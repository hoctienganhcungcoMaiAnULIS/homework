<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Quiz – Ms Mai An ULIS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --ocean-deep:#023E8A; --ocean-mid:#0077B6; --ocean-teal:#00B4D8;
  --sand:#FFD166; --coral:#FF6B6B; --seagreen:#06D6A0;
  --glass:rgba(255,255,255,0.18); --glass-b:rgba(255,255,255,0.42);
  --text:#fff; --correct:#00D26A; --wrong:#FF4757;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Nunito',sans-serif; min-height:100vh; color:#fff; overflow-x:hidden; }

/* ──────────────── MÀU LOANG CỐ ĐỊNH ──────────────── */
.bg-anim {
  position: fixed;
  inset: 0;
  z-index: -2;
  background: linear-gradient(-45deg, #023E8A, #0077B6, #00B4D8, #06D6A0, #48CAE4, #0096C7, #FFD166, #00B4D8);
  background-size: 600% 600%;
  animation: oceanFlow 18s ease infinite;
}
@keyframes oceanFlow { 0%,100% {background-position:0% 50%} 50% {background-position:100% 50%} }

/* ──────────────── HIỆU ỨNG BỌT BIỂN BAY BAY ──────────────── */
#sea-layer { position:fixed; inset:0; pointer-events:none; z-index:-1; overflow:hidden; }
.bubble {
  position: absolute;
  bottom: -50px;
  background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.1) 60%);
  border-radius: 50%;
  animation: floatUp infinite ease-in;
  box-shadow: inset 0 0 10px rgba(255,255,255,0.3);
}
@keyframes floatUp {
  0% { transform: translateY(0) scale(1) translateX(0); opacity: 0.8; }
  50% { transform: translateY(-55vh) scale(1.2) translateX(15px); opacity: 0.5; }
  100% { transform: translateY(-110vh) scale(1.5) translateX(-15px); opacity: 0; }
}

/* ──────────────── CÁC THÀNH PHẦN QUIZ ──────────────── */
.quiz-wrap { position:relative; z-index:1; max-width:880px; margin:0 auto; padding:18px 14px 70px; }
.hdr { text-align:center; padding:14px 20px 12px; background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1.5px solid var(--glass-b); border-radius:20px; margin-bottom:22px; box-shadow:0 8px 32px rgba(0,0,0,.18); }
.hdr-title { font-size:1.45rem; font-weight:900; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.35); margin-bottom:3px; }
.hdr-sub { font-size:.82rem; color:rgba(255,255,255,.88); font-weight:700; }
.sec-hdr { background:rgba(255,255,255,.22); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1.5px solid rgba(255,255,255,.5); border-radius:15px; padding:11px 18px; margin:28px 0 14px; text-align:center; }
.sec-title { font-size:1rem; font-weight:900; color:var(--sand); letter-spacing:1px; text-shadow:0 2px 4px rgba(0,0,0,.3); }
.sec-instr { font-size:.84rem; color:rgba(255,255,255,.92); font-weight:600; margin-top:4px; font-style:italic; }
.q-card { background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1.5px solid var(--glass-b); border-radius:20px; padding:20px 22px; margin-bottom:18px; box-shadow:0 8px 32px rgba(2,62,138,.22); transition:transform .2s; }
.q-card:hover { transform:translateY(-2px); }
.q-num { display:inline-block; background:linear-gradient(135deg,#FFD166,#FF6B6B); color:#fff; font-size:.75rem; font-weight:800; padding:3px 12px; border-radius:20px; margin-bottom:9px; text-shadow:0 1px 3px rgba(0,0,0,.3); }
.q-text { font-size:1.12rem; font-weight:700; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.3); margin-bottom:14px; line-height:1.55; }
.q-context { background:rgba(255,209,102,.2); border:2px solid rgba(255,209,102,.45); border-radius:10px; padding:9px 14px; margin-bottom:10px; font-size:.93rem; color:rgba(255,255,255,.95); font-style:italic; font-weight:700; }
.q-context span { color:#FFD166; font-weight:900; }
.q-sentences { background:rgba(255,255,255,.1); border-radius:10px; padding:9px 14px; margin-bottom:11px; font-size:.9rem; color:rgba(255,255,255,.92); line-height:1.85; }
.opts { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
@media(max-width:560px) { .opts{grid-template-columns:1fr;} }
.opt { background:rgba(255,255,255,.22); border:2px solid rgba(255,255,255,.4); border-radius:16px; padding:13px 14px; cursor:pointer; font-family:'Nunito',sans-serif; font-size:1.06rem; font-weight:700; color:#fff; text-align:center; line-height:1.4; box-shadow:0 6px 0 rgba(0,0,50,.22); transition:transform .15s,background .15s,box-shadow .15s; text-shadow:0 1px 3px rgba(0,0,0,.3); position:relative; top:0; }
.opt:hover:not([disabled]) { transform:scale(1.04) translateY(-3px); background:rgba(255,255,255,.34); box-shadow:0 9px 0 rgba(0,0,50,.22); }
.opt:active:not([disabled]) { top:4px; box-shadow:0 2px 0 rgba(0,0,50,.22); transform:scale(1); }
.opt.correct { background:#00D26A!important; border-color:#00a854!important; box-shadow:0 6px 0 #006b34!important; color:#fff!important; }
.opt.wrong { background:#FF4757!important; border-color:#cc2233!important; box-shadow:0 6px 0 #991a27!important; color:#fff!important; animation:shake .4s ease; }
.opt.dim { opacity:.55; cursor:not-allowed; }

/* ──────────────── Ô GIẢI THÍCH ──────────────── */
.expl {
  display: none;
  margin-top: 15px;
  background: rgba(0, 15, 30, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-left: 5px solid var(--sand);
  border-radius: 12px;
  padding: 18px 20px;
  font-size: .95rem;
  color: #f1f5f9;
  line-height: 1.75;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 5px 15px rgba(0,0,0,0.3);
  animation: slideD .3s ease;
}
.expl.show { display: block; }
@keyframes slideD { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
.expl-title { font-size:1rem; font-weight:900; color:var(--sand); margin-bottom:12px; display:flex; align-items:center; gap:7px; letter-spacing:0.5px; }
.vi-box { background:rgba(255,165,89,.15); border:1px dashed rgba(255,165,89,.6); border-radius:8px; padding:9px 14px; margin:10px 0; font-weight:700; color:#FFE8D0; font-size:.9rem; }
.expl ul { padding-left:20px; margin:8px 0; }
.expl li { margin-bottom:6px; }
.p-word { color:#7DD3FC; font-weight:800; font-size: 1.05em; }
.p-phonetic { color:#C4B5FD; background:rgba(139,92,246,.25); padding:2px 6px; border-radius:4px; font-style:italic; }
.p-mean { color:#FCA5A5; font-weight:700; }
.p-grammar { text-decoration:underline wavy #EF4444; color:#FCA5A5; font-weight:700; }
.hl-green { color:#86EFAC; font-weight:900; background:rgba(134, 239, 172, 0.15); padding: 2px 4px; border-radius: 4px; }
.hl-red { color:#FCA5A5; text-decoration:line-through; }

/* ──────────────── NÚT & MODAL KẾT QUẢ ──────────────── */
.sub-area { text-align:center; margin-top:38px; padding:18px; }
.sub-btn { background:linear-gradient(135deg,#FFD166,#FF6B6B); border:none; border-radius:25px; padding:17px 46px; font-family:'Nunito',sans-serif; font-size:1.15rem; font-weight:900; color:#fff; cursor:pointer; box-shadow:0 8px 0 rgba(0,0,0,.3),0 15px 30px rgba(0,0,0,.22); transition:all .15s; text-shadow:0 2px 4px rgba(0,0,0,.3); }
.sub-btn:hover { transform:translateY(-4px); box-shadow:0 12px 0 rgba(0,0,0,.3),0 20px 35px rgba(0,0,0,.25); }
.sub-btn:active { transform:translateY(4px); box-shadow:0 4px 0 rgba(0,0,0,.3); }
.modal-ov { display:none; position:fixed; inset:0; background:rgba(0,10,30,.85); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:1000; align-items:center; justify-content:center; padding:18px; }
.modal-ov.show { display:flex; }
.modal-box { background:linear-gradient(135deg,rgba(0,119,182,.95),rgba(2,62,138,.98)); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:2px solid rgba(255,255,255,.42); border-radius:24px; padding:32px 36px; max-width:480px; width:100%; text-align:center; box-shadow:0 25px 60px rgba(0,0,0,.6); animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes popIn { from { transform:scale(.5) translateY(30px); opacity:0; } to { transform:scale(1) translateY(0); opacity:1; } }
.m-title { font-size:1.35rem; font-weight:900; color:var(--sand); margin-bottom:18px; text-shadow:0 2px 6px rgba(0,0,0,.3); }
.name-inp { width:100%; padding:13px 16px; border:2px solid rgba(255,255,255,.4); border-radius:12px; background:rgba(255,255,255,.15); color:#fff; font-family:'Nunito',sans-serif; font-size:.98rem; font-weight:700; outline:none; margin-bottom:7px; transition:border-color .2s; }
.name-inp::placeholder { color:rgba(255,255,255,.5); }
.name-inp.err { border-color:#FF4757; }
.err-msg { color:#FF8094; font-size:.82rem; font-weight:700; display:none; margin-bottom:9px; }
.err-msg.show { display:block; }
.m-btn { background:linear-gradient(135deg,#06D6A0,#0096C7); border:none; border-radius:12px; padding:13px 32px; font-family:'Nunito',sans-serif; font-size:.98rem; font-weight:800; color:#fff; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.28); margin-top:8px; transition:all .15s; }
.m-btn:hover { transform:translateY(-3px); box-shadow:0 8px 0 rgba(0,0,0,.28); }
.res-greet { font-size:1.4rem; font-weight:900; color:var(--sand); margin-bottom:12px; }
.res-score { font-size:2.8rem; font-weight:900; color:#fff; margin:16px 0; text-shadow:0 4px 10px rgba(0,0,0,.4); }
.res-meme { width:200px; height:148px; border-radius:14px; margin:12px auto; display:block; object-fit:cover; border:3px solid rgba(255,255,255,.4); }
.retry-btn { background:linear-gradient(135deg,#FFD166,#FF6B6B); border:none; border-radius:12px; padding:13px 32px; font-family:'Nunito',sans-serif; font-size:.98rem; font-weight:800; color:#fff; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.28); margin-top:14px; transition:all .15s; }
.retry-btn:hover { transform:translateY(-3px); }
.cft { position:fixed; width:10px; height:10px; border-radius:2px; animation:cftFall linear forwards; z-index:9999; pointer-events:none; }
@keyframes cftFall { 0% { transform:translateY(-20px) rotate(0deg); opacity:1; } 100% { transform:translateY(100vh) rotate(720deg); opacity:0; } }
.prog-wrap { background:rgba(255,255,255,.18); border-radius:10px; height:5px; margin:12px 0; overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.3); }
.prog-bar { background:linear-gradient(90deg,#06D6A0,#FFD166); height:100%; border-radius:10px; transition:width .5s ease; width:0%; }

/* ──────────────── MÀN HÌNH KHÓA (PASSWORD MODAL) ──────────────── */
#passwordModal {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  background: rgba(5,2,15,0.92); backdrop-filter: blur(20px);
}
.pw-card {
  background: linear-gradient(160deg, rgba(40,10,70,0.95) 0%, rgba(15,5,30,0.98) 100%);
  border: 1.5px solid rgba(240,192,64,0.4); border-radius: 24px; padding: 48px 40px 40px; 
  max-width: 440px; width: 93%; text-align: center; position: relative; overflow: hidden;
  box-shadow: 0 0 60px rgba(106,5,114,0.6), 0 0 120px rgba(240,192,64,0.1), inset 0 1px 0 rgba(240,192,64,0.15);
}
.pw-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, #6A0572, #F0C040, #6A0572);
}
.pw-crest { font-size: 4rem; margin-bottom: 8px; display: block; }
.pw-title { font-family: 'Cinzel', serif; font-size: 1.4rem; font-weight: 700; color: #F0C040; margin-bottom: 6px; letter-spacing: 1px; }
.pw-sub   { font-size: .87rem; color: rgba(200,200,212,0.6); margin-bottom: 24px; }
.pw-input {
  width: 100%; padding: 13px 20px; border-radius: 12px;
  border: 1.5px solid rgba(240,192,64,0.3); background: rgba(255,255,255,0.05);
  color: #FFE082; font-size: 1rem; font-family: 'Nunito', sans-serif;
  outline: none; letter-spacing: 3px; text-align: center; transition: all .3s;
}
.pw-input:focus { border-color: #F0C040; box-shadow: 0 0 0 3px rgba(240,192,64,0.15); }
.pw-input.error { border-color: #FF4757; box-shadow: 0 0 0 3px rgba(255,71,87,0.25); animation: shake .4s ease; }
.pw-input::placeholder { color: rgba(200,200,212,0.3); letter-spacing: 1px; }
.pw-btn {
  width: 100%; padding: 14px; margin-top: 14px; border-radius: 12px; border: none;
  background: linear-gradient(135deg, #6A0572 0%, #9B1FA8 40%, #F0C040 100%);
  color: #fff; font-size: 1rem; font-weight: 700; font-family: 'Cinzel', serif;
  cursor: pointer; letter-spacing: .5px; transition: transform .2s;
}
.pw-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(106,5,114,0.7); }
.pw-err { color: #ff8a9a; font-size: .84rem; margin-top: 10px; display: none; font-weight: 700; }
@keyframes shake { 0%,100%{transform:translateX(0)} 15%,45%,75%{transform:translateX(-6px)} 30%,60%,90%{transform:translateX(6px)} }
</style>
</head>
<body>

<div class="bg-anim"></div>
<div id="sea-layer"></div>

<div id="passwordModal">
  <div class="pw-card">
    <span class="pw-crest">🔒</span>
    <div class="pw-title">BẢO MẬT</div>
    <div class="pw-sub">Vui lòng nhập mật khẩu để làm bài</div>
    <input type="password" class="pw-input" id="pwInput" placeholder="Nhập mật khẩu..." autocomplete="off" />
    <button class="pw-btn" onclick="checkPassword()">XÁC NHẬN</button>
    <div class="pw-err" id="pwErr">Mật khẩu không đúng! Vui lòng thử lại.</div>
  </div>
</div>

<div id="mainContent" style="display: none;">
  <div class="quiz-wrap">
    <div class="hdr">
      <div class="hdr-title">🌊 ENGLISH QUIZ – TỔNG ÔN TẬP</div>
      <div class="hdr-sub">Giáo viên tạo: Ms Mai An ULIS</div>
      <div class="prog-wrap"><div class="prog-bar" id="progBar"></div></div>
      <div id="progText" style="font-size:.8rem;color:rgba(255,255,255,.9);font-weight:800;margin-top:3px;text-shadow:0 1px 2px rgba(0,0,0,.4)">0 / 0 câu đã trả lời</div>
    </div>
    <div id="quiz-container"></div>
    <div class="sub-area">
      <button class="sub-btn" onclick="openNameModal()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
    </div>
  </div>
</div>

<div class="modal-ov" id="nameModal">
  <div class="modal-box">
    <div class="m-title">✏️ Nhập tên của bạn</div>
    <input type="text" class="name-inp" id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')submitName()">
    <div class="err-msg" id="nameErr">⚠️ Vui lòng nhập tên trước khi nộp bài!</div>
    <button class="m-btn" onclick="submitName()">✅ XEM KẾT QUẢ</button>
  </div>
</div>

<div class="modal-ov" id="resultModal">
  <div class="modal-box">
    <div class="res-greet" id="resGreet"></div>
    <div class="res-score" id="resScore"></div>
    <img class="res-meme" id="resMeme" src="" alt="" style="display:none;">
    <br>
    <button class="retry-btn" onclick="retryQuiz()">🔄 LÀM LẠI BÀI</button>
  </div>
</div>

<script>
// ─────────────────────────────── ÂM THANH ───────────────────────────────
const wrongSound = new Audio('https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/File%20nghe%20Ket%20A2/huh_sound_effect-www_tiengdong_com.mp3');
const welcomeSound = new Audio('https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/ti%E1%BA%BFng%20%C4%91%E1%BB%8Dc%20kh%C3%ADch%20l%E1%BB%87%20p2.mp3');

// ─────────────────────────────── MÃ BẢO MẬT ───────────────────────────────
const _k  = [99,111,109,97,105,97,110,117,108,105,115]; 
const _pw = _k.map(c => String.fromCharCode(c)).join('');

function checkPassword() {
  const inp = document.getElementById('pwInput');
  const err = document.getElementById('pwErr');
  
  if (inp.value === _pw) {
    document.getElementById('passwordModal').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    
    welcomeSound.currentTime = 0;
    welcomeSound.play().catch(e => console.log('Autoplay bị chặn bởi trình duyệt:', e));
    
  } else {
    inp.classList.remove('error'); 
    void inp.offsetWidth; 
    inp.classList.add('error');
    err.style.display = 'block'; 
    setTimeout(() => inp.classList.remove('error'), 500);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const pwInput = document.getElementById('pwInput');
  if(pwInput) pwInput.addEventListener('keydown', e => { 
    if (e.key==='Enter') checkPassword(); 
  });
});

// ─────────────────────────────── TẠO BỌT BIỂN (BUBBLES) ───────────────────────────────
function createBubbles() {
  const seaLayer = document.getElementById("sea-layer");
  seaLayer.innerHTML = ''; 
  const bubbleCount = 20; 
  
  for(let i=0; i<bubbleCount; i++) {
    let bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.style.left = Math.random() * 100 + "vw";
    let size = Math.random() * 25 + 10;
    bubble.style.width = size + "px";
    bubble.style.height = size + "px";
    bubble.style.animationDuration = (Math.random() * 6 + 6) + "s";
    bubble.style.animationDelay = (Math.random() * 5) + "s";
    seaLayer.appendChild(bubble);
  }
}

// ─────────────────────────────── QUESTION DATA ───────────────────────────────
const SECTIONS = [
{
  title:"PHONETICS",
  instruction:"I. Chọn từ có phần <u>gạch chân</u> được phát âm <strong>KHÁC</strong> với các từ còn lại.",
  qs:[
        {
      t:"Câu 2.",txt:"",
      opts:[
        {h:"<u>e</u>xciting",c:true},
        {h:"indep<u>e</u>ndent",c:false},
        {h:"succ<u>e</u>ss",c:false},
        {h:"h<u>e</u>ritage",c:false}
      ],
      expl:`<div class='expl-title'>💡 PHÂN TÍCH PHÁT ÂM</div><div class='vi-box'>📌 Dịch: Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại.</div><ul><li><span class='p-word'><u>e</u>xciting</span> <span class='p-phonetic'>/ɪ/</span> → <span class='p-mean'>thú vị</span> — "e" đọc là <span class='hl-green'>/ɪ/</span> ← KHÁC</li><li><span class='p-word'>indep<u>e</u>ndent</span> <span class='p-phonetic'>/e/</span> → <span class='p-mean'>độc lập</span> — "e" đọc là /e/</li><li><span class='p-word'>succ<u>e</u>ss</span> <span class='p-phonetic'>/e/</span> → <span class='p-mean'>thành công</span> — "e" đọc là /e/</li><li><span class='p-word'>h<u>e</u>ritage</span> <span class='p-phonetic'>/e/</span> → <span class='p-mean'>di sản</span> — "e" đọc là /e/</li></ul><p>✅ <span class='hl-green'>exciting</span>: chữ "e" được phát âm là <span class='p-phonetic'>/ɪ/</span>, trong khi ở 3 từ còn lại chữ "e" đều được phát âm là <span class='p-phonetic'>/e/</span>.</p>`
    },
    {
      t:"Câu 3.",txt:"",
      opts:[
        {h:"watch<u>ed</u>",c:true},
        {h:"play<u>ed</u>",c:false},
        {h:"remember<u>ed</u>",c:false},

// ─────────────────────────────── QUIZ LOGIC ───────────────────────────────
let totalQuestions = 0;
let answeredCount = 0;
let correctCount = 0;
let flatQuestions = [];

function initQuiz() {
  createBubbles(); 

  const container = document.getElementById("quiz-container");
  let html = "";
  let globalQIndex = 0;

  SECTIONS.forEach((section) => {
    html += `
      <div class="sec-hdr">
        <div class="sec-title">${section.title}</div>
        <div class="sec-instr">${section.instruction}</div>
      </div>
    `;

    section.qs.forEach((q) => {
      flatQuestions.push(q);
      totalQuestions++;

      let optsHtml = "";
      q.opts.forEach((opt, optIndex) => {
        optsHtml += `<div class="opt" onclick="selectOption(this, ${globalQIndex}, ${optIndex})">${opt.h}</div>`;
      });

      html += `
        <div class="q-card" id="q-${globalQIndex}">
          <div class="q-num">${q.t}</div>
          ${q.txt ? `<div class="q-text">${q.txt}</div>` : ""}
          <div class="opts" id="opts-${globalQIndex}">
            ${optsHtml}
          </div>
          <div class="expl" id="expl-${globalQIndex}">${q.expl}</div>
        </div>
      `;
      globalQIndex++;
    });
  });

  container.innerHTML = html;
  document.getElementById("progText").innerText = `0 / ${totalQuestions} câu đã trả lời`;
}

function selectOption(btnElement, qIndex, optIndex) {
  const optsContainer = document.getElementById(`opts-${qIndex}`);
  
  if (optsContainer.hasAttribute("data-answered")) return;
  optsContainer.setAttribute("data-answered", "true");

  const qData = flatQuestions[qIndex];
  const isCorrect = qData.opts[optIndex].c;

  const allBtns = optsContainer.querySelectorAll(".opt");
  allBtns.forEach((btn, idx) => {
    btn.classList.add("dim");
    btn.removeAttribute("onclick");
    if (qData.opts[idx].c) {
      btn.classList.remove("dim");
      btn.classList.add("correct");
    }
  });

  btnElement.classList.remove("dim");
  if (isCorrect) {
    btnElement.classList.add("correct");
    correctCount++;
  } else {
    btnElement.classList.add("wrong");
    wrongSound.currentTime = 0;
    wrongSound.play().catch(e => console.log('Chưa tương tác trang', e));
  }

  document.getElementById(`expl-${qIndex}`).classList.add("show");

  answeredCount++;
  updateProgress();
}

function updateProgress() {
  const progBar = document.getElementById("progBar");
  const progText = document.getElementById("progText");
  const percentage = (answeredCount / totalQuestions) * 100;
  
  progBar.style.width = percentage + "%";
  progText.innerText = `${answeredCount} / ${totalQuestions} câu đã trả lời`;
}

function openNameModal() {
  if (answeredCount === 0) {
    alert("Bạn chưa làm câu nào cả. Vui lòng làm bài trước khi nộp!");
    return;
  }
  document.getElementById("nameModal").classList.add("show");
  document.getElementById("nameInput").focus();
}

function submitName() {
  const nameInput = document.getElementById("nameInput");
  const nameErr = document.getElementById("nameErr");
  const userName = nameInput.value.trim();

  if (!userName) {
    nameInput.classList.add("err");
    nameErr.classList.add("show");
    return;
  }

  nameInput.classList.remove("err");
  nameErr.classList.remove("show");
  document.getElementById("nameModal").classList.remove("show");

  showResult(userName);
}

function showResult(name) {
  document.getElementById("resultModal").classList.add("show");
  document.getElementById("resGreet").innerText = `🎉 Chúc mừng ${name} đã hoàn thành bài!`;
  
  const scoreText = `${correctCount} / ${totalQuestions}`;
  document.getElementById("resScore").innerText = scoreText;

  const percent = correctCount / totalQuestions;
  const memeImg = document.getElementById("resMeme");
  memeImg.style.display = "block";

  if (percent === 1) {
    memeImg.src = "https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif"; 
    createConfetti();
  } else if (percent >= 0.8) {
    memeImg.src = "https://media.giphy.com/media/l41YkxvU8c7J7Bba0/giphy.gif"; 
    createConfetti();
  } else if (percent >= 0.5) {
    memeImg.src = "https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif"; 
  } else {
    memeImg.src = "https://media.giphy.com/media/26ybvVb9iSmht7LdC/giphy.gif"; 
  }
}

function retryQuiz() {
  answeredCount = 0;
  correctCount = 0;
  
  document.getElementById("resultModal").classList.remove("show");
  document.getElementById("nameInput").value = "";
  
  initQuiz();
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function createConfetti() {
  const colors = ['#FFD166', '#FF6B6B', '#06D6A0', '#00B4D8', '#fff'];
  for (let i = 0; i < 80; i++) {
    let conf = document.createElement('div');
    conf.className = 'cft';
    conf.style.left = Math.random() * 100 + 'vw';
    conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    conf.style.animationDuration = (Math.random() * 2 + 2) + 's'; 
    conf.style.animationDelay = (Math.random() * 1) + 's';
    document.body.appendChild(conf);
    
    setTimeout(() => { conf.remove(); }, 5000);
  }
}

// Khởi tạo quiz khi trang load
window.onload = initQuiz;

</script>
</body>
</html>
