<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BÀI KIỂM TRA TỔNG HỢP | Ms Mai An ULIS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #FDCB6E; 
  --deep-purple: #1a0533; 
  --mid-purple: #8854C0; 
  --light-purple: #a275d6; 
  --maroon: #740001; 
  --accent-teal: #00C9A7; 
  --correct: #00D26A; 
  --wrong: #FF4757; 
  --card-bg: rgba(25, 10, 45, 0.85); 
  --text-light: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Nunito', sans-serif; 
  min-height: 100vh; 
  background: var(--deep-purple); 
  overflow-x: hidden; 
  color: var(--text-light); 
}

/* ===== ANIMATED GRADIENT BACKGROUND ===== */
.bg-layer { 
  position: fixed; inset: 0; z-index: 0; 
  background: linear-gradient(135deg, #1a0533, #3a1c71, #d76d77, #ffaf7b, #3a1c71); 
  background-size: 400% 400%; 
  animation: gradientShift 15s ease infinite; 
}
@keyframes gradientShift { 0% {background-position: 0% 50%} 50% {background-position: 100% 50%} 100% {background-position: 0% 50%} }

/* Stars lấp lánh */
.star-field { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
.star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle var(--dur, 3s) ease-in-out infinite alternate; }
@keyframes twinkle { 
  0%{opacity:0.2; transform:scale(0.8); box-shadow: 0 0 2px #fff;} 
  100%{opacity:1; transform:scale(1.2); box-shadow: 0 0 8px var(--gold);} 
}

/* ===== GIAO DIỆN MÀN HÌNH KHÓA ===== */
#passwordModal {
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:rgba(5,2,15,0.92); backdrop-filter:blur(20px);
}
.pw-card {
  background:linear-gradient(160deg, rgba(40,10,70,0.95) 0%, rgba(15,5,30,0.98) 100%);
  border:1.5px solid rgba(240,192,64,0.4); border-radius:24px; padding:48px 40px 40px; 
  max-width:440px; width:93%; text-align:center; position:relative; overflow:hidden;
  box-shadow:0 0 60px rgba(106,5,114,0.6), 0 0 120px rgba(240,192,64,0.1), inset 0 1px 0 rgba(240,192,64,0.15);
}
.pw-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg, #6A0572, #F0C040, #6A0572);
}
.pw-crest { font-size:4rem; margin-bottom:8px; display:block; }
.pw-title { font-family:'Cinzel', serif; font-size:1.4rem; font-weight:700; color:#F0C040; margin-bottom:6px; letter-spacing:1px; }
.pw-sub   { font-size:.87rem; color:rgba(200,200,212,0.6); margin-bottom:24px; }
.pw-input {
  width:100%; padding:13px 20px; border-radius:12px;
  border:1.5px solid rgba(240,192,64,0.3); background:rgba(255,255,255,0.05);
  color:#FFE082; font-size:1rem; font-family:'Nunito', sans-serif;
  outline:none; letter-spacing:3px; text-align:center; transition:all .3s;
}
.pw-input:focus { border-color:#F0C040; box-shadow:0 0 0 3px rgba(240,192,64,0.15); }
.pw-input.error { border-color:#FF4757; box-shadow:0 0 0 3px rgba(255,71,87,0.25); animation:shake .4s ease; }
.pw-input::placeholder { color:rgba(200,200,212,0.3); letter-spacing:1px; }
.pw-btn {
  width:100%; padding:14px; margin-top:14px; border-radius:12px; border:none;
  background:linear-gradient(135deg, #6A0572 0%, #9B1FA8 40%, #F0C040 100%);
  color:#fff; font-size:1rem; font-weight:700; font-family:'Cinzel', serif;
  cursor:pointer; letter-spacing:.5px; transition:transform .2s;
}
.pw-btn:hover { transform:translateY(-2px); box-shadow:0 8px 32px rgba(106,5,114,0.7); }
.pw-err { color:#ff8a9a; font-size:.84rem; margin-top:10px; display:none; font-weight:700; }
@keyframes shake { 0%,100%{transform:translateX(0)} 15%,45%,75%{transform:translateX(-6px)} 30%,60%,90%{transform:translateX(6px)} }

/* ===== MAIN CONTENT ===== */
#mainContent { display: none; position: relative; z-index: 2; padding: 20px 16px 80px; max-width: 900px; margin: 0 auto; }

/* ===== HEADER ===== */
header { 
  text-align: center; padding: 16px 20px 12px; 
  background: rgba(45, 17, 85, 0.6); 
  border: 1px solid rgba(253, 203, 110, 0.4); 
  border-radius: 16px; margin-bottom: 22px; 
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4); 
}
.test-name { 
  font-family: 'Cinzel Decorative', serif; font-size: 1.1rem; 
  color: var(--gold); text-shadow: 0 0 10px rgba(253,203,110,0.5); 
  letter-spacing: 1px; 
}
.teacher-tag { 
  display: inline-block; margin-top: 6px; padding: 3px 12px; 
  background: rgba(0, 201, 167, 0.2); 
  border: 1px solid rgba(0, 201, 167, 0.5); 
  border-radius: 20px; font-size: 0.8rem; font-weight: 700; color: #fff; 
}

/* ===== SCORE BAR ===== */
.score-bar { 
  display: flex; align-items: center; justify-content: space-between; 
  background: rgba(26, 5, 51, 0.7); 
  border: 1px solid rgba(253, 203, 110, 0.3); 
  border-radius: 14px; padding: 10px 18px; margin-bottom: 24px; 
  font-size: 0.95rem; font-weight: 800; 
  backdrop-filter: blur(8px);
}
.score-item { display: flex; align-items: center; gap: 6px; }
.score-num { color: var(--gold); font-size: 1.2rem; }

/* ===== SECTION HEADER ===== */
.section-header { 
  display: flex; align-items: center; gap: 10px; 
  background: linear-gradient(90deg, rgba(136, 84, 192, 0.6), rgba(0, 201, 167, 0.1)); 
  border-left: 4px solid var(--gold); 
  border-radius: 0 10px 10px 0; padding: 10px 16px; margin: 28px 0 14px; 
  font-size: 1.05rem; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

/* ===== QUESTION CARD ===== */
.q-card { 
  background: var(--card-bg); 
  border: 1px solid rgba(255,255,255,0.15); 
  border-radius: 18px; padding: 22px; margin-bottom: 22px; 
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
  transition: all 0.3s;
}
.q-card:hover { border-color: rgba(253, 203, 110, 0.5); transform: translateY(-2px); }

.q-header { display: flex; align-items: flex-start; margin-bottom: 16px; }
.q-num { 
  display: inline-flex; align-items: center; justify-content: center; 
  width: 36px; height: 36px; 
  background: linear-gradient(135deg, var(--mid-purple), var(--accent-teal)); 
  border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; 
  font-size: 0.95rem; font-weight: 900; color: #fff; 
  margin-right: 12px; flex-shrink: 0; 
}
.q-text { font-size: 1.15rem; line-height: 1.5; color: #fff; padding-top: 4px; font-weight: 700; }
.q-text u { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px;}

/* MCQ Options */
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.options-grid.single-col { grid-template-columns: 1fr; }
.opt-btn { 
  padding: 14px 18px; 
  background: rgba(255, 255, 255, 0.1); 
  border: 2px solid rgba(255,255,255,0.2); 
  border-radius: 16px; color: #fff; 
  font-family: 'Nunito', sans-serif; font-size: 1.08rem; font-weight: 700; 
  cursor: pointer; text-align: left; transition: all 0.25s; 
  box-shadow: 0 4px 10px rgba(0,0,0,0.2), 0 3px 0 rgba(255,255,255,0.1); 
  line-height: 1.4; 
}
.opt-btn:hover:not(:disabled) { 
  transform: translateY(-3px); border-color: var(--gold); 
  background: rgba(255, 255, 255, 0.2); 
  box-shadow: 0 6px 15px rgba(0,0,0,0.3), 0 3px 0 var(--gold); 
}
.opt-btn.correct { 
  background: linear-gradient(135deg, #00b09b, #00D26A) !important; 
  border-color: #fff !important; color: #fff !important; 
  box-shadow: 0 0 20px rgba(0,210,106,0.5) !important; 
}
.opt-btn.wrong { 
  background: linear-gradient(135deg, #ff416c, #FF4757) !important; 
  border-color: #fff !important; color: #fff !important; 
  animation: shake 0.4s ease; 
  box-shadow: 0 0 20px rgba(255,71,87,0.5) !important; 
}

/* Duolingo Style Word Tiles */
.word-pool { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 12px;}
.result-box { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; min-height: 50px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; border: 2px dashed rgba(255,255,255,0.2); }
.word-tile { 
  padding: 8px 16px; border-radius: 12px; background: rgba(255,255,255,0.9); color: #333; 
  font-weight: 800; font-size: 1.05rem; cursor: pointer; user-select: none;
  border-bottom: 4px solid #b2bec3; transition: all 0.1s;
}
.word-tile:hover { transform: translateY(-2px); }
.word-tile.selected { opacity: 0.4; filter: grayscale(1); pointer-events: none; transform: none; }
.word-tile.used-in-result { border-bottom-color: #000; margin-bottom: 4px;}
.result-box .word-tile { background: #fff; border-bottom: 4px solid #b2bec3;}

/* typing gõ tay */
.typing-area { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.giau-di { display: none;}
.giau-di.hien { display: flex; flex-direction: column; gap: 10px; }
.type-input {
  width: 100%; padding: 12px 18px; border-radius: 12px;
  background: rgba(0,0,0,0.2); border: 2px solid rgba(255,255,255,0.3);
  color: #FFE082; font-size: 1rem; font-family: 'Nunito', sans-serif;
  outline: none; transition: all 0.3s;
}
.type-input:focus { border-color: var(--accent-teal); }
.type-input.error { border-color: var(--wrong); }
.check-btn {
  align-self: flex-end; padding: 10px 20px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, var(--gold), #f39c12);
  color: #000; font-family: 'Nunito', sans-serif; font-weight: 900;
  cursor: pointer; box-shadow: 0 4px 0 #d35400, 0 5px 10px rgba(0,0,0,0.3);
  transition: all 0.1s;
}
.check-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #d35400, 0 2px 5px rgba(0,0,0,0.3); }

/* EXPLANATION CHUẨN MỚI */
.explanation { 
  display: none; margin-top: 18px; padding: 18px; 
  background: rgba(0, 0, 0, 0.45); 
  border: 1px solid rgba(255,255,255,0.1); 
  border-left: 5px solid var(--accent-teal); 
  border-radius: 12px; font-size: 1rem; line-height: 1.7; color: #e8e8e8; 
  animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
}
@keyframes slideDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
.explanation.show { display: block; }
.explanation .ex-title { 
  font-size: 1.1rem; font-weight: 900; color: var(--gold); 
  margin-bottom: 12px; display: flex; align-items: center; gap: 6px; text-transform: uppercase;
}
.explanation p { margin-bottom: 8px; }

.trans-box { 
  background: rgba(253, 203, 110, 0.15); border-left: 4px solid var(--gold); 
  padding: 10px 14px; margin-bottom: 14px; border-radius: 6px; 
  color: var(--gold); font-weight: 800; font-size: 1.05rem;
}
.p-word { color: #00d2d3; font-weight: 900; }
.p-mean { color: #feca57; font-style: italic; font-weight: 700; }
.p-grammar { text-decoration: underline; text-decoration-color: #ff6b6b; font-weight: 900; color: #ff9ff3; }
.hl-green { color: var(--correct); font-weight: 900; }
.hl-red { color: #ff7675; text-decoration: line-through; font-weight: 800; }
.ex-step { color: #48dbfb; font-weight: 900; margin-top: 12px; border-bottom: 1px dashed rgba(72, 219, 251, 0.3); padding-bottom: 4px; margin-bottom: 8px; }

/* SUBMIT BTN */
.submit-wrap { text-align: center; margin: 40px 0 20px; }
.submit-btn { 
  padding: 16px 40px; background: linear-gradient(135deg, #00C9A7, #8854C0);
  border: 3px solid #fff; border-radius: 25px; 
  color: #fff; font-family: 'Cinzel Decorative', serif; font-size: 1.1rem; font-weight: 900; 
  cursor: pointer; box-shadow: 0 8px 25px rgba(0,201,167,0.5); 
  animation: pulseBtn 2s ease-in-out infinite; transition: all 0.3s; 
}
@keyframes pulseBtn { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
.submit-btn:hover { transform: translateY(-4px) scale(1.05) !important; }

/* MODALS */
.modal-overlay { 
  position: fixed; inset: 0; z-index: 9998; display: none; 
  align-items: center; justify-content: center; 
  background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); 
}
.modal-overlay.show { display: flex; }
.modal-box { 
  background: rgba(45, 17, 85, 0.9); border: 2px solid var(--gold); 
  border-radius: 24px; padding: 36px 26px; text-align: center; 
  max-width: 420px; width: 92%; box-shadow: 0 0 50px rgba(136, 84, 192, 0.6); 
  animation: modalAppear 0.4s ease; 
}
@keyframes modalAppear { from{transform:scale(0.8); opacity:0;} to{transform:scale(1); opacity:1;} }
.modal-box h3 { font-family: 'Cinzel Decorative', serif; color: var(--gold); font-size: 1.3rem; margin-bottom: 12px; }
#nameInputModal { 
  width: 100%; padding: 14px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.3); 
  color: #fff; font-size: 1.05rem; font-family: 'Nunito', sans-serif; outline: none; text-align: center;
}
#nameInputModal:focus { border-color: var(--accent-teal); }
#confirmNameBtn { 
  margin-top: 16px; width: 100%; padding: 14px; background: linear-gradient(135deg, var(--gold), #f39c12); 
  border: none; border-radius: 12px; color: #000; font-weight: 900; font-size: 1.05rem; cursor: pointer; 
}
.result-score-big { font-size: 3.5rem; font-weight: 900; color: #fff; text-shadow: 0 0 20px var(--accent-teal); margin: 10px 0; }
#memeImg { width: 100%; max-width: 260px; border-radius: 16px; margin: 0 auto 16px; display: block; border: 3px solid var(--gold); }
.close-result-btn { padding: 12px 30px; background: rgba(255,255,255,0.1); border: 2px solid #fff; border-radius: 12px; color: #fff; font-weight: 800; cursor: pointer; width: 100%; }

/* CONFETTI */
.confetti-piece { position: fixed; width: 8px; height: 16px; border-radius: 3px; pointer-events: none; z-index: 9999; animation: confettiFall var(--dur, 2s) ease-in var(--delay, 0s) forwards; }
@keyframes confettiFall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }

@media(max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="star-field" id="starField"></div>

<audio id="wrongAudio" src="https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/File%20nghe%20Ket%20A2/huh_sound_effect-www_tiengdong_com.mp3" preload="auto"></audio>
<audio id="greetingAudio" src="https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/File%20nghe%20Ket%20A2/ti%E1%BA%BFng%20%C4%91%E1%BB%8Dc%20kh%C3%ADch%20l%E1%BB%87%20p1.mp3" preload="auto"></audio>

<div id="passwordModal">
  <div class="pw-card">
    <span class="pw-crest">🔒</span>
    <div class="pw-title">BẢO MẬT</div>
    <div class="pw-sub">Vui lòng nhập mật khẩu để làm bài</div>
    <input type="password" class="pw-input" id="pwInput" placeholder="Nhập mật khẩu..." autocomplete="off" />
    <button class="pw-btn" onclick="checkPassword()">XÁC NHẬN</button>
    <div class="pw-err" id="pwErr">Mật khẩu không đúng! Vui lòng thử lại.</div>
  </div>
</div>

<div id="nameModal" class="modal-overlay">
  <div class="modal-box">
    <div style="font-size:3rem;margin-bottom:6px">🧙‍♂️</div>
    <h3>Định danh Phù Thủy</h3>
    <input type="text" id="nameInputModal" placeholder="Ví dụ: Harry Potter..." maxlength="40">
    <button id="confirmNameBtn">✨ LÀM BÀI ✨</button>
  </div>
</div>

<div id="resultModal" class="modal-overlay">
  <div class="modal-box" style="padding: 24px;">
    <div id="resultTitle" style="font-family:'Cinzel Decorative',serif; font-size:1.4rem; color:var(--gold); font-weight:bold;"></div>
    <div class="result-score-big" id="resultScore"></div>
    <div style="color:#00C9A7; font-size:1rem; font-weight:800; margin-bottom:12px;" id="resultDetail"></div>
    <img id="memeImg" src="" alt="Meme">
    <div style="background:rgba(255,255,255,0.1); border-radius:10px; padding:12px; font-size:0.95rem; font-weight:700; color:#fff; margin-bottom:16px;" id="resultComment"></div>
    <button class="close-result-btn" onclick="document.getElementById('resultModal').classList.remove('show')">ĐÓNG BẢNG ĐIỂM</button>
  </div>
</div>

<div id="mainContent">
  <header>
    <div style="font-size: 2.2rem; margin-bottom: 4px; text-shadow: 0 0 10px var(--gold);">🏰⚡📖</div>
    <div class="test-name">BÀI KIỂM TRA ĐỌC HIỂU & NGỮ PHÁP TỔNG HỢP</div>
    <div class="teacher-tag">🎓 Giáo viên tạo: Ms Mai An ULIS</div>
  </header>

  <div class="score-bar">
    <div class="score-item">⚡ Đúng: <span class="score-num" id="correctCount">0</span></div>
    <div class="score-item">📝 Đã làm: <span class="score-num" id="answeredCount">0</span> / <span id="totalQ">0</span></div>
    <div class="score-item">🏆 Điểm: <span class="score-num" id="scoreDisplay">0.0</span></div>
  </div>

  <div id="quizContainer"></div>

  <div class="submit-wrap">
    <button class="submit-btn" onclick="showFinalResult()">🎯 NỘP BÀI & XEM KẾT QUẢ</button>
  </div>
</div>

<script>
// ===== XỬ LÝ PASSWORD & ÂM THANH MỞ ĐẦU =====
const _k  = [49, 54, 49, 49]; // Mật khẩu là "1611"
const _pw = _k.map(c => String.fromCharCode(c)).join('');

function checkPassword() {
  const inp = document.getElementById('pwInput');
  const err = document.getElementById('pwErr');
  if (inp.value === _pw) {
    document.getElementById('passwordModal').style.display = 'none';
    
    // Phát âm thanh nhắc nhở
    const greetingAudio = document.getElementById('greetingAudio');
    greetingAudio.play().catch(e => console.log("Audio play blocked by browser:", e));

    // Hiện popup nhập tên
    document.getElementById('nameModal').classList.add('show');
    document.getElementById('nameInputModal').focus();

  } else {
    inp.classList.remove('error'); void inp.offsetWidth; inp.classList.add('error');
    err.style.display = 'block'; setTimeout(() => inp.classList.remove('error'), 500);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const pwInput = document.getElementById('pwInput');
  if(pwInput) pwInput.addEventListener('keydown', e => { if (e.key==='Enter') checkPassword(); });
});

document.getElementById('confirmNameBtn').onclick = submitName;
document.getElementById('nameInputModal').onkeydown = (e) => { if(e.key === 'Enter') submitName(); };

let userName = "";
function submitName(){
  const inp = document.getElementById('nameInputModal');
  const val = inp.value.trim();
  if(!val){
    inp.style.borderColor = '#FF4757';
    setTimeout(()=>inp.style.borderColor = 'rgba(255,255,255,0.3)', 500);
    return;
  }
  userName = val;
  document.getElementById('nameModal').classList.remove('remove');
  document.getElementById('mainContent').style.display = 'block';
  
  // Khởi tạo AudioContext nếu cần
  getCtx();
  buildQuiz();
}

// ===== STAR FIELD & CONFETTI =====
(function(){
  const sf = document.getElementById('starField');
  for(let i=0; i<50; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random()*3 + 1;
    s.style.cssText = `width:${size}px; height:${size}px; top:${Math.random()*100}%; left:${Math.random()*100}%; --dur:${(Math.random()*3+2).toFixed(1)}s; animation-delay:${(Math.random()*4).toFixed(1)}s`;
    sf.appendChild(s);
  }
})();

function launchConfetti(){
  const colors=['#FDCB6E','#00C9A7','#ff6b81','#a275d6','#fff'];
  for(let i=0; i<60; i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `left:${Math.random()*100}vw; top:-20px; background:${colors[Math.floor(Math.random()*colors.length)]}; --dur:${(Math.random()*1.5+1.5).toFixed(1)}s; --delay:${(Math.random()*0.3).toFixed(2)}s; transform:rotate(${Math.random()*360}deg)`;
    sf.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

// ===== AUDIO EFFECTS =====
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function getCtx(){ if(!audioCtx) audioCtx = new AudioCtx(); return audioCtx; }

function playCorrect(){
  const ctx = getCtx();
  if(ctx.state === 'suspended') ctx.resume();
  [523.25, 659.25, 783.99, 1046.50].forEach((freq,i)=>{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq; o.type = 'sine';
    const t = ctx.currentTime + i*0.08;
    g.gain.setValueAtTime(0.3, t); 
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    o.start(t); o.stop(t + 0.4);
  });
}

function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let correctCount = 0, answeredCount = 0, totalQuestions = 0;

function buildQuiz(){
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  totalQuestions = 0;

  quizData.forEach(section => {
    const secDiv = document.createElement('div');
    secDiv.className = 'section-header';
    secDiv.innerHTML = `<span>📜</span> <span>${section.section}</span>`;
    container.appendChild(secDiv);

    section.questions.forEach(q => {
      totalQuestions++;
      const card = document.createElement('div');
      card.className = 'q-card';
      
      let interactiveHTML = '';

      if (q.type === 'mcq') {
        interactiveHTML = `<div class="options-grid" id="opts-${q.id}">`;
        q.options.forEach((opt, i) => {
          interactiveHTML += `<button class="opt-btn" id="btn-${q.id}-${i}" onclick="checkMCQ(${q.id}, ${opt.correct}, this)">${opt.label}</button>`;
        });
        interactiveHTML += `</div>`;
      } 
      else if (q.type === 'ordering') {
        const sentenceKeys = shuffle(Object.keys(q.sentences));
        interactiveHTML = `
          <div class="result-box" id="result-${q.id}" data-answer="${q.answerKey.join('')}"></div>
          <div class="word-pool" id="pool-${q.id}">
            ${sentenceKeys.map(k => `<span class="word-tile" id="tile-${q.id}-${k}" onclick="toggleTile(${q.id}, '${k}')">${k}. ${q.sentences[k]}</span>`).join('')}
          </div>
          <div class="giau-di" id="btn-wrap-${q.id}">
            <button class="check-btn" onclick="checkOrder(${q.id})">Kiểm tra kết quả</button>
          </div>
        `;
      }
      else if (q.type === 'transformation') {
        interactiveHTML = `
          <div class="typing-area">
            <input type="text" class="type-input" id="input-${q.id}" placeholder="Gõ câu hoàn chỉnh vào đây..." autocomplete="off">
            <button class="check-btn" onclick="checkTypedAnswer(${q.id}, '${q.target.replace("'", "\\'")}')">Nộp bài</button>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="q-header">
          <div class="q-num">${totalQuestions}</div>
          <div class="q-text">${q.text || q.prompt}</div>
        </div>
        ${interactiveHTML}
        <div class="explanation" id="exp-${q.id}">
          ${q.explanation}
        </div>
      `;
      container.appendChild(card);
    });
  });

  document.getElementById('totalQ').textContent = totalQuestions;
}

const answeredState = {};

function handleAnswerResult(qId, isCorrect, disableElementsCallback) {
  if(answeredState[qId]) return;
  answeredState[qId] = true;
  answeredCount++;
  
  disableElementsCallback();

  if(isCorrect){
    correctCount++;
    playCorrect();
    launchConfetti();
  } else {
    playWrong();
  }

  document.getElementById(`exp-${qId}`).classList.add('show');
  updateScoreUI();
}

function checkMCQ(qId, isCorrect, btnElement){
  handleAnswerResult(qId, isCorrect, () => {
    const allBtns = document.querySelectorAll(`#opts-${qId} .opt-btn`);
    allBtns.forEach(btn => {
      btn.disabled = true;
      if(btn.innerHTML.includes('Children walking') || btn.getAttribute('onclick').includes('true')) btn.classList.add('correct');
    });
    if(!isCorrect) btnElement.classList.add('wrong');
  });
}

// ===== ORDERING LOGIC =====
function toggleTile(qId, key){
  const pool = document.getElementById(`pool-${qId}`);
  const result = document.getElementById(`result-${qId}`);
  const tile = document.getElementById(`tile-${qId}-${key}`);
  const btnWrap = document.getElementById(`btn-wrap-${qId}`);

  if(tile.parentElement.id === `pool-${qId}`){
    // Di chuyển lên kết quả
    tile.classList.add('used-in-result');
    result.appendChild(tile);
  } else {
    // Di chuyển xuống pool
    tile.classList.remove('used-in-result');
    pool.appendChild(tile);
  }

  // Hiện nút kiểm tra khi pool trống
  if(pool.children.length === 0){
    btnWrap.classList.add('hien');
  } else {
    btnWrap.classList.remove('hien');
  }
}

function checkOrder(qId){
  if(answeredState[qId]) return;
  const resultBox = document.getElementById(`result-${qId}`);
  const answerKey = resultBox.dataset.answer;
  let userOrder = "";
  Array.from(resultBox.children).forEach(tile => {
    userOrder += tile.id.split('-').pop(); // Lấy 'k'
  });

  const isCorrect = (userOrder === answerKey);
  handleAnswerResult(qId, isCorrect, () => {
    // Vô hiệu hóa gạch
    Array.from(resultBox.children).forEach(tile => tile.pointerEvents = 'none');
    document.getElementById(`btn-wrap-${qId}`).classList.remove('hien');
  });
}

// ===== TYPING LOGIC =====
function checkTypedAnswer(qId, target){
  if(answeredState[qId]) return;
  const input = document.getElementById(`input-${qId}`);
  const userText = input.value.trim().toLowerCase().replace(/[.,!?]$^/, ''); // Chuẩn hóa nhẹ
  const targetText = target.trim().toLowerCase().replace(/[.,!?]$^/, '');

  const isCorrect = (userText === targetText);
  handleAnswerResult(qId, isCorrect, () => {
    input.disabled = true;
    if(!isCorrect) input.classList.add('error');
  });
}

function updateScoreUI(){
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('answeredCount').textContent = answeredCount;
  const score = (correctCount / totalQuestions) * 10;
  document.getElementById('scoreDisplay').textContent = score.toFixed(1);
}
