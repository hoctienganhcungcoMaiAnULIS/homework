<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEST 1 – English Quiz | Ms Mai An ULIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #04042a;
      --deep-blue: #0d1b4b;
      --ocean: #0e5c8a;
      --sea: #1a8ab4;
      --foam: #76e5f5;
      --luffy-red: #e63946;
      --luffy-red-dark: #b02a34;
      --straw-gold: #f4d03f;
      --dark-gold: #c9a800;
      --white: #ffffff;
      --glass-bg: rgba(255,255,255,0.10);
      --glass-border: rgba(255,255,255,0.22);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Nunito',sans-serif;
      min-height:100vh;
      overflow-x:hidden;
      background:var(--navy);
      color:white;
    }
    /* ===== BACKGROUND ===== */
    .bg-gradient {
      position:fixed; inset:0; z-index:-2;
      background:linear-gradient(135deg,#04042a 0%,#0d1b4b 25%,#0e5c8a 50%,#1a1a5e 75%,#04042a 100%);
      background-size:400% 400%;
      animation:seaFlow 14s ease infinite;
    }
    @keyframes seaFlow {
      0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%}
    }
    .bg-pattern {
      position:fixed; inset:0; z-index:-1; opacity:0.13; pointer-events:none; overflow:hidden;
    }
    /* ===== HEADER ===== */
    .site-header {
      text-align:center; padding:18px 20px 10px; position:relative;
    }
    .test-title {
      font-size:2rem; font-weight:900; color:var(--straw-gold);
      text-shadow:0 0 24px rgba(244,208,63,.55), 3px 3px 0 var(--luffy-red);
      letter-spacing:3px;
    }
    .creator-line {
      font-size:.78rem; color:rgba(255,255,255,.72); font-weight:700;
      margin-top:3px; letter-spacing:1px;
    }
    .pirate-divider {
      display:flex; align-items:center; justify-content:center;
      gap:12px; margin:8px 0; font-size:1.3rem;
    }
    .divider-line {
      height:2px; width:100px;
      background:linear-gradient(90deg,transparent,var(--straw-gold),transparent);
    }
    /* ===== SCORE BAR ===== */
    .score-bar {
      position:sticky; top:0; z-index:100;
      display:flex; align-items:center; justify-content:center; gap:14px;
      padding:8px 20px;
      background:rgba(4,4,42,.75); backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(244,208,63,.3);
    }
    .score-badge {
      background:linear-gradient(135deg,var(--luffy-red),var(--luffy-red-dark));
      color:white; padding:4px 16px; border-radius:20px;
      font-weight:900; font-size:.9rem;
      box-shadow:0 2px 12px rgba(230,57,70,.5);
    }
    .prog-wrap {
      flex:1; max-width:280px; height:9px;
      background:rgba(255,255,255,.18); border-radius:5px; overflow:hidden;
    }
    .prog-bar {
      height:100%;
      background:linear-gradient(90deg,var(--luffy-red),var(--straw-gold));
      border-radius:5px; width:0%; transition:width .4s ease;
    }
    .answered-txt {
      font-size:.78rem; color:rgba(255,255,255,.65); font-weight:700;
    }
    /* ===== CONTAINER ===== */
    .quiz-container { max-width:840px; margin:0 auto; padding:20px 16px 50px; }
    /* ===== SECTION HEADER ===== */
    .section-header {
      background:linear-gradient(135deg,rgba(230,57,70,.25),rgba(244,208,63,.15));
      border:1px solid rgba(244,208,63,.35);
      border-radius:18px; padding:13px 22px; margin:28px 0 16px;
      backdrop-filter:blur(8px);
    }
    .section-title { font-size:1rem; font-weight:900; color:var(--straw-gold); text-transform:uppercase; letter-spacing:1px; }
    .section-instr { font-size:.87rem; color:rgba(255,255,255,.85); margin-top:5px; font-style:italic; line-height:1.55; }
    /* ===== QUESTION CARD ===== */
    .q-card {
      background:var(--glass-bg); backdrop-filter:blur(16px);
      border:1px solid var(--glass-border); border-radius:22px;
      padding:24px; margin-bottom:22px;
      box-shadow:0 8px 32px rgba(0,0,0,.32); transition:transform .2s;
    }
    .q-card:hover { transform:translateY(-2px); }
    .q-label {
      display:inline-block;
      background:linear-gradient(135deg,var(--luffy-red),var(--luffy-red-dark));
      color:white; font-size:.78rem; font-weight:900;
      padding:3px 14px; border-radius:20px; margin-bottom:11px;
    }
    .q-text { font-size:1.15rem; font-weight:700; color:white; line-height:1.65; margin-bottom:18px; }
    .q-text u { text-decoration-color:var(--straw-gold); text-decoration-thickness:2px; }
    /* ===== OPTIONS ===== */
    .opts-grid { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
    @media(max-width:520px){ .opts-grid{grid-template-columns:1fr;} }
    .opt-btn {
      background:rgba(255,255,255,.09); border:2px solid rgba(255,255,255,.22);
      border-radius:17px; padding:14px 18px; color:white;
      font-family:'Nunito',sans-serif; font-size:1.05rem; font-weight:700;
      cursor:pointer; text-align:left; transition:all .2s;
      box-shadow:0 4px 16px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.1);
      line-height:1.45;
    }
    .opt-btn:hover:not(:disabled) {
      transform:scale(1.04) translateY(-2px);
      background:rgba(255,255,255,.18);
      border-color:var(--straw-gold);
      box-shadow:0 7px 22px rgba(0,0,0,.3),0 0 16px rgba(244,208,63,.3);
    }
    .opt-btn.correct {
      background:rgba(0,210,106,.28) !important; border-color:#00D26A !important;
      color:#00ff88 !important; box-shadow:0 4px 16px rgba(0,210,106,.4) !important;
    }
    .opt-btn.wrong {
      background:rgba(255,71,87,.28) !important; border-color:#FF4757 !important;
      color:#ff9090 !important; box-shadow:0 4px 16px rgba(255,71,87,.4) !important;
      animation:shake .42s ease;
    }
    .opt-btn:disabled { cursor:not-allowed; }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-9px)} 40%{transform:translateX(9px)}
      60%{transform:translateX(-5px)} 80%{transform:translateX(5px)}
    }
    /* ===== EXPLANATION ===== */
    .exp-panel {
      display:none; background:rgba(244,208,63,.08);
      border:1px solid rgba(244,208,63,.28); border-radius:17px;
      padding:18px; margin-top:18px; animation:slideDown .32s ease;
    }
    .exp-panel.show { display:block; }
    @keyframes slideDown {
      from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)}
    }
    .exp-title {
      font-size:.86rem; font-weight:900; color:var(--straw-gold);
      margin-bottom:11px; display:flex; align-items:center; gap:7px;
    }
    .exp-body { font-size:.97rem; color:rgba(255,255,255,.9); line-height:1.75; }
    .exp-body p { margin-bottom:8px; }
    .viet-trans {
      background:rgba(244,208,63,.13); border-left:3px solid var(--straw-gold);
      padding:9px 13px; border-radius:0 9px 9px 0; margin:9px 0;
      font-weight:700; color:#ffeaa7; font-size:.95rem;
    }
    /* Colour coding */
    .p-word  { color:#74b9ff; font-weight:800; }
    .p-phonetic { color:#a29bfe; background:rgba(162,155,254,.16); padding:1px 5px; border-radius:5px; font-style:italic; }
    .p-mean  { color:#e17055; font-weight:700; }
    .p-grammar { color:#fd79a8; text-decoration:underline; text-decoration-color:#e63946; font-weight:800; }
    .hl-green { color:#00D26A; font-weight:900; }
    .hl-red   { color:#ff7675; text-decoration:line-through; font-weight:800; }
    /* ===== SIGN BOX ===== */
    .sign-box {
      display:inline-block; background:white; border:3px solid #222;
      border-radius:6px; padding:16px 26px; margin:12px 0;
      text-align:center; color:#1a1a1a; font-size:.96rem;
      font-weight:800; line-height:2;
      box-shadow:5px 5px 0 rgba(0,0,0,.32), inset 0 0 0 2px #ccc;
    }
    /* ===== SUBMIT ===== */
    .submit-sec { text-align:center; padding:32px 0 48px; }
    .submit-btn {
      background:linear-gradient(135deg,var(--luffy-red),var(--luffy-red-dark));
      color:white; border:none; border-radius:32px; padding:17px 52px;
      font-family:'Nunito',sans-serif; font-size:1.2rem; font-weight:900;
      cursor:pointer; letter-spacing:1px;
      box-shadow:0 6px 26px rgba(230,57,70,.5), 0 0 0 4px rgba(244,208,63,.3);
      transition:all .3s;
    }
    .submit-btn:hover {
      transform:scale(1.06) translateY(-3px);
      box-shadow:0 12px 32px rgba(230,57,70,.6),0 0 0 6px rgba(244,208,63,.4);
    }
    /* ===== MODALS ===== */
    .modal-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,.72); z-index:1000;
      align-items:center; justify-content:center;
      backdrop-filter:blur(5px);
    }
    .modal-overlay.active { display:flex; }
    .modal-box {
      background:linear-gradient(135deg,#0d1b4b,#04042a);
      border:2px solid rgba(244,208,63,.5); border-radius:26px;
      padding:38px; max-width:500px; width:92%;
      box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 50px rgba(244,208,63,.08);
      text-align:center; animation:popIn .4s ease;
    }
    @keyframes popIn {
      from{transform:scale(.7);opacity:0} to{transform:scale(1);opacity:1}
    }
    .modal-title { font-size:1.5rem; font-weight:900; color:var(--straw-gold); margin-bottom:16px; }
    .name-input {
      width:100%; padding:14px 18px;
      border:2px solid rgba(255,255,255,.28); border-radius:13px;
      background:rgba(255,255,255,.1); color:white;
      font-family:'Nunito',sans-serif; font-size:1rem; font-weight:700;
      margin-bottom:10px; outline:none; transition:border-color .22s;
    }
    .name-input:focus { border-color:var(--straw-gold); }
    .name-input.err { border-color:var(--luffy-red); animation:shake .42s ease; }
    .name-input::placeholder { color:rgba(255,255,255,.45); }
    .err-msg { color:#ff7675; font-size:.85rem; margin-bottom:10px; display:none; }
    .err-msg.show { display:block; }
    .confirm-btn {
      background:linear-gradient(135deg,var(--straw-gold),var(--dark-gold));
      color:#1a1a1a; border:none; border-radius:32px; padding:14px 40px;
      font-family:'Nunito',sans-serif; font-size:1.05rem; font-weight:900;
      cursor:pointer; transition:all .22s; width:100%; margin-top:4px;
    }
    .confirm-btn:hover { transform:scale(1.03); box-shadow:0 6px 20px rgba(244,208,63,.4); }
    /* Result */
    .result-greet { font-size:1.3rem; font-weight:900; color:var(--straw-gold); margin-bottom:10px; line-height:1.35; }
    .result-score { font-size:3.6rem; font-weight:900; color:white; text-shadow:0 0 22px rgba(255,255,255,.4); margin:14px 0; }
    .result-score span { color:var(--straw-gold); }
    .result-detail { background:rgba(255,255,255,.1); border-radius:13px; padding:12px; margin:12px 0; font-size:.92rem; color:rgba(255,255,255,.85); }
    .result-meme { width:210px; height:155px; object-fit:cover; border-radius:13px; margin:14px auto; display:block; border:3px solid var(--straw-gold); }
    .retry-btn {
      background:linear-gradient(135deg,#00D26A,#009950);
      color:white; border:none; border-radius:32px; padding:14px 40px;
      font-family:'Nunito',sans-serif; font-size:1.05rem; font-weight:900;
      cursor:pointer; width:100%; margin-top:10px; transition:all .22s;
    }
    .retry-btn:hover { transform:scale(1.03); }
    /* Confetti */
    .confetti-piece {
      position:fixed; top:-20px; z-index:2000;
      border-radius:4px; animation:confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%{transform:translateY(0) rotate(0deg);opacity:1}
      100%{transform:translateY(105vh) rotate(720deg);opacity:0}
    }
  </style>
</head>
<body>

<!-- BG -->
<div class="bg-gradient"></div>
<div class="bg-pattern">
  <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="pp" x="0" y="0" width="220" height="220" patternUnits="userSpaceOnUse">
        <!-- Straw Hat -->
        <g transform="translate(18,18)">
          <ellipse cx="38" cy="26" rx="33" ry="8" fill="#f4d03f" opacity=".65"/>
          <ellipse cx="38" cy="22" rx="19" ry="13" fill="#f4d03f" opacity=".5"/>
          <rect x="21" y="20" width="34" height="5" rx="2.5" fill="#e63946" opacity=".7"/>
        </g>
        <!-- Jolly Roger -->
        <g transform="translate(130,115)">
          <circle cx="18" cy="14" r="13" fill="white" opacity=".28"/>
          <circle cx="13" cy="11" r="2.8" fill="#0d1b4b" opacity=".55"/>
          <circle cx="23" cy="11" r="2.8" fill="#0d1b4b" opacity=".55"/>
          <path d="M11 20 Q18 25 25 20" stroke="#0d1b4b" fill="none" stroke-width="2" opacity=".5"/>
          <line x1="5"  y1="30" x2="13" y2="24" stroke="white" stroke-width="2.5" opacity=".3"/>
          <line x1="31" y1="30" x2="23" y2="24" stroke="white" stroke-width="2.5" opacity=".3"/>
        </g>
        <!-- Wave -->
        <path d="M0 165 Q28 155 55 165 Q82 175 110 165 Q138 155 165 165 Q192 175 220 165"
              stroke="#76e5f5" fill="none" stroke-width="3" opacity=".38"/>
        <!-- Star -->
        <polygon points="175,28 178,37 188,37 180,43 183,52 175,46 167,52 170,43 162,37 172,37"
                 fill="#f4d03f" opacity=".42"/>
        <!-- Dots -->
        <circle cx="95" cy="85" r="3" fill="#a29bfe" opacity=".4"/>
        <circle cx="103" cy="79" r="2" fill="#a29bfe" opacity=".3"/>
        <circle cx="88" cy="93" r="2" fill="#a29bfe" opacity=".3"/>
        <!-- Anchor small -->
        <g transform="translate(50,140)" opacity=".25" fill="none" stroke="#76e5f5" stroke-width="1.8">
          <circle cx="10" cy="5" r="4"/>
          <line x1="10" y1="9" x2="10" y2="22"/>
          <path d="M4 15 Q10 19 16 15"/>
          <line x1="4" y1="22" x2="16" y2="22"/>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#pp)"/>
  </svg>
</div>

<!-- HEADER -->
<header class="site-header">
  <div class="test-title">⚓ TEST 1 – ENGLISH ⚓</div>
  <div class="creator-line">👩‍🏫 Giáo viên tạo: Ms Mai An ULIS</div>
  <div class="pirate-divider">
    <div class="divider-line"></div>
    <span>🏴‍☠️</span>
    <div class="divider-line"></div>
  </div>
</header>

<!-- SCORE BAR -->
<div class="score-bar">
  <div class="score-badge">⭐ <span id="scoreDisp">0</span> / <span id="totalDisp">0</span></div>
  <div class="prog-wrap"><div class="prog-bar" id="progBar"></div></div>
  <div class="answered-txt"><span id="answDisp">0</span> đã trả lời</div>
</div>

<!-- QUIZ -->
<div class="quiz-container" id="quizContainer"></div>

<!-- SUBMIT -->
<div class="submit-sec">
  <button class="submit-btn" onclick="openNameModal()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
</div>

<!-- NAME MODAL -->
<div class="modal-overlay" id="nameModal">
  <div class="modal-box">
    <div class="modal-title">⚓ Nhập Tên Của Bạn!</div>
    <p style="color:rgba(255,255,255,.72);margin-bottom:18px;font-size:.95rem;">Để xem kết quả cá nhân hoá 🏴‍☠️</p>
    <input type="text" class="name-input" id="studentName" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50">
    <div class="err-msg" id="nameErr">⚠️ Vui lòng nhập tên của bạn!</div>
    <button class="confirm-btn" onclick="submitQuiz()">🏴‍☠️ XEM KẾT QUẢ NGAY!</button>
  </div>
</div>

<!-- RESULT MODAL -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-box" style="max-width:520px;">
    <div class="result-greet" id="resultGreet"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-detail" id="resultDetail"></div>
    <img id="resultMeme" class="result-meme" src="" alt="result gif">
    <button class="retry-btn" onclick="retryQuiz()">🔄 LÀM LẠI BÀI</button>
  </div>
</div>

<script>
// =============================================
// QUESTION DATA
// =============================================
const questions = [
  // ---- SECTION 1: PRONUNCIATION ----
  {
    id:1,
    section:"🔊 Phần 1: Phát Âm",
    instr:"Choose the letter A, B, C or D to indicate the word whose <u>underlined</u> part differs from the other three in pronunciation in each of the following questions.",
    qHTML:"<strong>Question 1.</strong>",
    opts:[
      {lbl:"A", html:"sk<u>y</u>train"},
      {lbl:"B", html:"h<u>y</u>perloop"},
      {lbl:"C", html:"c<u>y</u>cling"},
      {lbl:"D", html:"friendl<u>y</u>"}
    ],
    correct:"D",
    exp:`
      <p>📘 <strong>Dịch đề bài:</strong></p>
      <div class="viet-trans">Chọn từ có phần gạch chân phát âm KHÁC với 3 từ còn lại.</div>
      <p>📖 <strong>Liệt kê &amp; dịch 4 đáp án – phần gạch chân chữ "<u>y</u>":</strong></p>
      <p>A. <span class='p-word'>sk<u>y</u>train</span> <span class='p-mean'>(tàu điện trên cao)</span> – "y" phát âm <span class='p-phonetic'>/aɪ/</span></p>
      <p>B. <span class='p-word'>h<u>y</u>perloop</span> <span class='p-mean'>(siêu tàu ngầm áp suất)</span> – "y" phát âm <span class='p-phonetic'>/aɪ/</span></p>
      <p>C. <span class='p-word'>c<u>y</u>cling</span> <span class='p-mean'>(đi xe đạp)</span> – "y" phát âm <span class='p-phonetic'>/aɪ/</span></p>
      <p>D. <span class='p-word'>friendl<u>y</u></span> <span class='p-mean'>(thân thiện)</span> – "y" phát âm <span class='p-phonetic'>/i/</span> ← KHÁC!</p>
      <p>✅ <span class='hl-green'>Đáp án D – friendly</span>: Chữ "y" ở cuối từ có từ 2 âm tiết trở lên phát âm là <span class='p-phonetic'>/i/</span> (âm i ngắn, nhẹ).</p>
      <p>❌ <span class='hl-red'>A, B, C sai</span>: "y" trong âm tiết được nhấn mạnh của các từ này phát âm là <span class='p-phonetic'>/aɪ/</span> (âm ai dài, mạnh).</p>
      <p>🏴‍☠️ <span class='p-grammar'>Quy tắc nhớ đời:</span> "y" cuối từ đa âm → <span class='p-phonetic'>/i/</span> | "y" trong âm tiết chính → <span class='p-phonetic'>/aɪ/</span></p>
    `
  },
  {
    id:2,
    section:null, instr:null,
    qHTML:"<strong>Question 2.</strong>",
    opts:[
      {lbl:"A", html:"stop<u>ped</u>"},
      {lbl:"B", html:"book<u>ed</u>"},
      {lbl:"C", html:"visit<u>ed</u>"},
      {lbl:"D", html:"talk<u>ed</u>"}
    ],
    correct:"C",
    exp:`
      <p>📘 <strong>Dịch đề bài:</strong></p>
      <div class="viet-trans">Chọn từ có phần gạch chân phát âm KHÁC với 3 từ còn lại.</div>
      <p>📖 <strong>Liệt kê &amp; dịch 4 đáp án – phần gạch chân "<u>-ed</u>":</strong></p>
      <p>A. <span class='p-word'>stop<u>ped</u></span> <span class='p-mean'>(đã dừng)</span> – "stop" kết thúc /p/ → -ed = <span class='p-phonetic'>/t/</span></p>
      <p>B. <span class='p-word'>book<u>ed</u></span> <span class='p-mean'>(đã đặt chỗ)</span> – "book" kết thúc /k/ → -ed = <span class='p-phonetic'>/t/</span></p>
      <p>C. <span class='p-word'>visit<u>ed</u></span> <span class='p-mean'>(đã thăm)</span> – "visit" kết thúc /t/ → -ed = <span class='p-phonetic'>/ɪd/</span> ← KHÁC!</p>
      <p>D. <span class='p-word'>talk<u>ed</u></span> <span class='p-mean'>(đã nói)</span> – "talk" kết thúc /k/ → -ed = <span class='p-phonetic'>/t/</span></p>
      <p>✅ <span class='hl-green'>Đáp án C – visited</span>: Từ kết thúc bằng âm <span class='p-phonetic'>/t/</span> hoặc <span class='p-phonetic'>/d/</span> thì đuôi -ed đọc là <span class='p-phonetic'>/ɪd/</span> (có thêm âm tiết).</p>
      <p>❌ <span class='hl-red'>A, B, D sai</span>: Từ kết thúc bằng phụ âm vô thanh (voiceless) /p/, /k/ → -ed đọc là <span class='p-phonetic'>/t/</span>.</p>

// =============================================
// STATE
// =============================================
let score = 0;
let answeredCount = 0;
const totalQ = questions.length;
const userAns = {};

// =============================================
// SHUFFLE
// =============================================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// =============================================
// AUDIO (Web Audio API)
// =============================================
function playCorrect() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [[523.25,0],[659.25,.1],[783.99,.2],[1046.5,.3]].forEach(([f,t])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type='sine'; o.frequency.setValueAtTime(f,ctx.currentTime+t);
      g.gain.setValueAtTime(.25,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.28);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.3);
    });
  } catch(e){}
}
function playWrong() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [[220,0],[165,.12],[110,.24]].forEach(([f,t])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type='sawtooth'; o.frequency.setValueAtTime(f,ctx.currentTime+t);
      g.gain.setValueAtTime(.2,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.18);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.2);
    });
  } catch(e){}
}

// =============================================
// CONFETTI
// =============================================
function confetti() {
  const cols=['#e63946','#f4d03f','#00D26A','#76e5f5','#a29bfe','#fd79a8','#ffd700'];
  for(let i=0;i<65;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    const s=Math.random()*11+5;
    el.style.cssText=`left:${Math.random()*100}vw;background:${cols[Math.floor(Math.random()*cols.length)]};width:${s}px;height:${s}px;border-radius:${Math.random()>.5?'50%':'3px'};animation-duration:${Math.random()*2+1.5}s;animation-delay:${Math.random()*.5}s;`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3500);
  }
}

// =============================================
// RENDER
// =============================================
function render() {
  const c = document.getElementById('quizContainer');
  c.innerHTML = '';
  document.getElementById('totalDisp').textContent = totalQ;
  let lastSec = null;
  questions.forEach(q => {
    if(q.section && q.section!==lastSec){
      lastSec=q.section;
      const sh=document.createElement('div');
      sh.className='section-header';
      sh.innerHTML=`<div class="section-title">${q.section}</div>${q.instr?`<div class="section-instr">${q.instr}</div>`:''}`;
      c.appendChild(sh);
    }
    const card=document.createElement('div');
    card.className='q-card'; card.id=`qc-${q.id}`;
    const shuffled=shuffle(q.opts);
    let optsHTML='<div class="opts-grid">';
    shuffled.forEach(opt=>{
      optsHTML+=`<button class="opt-btn" onclick="pick(${q.id},'${opt.lbl}',this)" data-lbl="${opt.lbl}">${opt.html}</button>`;
    });
    optsHTML+='</div>';
    card.innerHTML=`
      <div class="q-label">⚓ Câu ${q.id}</div>
      <div class="q-text">${q.qHTML}</div>
      ${optsHTML}
      <div class="exp-panel" id="ep-${q.id}">
        <div class="exp-title">🗺️ GIẢI THÍCH CHI TIẾT</div>
        <div class="exp-body">${q.exp}</div>
      </div>`;
    c.appendChild(card);
  });
}

// =============================================
// SELECT ANSWER
// =============================================
function pick(qId, lbl, btn) {
  if(userAns[qId]!==undefined) return;
  userAns[qId]=lbl;
  const q=questions.find(x=>x.id===qId);
  const card=document.getElementById(`qc-${qId}`);
  const allBtns=card.querySelectorAll('.opt-btn');
  const isOk=lbl===q.correct;
  allBtns.forEach(b=>{
    b.disabled=true;
    if(b.dataset.lbl===q.correct) b.classList.add('correct');
  });
  if(isOk){ btn.classList.add('correct'); score++; playCorrect(); confetti(); }
  else { btn.classList.add('wrong'); playWrong(); }
  document.getElementById(`ep-${qId}`).classList.add('show');
  answeredCount++;
  updateUI();
}

function updateUI(){
  document.getElementById('scoreDisp').textContent=score;
  document.getElementById('answDisp').textContent=answeredCount;
  document.getElementById('progBar').style.width=((answeredCount/totalQ)*100)+'%';
}

// =============================================
// SUBMIT
// =============================================
function openNameModal(){
  document.getElementById('nameModal').classList.add('active');
  setTimeout(()=>document.getElementById('studentName').focus(),100);
}
document.getElementById('studentName').addEventListener('keydown',e=>{ if(e.key==='Enter') submitQuiz(); });

function submitQuiz(){
  const name=document.getElementById('studentName').value.trim();
  if(!name){
    const inp=document.getElementById('studentName');
    inp.classList.add('err');
    document.getElementById('nameErr').classList.add('show');
    setTimeout(()=>inp.classList.remove('err'),600);
    return;
  }
  document.getElementById('nameModal').classList.remove('active');
  showResult(name);
}

// =============================================
// RESULTS
// =============================================
function showResult(name){
  const pct=(score/totalQ)*100;
  let greet, meme;
  if(pct===100){
    greet=`🏆 HUYỀN THOẠI! ${name} là VƯƠNG của biển cả! 👑⚓🔥`;
    meme='https://media.giphy.com/media/lMVNl4XxTn76o/giphy.gif';
  } else if(pct>=80){
    greet=`🌟 TUYỆT VỜI! ${name} – Luffy cũng phải gọi bằng senpai! 🏴‍☠️💪`;
    meme='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';
  } else if(pct>=60){
    greet=`👊 KHÁ ĐÓ! ${name} đang tiến bộ như Luffy tập haki! ⚡`;
    meme='https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif';
  } else {
    greet=`😅 ${name} ơi, Luffy cũng phải khổ luyện 10 năm! Thử lại nào! 🥊`;
    meme='https://media.giphy.com/media/26ufcVAp3AiKd6Ekg/giphy.gif';
  }
  document.getElementById('resultGreet').innerHTML=greet;
  document.getElementById('resultScore').innerHTML=`<span>${score}</span> / ${totalQ}`;
  document.getElementById('resultMeme').src=meme;
  document.getElementById('resultDetail').innerHTML=
    `🎯 Tỉ lệ đúng: <strong>${Math.round(pct)}%</strong> &nbsp;|&nbsp; ✅ Đúng: <strong>${score}</strong> &nbsp;|&nbsp; ❌ Sai: <strong>${totalQ-score}</strong>`;
  document.getElementById('resultModal').classList.add('active');
  if(pct>=60){ confetti(); if(pct===100){ setTimeout(confetti,700); setTimeout(confetti,1400); } }
}

// =============================================
// RETRY
// =============================================
function retryQuiz(){
  score=0; answeredCount=0;
  Object.keys(userAns).forEach(k=>delete userAns[k]);
  document.getElementById('resultModal').classList.remove('active');
  document.getElementById('studentName').value='';
  document.getElementById('nameErr').classList.remove('show');
  updateUI();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

// =============================================
// INIT
// =============================================
render();
updateUI();
</script>
</body>
