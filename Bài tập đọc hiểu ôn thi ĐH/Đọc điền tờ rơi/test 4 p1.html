<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Tiếng Anh - Ms Mai An ULIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        /* ================= BẢN THIẾT KẾ MÀU SẮC & ANIMATION ================= */
        :root {
            --pastel-1: #9796f0;
            --pastel-2: #fbc7d4;
            --pastel-3: #a1c4fd;
            --pastel-4: #c2e9fb;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.7);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }

        body {
            background: linear-gradient(-45deg, var(--pastel-1), var(--pastel-2), var(--pastel-3), var(--pastel-4));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            overflow: hidden;
            color: #2d3436;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* FLOATING EMOJIS (SVG PATTERN) */
        .floating-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 0%, transparent 60%);
            pointer-events: none;
        }
        .emoji {
            position: absolute; font-size: 2.5rem; opacity: 0.4;
            animation: floatEmoji 10s linear infinite;
        }
        @keyframes floatEmoji {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }

        /* ================= GIAO DIỆN MÀN HÌNH KHÓA (TONE PASTEL) ================= */
        #passwordModal {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(25px);
        }
        .pw-card {
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid var(--glass-border); border-radius: 30px; padding: 48px 40px 40px; 
            max-width: 440px; width: 93%; text-align: center; position: relative; overflow: hidden;
            box-shadow: 0 15px 35px rgba(151, 150, 240, 0.4), inset 0 0 15px rgba(255,255,255,0.8);
        }
        .pw-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
            background: linear-gradient(90deg, #9796f0, #fbc7d4, #9796f0);
        }
        .pw-crest { font-size: 4.5rem; margin-bottom: 15px; display: block; animation: floatMenu 3s ease-in-out infinite;}
        @keyframes floatMenu { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .pw-title { font-family: 'Cinzel', serif; font-size: 1.6rem; font-weight: 800; color: #5a57ad; margin-bottom: 6px; letter-spacing: 2px; }
        .pw-sub   { font-size: 0.95rem; color: #636e72; margin-bottom: 24px; font-weight: 600;}
        .pw-input {
            width: 100%; padding: 15px 20px; border-radius: 15px;
            border: 2px solid rgba(151, 150, 240, 0.5); background: rgba(255,255,255,0.8);
            color: #5a57ad; font-size: 1.1rem; font-weight: 700;
            outline: none; letter-spacing: 3px; text-align: center; transition: all .3s;
        }
        .pw-input:focus { border-color: #9796f0; box-shadow: 0 0 0 4px rgba(151, 150, 240, 0.2); }
        .pw-input.error { border-color: #ff7675; box-shadow: 0 0 0 4px rgba(255, 118, 117, 0.3); animation: shake .4s ease; }
        .pw-input::placeholder { color: #b2bec3; letter-spacing: 1px; font-weight: normal;}
        .pw-btn {
            width: 100%; padding: 15px; margin-top: 18px; border-radius: 15px; border: none;
            background: linear-gradient(135deg, #9796f0 0%, #fbc7d4 100%);
            color: #fff; font-size: 1.1rem; font-weight: 800; font-family: 'Nunito', sans-serif;
            cursor: pointer; letter-spacing: 1px; transition: all .2s; box-shadow: 0 5px 15px rgba(151, 150, 240, 0.4);
        }
        .pw-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(151, 150, 240, 0.6); filter: brightness(1.1); }
        .pw-err { color: #d63031; font-size: 0.9rem; margin-top: 12px; display: none; font-weight: 800; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 15%,45%,75%{transform:translateX(-8px)} 30%,60%,90%{transform:translateX(8px)} }

        /* ================= GIAO DIỆN CHÍNH (SPLIT SCREEN) ================= */
        #mainContent { display: none; height: 100vh; padding: 15px; }
        .header {
            position: absolute; top: 15px; left: 30px; z-index: 100;
            background: var(--glass-bg); backdrop-filter: blur(10px); padding: 8px 20px;
            border-radius: 20px; border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
            font-size: 0.9rem; font-weight: 800; color: #5a57ad; letter-spacing: 1px;
        }

        .split-container {
            display: flex; gap: 20px; height: calc(100vh - 30px); margin-top: 40px;
        }
        
        .panel {
            flex: 1; background: var(--glass-bg); backdrop-filter: blur(16px);
            border: 2px solid var(--glass-border); border-radius: 25px;
            box-shadow: var(--glass-shadow); padding: 30px; overflow-y: auto;
            position: relative;
        }

        /* Tùy chỉnh thanh cuộn */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(151, 150, 240, 0.6); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(151, 150, 240, 0.9); }

        /* ================= VÙNG BÀI ĐỌC (TRÁI) ================= */
        .passage-box { margin-bottom: 40px; }
        .passage-title { font-size: 1.6rem; color: #d63031; margin-bottom: 15px; text-align: center; text-transform: uppercase; font-weight: 800; text-shadow: 1px 1px 2px rgba(255,255,255,0.8);}
        .paragraph { margin-bottom: 20px; font-size: 1.15rem; line-height: 1.8; color: #2d3436; font-weight: 600;}
        .blank-space { display: inline-block; padding: 0 15px; margin: 0 5px; background: rgba(255,255,255,0.7); border: 2px dashed #9796f0; border-radius: 8px; font-weight: 800; color: #5a57ad;}
        
        .translate-btn {
            background: #fff; border: 2px solid #fbc7d4; color: #e84393; padding: 6px 15px;
            border-radius: 20px; font-size: 0.9rem; font-weight: 700; cursor: pointer;
            transition: all 0.2s; margin-top: 5px; display: inline-flex; align-items: center; gap: 5px;
        }
        .translate-btn:hover { background: #fbc7d4; color: #fff; transform: scale(1.05); }
        .translation-text {
            display: none; background: rgba(253, 235, 236, 0.8); border-left: 4px solid #e84393;
            padding: 12px 15px; margin-top: 10px; border-radius: 0 10px 10px 0; font-size: 1.05rem; font-style: italic;
        }

        /* GLOSSARY */
        .glossary-table {
            width: 100%; border-collapse: collapse; margin-top: 30px; background: rgba(255,255,255,0.5);
            border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .glossary-table th { background: #9796f0; color: white; padding: 12px; font-size: 1.1rem; }
        .glossary-table td { padding: 12px; border-bottom: 1px solid rgba(151, 150, 240, 0.2); font-weight: 600;}
        .glossary-table tr:last-child td { border-bottom: none; }

        /* ================= VÙNG CÂU HỎI (PHẢI) ================= */
        .question-card {
            background: rgba(255,255,255,0.7); border: 2px solid #fff; border-radius: 20px;
            padding: 25px; margin-bottom: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        .question-card:hover { transform: translateY(-5px); }
        .q-text { font-size: 1.25rem; font-weight: 800; color: #2d3436; margin-bottom: 15px; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .opt-btn {
            background: white; border: 2px solid #c2e9fb; padding: 12px 20px; border-radius: 15px;
            font-size: 1.1rem; font-weight: 700; color: #0984e3; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; text-align: center;
        }
        .opt-btn:hover:not(:disabled) { background: #c2e9fb; transform: scale(1.03); }
        .opt-btn:disabled { cursor: not-allowed; opacity: 0.8; }
        
        /* Hiệu ứng chọn đáp án */
        .opt-btn.correct { background: #00b894 !important; border-color: #00b894 !important; color: white !important; box-shadow: 0 0 20px rgba(0, 184, 148, 0.5); }
        .opt-btn.wrong { background: #ff7675 !important; border-color: #ff7675 !important; color: white !important; animation: shake 0.4s ease; }

        /* GIẢI THÍCH MASTER LEVEL */
        .explanation {
            display: none; margin-top: 20px; padding: 20px; background: rgba(255,255,255,0.9);
            border-radius: 15px; border-left: 5px solid #fdcb6e; box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            font-size: 1.05rem; line-height: 1.7; animation: slideDown 0.4s ease;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* CÁC CLASS MÀU SẮC CHUẨN YÊU CẦU */
        .p-word { color: #1e3a8a; font-weight: 900; background: rgba(30,58,138,0.1); padding: 0 4px; border-radius: 4px;} /* Xanh dương */
        .p-mean { color: #b91c1c; font-weight: 800; } /* Đất nung */
        .p-grammar { text-decoration: underline wavy red; font-weight: 800; color: #d35400;} /* Gạch chân đỏ */
        .hl-green { color: #15803d; font-weight: 900; } /* Xanh lá */
        .hl-red { color: #7f1d1d; font-weight: 800; text-decoration: line-through; } /* Đỏ sậm gạch ngang */
        .exp-title { font-weight: 800; color: #e17055; margin-bottom: 8px; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px;}
        .exp-quote { background: #fdfbf7; padding: 10px; border-left: 4px solid #74b9ff; font-style: italic; margin: 10px 0; border-radius: 0 8px 8px 0;}

        /* NÚT NỘP BÀI */
        .submit-btn {
            width: 100%; padding: 20px; margin-top: 30px; border-radius: 20px; border: none;
            background: linear-gradient(45deg, #fd79a8, #e84393); color: white;
            font-size: 1.5rem; font-weight: 900; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(232, 67, 147, 0.4); transition: all 0.3s;
        }
        .submit-btn:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 30px rgba(232, 67, 147, 0.6); }

        /* ================= POPUP KẾT QUẢ ================= */
        #resultModal {
            position: fixed; inset: 0; z-index: 10000; display: none;
            align-items: center; justify-content: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
        }
        .result-card {
            background: white; border-radius: 30px; padding: 40px; width: 90%; max-width: 500px;
            text-align: center; position: relative; overflow: hidden;
            background: linear-gradient(135deg, #ffffff, #f1f2f6);
        }
        .score-circle {
            width: 150px; height: 150px; border-radius: 50%; background: linear-gradient(45deg, #00b894, #55efc4);
            color: white; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 900;
            margin: 0 auto 20px; box-shadow: 0 10px 20px rgba(0, 184, 148, 0.4);
            border: 8px solid white;
        }
        .result-name { font-size: 1.8rem; font-weight: 800; color: #2d3436; margin-bottom: 10px; }
        .result-msg { font-size: 1.2rem; font-weight: 700; color: #636e72; margin-bottom: 20px; }
        .gif-container img { width: 100%; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        /* Confetti Canvas */
        #confettiCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9998; }
    </style>
</head>
<body>

    <div class="floating-bg" id="floatingBg"></div>

    <div id="passwordModal">

        <div class="split-container">

                </div>

            <div class="panel right-panel">

        const bg = document.getElementById('floatingBg');
        for(let i=0; i<15; i++) {
            let el = document.createElement('div');
            el.className = 'emoji';
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (Math.random() * 10 + 10) + 's';
            el.style.animationDelay = (Math.random() * 5) + 's';
            bg.appendChild(el);
        }

        // ================= XỬ LÝ MẬT KHẨU =================
        const _k  = [99, 111, 103, 97, 110, 103, 100, 97, 116, 100, 105, 101, 109, 99, 97, 111]; 
        const _pw = _k.map(c => String.fromCharCode(c)).join(''); // 

        function checkPassword() {
            const inp = document.getElementById('pwInput');
            const err = document.getElementById('pwErr');
            if (inp.value === _pw) {
                document.getElementById('passwordModal').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                // Play motivational audio
                document.getElementById('audioMotivate').play().catch(e => console.log("Audio play prevented by browser"));
            } else {
                inp.classList.remove('error'); void inp.offsetWidth; inp.classList.add('error');
                err.style.display = 'block'; setTimeout(() => inp.classList.remove('error'), 500);
            }
        }
        document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key==='Enter') checkPassword(); });

        // ================= DỮ LIỆU BÀI ĐỌC (FULL 100%) =================

                    </div>
                    <div class="paragraph">
                        <strong>Positive Action!</strong><br>
                        🌟 <strong>Embrace Lifelong Learning:</strong><br>
                        • <span class="blank-space">4. [___]</span> short courses or full degrees online to enhance your skills and career prospects.<br>
                        ⚠️ <strong>Stay Competitive:</strong><br>

                        <br><button class="translate-btn" onclick="toggleTrans(this)">Mở dịch đoạn này 🌟</button>
                        <div class="translation-text"><strong>Hành động tích cực!</strong><br>🌟 <strong>Đón nhận học tập suốt đời:</strong><br>• Tham gia các khóa học ngắn hạn hoặc các bằng cấp đầy đủ trực tuyến để nâng cao kỹ năng và triển vọng nghề nghiệp của bạn.<br>⚠️ <strong>Duy trì sức cạnh tranh:</strong><br>• Các chương trình trực tuyến giúp sinh viên cập nhật xu hướng ngành và cải thiện khả năng có việc làm.<br>🌱 <strong>Thúc đẩy sự đa dạng:</strong><br>• Ở một mức độ đáng kể, giáo dục trực tuyến đang biến đổi việc học truyền thống bằng cách làm cho nó dễ tiếp cận đối với những người học đa dạng trên toàn thế giới.</div>
                    </div>
                `
            },

                        <div class="translation-text"><strong>Sự thật và Số liệu:</strong><br>• Một số lượng lớn các công ty đã chuyển sang mô hình làm việc từ xa hoặc kết hợp do sự tiến bộ của công nghệ và sự thay đổi trong động lực nơi làm việc.<br>• Sự chuyển đổi này đã mở ra cánh cửa cho sự linh hoạt nhưng đồng thời cũng mang lại nhiều thách thức.</div>

        // ================= KHỞI TẠO GIAO DIỆN =================
        function initApp() {
            // Render Reading Passages
            let leftHTML = '';
            readingData.forEach(p => {
                leftHTML += `<div class="passage-box"><div class="passage-title">${p.title}</div>${p.content}</div>`;
            });
            leftHTML += glossaryHTML;
            document.getElementById('readingPanel').innerHTML = leftHTML;

            // Render Questions
            let rightHTML = '';
            questionsData.forEach(q => {
                // Shuffle options
                let shuffled = [...q.options].sort(() => Math.random() - 0.5);
                
                let btnsHTML = '';
                shuffled.forEach(opt => {
                    btnsHTML += `<button class="opt-btn" onclick="checkAnswer(this, ${q.qNum}, ${opt.c})">${opt.t}</button>`;
                });

                rightHTML += `
                    <div class="question-card" id="qCard_${q.qNum}">
                        <div class="q-text">Question ${q.qNum}: Choose the best option.</div>
                        <div class="options-grid">${btnsHTML}</div>
                        <div class="explanation" id="exp_${q.qNum}">${q.exp}</div>
                    </div>
                `;
            });
            document.getElementById('questionsPanel').innerHTML = rightHTML;
        }

        // Mở dịch đoạn văn
        function toggleTrans(btn) {
            let transDiv = btn.nextElementSibling;
            if (transDiv.style.display === 'block') {
                transDiv.style.display = 'none';
                btn.innerHTML = 'Mở dịch đoạn này 🌟';
            } else {
                transDiv.style.display = 'block';
                btn.innerHTML = 'Đóng dịch 🙈';
            }
        }

        // Biến lưu trữ điểm
        let score = 0;
        let answeredQuestions = new Set();

        function checkAnswer(btn, qNum, isCorrect) {
            if (answeredQuestions.has(qNum)) return;
            answeredQuestions.add(qNum);

            let card = document.getElementById(`qCard_${qNum}`);
            let btns = card.querySelectorAll('.opt-btn');
            
            // Disable all buttons in this question
            btns.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.add('correct');
                document.getElementById('audioDing').play().catch(e=>{});
                score++;
                fireConfetti();
            } else {
                btn.classList.add('wrong');
                document.getElementById('audioHuh').play().catch(e=>{});
                // Find and highlight correct answer
                btns.forEach(b => {
                    let optData = questionsData.find(x => x.qNum === qNum).options.find(x => x.t === b.innerText);
                    if(optData && optData.c) b.classList.add('correct');
                });
            }

            // Hiển thị giải thích
            document.getElementById(`exp_${qNum}`).style.display = 'block';
        }

        // ================= HIỆU ỨNG PHÁO HOA (CONFETTI) =================
        function fireConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            let particles = [];
            for(let i=0; i<100; i++) {
                particles.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height,
                    w: Math.random() * 10 + 5, h: Math.random() * 10 + 5,
                    color: `hsl(${Math.random()*360}, 100%, 50%)`,
                    vy: Math.random() * 3 + 2, vx: Math.random() * 2 - 1
                });
            }
            function draw() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                let active = false;
                particles.forEach(p => {
                    p.y += p.vy; p.x += p.vx;
                    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
                    if(p.y < canvas.height) active = true;
                });
                if(active) requestAnimationFrame(draw); else ctx.clearRect(0,0,canvas.width,canvas.height);
            }
            draw();
        }

        // ================= NỘP BÀI & KẾT QUẢ =================
        function submitExam() {
            if(answeredQuestions.size < 18) {
                alert("Con ơi, con chưa làm hết bài kìa! Cố lên làm nốt nhé! 💪");
                return;
            }
            document.getElementById('nameModal').style.display = 'flex';
        }

        function calculateScore() {
            const name = document.getElementById('studentName').value.trim();
            if(!name) { alert("Phải nhập tên để Ms Mai An còn biết ai xuất sắc chứ!"); return; }
            
            document.getElementById('nameModal').style.display = 'none';
            document.getElementById('resultModal').style.display = 'flex';
            
            document.getElementById('finalScore').innerText = `${score}/18`;
            document.getElementById('resName').innerText = `Học sinh: ${name}`;
            
            let percentage = (score / 18) * 100;
            let msg = '', gif = '';
            
            if(percentage === 100) {
                msg = "THIÊN TÀI XUẤT HIỆN! Ms Mai An quá tự hào về con! 🏆✨";
                gif = "https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif"; // Minions cheering
            } else if (percentage >= 60) {
                msg = "RẤT TỐT! Cố gắng thêm chút nữa là hoàn hảo nha! 🔥💪";
                gif = "https://media.giphy.com/media/3o72FcJmLzIdYJiyTq/giphy.gif"; // High five
            } else {
                msg = "Ôi không sao! Đọc kỹ giải thích của cô bên trên để phục thù nhé! 🥺❤️";
                gif = "https://media.giphy.com/media/OPU6wzx8JrHna/giphy.gif"; // Crying SpongeBob
            }
            
            document.getElementById('resMsg').innerText = msg;
            document.getElementById('resGif').src = gif;
        }

        // Run Init
        initApp();
    </script>
