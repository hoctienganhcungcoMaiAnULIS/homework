<!DOCTYPE html>
<html lang="vi">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* CSS VARIABLES & FONTS */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&family=Cinzel:wght@700&display=swap');
        
        :root {
            --glass-bg: rgba(255, 255, 255, 0.2);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            --primary: #ec38bc;
            --secondary: #7303c0;
            --correct: #27ae60;
            --incorrect: #e74c3c;
            --text-dark: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        /* DYNAMIC GRADIENT BACKGROUND */
        body {
            background: linear-gradient(-45deg, #03001e, #7303c0, #ec38bc, #fdeff9);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: var(--text-dark);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* FLOATING EMOJIS (SVG PATTERN) */
        .floating-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .emoji {
            position: absolute;
            font-size: 3rem;
            opacity: 0.4;
            animation: floatup linear infinite;
        }
        @keyframes floatup {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* GIAO DIỆN MÀN HÌNH KHÓA */
        #passwordModal {
            position:fixed; inset:0; z-index:9999;
            display:flex; align-items:center; justify-content:center;
            background:rgba(5,2,15,0.92); backdrop-filter:blur(20px);
        }
        .pw-card {
            background:linear-gradient(160deg, rgba(40,10,70,0.95) 0%, rgba(15,5,30,0.98) 100%);
            border:1.5px solid rgba(240,192,64,0.4); border-radius:24px; padding:48px 40px 40px; 
            max-width:440px; width:93%; text-align:center; position:relative; overflow:hidden;
            box-shadow:0 0 60px rgba(106,5,114,0.6), 0 0 120px rgba(240,192,64,0.1), inset 0 1px 0 rgba(240,192,64,0.15);
        }
        .pw-card::before {
            content:''; position:absolute; top:0; left:0; right:0; height:3px;
            background:linear-gradient(90deg, #6A0572, #F0C040, #6A0572);
        }
        .pw-crest { font-size:4rem; margin-bottom:8px; display:block; }
        .pw-title { font-family:'Cinzel', serif; font-size:1.4rem; font-weight:700; color:#F0C040; margin-bottom:6px; letter-spacing:1px; }
        .pw-sub   { font-size:.87rem; color:rgba(200,200,212,0.6); margin-bottom:24px; }
        .pw-input {
            width:100%; padding:13px 20px; border-radius:12px;
            border:1.5px solid rgba(240,192,64,0.3); background:rgba(255,255,255,0.05);
            color:#FFE082; font-size:1rem; font-family:'Nunito', sans-serif;
            outline:none; letter-spacing:3px; text-align:center; transition:all .3s;
        }
        .pw-input:focus { border-color:#F0C040; box-shadow:0 0 0 3px rgba(240,192,64,0.15); }
        .pw-input.error { border-color:#FF4757; box-shadow:0 0 0 3px rgba(255,71,87,0.25); animation:shake .4s ease; }
        .pw-input::placeholder { color:rgba(200,200,212,0.3); letter-spacing:1px; }
        .pw-btn {
            width:100%; padding:14px; margin-top:14px; border-radius:12px; border:none;
            background:linear-gradient(135deg, #6A0572 0%, #9B1FA8 40%, #F0C040 100%);
            color:#fff; font-size:1rem; font-weight:700; font-family:'Cinzel', serif;
            cursor:pointer; letter-spacing:.5px; transition:transform .2s;
        }
        .pw-btn:hover { transform:translateY(-2px); box-shadow:0 8px 32px rgba(106,5,114,0.7); }
        .pw-err { color:#ff8a9a; font-size:.84rem; margin-top:10px; display:none; font-weight:700; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 15%,45%,75%{transform:translateX(-6px)} 30%,60%,90%{transform:translateX(6px)} }

        /* HEADER & LAYOUT */
        #mainContent {
            display: none; /* Ẩn đi chờ nhập pass */
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        header {
            position: relative;
            z-index: 10;
            padding: 10px 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        header h1 { font-size: 1.5rem; font-weight: 900; }
        header p { font-size: 0.9rem; font-style: italic; opacity: 0.9; }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            z-index: 10;
            gap: 20px;
            padding: 20px;
        }

        .pane {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }
        .pane::-webkit-scrollbar { width: 8px; }
        .pane::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.5); border-radius: 10px; }

        /* READING PASSAGE STYLES */
        .passage-title {
            font-size: 1.4rem;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
            margin-bottom: 15px;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }
        .paragraph {
            background: rgba(255,255,255,0.6);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            line-height: 1.6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .btn-translate {
            background: #ffeaa7;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 10px;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            color: #d35400;
        }
        .btn-translate:hover { transform: scale(1.05); background: #fdcb6e; }
        .translation {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
            color: #2d3436;
            font-style: italic;
        }

        /* GLOSSARY TABLE */
        .glossary-box {
            background: rgba(255,255,255,0.85);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            margin-bottom: 30px;
        }
        .glossary-box h3 { color: var(--secondary); margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: rgba(115, 3, 192, 0.1); color: var(--secondary); }
        .g-word { font-weight: bold; color: #0984e3; }
        .g-type { color: #888; font-size: 0.9em; font-style: italic; }
        .g-mean { color: #d35400; }

        /* QUESTION STYLES */
        .question-card {
            background: rgba(255,255,255,0.7);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .q-text { font-size: 1.15rem; font-weight: bold; margin-bottom: 15px; }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .option-btn {
            background: #fff;
            border: 2px solid transparent;
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .option-btn:hover { background: #f0f0f0; transform: translateY(-2px); border-color: var(--primary); }
        
        .option-btn.correct { background: var(--correct); color: white; border-color: var(--correct); box-shadow: 0 0 15px var(--correct); }
        .option-btn.wrong { background: var(--incorrect); color: white; border-color: var(--incorrect); animation: shake 0.4s; }

        /* MASTER EXPLANATION (STRICT CLASSES) */
        .explanation-box {
            display: none;
            background: #fff;
            border-left: 5px solid var(--primary);
            padding: 15px;
            border-radius: 0 12px 12px 0;
            margin-top: 15px;
            font-size: 1rem;
            line-height: 1.8;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .p-word { color: #0984e3; font-weight: bold; }
        .p-mean { color: #d35400; font-style: italic; }
        .p-grammar { text-decoration: underline; text-decoration-color: red; font-weight: bold; }
        
        /* HIGHLIGHT NỔI BẬT CHO ĐÁP ÁN */
        .hl-green {
            background-color: rgba(39, 174, 96, 0.15);
            color: #1a7536;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 900;
            border: 2px solid #27ae60;
            box-shadow: 0 2px 8px rgba(39, 174, 96, 0.3);
            display: inline-block;
            margin: 2px 0;
        }
        .hl-red {
            background-color: rgba(231, 76, 60, 0.1);
            color: #c0392b;
            padding: 2px 6px;
            border-radius: 6px;
            text-decoration: line-through;
            font-weight: 800;
            border: 1px dashed #e74c3c;
        }
        
        .exp-quote { background: #f8f9fa; padding: 10px; border-radius: 8px; font-style: italic; margin-top: 10px; border: 1px solid #ddd; }

        /* SUBMIT BUTTON & POPUP */
        .submit-btn {
            display: block; width: 100%;
            background: linear-gradient(45deg, #00b09b, #96c93d);
            color: white; border: none; padding: 15px;
            font-size: 1.2rem; font-weight: 900; border-radius: 12px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,176,155,0.4);
            margin-top: 20px; transition: transform 0.2s;
        }
        .submit-btn:hover { transform: scale(1.02); }

        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 100; backdrop-filter: blur(5px);
            justify-content: center; align-items: center;
        }
        .popup {
            background: white; padding: 30px; border-radius: 20px; text-align: center;
            max-width: 400px; width: 90%; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .popup input {
            width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #ddd;
            border-radius: 8px; font-size: 1.1rem; text-align: center; outline: none;
        }
        .popup input:focus { border-color: var(--primary); }
        .popup img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 12px; margin: 15px 0; }

        canvas#confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }

        @media (max-width: 768px) {
            .container { flex-direction: column; overflow-y: auto; }
            .pane { flex: none; height: auto; overflow: visible; }
            body { overflow: auto; }
        }
    </style>
</head>

        <canvas id="confetti"></canvas>

        <div class="floating-bg" id="floatingBg"></div>

        <header>
            <h1>TEST 2 - ĐỌC ĐIỀN TỜ RƠI</h1>
            <p>Giáo viên tạo: Ms Mai An ULIS</p>
        </header>

        <div class="container">
            <div class="pane" id="readingPane"></div>

            <div class="pane" id="quizPane">

                <button class="submit-btn" onclick="openSubmitPopup()">🎯 NỘP BÀI TÍNH ĐIỂM & XEM KẾT QUẢ</button>

<script>
// ==========================================
// 1. LOGIC MÀN HÌNH KHÓA & ÂM THANH
// ==========================================
const _k  = [99,111,109,97,105,97,110,117,108,105,115]; // "comaianulis"
const _pw = _k.map(c => String.fromCharCode(c)).join('');

const reminderAudio = new Audio("https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/export_7wcKV5pKUrQYWyi7XgktJM.mp3");
const wrongAudio = new Audio("https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/oi-ban-oi.mp3");

function checkPassword() {
  const inp = document.getElementById('pwInput');
  const err = document.getElementById('pwErr');
  if (inp.value === _pw) {
    // Ẩn modal, hiện content
    document.getElementById('passwordModal').style.display = 'none';
    const main = document.getElementById('mainContent');
    if(main) main.style.display = 'flex';
    
    // Phát âm thanh nhắc nhở
    reminderAudio.currentTime = 0;
    reminderAudio.play().catch(e => console.log("Trình duyệt chặn autoplay audio"));
    
  } else {
    inp.classList.remove('error'); void inp.offsetWidth; inp.classList.add('error');
    err.style.display = 'block'; setTimeout(() => inp.classList.remove('error'), 500);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const pwInput = document.getElementById('pwInput');
  if(pwInput) pwInput.addEventListener('keydown', e => { if (e.key==='Enter') checkPassword(); });
});

// ==========================================
// 2. DỮ LIỆU ĐỀ BÀI VÀ LỜI GIẢI MASTER
// ==========================================
const data = [
    {
        theme: ['🌲', '🦜', '🌍', '🔥'],
        title: "Protecting Our Planet: Record-breaking Amazon Deforestation",
        paragraphs: [
            {
                en: "Facts and Figures<br><br>The Amazon rainforest has faced deforestation to a significant (1) _____, with over 8,000 square kilometers destroyed in 2024 alone. (2) _____ slowing down, deforestation rates are accelerating due to (3) _____ factors, such as illegal logging, agriculture, and mining.",
                vi: "Dữ kiện và Con số<br><br>Rừng nhiệt đới Amazon đang phải đối mặt với nạn phá rừng ở một mức độ đáng kể, với hơn 8.000 km2 bị phá hủy chỉ riêng trong năm 2024. Mặc dù có những nỗ lực làm chậm lại, tỷ lệ phá rừng vẫn đang tăng nhanh do nhiều yếu tố, chẳng hạn như khai thác gỗ trái phép, nông nghiệp và khai thác mỏ."
            },
            {
                en: "Positive Action!<br><br><b>Advocate:</b><br>Support (4) _____ projects, including replanting native trees and preserving biodiversity, to (5) _____ deforestation.",
                vi: "Hành động Tích cực!<br><br><b>Ủng hộ:</b><br>Hỗ trợ các dự án phục hồi, bao gồm việc trồng lại cây bản địa và bảo tồn đa dạng sinh học, để ứng phó với nạn phá rừng."
            },
            {
                en: "<b>Conserve:</b><br>Advocate stricter laws and penalties to (6) _____ illegal logging while pushing for sustainable practices.<br><br><b>Protect:</b><br>Raise awareness about the importance of protecting endangered wildlife and their habitats.",
                vi: "<b>Bảo tồn:</b><br>Ủng hộ các luật lệ và hình phạt nghiêm khắc hơn để chống lại việc khai thác gỗ trái phép trong khi thúc đẩy các hoạt động bền vững.<br><br><b>Bảo vệ:</b><br>Nâng cao nhận thức về tầm quan trọng của việc bảo vệ động vật hoang dã có nguy cơ tuyệt chủng và môi trường sống của chúng."
            }
        ],
        glossary: [
            {w: "Deforestation", t: "n", m: "Nạn phá rừng"},
            {w: "Significant", t: "adj", m: "Đáng kể, quan trọng"},
            {w: "Accelerate", t: "v", m: "Tăng tốc, thúc đẩy"},
            {w: "Illegal logging", t: "n.p", m: "Khai thác gỗ trái phép"},
            {w: "Advocate", t: "v/n", m: "Biện hộ, ủng hộ"},
            {w: "Replant", t: "v", m: "Trồng lại"},
            {w: "Biodiversity", t: "n", m: "Đa dạng sinh học"},
            {w: "Conserve", t: "v", m: "Bảo tồn"},
            {w: "Penalty", t: "n", m: "Hình phạt, tiền phạt"},
            {w: "Endangered", t: "adj", m: "Có nguy cơ tuyệt chủng"},
            {w: "Habitat", t: "n", m: "Môi trường sống"}
        ],
        questions: [
            {
                id: 1, text: "The Amazon rainforest has faced deforestation to a significant (1) _____, with over 8,000 square kilometers...",
                options: [
                    { t: "extent", c: true, 
                      exp: `Dịch câu: "Rừng Amazon đối mặt nạn phá rừng ở một mức độ đáng kể..."<br>
                      ❌ basis: <span class='hl-red'>cơ sở</span> -> Sai nghĩa.<br>
                      ❌ scale: <span class='hl-red'>quy mô</span> -> Dùng "on a large scale", không dùng với "to a significant...".<br>
                      ❌ number: <span class='hl-red'>số lượng</span> -> Không hợp ngữ cảnh.<br>
                      <span class='hl-green'>✅ extent</span>: Đúng. <span class='p-grammar'>to a significant extent</span> mang nghĩa <span class='p-mean'>ở mức độ đáng kể</span>.<br>
                      <div class='exp-quote'><b>Dẫn chứng:</b> "...faced deforestation <span class='hl-green'>to a significant extent</span>..."</div>` },
                    { t: "basis", c: false }, { t: "scale", c: false }, { t: "number", c: false }
                ]
            },
            {
                id: 2, text: "(2) _____ slowing down, deforestation rates are accelerating...",
                options: [
                    { t: "In spite of", c: true, 
                      exp: `Dịch câu: "(2) _____ việc làm chậm lại, tỷ lệ phá rừng đang tăng nhanh..."<br>
                      ❌ Aside from: <span class='hl-red'>Ngoại trừ</span> -> Sai logic.<br>
                      ❌ Instead of: <span class='hl-red'>Thay vì</span> -> Không khớp với key giải thích gốc.<br>
                      ❌ On top of: <span class='hl-red'>Thêm vào đó</span> -> Sai logic.<br>
                      <span class='hl-green'>✅ In spite of</span>: Đúng. <span class='p-grammar'>In spite of + V-ing/N</span> mang nghĩa <span class='p-mean'>Mặc dù</span>, phù hợp ngữ cảnh nhấn mạnh tốc độ phá rừng vẫn tăng dù nỗ lực cản lại.<br>
                      <div class='exp-quote'><b>Dẫn chứng:</b> "<span class='hl-green'>In spite of</span> slowing down, deforestation rates are accelerating..." (<span class='p-mean'>Mặc dù làm chậm lại, tốc độ phá rừng vẫn tăng...</span>)</div>` },
                    { t: "Aside from", c: false }, { t: "Instead of", c: false }, { t: "On top of", c: false }
                ]
            },
            {
                id: 3, text: "...deforestation rates are accelerating due to (3) _____ factors, such as illegal logging...",
                options: [
                    { t: "many", c: true, 
                      exp: `Dịch câu: "...do (3) _____ yếu tố, chẳng hạn như..."<br>
                      ❌ every: <span class='hl-red'>Mọi (đi với danh từ số ít)</span>.<br>
                      ❌ each: <span class='hl-red'>Mỗi (đi với danh từ số ít)</span>.<br>
                      ❌ little: <span class='hl-red'>Ít (đi với danh từ không đếm được)</span>.<br>
                      <span class='hl-green'>✅ many</span>: Đúng. <span class='p-grammar'>many + danh từ đếm được số nhiều</span>. Ở đây "factors" (yếu tố) có "s".<br>
                      <div class='exp-quote'><b>Dẫn chứng:</b> "...due to <span class='hl-green'>many</span> factors..." (<span class='p-mean'>do nhiều yếu tố</span>)</div>` },
                    { t: "every", c: false }, { t: "each", c: false }, { t: "little", c: false }
                ]
            },
            {
                id: 4, text: "Support (4) _____ projects, including replanting native trees...",
                options: [

                      <div class='exp-quote'><b>Dẫn chứng:</b> "...to <span class='hl-green'>patch up</span> misunderstandings..."</div>` },
                    { t: "set aside", c: false }, { t: "bring in", c: false }, { t: "take over", c: false }
                ]
            }
        ]
    }
];

// ==========================================
// 3. LOGIC RENDER & TƯƠNG TÁC
// ==========================================
let userAnswers = {};
let totalQuestions = 0;

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function init() {
    const readingPane = document.getElementById('readingPane');
    const questionsContainer = document.getElementById('questionsContainer');
    let readingHTML = "";
    let quizHTML = "";
    let allEmojis = [];

    data.forEach((passage, pIndex) => {
        allEmojis.push(...passage.theme);
        
        // --- RENDER READING ---
        readingHTML += `<div class="passage-title">${passage.title}</div>`;
        passage.paragraphs.forEach((p, idx) => {
            const tId = `trans_${pIndex}_${idx}`;
            readingHTML += `
                <div class="paragraph">
                    <p>${p.en}</p>
                    <button class="btn-translate" onclick="toggleTrans('${tId}')">Mở dịch đoạn này 🌟</button>
                    <div id="${tId}" class="translation">${p.vi}</div>
                </div>`;
        });

        // Glossary
        readingHTML += `
            <div class="glossary-box">
                <h3>📚 Bảng từ vựng (Glossary)</h3>
                <table>
                    <tr><th>Từ vựng</th><th>Loại từ</th><th>Nghĩa tiếng Việt</th></tr>`;
        passage.glossary.forEach(g => {
            readingHTML += `<tr><td class="g-word">${g.w}</td><td class="g-type">${g.t}</td><td class="g-mean">${g.m}</td></tr>`;
        });
        readingHTML += `</table></div><hr style="border:1px dashed #fff; margin:30px 0;"><br>`;

        // --- RENDER QUESTIONS ---
        passage.questions.forEach(q => {
            totalQuestions++;
            let shuffledOptions = shuffle([...q.options]);
            let optionsHTML = shuffledOptions.map(opt => 
                `<button class="option-btn" onclick="handleSelect(${q.id}, this, ${opt.c})">${opt.t}</button>`
            ).join('');

            let correctExp = q.options.find(o => o.c).exp;

            quizHTML += `
                <div class="question-card" id="qcard_${q.id}">
                    <div class="q-text">Câu ${q.id}: ${q.text}</div>
                    <div class="options-grid" id="opts_${q.id}">${optionsHTML}</div>
                    <div class="explanation-box" id="exp_${q.id}">${correctExp}</div>
                </div>`;
        });
    });

    readingPane.innerHTML = readingHTML;
    questionsContainer.innerHTML = quizHTML;
    createFloatingEmojis(allEmojis);
}

function toggleTrans(id) {
    const el = document.getElementById(id);
    el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function createFloatingEmojis(emojis) {
    const bg = document.getElementById('floatingBg');
    for(let i=0; i<30; i++) {
        let el = document.createElement('div');
        el.className = 'emoji';
        el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.animationDuration = (10 + Math.random() * 20) + 's';
        el.style.animationDelay = (Math.random() * 5) + 's';
        bg.appendChild(el);
    }
}

// ==========================================
// 4. KIỂM TRA ĐÁP ÁN & ÂM THANH TRẮC NGHIỆM
// ==========================================
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playCorrectSound() {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
    osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // A6
    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    shootConfetti();
}

function handleSelect(qId, btnEl, isCorrect) {
    if(userAnswers[qId] !== undefined) return; 
    
    userAnswers[qId] = isCorrect;
    const parent = document.getElementById(`opts_${qId}`);
    const allBtns = parent.querySelectorAll('.option-btn');
    
    allBtns.forEach(b => {
        b.style.pointerEvents = 'none';
        b.style.opacity = '0.7';
        let optText = b.innerText;
        let isBtnCorrect = data.flatMap(p => p.questions).find(q => q.id === qId).options.find(o => o.t === optText).c;
        if(isBtnCorrect) {
            b.classList.add('correct');
            b.style.opacity = '1';
        }
    });

    if(isCorrect) {
        playCorrectSound();
        btnEl.classList.add('correct');
        btnEl.style.opacity = '1';
    } else {
        // ÂM THANH ÔI BẠN ƠI
        wrongAudio.currentTime = 0;
        wrongAudio.play().catch(e => console.log(e));
        
        btnEl.classList.add('wrong');
        btnEl.style.opacity = '1';
    }

    const expBox = document.getElementById(`exp_${qId}`);
    expBox.style.display = 'block';
}

// ==========================================
// 5. HIỆU ỨNG CONFETTI (PHÁO HOA)
// ==========================================
let canvas = document.getElementById('confetti');
let ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let particles = [];
function shootConfetti() {
    for(let i=0; i<50; i++) {
        particles.push({
            x: canvas.width/2, y: canvas.height/2,
            r: Math.random()*6+2,
            dx: Math.random()*10-5, dy: Math.random()*-10-5,
            c: `hsl(${Math.random()*360}, 100%, 50%)`
        });
    }
}
function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach((p, index) => {
        p.x += p.dx; p.y += p.dy; p.dy += 0.3; // gravity
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = p.c; ctx.fill();
        if(p.y > canvas.height) particles.splice(index, 1);
    });
    requestAnimationFrame(animateConfetti);
}
animateConfetti();

// ==========================================
// 6. NỘP BÀI & POPUP KẾT QUẢ
// ==========================================
function openSubmitPopup() {
    const answeredCount = Object.keys(userAnswers).length;
    if(answeredCount < totalQuestions) {
        alert(`Bạn mới làm ${answeredCount}/${totalQuestions} câu. Vui lòng làm hết trước khi nộp!`);
        return;
    }
    
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('popupContent').innerHTML = `
        <h2 style="color:var(--primary);">Hành trình hoàn tất!</h2>
        <p>Nhập tên của bạn để xem kết quả nhé:</p>
        <input type="text" id="studentName" placeholder="Tên học sinh...">
        <button class="submit-btn" onclick="showScore()">XEM ĐIỂM NGAY 🚀</button>
    `;
}

function showScore() {
    const name = document.getElementById('studentName').value.trim();
    if(!name) { alert("Nhập tên vô để còn khen chứ!"); return; }

    const correctCount = Object.values(userAnswers).filter(v => v).length;
    const percent = (correctCount / totalQuestions) * 100;
    
    let gifUrl = "";
    let comment = "";
    if(percent === 100) {
        gifUrl = "https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif"; 
        comment = "Trời ơi, THIÊN TÀI LÀ ĐÂY! Em làm đúng tuyệt đối! Ms Mai An quá tự hào luôn! 🏆✨";
        for(let i=0; i<5; i++) setTimeout(shootConfetti, i*300);
    } else if(percent >= 60) {
        gifUrl = "https://media.giphy.com/media/l4q8cJzGdR9J8w3hS/giphy.gif"; 
        comment = "Rất tốt! Em đã nắm bài khá vững! Cố lên chút nữa là đạt điểm tối đa nha! High-five! 👏🔥";
        shootConfetti();
    } else {
        gifUrl = "https://media.giphy.com/media/3o6wrvdHFbwBrUFenu/giphy.gif"; 
        comment = "Úi chà, sai hơi nhiều rồi. Nhớ đọc thật kỹ giải thích Master của cô ở từng câu để không mắc lại lỗi nhé! Cố lên em! 💪🥺";
    }

    document.getElementById('popupContent').innerHTML = `
        <h1 style="color:var(--secondary); font-size:2rem;">BẢNG ĐIỂM</h1>
        <h2 style="margin: 10px 0; color:#333;">Học sinh: <span style="color:var(--primary);">${name}</span></h2>
        <div style="font-size: 3rem; font-weight: 900; color:var(--correct); margin: 10px 0;">${correctCount}/${totalQuestions}</div>
        <img src="${gifUrl}" alt="Reaction GIF">
        <p style="font-size: 1.1rem; line-height:1.5; color:#555; padding: 10px; background:#f4f4f4; border-radius:10px;">${comment}</p>
        <button class="btn-translate" style="width:100%; margin-top:15px; font-size:1.1rem; padding:10px;" onclick="closePopup()">ĐÓNG LẠI & XEM GIẢI THÍCH</button>
    `;
}

function closePopup() {
    document.getElementById('overlay').style.display = 'none';
}

// Khởi chạy
window.onload = init;
</script>
