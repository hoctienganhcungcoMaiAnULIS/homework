<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Test – Grade 7 🐻</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{  font-family:'Nunito',sans-serif;  min-height:100vh;  overflow-x:hidden;  position:relative;}

/* ── ANIMATED GRADIENT BG ── */
.bg-anim{  position:fixed;inset:0;z-index:-2;  background:linear-gradient(-45deg,    #D4845A,#F5A623,#FFD1A9,    #C8956C,#FFDAB9,#A67C52,    #F0A030,#FFE4C4,#D4845A);  background-size:400% 400%;  animation:bgMove 16s ease infinite;}
@keyframes bgMove{  0%{background-position:0% 50%}  50%{background-position:100% 50%}  100%{background-position:0% 50%}}

/* ── BEAR PATTERN OVERLAY ── */
.bear-pattern{  position:fixed;inset:0;z-index:-1;  pointer-events:none;overflow:hidden;}

/* ── HEADER ── */
header{  position:sticky;top:0;z-index:50;  padding:8px 16px 6px;  display:flex;justify-content:center;}
.header-pill{  display:inline-flex;flex-direction:column;align-items:center;  background:rgba(255,255,255,0.38);  backdrop-filter:blur(14px);  -webkit-backdrop-filter:blur(14px);  border:1.5px solid rgba(255,255,255,0.6);  border-radius:50px;  padding:7px 24px 5px;  box-shadow:0 4px 18px rgba(160,82,45,0.18);}
.header-title{  font-size:1.0rem;font-weight:900;  color:#5D2E0C;letter-spacing:0.3px;  text-shadow:0 1px 3px rgba(255,255,255,0.5);}
.header-sub{  font-size:0.68rem;font-weight:700;  color:#8B4513;opacity:0.82;margin-top:1px;}

/* ── CONTAINER ── */
.container{  max-width:840px;margin:0 auto;  padding:14px 14px 110px;}

/* ── SECTION DIVIDER ── */
.section-label{  text-align:center;  margin:28px 0 16px;}
.section-label span{  display:inline-block;  background:rgba(120,50,10,0.82);  color:#fff;  font-size:0.8rem;font-weight:900;  letter-spacing:1.8px;text-transform:uppercase;  padding:7px 22px;  border-radius:50px;  box-shadow:0 4px 14px rgba(120,50,10,0.3);}

/* ── QUESTION CARD ── */
.q-card{  margin-bottom:18px;  background:rgba(255,255,255,0.3);  backdrop-filter:blur(16px);  -webkit-backdrop-filter:blur(16px);  border:1.5px solid rgba(255,255,255,0.55);  border-radius:22px;  padding:20px 20px 16px;  box-shadow:0 8px 30px rgba(160,82,45,0.12);  transition:box-shadow 0.25s;}
.q-card:hover{  box-shadow:0 12px 36px rgba(160,82,45,0.18);}
.q-num{  font-size:0.7rem;font-weight:900;  color:#A0522D;text-transform:uppercase;  letter-spacing:1.4px;margin-bottom:4px;}
.q-instr{  font-size:0.82rem;font-weight:600;  color:#7C4010;font-style:italic;  margin-bottom:8px;line-height:1.45;}
.q-text{  font-size:1.08rem;font-weight:800;  color:#3E1A00;margin-bottom:14px;line-height:1.55;}

/* ── SPECIAL DISPLAY BOXES ── */
.dialogue-box{  background:rgba(255,218,165,0.42);  border-left:4px solid #C8956C;  border-radius:12px;  padding:12px 16px;margin-bottom:14px;  font-size:0.96rem;color:#3E1A00;line-height:1.65;}
.dialogue-box .sp-name{font-weight:900;color:#7C3A00;}
.note-wrap{  display:flex;gap:14px;align-items:flex-start;  margin-bottom:14px;flex-wrap:wrap;}
.note-card{  flex:0 0 auto;min-width:210px;max-width:260px;  background:rgba(255,255,255,0.72);  border:2px solid #C8956C;  border-radius:14px;  padding:13px 17px;  font-size:0.9rem;color:#3E1A00;line-height:1.6;  box-shadow:3px 3px 0 rgba(200,149,108,0.28);}
.note-card .note-to{font-weight:900;margin-bottom:4px;font-size:0.95rem;}
.note-card .note-body{font-size:0.88rem;}
.note-card .note-sig{text-align:right;font-weight:800;font-style:italic;margin-top:8px;font-size:0.88rem;}
.sign-wrap{  display:flex;gap:16px;align-items:flex-start;  margin-bottom:14px;flex-wrap:wrap;}
.push-sign{  flex:0 0 auto;width:120px;  background:#fff;border:4px solid #1a1a1a;  border-radius:8px;padding:10px 8px 8px;  text-align:center;  box-shadow:5px 5px 0 #1a1a1a;}
.push-sign .ps-text{  font-size:0.95rem;font-weight:900;  color:#1a1a1a;letter-spacing:0.5px;line-height:1.2;  text-transform:uppercase;}
.push-sign .ps-icon{  width:52px;height:52px;  background:#1a1a1a;border-radius:4px;  margin:8px auto 0;  display:flex;align-items:center;justify-content:center;  color:#fff;font-size:1.5rem;}
.push-sign .ps-arrow{  font-size:1.1rem;font-weight:900;  color:#1a1a1a;margin-top:5px;}
.passage-box{  background:rgba(255,232,196,0.5);  border:1.5px solid rgba(200,149,108,0.4);  border-radius:14px;  padding:14px 16px;margin-bottom:14px;  font-size:0.96rem;color:#3E1A00;line-height:1.65;}
.passage-box .p-sent{  padding:3px 0;font-size:0.93rem;}
.passage-box .p-sent b{color:#A0522D;}

/* ── OPTIONS GRID ── */
.opts-grid{  display:grid;  grid-template-columns:1fr 1fr;  gap:10px;margin-top:2px;}
@media(max-width:530px){.opts-grid{grid-template-columns:1fr;}}

/* ── OPTION CARD ── */
.opt{  cursor:pointer;  padding:13px 15px;  background:rgba(255,228,196,0.52);  border:2px solid rgba(200,149,108,0.35);  border-radius:18px;  font-family:'Nunito',sans-serif;  font-size:1.0rem;font-weight:700;  color:#3E1A00;text-align:center;  transition:transform 0.18s,background 0.18s,border-color 0.18s,box-shadow 0.18s;  box-shadow:0 4px 10px rgba(160,82,45,0.12),0 2px 0 rgba(160,82,45,0.22);  user-select:none;line-height:1.4;  -webkit-tap-highlight-color:transparent;}
.opt:hover:not(.disabled){  transform:scale(1.04) translateY(-3px);  background:rgba(255,228,196,0.85);  border-color:#C8956C;  box-shadow:0 8px 20px rgba(160,82,45,0.22),0 3px 0 rgba(160,82,45,0.3);}
.opt.correct{  background:rgba(0,210,106,0.2)!important;  border-color:#00D26A!important;  color:#004D22!important;  box-shadow:0 4px 14px rgba(0,210,106,0.3)!important;  transform:scale(1.03)!important;}
.opt.incorrect{  background:rgba(255,71,87,0.15)!important;  border-color:#FF4757!important;  color:#B80016!important;  animation:shake 0.42s ease;}
.opt.reveal-correct{  background:rgba(0,210,106,0.1)!important;  border-color:rgba(0,210,106,0.55)!important;  color:#004D22!important;}
.opt.disabled{cursor:default;pointer-events:none;}
@keyframes shake{  0%,100%{transform:translateX(0)}  15%{transform:translateX(-9px)}  35%{transform:translateX(9px)}  55%{transform:translateX(-6px)}  75%{transform:translateX(6px)}}

/* ── EXPLANATION BOX ── */
.expl-box{  display:none;  margin-top:14px;  background:rgba(255,243,224,0.78);  border:1.5px solid rgba(200,149,108,0.42);  border-left:4px solid #F5A623;  border-radius:14px;  padding:15px 17px;  font-size:0.93rem;color:#3E1A00;  line-height:1.75;  animation:fadeIn 0.35s ease;}
.expl-box.show{display:block;}
.expl-title{  font-size:0.82rem;font-weight:900;  color:#A0522D;text-transform:uppercase;  letter-spacing:0.8px;margin-bottom:10px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.p-word{color:#1D4ED8;font-weight:800;}
.p-phonetic{color:#7C3AED;background:rgba(124,58,237,0.09);border-radius:4px;padding:0 4px;font-style:italic;}
.p-mean{color:#B45309;font-weight:700;}
.p-grammar{color:#DC2626;text-decoration:underline;font-weight:700;}
.hl-green{color:#059669;font-weight:900;}
.hl-red{color:#DC2626;text-decoration:line-through;font-weight:700;}
.vi-box{  background:rgba(255,193,110,0.28);  border-left:3px solid #F5A623;  border-radius:8px;  padding:7px 12px;margin:9px 0;  font-weight:700;color:#7C3A00;  font-size:0.92rem;line-height:1.5;}

/* ── SUBMIT FOOTER ── */
.submit-wrap{  position:fixed;bottom:0;left:0;right:0;  padding:12px 20px 16px;  background:rgba(255,243,220,0.88);  backdrop-filter:blur(12px);  border-top:1.5px solid rgba(200,149,108,0.28);  display:flex;justify-content:center;z-index:40;}
.submit-btn{  background:linear-gradient(135deg,#A0522D 0%,#D4845A 60%,#F5A623 100%);  color:#fff;border:none;border-radius:50px;  padding:14px 42px;  font-family:'Nunito',sans-serif;  font-size:1.08rem;font-weight:900;  cursor:pointer;letter-spacing:0.3px;  box-shadow:0 6px 22px rgba(160,82,45,0.4);  transition:transform 0.18s,box-shadow 0.18s;}
.submit-btn:hover{  transform:scale(1.04) translateY(-2px);  box-shadow:0 10px 30px rgba(160,82,45,0.5);}

/* ── MODALS ── */
.modal-overlay{  display:none;position:fixed;inset:0;  background:rgba(55,18,0,0.52);  backdrop-filter:blur(7px);  z-index:200;align-items:center;  justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{  background:rgba(255,244,225,0.97);  backdrop-filter:blur(20px);  border:2px solid rgba(200,149,108,0.6);  border-radius:26px;  padding:30px 26px 24px;  max-width:460px;width:100%;  text-align:center;  box-shadow:0 24px 64px rgba(80,30,0,0.32);  max-height:90vh;overflow-y:auto;}
.modal-title{  font-size:1.35rem;font-weight:900;  color:#5D2E0C;margin:8px 0 6px;line-height:1.3;}
.modal-sub{  font-size:0.86rem;font-weight:600;  color:#8B4513;margin-bottom:4px;}
.name-input{  width:100%;padding:13px 18px;  border:2px solid #C8956C;border-radius:14px;  font-family:'Nunito',sans-serif;  font-size:1rem;font-weight:700;color:#3E1A00;  background:rgba(255,255,255,0.88);  margin:14px 0 4px;outline:none;  transition:border-color 0.2s;}
.name-input:focus{border-color:#A0522D;}
.name-input.err{border-color:#FF4757;animation:shake 0.3s ease;}
.err-msg{color:#FF4757;font-size:0.82rem;font-weight:700;display:none;margin-bottom:6px;}
.modal-btn{  display:block;width:100%;padding:13px;  background:linear-gradient(135deg,#A0522D,#D4845A);  color:#fff;border:none;border-radius:14px;  font-family:'Nunito',sans-serif;  font-size:1.03rem;font-weight:900;  cursor:pointer;margin-top:10px;  box-shadow:0 4px 14px rgba(160,82,45,0.32);  transition:transform 0.18s,box-shadow 0.18s;}
.modal-btn:hover{transform:scale(1.02);box-shadow:0 6px 18px rgba(160,82,45,0.42);}
.modal-btn.outline{  background:transparent;  border:2px solid #C8956C;color:#A0522D;  box-shadow:none;}
.modal-btn.outline:hover{background:rgba(200,149,108,0.12);}
.result-emoji{font-size:3rem;margin-bottom:4px;}
.result-greet{  font-size:1.25rem;font-weight:900;  color:#5D2E0C;margin:6px 0;line-height:1.3;}
.score-big{  font-size:3.2rem;font-weight:900;  color:#A0522D;margin:12px 0 4px;  text-shadow:0 2px 8px rgba(160,82,45,0.2);}
.score-lbl{font-size:0.88rem;font-weight:700;color:#8B4513;margin-bottom:12px;}
#confetti-canvas{  position:fixed;top:0;left:0;  width:100%;height:100%;  pointer-events:none;z-index:500;}
</style>
</head>
<body>
<div class="bg-anim"></div>
<div class="bear-pattern">
<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern id="bp" x="0" y="0" width="115" height="115" patternUnits="userSpaceOnUse">
<g transform="translate(57,57)" opacity="0.2">
<ellipse cx="0" cy="20" rx="13" ry="15" fill="#7A4520"/>
<ellipse cx="0" cy="22" rx="8" ry="9" fill="#B87444" opacity="0.8"/>
<circle cx="0" cy="0" r="20" fill="#7A4520"/>
<circle cx="-16" cy="-16" r="8.5" fill="#7A4520"/>
<circle cx="-16" cy="-16" r="5.5" fill="#B87444"/>
<circle cx="16" cy="-16" r="8.5" fill="#7A4520"/>
<circle cx="16" cy="-16" r="5.5" fill="#B87444"/>
<circle cx="0" cy="3" r="13.5" fill="#B87444"/>
<circle cx="-7" cy="-4" r="3.8" fill="#2C1000"/>
<circle cx="-5.5" cy="-5.5" r="1.3" fill="white"/>
<circle cx="7" cy="-4" r="3.8" fill="#2C1000"/>
<circle cx="8.5" cy="-5.5" r="1.3" fill="white"/>
<ellipse cx="0" cy="5" rx="4.5" ry="3.5" fill="#2C1000"/>
<path d="M -3.5 9.5 Q 0 13.5 3.5 9.5" stroke="#2C1000" stroke-width="2" fill="none" stroke-linecap="round"/>
<ellipse cx="-18" cy="14" rx="5" ry="9" fill="#7A4520" transform="rotate(-18,-18,14)"/>
<ellipse cx="18" cy="14" rx="5" ry="9" fill="#7A4520" transform="rotate(18,18,14)"/>
<rect x="6" y="8" width="9" height="11" rx="2" fill="#FFD700" opacity="0.7"/>
<text x="7.5" y="17" font-size="7" fill="#A0520060">🍯</text>
</g>
</pattern>
</defs>
<rect width="100%" height="100%" fill="url(#bp)"/>
</svg>
</div>
<canvas id="confetti-canvas"></canvas>

<header>
  <div class="header-pill">
    <div class="header-title">🐻 ENGLISH TEST – GRADE 7</div>
    <div class="header-sub">Giáo viên tạo: Ms Mai An ULIS</div>
  </div>
</header>

<div class="container" id="quiz-container"></div>

<div class="submit-wrap">
  <button class="submit-btn" onclick="openNameModal()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
</div>

<div class="modal-overlay" id="name-modal">
  <div class="modal-box">
    <div style="font-size:2.8rem">🐻</div>
    <div class="modal-title">Nhập tên của bạn!</div>
    <div class="modal-sub">Gấu muốn biết tên bạn để công bố kết quả~</div>
    <input type="text" class="name-input" id="student-name" placeholder="Ví dụ: Nguyễn Văn A...">
    <div class="err-msg" id="name-err">⚠️ Ơ kìa! Bạn quên nhập tên rồi!</div>
    <button class="modal-btn" onclick="submitQuiz()">✅ XEM NGAY KẾT QUẢ!</button>
    <button class="modal-btn outline" onclick="closeModal('name-modal')">← Quay lại làm bài</button>
  </div>
</div>

<div class="modal-overlay" id="result-modal">
  <div class="modal-box">
    <div id="result-content"></div>
    <button class="modal-btn" onclick="retakeQuiz()">🔄 LÀM LẠI TỪ ĐẦU</button>
    <button class="modal-btn outline" onclick="closeModal('result-modal')">← Xem lại bài làm</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════
//  QUESTIONS DATA
// ══════════════════════════════════════════════════
const QS = [
  {
    id:1, section:"🔤 PHẦN 1: PHÁT ÂM – PRONUNCIATION",
    instr:"Chọn từ có phần <u>gạch chân</u> phát âm KHÁC với ba từ còn lại.",
    qtext:"", type:"word",
    opts:[ {h:"f<u>ear</u>",v:"fear"}, {h:"app<u>ear</u>",v:"appear"}, {h:"nucl<u>ear</u>",v:"nuclear"}, {h:"<u>ar</u>ea",v:"area"} ],
    ans:"area",
    expl:`<div class="expl-title">📖 PHÂN TÍCH PHÁT ÂM</div><b>1. Phân tích từng từ:</b><br>• <span class="p-word">fear</span> <span class="p-phonetic">/fɪər/</span> – <span class="p-mean">sợ hãi</span> → âm gạch chân <b>ear</b> = <span class="p-phonetic">/ɪər/</span><br>• <span class="p-word">appear</span> <span class="p-phonetic">/əˈpɪər/</span> – <span class="p-mean">xuất hiện</span> → âm gạch chân <b>ear</b> = <span class="p-phonetic">/ɪər/</span><br>• <span class="p-word">nuclear</span> <span class="p-phonetic">/ˈnjuːklɪər/</span> – <span class="p-mean">hạt nhân</span> → âm gạch chân <b>ear</b> = <span class="p-phonetic">/ɪər/</span><br>• <span class="p-word">area</span> <span class="p-phonetic">/ˈeərɪə/</span> – <span class="p-mean">khu vực</span> → âm gạch chân <b>ar</b> = <span class="p-phonetic">/eər/</span> ← <span class="hl-green">KHÁC!</span><br><br><div class="vi-box">✅ Ba từ <b>fear, appear, nuclear</b> có phần gạch chân đọc <b>/ɪər/</b>. Riêng <b>area</b> đọc <b>/eər/</b> → <span class="hl-green">Đáp án D</span></div>`
  },
  {
    id:2, instr:"Chọn từ có phần <u>gạch chân</u> phát âm KHÁC với ba từ còn lại.", qtext:"", type:"word",
    opts:[ {h:"decor<u>a</u>te",v:"decorate"}, {h:"repl<u>a</u>ce",v:"replace"}, {h:"c<u>ar</u>ve",v:"carve"}, {h:"l<u>a</u>ne",v:"lane"} ],
    ans:"carve",
    expl:`<div class="expl-title">📖 PHÂN TÍCH PHÁT ÂM</div><b>1. Phân tích nguyên âm gạch chân:</b><br>• <span class="p-word">decorate</span> <span class="p-phonetic">/ˈdekəreɪt/</span> – <span class="p-mean">trang trí</span> → âm <b>a</b> đọc <span class="p-phonetic">/eɪ/</span><br>• <span class="p-word">replace</span> <span class="p-phonetic">/rɪˈpleɪs/</span> – <span class="p-mean">thay thế</span> → âm <b>a</b> đọc <span class="p-phonetic">/eɪ/</span><br>• <span class="p-word">carve</span> <span class="p-phonetic">/kɑːv/</span> – <span class="p-mean">khắc, chạm trổ</span> → âm <b>ar</b> đọc <span class="p-phonetic">/ɑː/</span> ← <span class="hl-green">KHÁC!</span><br>• <span class="p-word">lane</span> <span class="p-phonetic">/leɪn/</span> – <span class="p-mean">làn đường</span> → âm <b>a</b> đọc <span class="p-phonetic">/eɪ/</span><br><br><div class="vi-box">✅ Ba từ <b>decorate, replace, lane</b> có nguyên âm gạch chân đọc <b>/eɪ/</b>. Riêng <b>carve</b> đọc <b>/ɑː/</b> → <span class="hl-green">Đáp án C</span></div>`
  },
  {
    id:3, instr:"Chọn từ có phần <u>gạch chân</u> phát âm KHÁC với ba từ còn lại.", qtext:"", type:"word",
    opts:[ {h:"h<u>y</u>perloop",v:"hyperloop"}, {h:"rec<u>y</u>cle",v:"recycle"}, {h:"h<u>y</u>dro",v:"hydro"}, {h:"s<u>y</u>llable",v:"syllable"} ],
    ans:"syllable",
    expl:`<div class="expl-title">📖 PHÂN TÍCH PHÁT ÂM</div><b>1. Phân tích chữ "y" trong từng từ:</b><br>• <span class="p-word">hyperloop</span> <span class="p-phonetic">/ˈhaɪpəluːp/</span> – <span class="p-mean">đường ống siêu tốc</span> → chữ <b>y</b> đọc <span class="p-phonetic">/aɪ/</span><br>• <span class="p-word">recycle</span> <span class="p-phonetic">/riːˈsaɪkl/</span> – <span class="p-mean">tái chế</span> → chữ <b>y</b> đọc <span class="p-phonetic">/aɪ/</span><br>• <span class="p-word">hydro</span> <span class="p-phonetic">/ˈhaɪdrəʊ/</span> – <span class="p-mean">hydro/nước</span> → chữ <b>y</b> đọc <span class="p-phonetic">/aɪ/</span><br>• <span class="p-word">syllable</span> <span class="p-phonetic">/ˈsɪləbl/</span> – <span class="p-mean">âm tiết</span> → chữ <b>y</b> đọc <span class="p-phonetic">/ɪ/</span> ← <span class="hl-green">KHÁC!</span><br><br><div class="vi-box">✅ Ba từ <b>hyperloop, recycle, hydro</b> có chữ "y" đọc <b>/aɪ/</b>. Riêng <b>syllable</b> đọc <b>/ɪ/</b> → <span class="hl-green">Đáp án D</span></div>`
  },
  {
    id:4, instr:"Chọn từ có phần <u>gạch chân</u> phát âm KHÁC với ba từ còn lại.", qtext:"", type:"word",
    opts:[ {h:"p<u>ar</u>ent",v:"parent"}, {h:"v<u>ar</u>ious",v:"various"}, {h:"sol<u>ar</u>",v:"solar"}, {h:"libr<u>ar</u>ian",v:"librarian"} ],
    ans:"solar",

    // Build options
    let optsHtml = '';
    q.opts.forEach(opt => {
      optsHtml += `<div class="opt" data-val="${opt.v}" onclick="selectOpt(${q.id}, '${opt.v}', this)">${opt.h}</div>`;
    });
    
    // Build card
    html += `
      <div class="q-card" id="qcard-${q.id}">
        <div class="q-num">Question ${index + 1}</div>
        <div class="q-instr">${q.instr}</div>
        <div class="q-text">${q.qtext}</div>
        <div class="opts-grid">${optsHtml}</div>
        <div class="expl-box" id="expl-${q.id}">${q.expl}</div>
      </div>
    `;
  });
  
  container.innerHTML = html;
}

window.selectOpt = function(qId, val, btn) {
  if(isSubmitted) return;
  const q = QS.find(x => x.id === qId);
  const card = document.getElementById(`qcard-${qId}`);
  const allBtns = card.querySelectorAll('.opt');
  
  // Mark as answered
  userAnswers[qId] = val;
  
  // Disable all buttons in this question
  allBtns.forEach(b => {
    b.classList.add('disabled');
    b.style.pointerEvents = 'none';
  });
  
  // Highlight correctness
  if(val === q.ans) {
    btn.classList.add('correct');
  } else {
    btn.classList.add('incorrect');
    // Show the right answer too
    allBtns.forEach(b => {
      if(b.getAttribute('data-val') === q.ans) {
        b.classList.add('reveal-correct');
      }
    });
  }
  
  // Show explanation
  const explBox = document.getElementById(`expl-${qId}`);
  explBox.classList.add('show');
};

// Modals
function openNameModal() {
  if (Object.keys(userAnswers).length < QS.length) {
    // Show missing warning, but still allow open
    const missCount = QS.length - Object.keys(userAnswers).length;
    document.getElementById('name-err').innerHTML = `⚠️ Bạn còn bỏ trống ${missCount} câu kìa! Hãy điền tên để nộp bài hoặc quay lại làm tiếp nhé.`;
    document.getElementById('name-err').style.display = 'block';
  } else {
    document.getElementById('name-err').style.display = 'none';
  }
  document.getElementById('name-modal').classList.add('show');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

function submitQuiz() {
  const nameInput = document.getElementById('student-name');
  const name = nameInput.value.trim();
  
  if(!name) {
    nameInput.classList.add('err');
    document.getElementById('name-err').innerHTML = '⚠️ Ơ kìa! Bạn quên nhập tên rồi!';
    document.getElementById('name-err').style.display = 'block';
    setTimeout(() => nameInput.classList.remove('err'), 300);
    return;
  }
  
  isSubmitted = true;
  closeModal('name-modal');
  
  // Calculate score
  let correctCount = 0;
  QS.forEach(q => {
    if(userAnswers[q.id] === q.ans) correctCount++;
  });
  
  // Display Result
  const resultContent = document.getElementById('result-content');
  let percent = (correctCount / QS.length) * 100;
  let emoji = percent === 100 ? "🏆" : percent >= 80 ? "🔥" : percent >= 50 ? "👍" : "🐻";
  let greet = percent === 100 ? `Tuyệt đỉnh, ${name}!` : percent >= 80 ? `Giỏi lắm, ${name}!` : `Cố lên nhé, ${name}!`;
  
  resultContent.innerHTML = `
    <div class="result-emoji">${emoji}</div>
    <div class="result-greet">${greet}</div>
    <div class="score-big">${correctCount}/${QS.length}</div>
    <div class="score-lbl">CÂU TRẢ LỜI ĐÚNG</div>
    <div class="progress-wrap">
      <div class="prog-bar"><div class="prog-fill" style="width:${percent}%"></div></div>
      <div class="prog-text">${Math.round(percent)}%</div>
    </div>
  `;
  
  document.getElementById('result-modal').classList.add('show');
  if(percent >= 80) fireConfetti();
  
  // Auto-fill unanswered to show logic
  QS.forEach(q => {
    if(!userAnswers[q.id]) {
      const card = document.getElementById(`qcard-${q.id}`);
      const allBtns = card.querySelectorAll('.opt');
      allBtns.forEach(b => {
        b.classList.add('disabled');
        if(b.getAttribute('data-val') === q.ans) b.classList.add('reveal-correct');
      });
      document.getElementById(`expl-${q.id}`).classList.add('show');
    }
  });
}

function retakeQuiz() {
  userAnswers = {};
  isSubmitted = false;
  document.getElementById('student-name').value = '';
  closeModal('result-modal');
  window.scrollTo(0, 0);
  renderQuiz();
}

// Minimal Confetti Engine
function fireConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  let particles = [];
  const colors = ['#F5A623', '#A0522D', '#D4845A', '#00D26A', '#FFD1A9'];
  for(let i=0; i<100; i++) {
    particles.push({
      x: canvas.width/2, y: canvas.height/2 + 100,
      r: Math.random()*6+4,
      dx: Math.random()*10-5, dy: Math.random()*-15-5,
      color: colors[Math.floor(Math.random()*colors.length)]
    });
  }
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let keepAnimating = false;
    particles.forEach(p => {
      p.x += p.dx; p.y += p.dy; p.dy += 0.4;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.color; ctx.fill();
      if(p.y < canvas.height) keepAnimating = true;
    });
    if(keepAnimating) requestAnimationFrame(animate);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  animate();
}

// Initialize
window.onload = renderQuiz;
</script>
