<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh - Ms Mai An ULIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00C9A7;
            --primary-dark: #00a88b;
            --secondary: #FDCB6E;
            --bg-start: #a8e063;
            --bg-end: #56ab2f;
            --correct: #00D26A;
            --incorrect: #FF4757;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-main: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end), #8854C0);
            background-size: 300% 300%;
            animation: gradientMove 12s ease infinite;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Environment Elements */
        .floating-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .leaf {
            position: absolute;
            font-size: 2rem;
            opacity: 0.4;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 15px;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }
        header h2 {
            font-size: 1rem;
            font-weight: 600;
            opacity: 0.9;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        .section-title {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            color: #2d3436;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--glass-border);
        }

        .question-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }

        .q-text {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .q-text u {
            text-decoration-color: var(--primary);
            text-decoration-thickness: 3px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 12px 20px;
            font-size: 1.08rem;
            font-family: 'Nunito', sans-serif;
            border: 2px solid #dfe6e9;
            border-radius: 15px;
            outline: none;
            transition: all 0.2s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 201, 167, 0.2);
        }

        .btn-check {
            padding: 12px 25px;
            font-size: 1.08rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            background: var(--secondary);
            color: #4a4a4a;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 #e1b15c, 0 8px 15px rgba(0,0,0,0.1);
            transition: all 0.1s;
        }
        .btn-check:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #e1b15c, 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-check:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: 0 6px 0 #ccc;
        }

        /* States */
        .state-correct input {
            border-color: var(--correct);
            background-color: #f0fff4;
            color: #008a45;
            font-weight: bold;
        }
        .state-incorrect input {
            border-color: var(--incorrect);
            background-color: #fff0f1;
            color: #b00020;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake-anim { animation: shake 0.4s ease-in-out; }

        /* Explanation Box */
        .explanation {
            display: none;
            margin-top: 15px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            border-left: 5px solid var(--primary);
            font-size: 1rem;
            line-height: 1.6;
            animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .explanation ol { margin-left: 20px; margin-top: 10px; }
        .explanation li { margin-bottom: 8px; }

        /* Custom Highlight Classes */
        .vietnamese-translation {
            display: block;
            background: #fff3cd;
            color: #856404;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            border: 1px solid #ffeeba;
            margin-bottom: 12px;
        }
        .p-word { color: #0984e3; font-weight: bold; }
        .p-phonetic { background: #e0d4f5; color: #6c5ce7; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .p-mean { color: #d35400; font-style: italic; font-weight: 600; }
        .p-grammar { color: #d63031; text-decoration: underline; text-decoration-color: #d63031; font-weight: bold; }
        .hl-green { color: var(--correct); font-weight: 800; }
        .hl-red { color: var(--incorrect); font-weight: bold; text-decoration: line-through; }

        /* Submit Button */
        .submit-container {
            text-align: center;
            margin-top: 40px;
        }
        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 1.3rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #008f76, 0 10px 20px rgba(0,0,0,0.2);
            transition: all 0.1s;
        }
        .btn-submit:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0 #008f76, 0 2px 10px rgba(0,0,0,0.2);
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal h2 { margin-bottom: 20px; color: var(--text-main); font-family: 'Quicksand', sans-serif; }
        .modal input {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        .modal input.error { border-color: var(--incorrect); background: #fff0f1; }
        .btn-modal {
            background: var(--primary); color: white; border: none; padding: 12px 30px;
            font-size: 1.1rem; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%;
        }
        .result-gif { width: 100%; border-radius: 15px; margin: 15px 0; max-height: 200px; object-fit: cover;}
        .score-text { font-size: 2rem; font-weight: 800; color: var(--primary); margin: 10px 0; }

        /* Confetti */
        .confetti { position: fixed; width: 10px; height: 10px; z-index: 9999; pointer-events: none; }
    </style>
</head>
<body>

    <div class="floating-bg" id="floatingBg"></div>

    <header>
        <h2>Giáo viên tạo: Ms Mai An ULIS</h2>
    </header>

    <div class="container" id="app">
        <div class="submit-container">
            <button class="btn-submit" onclick="openNameModal()">🎯 NỘP BÀI & XEM KẾT QUẢ</button>
        </div>
    </div>

    <div class="modal-overlay" id="nameModalOverlay">
        <div class="modal">
            <h2>Nhập tên của bạn nhé! 🚀</h2>
            <input type="text" id="studentName" placeholder="Ví dụ: Nguyễn Văn A..." onkeyup="if(event.key === 'Enter') submitName()">
            <button class="btn-modal" onclick="submitName()">Bắt đầu chấm điểm</button>
        </div>
    </div>

    <div class="modal-overlay" id="resultModalOverlay">
        <div class="modal">
            <h2 id="resultGreeting">🌟 THIÊN TÀI!</h2>
            <img id="resultGif" class="result-gif" src="" alt="Result Meme">
            <p style="font-size: 1.1rem;">Điểm của bạn:</p>
            <div class="score-text" id="scoreDisplay">0 / 0</div>
            <button class="btn-modal" onclick="location.reload()" style="margin-top: 15px;">Làm lại bài</button>
        </div>
    </div>

<script>
    // -----------------------------------------------------
    // DỮ LIỆU ĐỀ BÀI ĐÃ XỬ LÝ (Không xáo trộn, đúng thứ tự ảnh gốc)
    // -----------------------------------------------------
    const rawQuestions = [
        // ================= IMAGE 1 =================
        {
            section: "Đề cương ôn tập cuối học kỳ II khối 7 năm học 2024 - 2025<br>Complete the sentences with the correct form of the verbs in brackets.",
            text: "31. Tom (not have) ___________ time to finish his report yesterday.",
            answers: ["didn't have", "did not have"],
            placeholder: "Nhập từ cần điền...",
            explain: `
                <span class="vietnamese-translation">Tom đã không có thời gian để hoàn thành báo cáo của anh ấy vào ngày hôm qua.</span>
                <ol>
                    <li><strong>Từ vựng/Cấu trúc:</strong> Dấu hiệu nhận biết là <span class="p-word">yesterday</span> <span class="p-mean">(hôm qua)</span> -> Dùng <span class="p-grammar">Thì Quá khứ đơn (Past Simple)</span>.</li>
                    <li><strong>Dịch nghĩa đáp án:</strong> Động từ nguyên thể là "have" (có). Dạng phủ định ở quá khứ là "đã không có".</li>
                    <li><strong>Tại sao đúng:</strong> <span class="hl-green">didn't have / did not have</span> vì trong câu phủ định quá khứ đơn đối với động từ thường, ta mượn trợ động từ <em>did + not (didn't) + V (nguyên thể)</em>.</li>
                    <li><strong>Lỗi sai:</strong> <span class="hl-red">haven't / doesn't have</span> (sai thì hoặc áp dụng sai cấu trúc phủ định của động từ thường).</li>
                </ol>
            `
        },
        {
            section: "Đề cương ôn tập cuối học kỳ II khối 7 năm học 2024 - 2025<br>Complete the sentences with the correct form of the verbs in brackets.",
            text: "32. Sometimes Jane (clean) ___________ up the streets of her neighborhood for volunteer service.",
            answers: ["cleans"],
            placeholder: "Nhập từ cần điền...",
            explain: `
                <span class="vietnamese-translation">Thỉnh thoảng Jane dọn dẹp đường phố trong khu phố của cô ấy để phục vụ tình nguyện.</span>
                <ol>
                    <li><strong>Từ vựng/Cấu trúc:</strong> Dấu hiệu <span class="p-word">Sometimes</span> <span class="p-mean">(thỉnh thoảng)</span> chỉ thói quen -> Dùng <span class="p-grammar">Thì Hiện tại đơn (Present Simple)</span>. Chủ ngữ "Jane" là ngôi thứ 3 số ít.</li>
                    <li><strong>Dịch nghĩa đáp án:</strong> <span class="p-word">clean up</span> <span class="p-mean">(dọn dẹp)</span>.</li>
                    <li><strong>Tại sao đúng:</strong> <span class="hl-green">cleans</span> vì với chủ ngữ số ít ở hiện tại đơn, động từ thường phải thêm "s" hoặc "es". Động từ "clean" chỉ cần thêm "s".</li>
                    <li><strong>Lỗi sai:</strong> <span class="hl-red">clean / cleaned</span> (Quên chia động từ theo chủ ngữ số ít hoặc sai thì).</li>
                </ol>
            `
        },
        {
            section: "Đề cương ôn tập cuối học kỳ II khối 7 năm học 2024 - 2025<br>Complete the sentences with the correct form of the verbs in brackets.",
            text: "33. You must (obey) ___________ traffic rules when you are a road user.",
            answers: ["obey"],
            placeholder: "Nhập từ cần điền...",
            explain: `
                <span class="vietnamese-translation">Bạn phải tuân thủ luật giao thông khi bạn là người tham gia giao thông.</span>
                <ol>
                    <li><strong>Từ vựng/Cấu trúc:</strong> <span class="p-grammar">Modal verb "must" + V(nguyên thể không to)</span> chỉ một sự bắt buộc.</li>
                    <li><strong>Dịch nghĩa đáp án:</strong> <span class="p-word">obey</span> <span class="p-mean">(tuân theo, vâng lời)</span>.</li>
                    <li><strong>Tại sao đúng:</strong> <span class="hl-green">obey</span> vì đứng sau động từ khuyết thiếu "must" luôn là động từ nguyên thể.</li>
                    <li><strong>Lỗi sai:</strong> <span class="hl-red">to obey / obeying / obeyed</span> (Đều sai quy tắc của Modal Verbs).</li>
                </ol>
            `
        },
        {
            section: "Đề cương ôn tập cuối học kỳ II khối 7 năm học 2024 - 2025<br>Complete the sentences with the correct form of the verbs in brackets.",
            text: "34. At present they (not use) ___________ nuclear energy much because it is dangerous.",
            answers: ["are not using", "aren't using"],
            placeholder: "Nhập từ cần điền...",
            explain: `
                <span class="vietnamese-translation">Hiện tại họ không sử dụng năng lượng hạt nhân nhiều vì nó nguy hiểm.</span>
                <ol>
                    <li><strong>Từ vựng/Cấu trúc:</strong> Dấu hiệu <span class="p-word">At present</span> <span class="p-mean">(hiện tại, ngay lúc này)</span> -> Dùng <span class="p-grammar">Thì Hiện tại tiếp diễn (Present Continuous)</span>.</li>
                    <li><strong>Dịch nghĩa đáp án:</strong> "not use" -> đang không sử dụng.</li>
                    <li><strong>Tại sao đúng:</strong> <span class="hl-green">are not using / aren't using</span> vì chủ ngữ "they" (số nhiều) đi với to be "are", cấu trúc phủ định là <em>are + not + V-ing</em>. Động từ "use" tận cùng là "e" nên bỏ "e" thêm "ing".</li>
                    <li><strong>Lỗi sai:</strong> <span class="hl-red">don't use / are not use</span> (Sai thì hoặc thiếu đuôi -ing).</li>
                </ol>
            `
        },
        {
            section: "Rewrite the following sentences using the words in brackets.",
            text: "35. Why don't we use solar energy instead of coal? (WHAT ABOUT) <br>=> ........................................................................",
            answers: ["what about using solar energy instead of coal?", "what about using solar energy instead of coal"],
            placeholder: "Nhập lại cả câu...",
            explain: `
                <span class="vietnamese-translation">Tại sao chúng ta không sử dụng năng lượng mặt trời thay vì than đá? -> Còn việc sử dụng năng lượng mặt trời thay vì than đá thì sao?</span>
                <ol>
                    <li><strong>Từ vựng/Cấu trúc:</strong> Cấu trúc đưa ra lời gợi ý: <span class="p-grammar">Why don't we + V(nguyên thể)...? = What about + V-ing...?</span></li>
                    <li><strong>Phân tích câu:</strong> Động từ chính là "use" cần chuyển thành danh động từ (V-ing) sau giới từ "about".</li>
                    <li><strong>Tại sao đúng:</strong> <span class="hl-green">What about using solar energy instead of coal?</span> vì áp dụng đúng cấu trúc gợi ý với What about.</li>
                    <li><strong>Lỗi sai:</strong> <span class="hl-red">What about use / What about to use</span> (Sau giới từ phải là V-ing, không được dùng nguyên thể).</li>
                </ol>
            `
        },
        {
            section: "Rewrite the following sentences using the words in brackets.",
            text: "36. I tried my best, but I couldn't win the leading role in the play. (ALTHOUGH) <br>=> ........................................................................",
            answers: ["although i tried my best, i couldn't win the leading role in the play.", "although i tried my best i couldn't win the leading role in the play", "although i tried my best, i could not win the leading role in the play."],
            placeholder: "Nhập lại cả câu...",
            explain: `
                <span class="vietnamese-translation">Tôi đã cố gắng hết sức, nhưng tôi không thể giành được vai diễn chính trong vở kịch. -> Mặc dù tôi đã cố gắng hết sức, tôi không thể giành được vai chính.</span>
                <ol>
                    <li><strong>Từ vựng/Cấu trúc:</strong> Chuyển đổi giữa câu ghép dùng liên từ "but" và câu phức dùng liên từ chỉ sự nhượng bộ <span class="p-grammar">Although + Clause 1, Clause 2</span> <span class="p-mean">(Mặc dù... nhưng...)</span>.</li>
                    <li><strong>Phân tích câu:</strong> Khi dùng "Although" ở đầu câu để nối hai vế tương phản, ta tuyệt đối KHÔNG dùng "but" ở vế sau nữa.</li>
                    <li><strong>Tại sao đúng:</strong> <span class="hl-green">Although I tried my best, I couldn't win the leading role in the play.</span> vì ghép đúng 2 mệnh đề tương phản và loại bỏ được "but".</li>
                    <li><strong>Lỗi sai:</strong> <span class="hl-red">Although I tried my best, but I couldn't...</span> (Lỗi sai kinh điển: Dùng song song cả Although và But trong cùng một câu).</li>
                </ol>
            `
        },
        {
            section: "Rewrite the following sentences using the words in brackets.",
            text: "37. He got stuck in the traffic jam. He didn't get angry. (HOWEVER) <br>=> ........................................................................",
            answers: ["he got stuck in the traffic jam. however, he didn't get angry.", "he got stuck in the traffic jam; however, he didn't get angry.", "he got stuck in the traffic jam. however he didn't get angry."],
            placeholder: "Nhập lại cả câu...",
            explain: `
                <span class="vietnamese-translation">Anh ấy bị kẹt xe. Anh ấy đã không tức giận. -> Anh ấy bị kẹt xe; tuy nhiên, anh ấy đã không tức giận.</span>
                <ol>
                    <li><strong>Từ vựng/Cấu trúc:</strong> Dùng trạng từ liên kết <span class="p-word">However</span> <span class="p-mean">(Tuy nhiên)</span> để nối hai câu độc lập có ý nghĩa trái ngược nhau.</li>
                    <li><strong>Phân tích câu:</strong> Vị trí của "However" thường là: <em>Câu 1. However, Câu 2.</em> HOẶC <em>Câu 1; however, Câu 2.</em></li>
                    <li><strong>Tại sao đúng:</strong> <span class="hl-green">He got stuck in the traffic jam. However, he didn't get angry.</span> (Có dấu phẩy sau However).</li>
                    <li><strong>Lỗi sai:</strong> <span class="hl-red">...traffic jam, however, he didn't...</span> (Lỗi run-on sentence: Không dùng dấu phẩy để nối 2 mệnh đề độc lập với trạng từ liên kết. Phải dùng dấu chấm hoặc chấm phẩy trước However).</li>
                </ol>
            `
        },
        {
            section: "Rearrange these words/ phrases to make meaningful sentences.",
            text: "38. will/ the / popular/ Driverless / be / trains / in / future /.",
            answers: ["driverless trains will be popular in the future.", "driverless trains will be popular in the future"],
            placeholder: "Sắp xếp lại thành câu...",
            explain: `
                <span class="vietnamese-translation">Những đoàn tàu không người lái sẽ trở nên phổ biến trong tương lai.</span>
                <ol>

            placeholder: "Sắp xếp lại thành câu...",
            explain: `
                <span class="vietnamese-translation">Từ nhà của bạn đến cửa hàng đó bao xa?</span>
                <ol>
                    <li><strong>Từ vựng/Cấu trúc:</strong> Cấu trúc hỏi khoảng cách kinh điển: <span class="p-grammar">How far is it from A to B?</span> <span class="p-mean">(Từ A đến B bao xa)</span>.</li>
                    <li><strong>Tại sao đúng:</strong> <span class="hl-green">How far is it from your house to that shop?</span> (Đặt "How far is it" lên đầu, tiếp theo là cụm "from... to...").</li>
                    <li><strong>Lỗi sai:</strong> <span class="hl-red">How far it is...</span> (Lỗi quên đảo to be trong câu hỏi).</li>
                </ol>
            `
        },
        {
            section: "IV. Make questions for underlined words.",
            text: "1. I go shopping <u>three times a month</u>. (Gạch chân: three times a month)",
            answers: ["how often do you go shopping?", "how often do you go shopping"],
            placeholder: "Đặt câu hỏi cho phần gạch chân...",
            explain: `
                <span class="vietnamese-translation">Tôi đi mua sắm 3 lần 1 tháng. -> Bạn đi mua sắm bao lâu 1 lần?</span>
                <ol>
                    <li><strong>Từ vựng/Cấu trúc:</strong> Phần gạch chân "three times a month" chỉ <span class="p-word">tần suất</span>. Từ để hỏi tương ứng là <span class="p-grammar">How often</span>.</li>
                    <li><strong>Phân tích câu:</strong> Câu gốc ở Hiện tại đơn (go), chủ ngữ "I". Khi đặt câu hỏi phải mượn trợ động từ "do", đổi "I" thành "you".</li>
                    <li><strong>Tại sao đúng:</strong> <span class="hl-green">How often do you go shopping?</span></li>
                    <li><strong>Lỗi sai:</strong> <span class="hl-red">How often you go... / How long do you go...</span> (Thiếu trợ động từ hoặc sai từ để hỏi).</li>
                </ol>
            `
        },
        {
            section: "IV. Make questions for underlined words.",
            text: "2. My children went to bed <u>at 10 o'clock</u> last night. (Gạch chân: at 10 o'clock)",
            answers: ["what time did your children go to bed last night?", "when did your children go to bed last night?", "what time did your children go to bed last night", "when did your children go to bed last night"],
            placeholder: "Đặt câu hỏi cho phần gạch chân...",
            explain: `
                <span class="vietnamese-translation">Các con tôi đã đi ngủ lúc 10 giờ tối qua. -> Mấy giờ các con bạn đã đi ngủ tối qua?</span>
                <ol>
                    <li><strong>Từ vựng/Cấu trúc:</strong> Gạch chân giờ cụ thể "at 10 o'clock" -> Dùng từ để hỏi <span class="p-grammar">What time</span> hoặc <span class="p-grammar">When</span>.</li>
                    <li><strong>Phân tích câu:</strong> Câu gốc ở thì Quá khứ đơn (went). Cần mượn trợ động từ "did", động từ "went" đưa về nguyên thể "go", đổi "My" thành "your".</li>
                    <li><strong>Tại sao đúng:</strong> <span class="hl-green">What time did your children go to bed last night?</span></li>
                    <li><strong>Lỗi sai:</strong> <span class="hl-red">What time did your children went...</span> (Đã có 'did' thì động từ phải ở nguyên thể, không được chia quá khứ nữa).</li>
                </ol>
            `
        },
        {
            section: "IV. Make questions for underlined words.",
            text: "3. I think, it is <u>Tom's</u> schoolbag. (Gạch chân: Tom's)",
            answers: ["whose schoolbag do you think it is?", "whose schoolbag is it, do you think?", "whose schoolbag do you think it is", "whose schoolbag is it do you think"],
            placeholder: "Đặt câu hỏi cho phần gạch chân...",
            explain: `
                <span class="vietnamese-translation">Tôi nghĩ, đó là cặp sách của Tom. -> Bạn nghĩ đó là cặp sách của ai?</span>
                <ol>
                    <li><strong>Từ vựng/Cấu trúc:</strong> Gạch chân sở hữu cách "Tom's" chỉ sự sở hữu. Từ để hỏi là <span class="p-grammar">Whose + Danh từ + is it?</span> <span class="p-mean">(Cái ... của ai)</span>.</li>
                    <li><strong>Phân tích câu:</strong> Kết hợp với mệnh đề "I think" (đổi thành do you think).</li>
                    <li><strong>Tại sao đúng:</strong> <span class="hl-green">Whose schoolbag do you think it is?</span></li>
                    <li><strong>Lỗi sai:</strong> <span class="hl-red">Who schoolbag...</span> (Sai từ để hỏi, Who là 'ai', Whose mới là 'của ai').</li>
                </ol>
            `
        },
        {
            section: "IV. Make questions for underlined words.",
            text: "4. It is about <u>300 metres</u> from here to her office. (Gạch chân: 300 metres)",
            answers: ["how far is it from here to her office?", "how far is it from here to her office"],
            placeholder: "Đặt câu hỏi cho phần gạch chân...",
            explain: `
                <span class="vietnamese-translation">Khoảng 300 mét từ đây đến văn phòng của cô ấy. -> Từ đây đến văn phòng của cô ấy bao xa?</span>
                <ol>
                    <li><strong>Từ vựng/Cấu trúc:</strong> Gạch chân khoảng cách "300 metres" -> Dùng từ để hỏi <span class="p-grammar">How far</span> <span class="p-mean">(Bao xa)</span>.</li>
                    <li><strong>Tại sao đúng:</strong> <span class="hl-green">How far is it from here to her office?</span>. Cấu trúc chuẩn How far is it from A to B.</li>
                    <li><strong>Lỗi sai:</strong> <span class="hl-red">How long is it...</span> (How long hỏi về thời gian/độ dài vật lý, How far mới hỏi khoảng cách địa lý).</li>
                </ol>
            `
        },
        {
            section: "IV. Make questions for underlined words.",
            text: "5. There are <u>only two</u> apples in the fridge. (Gạch chân: only two)",
            answers: ["how many apples are there in the fridge?", "how many apples are there in the fridge"],
            placeholder: "Đặt câu hỏi cho phần gạch chân...",
            explain: `
                <span class="vietnamese-translation">Chỉ có 2 quả táo ở trong tủ lạnh. -> Có bao nhiêu quả táo trong tủ lạnh?</span>
                <ol>
                    <li><strong>Từ vựng/Cấu trúc:</strong> Gạch chân số lượng đếm được "only two" -> Từ để hỏi là <span class="p-grammar">How many + Danh từ số nhiều đếm được</span>.</li>
                    <li><strong>Phân tích câu:</strong> Danh từ đi kèm là "apples". Cấu trúc There are đảo thành "are there".</li>
                    <li><strong>Tại sao đúng:</strong> <span class="hl-green">How many apples are there in the fridge?</span></li>
                    <li><strong>Lỗi sai:</strong> <span class="hl-red">How much apples...</span> (How much dùng cho danh từ không đếm được, ví dụ như nước, tiền, gạo...).</li>
                </ol>
            `
        }
    ];

    // -----------------------------------------------------
    // LOGIC ỨNG DỤNG
    // -----------------------------------------------------

    let questions = [];
    let checkedCount = 0;
    let score = 0;

    // Web Audio API for sounds (no external files)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
    }

    function playDing() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
        osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // A6
        
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.5);
    }

    function playBuzz() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
        
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.3);
    }

    // Confetti generator
    function fireConfetti() {
        const colors = ['#00D26A', '#FDCB6E', '#00C9A7', '#FF4757', '#8854C0'];
        for (let i = 0; i < 40; i++) {
            let confetti = document.createElement('div');
            confetti.classList.add('confetti');
            document.body.appendChild(confetti);
            
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = '-10px';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
            
            let duration = Math.random() * 2 + 1;
            confetti.style.transition = `top ${duration}s ease-in, left ${duration}s ease-in, transform ${duration}s linear`;
            
            setTimeout(() => {
                confetti.style.top = '100vh';
                confetti.style.left = (Math.random() * 100) + 'vw';
                confetti.style.transform = `rotate(${Math.random() * 720}deg)`;
            }, 10);
            
            setTimeout(() => confetti.remove(), duration * 1000);
        }
    }

    // Floating background elements
    function createLeaves() {
        const bg = document.getElementById('floatingBg');
        const leafChars = ['🍃', '🌿', '🌱', '✨'];
        for(let i=0; i<15; i++){
            let leaf = document.createElement('div');
            leaf.classList.add('leaf');
            leaf.innerText = leafChars[Math.floor(Math.random()*leafChars.length)];
            leaf.style.left = Math.random() * 100 + 'vw';
            leaf.style.animationDuration = (Math.random() * 10 + 10) + 's';
            leaf.style.animationDelay = (Math.random() * 10) + 's';
            bg.appendChild(leaf);
        }
    }

    function renderQuestions() {
        // Đã bỏ hàm shuffleArray, lấy trực tiếp thứ tự mảng gốc
        questions = [...rawQuestions];
        const app = document.getElementById('app');
        let currentSection = "";

        // Remove old questions, keep submit button container
        const oldQs = app.querySelectorAll('.section-wrapper');
        oldQs.forEach(q => q.remove());

        const submitCont = app.querySelector('.submit-container');

        questions.forEach((q, index) => {
            let wrapper = document.createElement('div');
            wrapper.className = 'section-wrapper';
            
            // Render section title if changed
            if (q.section !== currentSection) {
                let secTitle = document.createElement('div');
                secTitle.className = 'section-title';
                secTitle.innerHTML = q.section;
                wrapper.appendChild(secTitle);
                currentSection = q.section;
            }

            let card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-card-${index}`;

            card.innerHTML = `
                <div class="q-text">${q.text}</div>
                <div class="input-group" id="group-${index}">
                    <input type="text" id="input-${index}" placeholder="${q.placeholder}" onkeypress="handleKeyPress(event, ${index})">
                    <button class="btn-check" id="btn-${index}" onclick="checkAnswer(${index})">Kiểm tra</button>
                </div>
                <div class="explanation" id="exp-${index}">
                    ${q.explain}
                </div>
            `;
            wrapper.appendChild(card);
            app.insertBefore(wrapper, submitCont);
        });
    }

    // Normalize text for comparison
    function normalizeStr(str) {
        return str.trim()
                  .toLowerCase()
                  .replace(/\s+/g, ' ') // Remove extra spaces
                  .replace(/[.!?]/g, ''); // Remove punctuation for safer matches
    }

    function checkAnswer(index) {
        initAudio(); // Initialize audio context on user gesture
        
        const inputEl = document.getElementById(`input-${index}`);
        const btnEl = document.getElementById(`btn-${index}`);
        const groupEl = document.getElementById(`group-${index}`);
        const expEl = document.getElementById(`exp-${index}`);
        const cardEl = document.getElementById(`q-card-${index}`);
        
        if(inputEl.disabled) return; // Already checked

        let userVal = normalizeStr(inputEl.value);
        if(!userVal) {
            // Flash red border if empty
            inputEl.style.borderColor = "var(--incorrect)";
            setTimeout(() => inputEl.style.borderColor = "", 300);
            return;
        }

        let isCorrect = questions[index].answers.some(ans => normalizeStr(ans) === userVal);

        if (isCorrect) {
            groupEl.classList.add('state-correct');
            playDing();
            fireConfetti();
            score++;
        } else {
            groupEl.classList.add('state-incorrect');
            cardEl.classList.add('shake-anim');
            setTimeout(() => cardEl.classList.remove('shake-anim'), 400);
            playBuzz();
        }

        // Lock inputs
        inputEl.disabled = true;
        btnEl.disabled = true;
        btnEl.innerText = isCorrect ? "Đúng! ✔" : "Sai! ✘";

        // Show Explanation
        expEl.style.display = 'block';
        checkedCount++;
    }

    function handleKeyPress(e, index) {
        if(e.key === 'Enter') {
            checkAnswer(index);
        }
    }

    // Modals & Submission Logic
    function openNameModal() {
        if(checkedCount < questions.length) {
            alert("Bạn hãy làm và Kiểm tra hết các câu hỏi trước khi nộp bài nhé!");
            return;
        }
        document.getElementById('nameModalOverlay').style.display = 'flex';
        document.getElementById('studentName').focus();
    }

    function submitName() {
        const nameInput = document.getElementById('studentName');
        const name = nameInput.value.trim();
        if(!name) {
            nameInput.classList.add('error');
            setTimeout(() => nameInput.classList.remove('error'), 500);
            return;
        }

        document.getElementById('nameModalOverlay').style.display = 'none';
        showResultModal(name);
    }

    function showResultModal(name) {
        const percent = Math.round((score / questions.length) * 100);
        let greeting = "";
        let gifSrc = "";

        if (percent === 100) {
            greeting = `🌟 THIÊN TÀI! ${name} xuất sắc tuyệt đối!`;
            gifSrc = "https://media.giphy.com/media/nxxZv20hxX9zE/giphy.gif"; // Leo cheers
        } else if (percent >= 60) {
            greeting = `🎉 Rất tốt! ${name} đã làm rất ổn!`;
            gifSrc = "https://media.giphy.com/media/11ISwbgCxEzMyY/giphy.gif"; // Nodding approval
        } else {
            greeting = `💪 Cố gắng lên ${name} ơi! Sai để học!`;
            gifSrc = "https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"; // Crying/Sad humor
        }

        document.getElementById('resultGreeting').innerText = greeting;
        document.getElementById('scoreDisplay').innerText = `${score} / ${questions.length}`;
        document.getElementById('resultGif').src = gifSrc;
        document.getElementById('resultModalOverlay').style.display = 'flex';
    }

    // Init
    window.onload = () => {
        createLeaves();
        renderQuestions();
    };

</script>
