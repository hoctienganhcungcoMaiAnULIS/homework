    position: fixed; top: 75px; right: 16px;

  .pw-crest { font-size: 3.5rem; margin-bottom: 8px; display: block; }

  .pw-sub   { font-size: 0.95rem; color: #636e72; font-weight: 700; margin-bottom: 24px; }
  .pw-input {
    width: 100%; padding: 14px 20px; border-radius: 18px;
    border: 3px solid rgba(9, 132, 227, 0.3); background: #fff;
    color: #1e2749; font-size: 1.1rem; font-weight: 700; font-family: 'Nunito', sans-serif;
    outline: none; letter-spacing: 2px; text-align: center; transition: all .3s;
  }
  .pw-input:focus { border-color: #0984e3; box-shadow: 0 0 15px rgba(9, 132, 227, 0.2); transform: scale(1.02); }

<body>

<div id="passwordModal">
  <div class="pw-card">
    <span class="pw-crest">🔒</span>

</div>

<div class="ocean-layer" id="oceanLayer">
  </div>
<canvas id="confetti-canvas"></canvas>

<header>
  <h1>🌊 ENGLISH PRACTICE TEST 🌊</h1>
  <p>✨ Giáo viên tạo: Ms Mai An ULIS ✨</p>
</header>
<div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
<div class="score-tracker" id="scoreTracker">🎯 0 / 41</div>

<main id="mainContent"></main>

</div>

<div class="modal-overlay" id="nameModal">
  <div class="modal-box">
    <h2>📝 Tên học sinh</h2>
    <p style="font-size: .95rem; color: #636e72; font-weight: 700;">Nhập tên để nhận bằng khen nha! 🎉</p>

</div>

  <div class="modal-box" style="max-width: 500px;">
    <div class="result-msg" id="resultMsg"></div>
    <div class="result-score" id="resultScore"></div>
    <img class="result-gif" id="resultGif" src="" alt="Meme Kết Quả">

    <button class="retry-btn" onclick="retryQuiz()">🔄 Chơi Lại Từ Đầu</button>
  </div>
</div>

<script>
// =============== CẤU HÌNH ÂM THANH MỚI ===============
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let audioEnabled = false;

// Âm thanh trả lời sai (Hiệu ứng Huh)
const wrongSound = new Audio("https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/File%20nghe%20Ket%20A2/huh_sound_effect-www_tiengdong_com.mp3");
// Âm thanh đọc khích lệ học sinh khi vào bài
const introSound = new Audio("https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/ti%E1%BA%BFng%20%C4%91%E1%BB%8Dc%20kh%C3%ADch%20l%E1%BB%87%20p2.mp3");

function initAudio() {
  if(!audioEnabled) { audioCtx.resume(); audioEnabled = true; }
}

function playSound(type) {
  if(type === 'correct') {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(659.25, now); 
    osc.frequency.setValueAtTime(880.00, now + 0.1); 
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.start(now); osc.stop(now + 0.3);
  } else {
    // Phát âm thanh sai "Huh"
    wrongSound.currentTime = 0;
    wrongSound.play().catch(e => console.log("Không thể phát âm thanh sai:", e));
  }
}

// =============== LOGIC MỞ KHÓA MẬT KHẨU ===============
const _k  = [49, 54, 49, 49]; // Mã hóa ASCII của 1611
const _pw = _k.map(c => String.fromCharCode(c)).join('');

function checkPassword() {
  const inp = document.getElementById('pwInput');
  const err = document.getElementById('pwErr');
  if (inp.value === _pw) {
    document.getElementById('passwordModal').style.display = 'none';
    const main = document.getElementById('mainContent');
    if(main) main.style.display = 'block';
    
    // Phát lời chào/nhắc nhở khích lệ ngay khi mở khóa thành công
    introSound.currentTime = 0;
    introSound.play().catch(e => console.log("Trình duyệt chặn Autoplay Audio:", e));
    
  } else {
    inp.classList.remove('error'); void inp.offsetWidth; inp.classList.add('error');
    err.style.display = 'block'; setTimeout(() => inp.classList.remove('error'), 500);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const pwInput = document.getElementById('pwInput');
  if(pwInput) pwInput.addEventListener('keydown', e => { if (e.key==='Enter') checkPassword(); });
});


// =============== DỮ LIỆU CÂU HỎI (GIẢI THÍCH CHI TIẾT 4 BƯỚC) ===============
const questions = [
  // --- EXERCISE 1 (Phonetics) ---
  {id:1, q:'Question 1. Chọn từ có phần <u>gạch chân</u> phát âm KHÁC ba từ còn lại:', opts:[{html:'tr<u>a</u>ffic', correct:true}, {html:'st<u>a</u>tion', correct:false}, {html:'s<u>a</u>fety', correct:false}, {html:'pl<u>a</u>yground', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có cách phát âm chữ "a" khác biệt.</div> <span class='ex-step-title'>📚 Phân tích từ vựng:</span> <p>A. <span class='p-word'>traffic</span> <span class='p-phonetic'>/ˈtræfɪk/</span> (<span class='p-mean'>giao thông</span>): chữ "a" đọc là <span class='p-phonetic'>/æ/</span>.</p> <p>B. <span class='p-word'>station</span> <span class='p-phonetic'>/ˈsteɪʃən/</span> (<span class='p-mean'>nhà ga</span>): chữ "a" đọc là <span class='p-phonetic'>/eɪ/</span>.</p> <p>C. <span class='p-word'>safety</span> <span class='p-phonetic'>/ˈseɪfti/</span> (<span class='p-mean'>sự an toàn</span>): chữ "a" đọc là <span class='p-phonetic'>/eɪ/</span>.</p> <p>D. <span class='p-word'>playground</span> <span class='p-phonetic'>/ˈpleɪɡraʊnd/</span> (<span class='p-mean'>sân chơi</span>): chữ "a" đọc là <span class='p-phonetic'>/eɪ/</span>.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn traffic</span> vì có nguyên âm ngắn <span class='p-phonetic'>/æ/</span>, miệng mở rộng khi phát âm.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì chữ "a" đều đọc là âm đôi <span class='p-phonetic'>/eɪ/</span>.</p>`},
  
  {id:2, q:'Question 2. Chọn từ có phần <u>gạch chân</u> phát âm KHÁC ba từ còn lại:', opts:[{html:'f<u>ear</u>', correct:false}, {html:'n<u>ear</u>', correct:false}, {html:'gr<u>eat</u>', correct:true}, {html:'id<u>ea</u>', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có cách phát âm cụm "ear/ea" khác biệt.</div> <span class='ex-step-title'>📚 Phân tích từ vựng:</span> <p>A. <span class='p-word'>fear</span> <span class='p-phonetic'>/fɪə/</span> (<span class='p-mean'>nỗi sợ</span>): cụm gạch chân đọc là <span class='p-phonetic'>/ɪə/</span>.</p> <p>B. <span class='p-word'>near</span> <span class='p-phonetic'>/nɪə/</span> (<span class='p-mean'>gần</span>): cụm gạch chân đọc là <span class='p-phonetic'>/ɪə/</span>.</p> <p>C. <span class='p-word'>great</span> <span class='p-phonetic'>/ɡreɪt/</span> (<span class='p-mean'>tuyệt vời</span>): chữ "ea" đọc là <span class='p-phonetic'>/eɪ/</span>.</p> <p>D. <span class='p-word'>idea</span> <span class='p-phonetic'>/aɪˈdɪə/</span> (<span class='p-mean'>ý tưởng</span>): chữ "ea" đọc là <span class='p-phonetic'>/ɪə/</span>.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn great</span> vì cụm "ea" đọc là âm đôi <span class='p-phonetic'>/eɪ/</span> (đây là một ngoại lệ quen thuộc).</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì đều phát âm là <span class='p-phonetic'>/ɪə/</span>.</p>`},

  {id:3, q:'Question 3. Chọn từ có phần <u>gạch chân</u> phát âm KHÁC ba từ còn lại:', opts:[{html:'b<u>ear</u>', correct:true}, {html:'app<u>ear</u>', correct:false}, {html:'th<u>eater</u>', correct:false}, {html:'sh<u>ear</u>', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có cách phát âm cụm "ear" khác biệt.</div> <span class='ex-step-title'>📚 Phân tích từ vựng:</span> <p>A. <span class='p-word'>bear</span> <span class='p-phonetic'>/beə/</span> (<span class='p-mean'>con gấu / chịu đựng</span>): "ear" đọc là <span class='p-phonetic'>/eə/</span>.</p> <p>B. <span class='p-word'>appear</span> <span class='p-phonetic'>/əˈpɪə/</span> (<span class='p-mean'>xuất hiện</span>): "ear" đọc là <span class='p-phonetic'>/ɪə/</span>.</p> <p>C. <span class='p-word'>theater</span> <span class='p-phonetic'>/ˈθɪətə/</span> (<span class='p-mean'>nhà hát</span>): "ea" đọc là <span class='p-phonetic'>/ɪə/</span>.</p> <p>D. <span class='p-word'>shear</span> <span class='p-phonetic'>/ʃɪə/</span> (<span class='p-mean'>cắt xén</span>): "ear" đọc là <span class='p-phonetic'>/ɪə/</span>.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn bear</span> vì phát âm là <span class='p-phonetic'>/eə/</span>. Nhóm ngoại lệ chứa "ear" đọc là /eə/ gồm: bear, tear (xé rách), pear, wear, swear.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì đều phát âm là <span class='p-phonetic'>/ɪə/</span>.</p>`},

  {id:4, q:'Question 4. Chọn từ có phần <u>gạch chân</u> phát âm KHÁC ba từ còn lại:', opts:[{html:'n<u>a</u>tion', correct:false}, {html:'m<u>a</u>nsion', correct:true}, {html:'inv<u>a</u>sion', correct:false}, {html:'tr<u>a</u>nslation', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có cách phát âm nguyên âm "a" khác biệt.</div> <span class='ex-step-title'>📚 Phân tích từ vựng:</span> <p>A. <span class='p-word'>nation</span> <span class='p-phonetic'>/ˈneɪʃən/</span> (<span class='p-mean'>quốc gia</span>): chữ "a" đọc là <span class='p-phonetic'>/eɪ/</span>.</p> <p>B. <span class='p-word'>mansion</span> <span class='p-phonetic'>/ˈmænʃən/</span> (<span class='p-mean'>biệt thự</span>): chữ "a" đọc là <span class='p-phonetic'>/æ/</span>.</p> <p>C. <span class='p-word'>invasion</span> <span class='p-phonetic'>/ɪnˈveɪʒən/</span> (<span class='p-mean'>sự xâm lược</span>): chữ "a" đọc là <span class='p-phonetic'>/eɪ/</span>.</p> <p>D. <span class='p-word'>translation</span> <span class='p-phonetic'>/trænsˈleɪʃən/</span> (<span class='p-mean'>bản dịch</span>): chữ "a" đọc là <span class='p-phonetic'>/eɪ/</span>.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn mansion</span> vì âm "a" là âm bẹt <span class='p-phonetic'>/æ/</span>.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì các danh từ chứa gốc "-ation" hoặc "-asion" thường làm chữ "a" biến thành âm đôi <span class='p-phonetic'>/eɪ/</span>.</p>`},

  {id:5, q:'Question 5. Chọn từ có phần <u>gạch chân</u> phát âm KHÁC ba từ còn lại:', opts:[{html:'app<u>ear</u>', correct:false}, {html:'t<u>ea</u>spoon', correct:true}, {html:'f<u>ear</u>', correct:false}, {html:'id<u>ea</u>', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có cách phát âm cụm "ea/ear" khác biệt.</div> <span class='ex-step-title'>📚 Phân tích từ vựng:</span> <p>A. <span class='p-word'>appear</span> <span class='p-phonetic'>/əˈpɪə/</span> (<span class='p-mean'>xuất hiện</span>): "ear" đọc là <span class='p-phonetic'>/ɪə/</span>.</p> <p>B. <span class='p-word'>teaspoon</span> <span class='p-phonetic'>/ˈtiːspuːn/</span> (<span class='p-mean'>thìa cà phê</span>): "ea" đọc là <span class='p-phonetic'>/iː/</span>.</p> <p>C. <span class='p-word'>fear</span> <span class='p-phonetic'>/fɪə/</span> (<span class='p-mean'>nỗi sợ</span>): "ear" đọc là <span class='p-phonetic'>/ɪə/</span>.</p> <p>D. <span class='p-word'>idea</span> <span class='p-phonetic'>/aɪˈdɪə/</span> (<span class='p-mean'>ý tưởng</span>): "ea" đọc là <span class='p-phonetic'>/ɪə/</span>.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn teaspoon</span> vì "ea" được phát âm là nguyên âm dài <span class='p-phonetic'>/iː/</span> (cười nhẹ khi đọc). Đây là quy tắc chung của từ "tea" (trà).</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì đều phát âm là âm đôi <span class='p-phonetic'>/ɪə/</span>.</p>`},

  {id:6, q:'Question 6. Chọn từ có phần <u>gạch chân</u> phát âm KHÁC ba từ còn lại:', opts:[{html:'play<u>ed</u>', correct:false}, {html:'arriv<u>ed</u>', correct:false}, {html:'miss<u>ed</u>', correct:true}, {html:'remember<u>ed</u>', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có cách phát âm ĐUÔI -ED khác biệt.</div> <span class='ex-step-title'>📚 Phân tích Quy tắc đuôi -ed:</span> <p>- <span class='p-grammar'>Đọc là /t/</span>: Khi động từ tận cùng bằng âm vô thanh (p, k, f, s, sh, ch).<br> - <span class='p-grammar'>Đọc là /ɪd/</span>: Khi động từ tận cùng bằng âm /t/, /d/.<br> - <span class='p-grammar'>Đọc là /d/</span>: Các trường hợp còn lại (âm hữu thanh).</p> <p>A. play -> <span class='p-word'>played</span> <span class='p-phonetic'>/pleɪd/</span> (kết thúc bằng nguyên âm hữu thanh /eɪ/ -> đọc là /d/).</p> <p>B. arrive -> <span class='p-word'>arrived</span> <span class='p-phonetic'>/əˈraɪvd/</span> (kết thúc bằng /v/ hữu thanh -> /d/).</p> <p>C. miss -> <span class='p-word'>missed</span> <span class='p-phonetic'>/mɪst/</span> (kết thúc bằng /s/ vô thanh -> /t/).</p> <p>D. remember -> <span class='p-word'>remembered</span> <span class='p-phonetic'>/rɪˈmembəd/</span> (kết thúc bằng /ə/ hữu thanh -> /d/).</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn missed</span> vì đuôi -ed đọc là âm vô thanh <span class='p-phonetic'>/t/</span>.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì đuôi -ed đều đọc là <span class='p-phonetic'>/d/</span>.</p>`},

  {id:7, q:'Question 7. Chọn từ có phần <u>gạch chân</u> phát âm KHÁC ba từ còn lại:', opts:[{html:'s<u>y</u>mbol', correct:true}, {html:'h<u>y</u>dro', correct:false}, {html:'h<u>y</u>perloop', correct:false}, {html:'c<u>y</u>cle', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có cách phát âm chữ "y" khác biệt.</div> <span class='ex-step-title'>📚 Phân tích từ vựng:</span> <p>A. <span class='p-word'>symbol</span> <span class='p-phonetic'>/ˈsɪmbəl/</span> (<span class='p-mean'>biểu tượng</span>): chữ "y" đọc là <span class='p-phonetic'>/ɪ/</span> (âm ngắn).</p> <p>B. <span class='p-word'>hydro</span> <span class='p-phonetic'>/ˈhaɪdrəʊ/</span> (<span class='p-mean'>thủy năng</span>): chữ "y" đọc là <span class='p-phonetic'>/aɪ/</span>.</p> <p>C. <span class='p-word'>hyperloop</span> <span class='p-phonetic'>/ˈhaɪpəluːp/</span> (<span class='p-mean'>tàu siêu tốc</span>): chữ "y" đọc là <span class='p-phonetic'>/aɪ/</span>.</p> <p>D. <span class='p-word'>cycle</span> <span class='p-phonetic'>/ˈsaɪkəl/</span> (<span class='p-mean'>chu trình/xe đạp</span>): chữ "y" đọc là <span class='p-phonetic'>/aɪ/</span>.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn symbol</span> vì "y" phát âm là nguyên âm ngắn <span class='p-phonetic'>/ɪ/</span>.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì "y" đều phát âm là âm đôi <span class='p-phonetic'>/aɪ/</span>.</p>`},

  {id:8, q:'Question 8. Chọn từ có phần <u>gạch chân</u> phát âm KHÁC ba từ còn lại:', opts:[{html:'app<u>ear</u>', correct:false}, {html:'r<u>ea</u>lly', correct:false}, {html:'n<u>ear</u>', correct:false}, {html:'w<u>ear</u>', correct:true}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có cách phát âm cụm "ear/ea" khác biệt.</div> <span class='ex-step-title'>📚 Phân tích từ vựng:</span> <p>A. <span class='p-word'>appear</span> <span class='p-phonetic'>/əˈpɪə/</span> (<span class='p-mean'>xuất hiện</span>): "ear" đọc là <span class='p-phonetic'>/ɪə/</span>.</p> <p>B. <span class='p-word'>really</span> <span class='p-phonetic'>/ˈrɪəli/</span> (<span class='p-mean'>thực sự</span>): "ea" đọc là <span class='p-phonetic'>/ɪə/</span>.</p> <p>C. <span class='p-word'>near</span> <span class='p-phonetic'>/nɪə/</span> (<span class='p-mean'>gần</span>): "ear" đọc là <span class='p-phonetic'>/ɪə/</span>.</p> <p>D. <span class='p-word'>wear</span> <span class='p-phonetic'>/weə/</span> (<span class='p-mean'>mặc đồ</span>): "ear" đọc là <span class='p-phonetic'>/eə/</span>.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn wear</span> vì nằm trong nhóm ngoại lệ "ear" đọc là <span class='p-phonetic'>/eə/</span> (cùng nhóm với bear, tear, swear, pear).</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì đều phát âm là <span class='p-phonetic'>/ɪə/</span>.</p>`},

  {id:9, q:'Question 9. Chọn từ có phần <u>gạch chân</u> phát âm KHÁC ba từ còn lại:', opts:[{html:'paint<u>ed</u>', correct:true}, {html:'park<u>ed</u>', correct:false}, {html:'stopp<u>ed</u>', correct:false}, {html:'watch<u>ed</u>', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có cách phát âm ĐUÔI -ED khác biệt.</div> <span class='ex-step-title'>📚 Phân tích Quy tắc đuôi -ed:</span> <p>A. paint -> <span class='p-word'>painted</span> <span class='p-phonetic'>/ˈpeɪntɪd/</span> (<span class='p-mean'>sơn</span>): kết thúc bằng /t/ -> đuôi -ed đọc là <span class='p-phonetic'>/ɪd/</span>.</p> <p>B. park -> <span class='p-word'>parked</span> <span class='p-phonetic'>/pɑːkt/</span> (<span class='p-mean'>đỗ xe</span>): kết thúc bằng /k/ (vô thanh) -> đọc là <span class='p-phonetic'>/t/</span>.</p> <p>C. stop -> <span class='p-word'>stopped</span> <span class='p-phonetic'>/stɒpt/</span> (<span class='p-mean'>dừng lại</span>): kết thúc bằng /p/ (vô thanh) -> đọc là <span class='p-phonetic'>/t/</span>.</p> <p>D. watch -> <span class='p-word'>watched</span> <span class='p-phonetic'>/wɒtʃt/</span> (<span class='p-mean'>xem</span>): kết thúc bằng /tʃ/ (ch) (vô thanh) -> đọc là <span class='p-phonetic'>/t/</span>.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn painted</span> vì đuôi -ed đọc là <span class='p-phonetic'>/ɪd/</span>, tạo thành một âm tiết riêng biệt hoàn toàn. Quy tắc: <span class='p-grammar'>Sau /t/ và /d/ -> đọc là /ɪd/</span>.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì đuôi -ed đều đọc là <span class='p-phonetic'>/t/</span>.</p>`},

  {id:10, q:'Question 10. Chọn từ có phần <u>gạch chân</u> phát âm KHÁC ba từ còn lại:', opts:[{html:'th<u>ere</u>', correct:false}, {html:'h<u>ere</u>', correct:true}, {html:'c<u>are</u>', correct:false}, {html:'sh<u>are</u>', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có cách phát âm cụm "ere/are" khác biệt.</div> <span class='ex-step-title'>📚 Phân tích từ vựng:</span> <p>A. <span class='p-word'>there</span> <span class='p-phonetic'>/ðeə/</span> (<span class='p-mean'>ở đó</span>): cụm gạch chân đọc là <span class='p-phonetic'>/eə/</span>.</p> <p>B. <span class='p-word'>here</span> <span class='p-phonetic'>/hɪə/</span> (<span class='p-mean'>ở đây</span>): cụm gạch chân đọc là <span class='p-phonetic'>/ɪə/</span>.</p> <p>C. <span class='p-word'>care</span> <span class='p-phonetic'>/keə/</span> (<span class='p-mean'>quan tâm</span>): cụm gạch chân đọc là <span class='p-phonetic'>/eə/</span>.</p> <p>D. <span class='p-word'>share</span> <span class='p-phonetic'>/ʃeə/</span> (<span class='p-mean'>chia sẻ</span>): cụm gạch chân đọc là <span class='p-phonetic'>/eə/</span>.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn here</span> vì phát âm là <span class='p-phonetic'>/ɪə/</span>.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì đều phát âm là âm đôi <span class='p-phonetic'>/eə/</span>.</p>`},

  // --- EXERCISE 2 (Stress) ---
  {id:11, q:'Question 11. Chọn từ có trọng âm KHÁC ba từ còn lại:', opts:[{html:'appliance', correct:false}, {html:'biogas', correct:true}, {html:'recycle', correct:false}, {html:'advantage', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có vị trí trọng âm chính khác biệt.</div> <span class='ex-step-title'>📚 Phân tích trọng âm:</span> <p>A. <span class='p-word'>appliance</span> <span class='p-phonetic'>/əˈplaɪəns/</span> (<span class='p-mean'>thiết bị</span>): Nhấn âm tiết thứ 2. Tiền tố "ap-" không nhận trọng âm.</p> <p>B. <span class='p-word'>biogas</span> <span class='p-phonetic'>/ˈbaɪəʊɡæs/</span> (<span class='p-mean'>khí sinh học</span>): Nhấn âm tiết thứ 1. Đây là danh từ ghép (bio + gas), trọng âm rơi vào thành phần đầu.</p> <p>C. <span class='p-word'>recycle</span> <span class='p-phonetic'>/rɪˈsaɪkəl/</span> (<span class='p-mean'>tái chế</span>): Nhấn âm tiết thứ 2. Động từ có tiền tố "re-", trọng âm rơi vào âm tiết gốc.</p> <p>D. <span class='p-word'>advantage</span> <span class='p-phonetic'>/ədˈvɑːntɪdʒ/</span> (<span class='p-mean'>lợi thế</span>): Nhấn âm tiết thứ 2.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn biogas</span> vì nhấn âm 1.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì đều nhấn trọng âm ở âm tiết thứ 2.</p>`},

  {id:12, q:'Question 12. Chọn từ có trọng âm KHÁC ba từ còn lại:', opts:[{html:'fantastic', correct:false}, {html:'amusing', correct:false}, {html:'delicious', correct:false}, {html:'gripping', correct:true}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có vị trí trọng âm chính khác biệt.</div> <span class='ex-step-title'>📚 Phân tích trọng âm:</span> <p>A. <span class='p-word'>fantastic</span> <span class='p-phonetic'>/fænˈtæstɪk/</span> (<span class='p-mean'>tuyệt vời</span>): Nhấn âm 2. (Quy tắc: từ có đuôi -ic nhấn vào âm tiết ngay trước nó).</p> <p>B. <span class='p-word'>amusing</span> <span class='p-phonetic'>/əˈmjuːzɪŋ/</span> (<span class='p-mean'>thú vị/hài hước</span>): Nhấn âm 2 (tiền tố a- không nhận trọng âm).</p> <p>C. <span class='p-word'>delicious</span> <span class='p-phonetic'>/dɪˈlɪʃəs/</span> (<span class='p-mean'>ngon miệng</span>): Nhấn âm 2. (Quy tắc: từ có đuôi -ious nhấn vào âm ngay trước nó).</p> <p>D. <span class='p-word'>gripping</span> <span class='p-phonetic'>/ˈɡrɪpɪŋ/</span> (<span class='p-mean'>cuốn hút/kịch tính</span>): Nhấn âm 1 (tính từ 2 âm tiết thông thường).</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn gripping</span> vì nhấn âm 1.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì đều nhấn trọng âm ở âm tiết thứ 2.</p>`},

  {id:13, q:'Question 13. Chọn từ có trọng âm KHÁC ba từ còn lại:', opts:[{html:'cartoon', correct:true}, {html:'action', correct:false}, {html:'shocking', correct:false}, {html:'boring', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có vị trí trọng âm chính khác biệt.</div> <span class='ex-step-title'>📚 Phân tích trọng âm:</span> <p>A. <span class='p-word'>cartoon</span> <span class='p-phonetic'>/kɑːˈtuːn/</span> (<span class='p-mean'>phim hoạt hình</span>): Nhấn âm 2. (Quy tắc ngoại lệ: từ mượn gốc Pháp có đuôi -oon thường nhấn vào chính nó).</p> <p>B. <span class='p-word'>action</span> <span class='p-phonetic'>/ˈækʃən/</span> (<span class='p-mean'>hành động</span>): Nhấn âm 1. (Đuôi -tion nhấn âm trước nó).</p> <p>C. <span class='p-word'>shocking</span> <span class='p-phonetic'>/ˈʃɒkɪŋ/</span> (<span class='p-mean'>gây sốc</span>): Nhấn âm 1.</p> <p>D. <span class='p-word'>boring</span> <span class='p-phonetic'>/ˈbɔːrɪŋ/</span> (<span class='p-mean'>nhàm chán</span>): Nhấn âm 1.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn cartoon</span> vì nhấn âm 2.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì đều là từ 2 âm tiết nhấn âm 1.</p>`},

  {id:14, q:'Question 14. Chọn từ có trọng âm KHÁC ba từ còn lại:', opts:[{html:'wonderful', correct:false}, {html:'amusing', correct:true}, {html:'excellent', correct:false}, {html:'interesting', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có vị trí trọng âm chính khác biệt.</div> <span class='ex-step-title'>📚 Phân tích trọng âm:</span> <p>A. <span class='p-word'>wonderful</span> <span class='p-phonetic'>/ˈwʌndəfəl/</span> (<span class='p-mean'>tuyệt vời</span>): Nhấn âm 1.</p> <p>B. <span class='p-word'>amusing</span> <span class='p-phonetic'>/əˈmjuːzɪŋ/</span> (<span class='p-mean'>hài hước/thú vị</span>): Nhấn âm 2.</p> <p>C. <span class='p-word'>excellent</span> <span class='p-phonetic'>/ˈeksələnt/</span> (<span class='p-mean'>xuất sắc</span>): Nhấn âm 1.</p> <p>D. <span class='p-word'>interesting</span> <span class='p-phonetic'>/ˈɪntrəstɪŋ/</span> (<span class='p-mean'>thú vị</span>): Nhấn âm 1.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn amusing</span> vì nó nhấn âm 2, nguyên âm "a-" ở đầu là âm schwa /ə/ rất nhẹ không bao giờ nhận trọng âm.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì đều là tính từ dài nhấn âm 1.</p>`},

  {id:15, q:'Question 15. Chọn từ có trọng âm KHÁC ba từ còn lại:', opts:[{html:'polluting', correct:false}, {html:'recycle', correct:false}, {html:'government', correct:true}, {html:'resources', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có vị trí trọng âm chính khác biệt.</div> <span class='ex-step-title'>📚 Phân tích trọng âm:</span> <p>A. <span class='p-word'>polluting</span> <span class='p-phonetic'>/pəˈluːtɪŋ/</span> (<span class='p-mean'>gây ô nhiễm</span>): Nhấn âm 2.</p> <p>B. <span class='p-word'>recycle</span> <span class='p-phonetic'>/rɪˈsaɪkəl/</span> (<span class='p-mean'>tái chế</span>): Nhấn âm 2.</p> <p>C. <span class='p-word'>government</span> <span class='p-phonetic'>/ˈɡʌvənmənt/</span> (<span class='p-mean'>chính phủ</span>): Nhấn âm 1. (Gốc "govern" nhấn âm 1, đuôi -ment không làm thay đổi trọng âm).</p> <p>D. <span class='p-word'>resources</span> <span class='p-phonetic'>/rɪˈsɔːsɪz/</span> (<span class='p-mean'>tài nguyên</span>): Nhấn âm 2.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn government</span> vì nhấn âm 1.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì đều nhấn trọng âm ở âm tiết thứ 2.</p>`},

  {id:16, q:'Question 16. Chọn từ có trọng âm KHÁC ba từ còn lại:', opts:[{html:'reduce', correct:true}, {html:'transport', correct:false}, {html:'native', correct:false}, {html:'castle', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có vị trí trọng âm chính khác biệt.</div> <span class='ex-step-title'>📚 Phân tích trọng âm:</span> <p>A. <span class='p-word'>reduce</span> <span class='p-phonetic'>/rɪˈdjuːs/</span> (<span class='p-mean'>giảm bớt</span>): Nhấn âm 2. (Quy tắc: Động từ 2 âm tiết thường nhấn âm 2).</p> <p>B. <span class='p-word'>transport</span> <span class='p-phonetic'>/ˈtrænspɔːt/</span> (<span class='p-mean'>phương tiện vận chuyển</span>): Danh từ nhấn âm 1.</p> <p>C. <span class='p-word'>native</span> <span class='p-phonetic'>/ˈneɪtɪv/</span> (<span class='p-mean'>bản địa</span>): Tính từ nhấn âm 1.</p> <p>D. <span class='p-word'>castle</span> <span class='p-phonetic'>/ˈkɑːsəl/</span> (<span class='p-mean'>lâu đài</span>): Danh từ nhấn âm 1.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn reduce</span> vì nó là động từ nhấn âm 2.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì là danh từ/tính từ 2 âm tiết nên nhấn âm 1.</p>`},

  {id:20, q:'Question 20. Chọn từ có trọng âm KHÁC ba từ còn lại:', opts:[{html:'enormous', correct:false}, {html:'exhausted', correct:false}, {html:'abundant', correct:false}, {html:'natural', correct:true}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Tìm từ có vị trí trọng âm chính khác biệt.</div> <span class='ex-step-title'>📚 Phân tích trọng âm:</span> <p>A. <span class='p-word'>enormous</span> <span class='p-phonetic'>/ɪˈnɔːməs/</span> (<span class='p-mean'>to lớn/khổng lồ</span>): Nhấn âm 2.</p> <p>B. <span class='p-word'>exhausted</span> <span class='p-phonetic'>/ɪɡˈzɔːstɪd/</span> (<span class='p-mean'>kiệt sức</span>): Nhấn âm 2.</p> <p>C. <span class='p-word'>abundant</span> <span class='p-phonetic'>/əˈbʌndənt/</span> (<span class='p-mean'>dồi dào</span>): Nhấn âm 2.</p> <p>D. <span class='p-word'>natural</span> <span class='p-phonetic'>/ˈnætʃərəl/</span> (<span class='p-mean'>tự nhiên</span>): Nhấn âm 1.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn natural</span> vì nhấn âm 1.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>Các từ còn lại sai</span> vì đều nhấn trọng âm ở âm tiết thứ 2.</p>`},

  // --- EXERCISE 3 (Grammar & Vocabulary) ---
  {id:21, q:'Question 21. The ending of the film is ______. All audiences are very sad.', opts:[{html:'disappointed', correct:false}, {html:'satisfying', correct:false}, {html:'disappointing', correct:true}, {html:'satisfied', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Phần kết của bộ phim thì ______. Tất cả khán giả đều rất buồn."</div> <span class='ex-step-title'>📚 Phân tích từ vựng:</span> <p>A. <span class='p-word'>disappointed</span> (adj): cảm thấy thất vọng (chỉ CẢM XÚC của con người).</p> <p>B. <span class='p-word'>satisfying</span> (adj): đem lại sự thỏa mãn, hài lòng.</p> <p>C. <span class='p-word'>disappointing</span> (adj): đáng thất vọng, gây thất vọng (chỉ BẢN CHẤT của sự vật/sự việc gây ra tác động).</p> <p>D. <span class='p-word'>satisfied</span> (adj): cảm thấy hài lòng, thỏa mãn (chỉ CẢM XÚC của con người).</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn C (disappointing)</span> vì chủ ngữ là "The ending of the film" (kết phim) - một SỰ VẬT. Theo <span class='p-grammar'>quy tắc Tính từ phân từ (Participles as Adjectives)</span>, ta dùng đuôi -ing để miêu tả bản chất của vật gây ra tác động. Thêm nữa, vế sau nói khán giả "sad" (buồn) nên tính chất của kết phim phải mang nghĩa tiêu cực (gây thất vọng).</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>A và D sai</span> vì tính từ đuôi -ed chỉ dùng để diễn tả cảm xúc của CON NGƯỜI bị tác động. <span class='hl-red'>B sai</span> về mặt ngữ nghĩa logic (kết phim làm hài lòng thì khán giả không thể cảm thấy buồn được).</p>`},

  {id:22, q:'Question 22. ______ energy is produced by collecting sunlight and converting it into electricity.', opts:[{html:'Solar', correct:true}, {html:'Wind', correct:false}, {html:'Hydro', correct:false}, {html:'Nuclear', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Năng lượng ______ được tạo ra bằng cách thu thập ánh sáng mặt trời và chuyển hóa nó thành điện năng."</div> <span class='ex-step-title'>📚 Phân tích từ vựng:</span> <p>A. <span class='p-word'>Solar</span> (adj): thuộc về Mặt trời -> Solar energy: năng lượng mặt trời.</p> <p>B. <span class='p-word'>Wind</span> (n): gió -> Wind energy: năng lượng gió.</p> <p>C. <span class='p-word'>Hydro</span> (adj): thuộc về nước -> Hydro energy: năng lượng thủy điện.</p> <p>D. <span class='p-word'>Nuclear</span> (adj): thuộc về hạt nhân -> Nuclear energy: năng lượng hạt nhân.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn A (Solar)</span> vì trong câu có từ khóa chốt hạ là <span class='p-grammar'>collecting sunlight</span> (thu thập ánh sáng mặt trời). Chỉ có năng lượng mặt trời mới được sản sinh ra từ ánh sáng mặt trời.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>B, C, D sai</span> vì các nguồn năng lượng này được tạo ra từ gió, dòng chảy của nước hoặc phản ứng phân hạch hạt nhân, hoàn toàn không liên quan đến "sunlight".</p>`},

  {id:23, q:'Question 23. What ______ Kelvin doing? – He ______ at my desk.', opts:[{html:'do – does', correct:false}, {html:'is – sits', correct:false}, {html:'does – sits', correct:false}, {html:'is – is sitting', correct:true}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Kelvin ĐANG làm gì vậy? - Cậu ấy ĐANG ngồi ở bàn của tôi."</div> <span class='ex-step-title'>📚 Phân tích ngữ pháp:</span> <p>Cả câu hỏi và câu trả lời đều đang đề cập đến một hành động ĐANG diễn ra ngay tại thời điểm nói. Do đó, ta phải sử dụng <span class='p-grammar'>Thì Hiện tại tiếp diễn (Present Continuous)</span>.</p> <p>- Công thức câu hỏi: <span class='p-grammar'>Wh- + is/am/are + S + V-ing?</span></p> <p>- Công thức câu khẳng định: <span class='p-grammar'>S + is/am/are + V-ing.</span></p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn D (is - is sitting)</span>. Chỗ trống 1 cần "is" vì chủ ngữ Kelvin là ngôi thứ 3 số ít. Chỗ trống 2 cần "is sitting" để đúng công thức thì Hiện tại tiếp diễn.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>A và C sai</span> vì dùng do/does của thì Hiện tại đơn (diễn tả thói quen/sự thật hiển nhiên). <span class='hl-red'>B sai</span> ở chỗ trống 2 vì "sits" là V(s/es) của Hiện tại đơn, không khớp với vế câu hỏi.</p>`},

  {id:24, q:'Question 24. Segway is a ______ electric vehicle.', opts:[{html:'one-wheeled', correct:false}, {html:'two-wheeled', correct:true}, {html:'three-wheeled', correct:false}, {html:'four-wheeled', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Segway là một loại phương tiện điện có ______."</div> <span class='ex-step-title'>📚 Phân tích từ vựng:</span> <p>Đuôi "-wheeled" trong tính từ ghép có nghĩa là "có ... bánh xe".</p> <p>A. <span class='p-word'>one-wheeled</span>: có 1 bánh (thường là xe Solowheel).</p> <p>B. <span class='p-word'>two-wheeled</span>: có 2 bánh.</p> <p>C. <span class='p-word'>three-wheeled</span>: có 3 bánh.</p> <p>D. <span class='p-word'>four-wheeled</span>: có 4 bánh (thường là ô tô).</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn B (two-wheeled)</span>. Đây là câu hỏi về kiến thức thực tế từ vựng trong SGK. <span class='p-word'>Segway</span> là loại xe điện cá nhân tự cân bằng, người lái đứng trên một bệ đỡ với **2 bánh xe** nằm song song hai bên.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>A, C, D sai</span> vì không đúng đặc điểm thiết kế của xe Segway.</p>`},

  {id:25, q:'Question 25. Have you got ______ pen, or would you like to borrow ______?', opts:[{html:'your – mine', correct:true}, {html:'yours – my', correct:false}, {html:'yours – mine', correct:false}, {html:'your – my', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Bạn có bút của bạn không, hay bạn muốn mượn (bút) của tôi?"</div> <span class='ex-step-title'>📚 Phân tích ngữ pháp:</span> <p>- <span class='p-grammar'>Tính từ sở hữu (Possessive Adjective)</span>: my, your, his, her... BẮT BUỘC phải đi kèm với một Danh từ phía sau (VD: my pen, your pen).</p> <p>- <span class='p-grammar'>Đại từ sở hữu (Possessive Pronoun)</span>: mine, yours, his, hers... BẮT BUỘC phải đứng độc lập, không có Danh từ đi sau. Nó dùng để thay thế cho cụm [Tính từ sở hữu + Danh từ đã nhắc đến trước đó].</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn A (your - mine)</span>. Chỗ trống thứ 1 đứng trước danh từ "pen" -> Cần Tính từ sở hữu "your" (your pen = bút của bạn). Chỗ trống thứ 2 đứng cuối câu độc lập, nhằm tránh lặp lại cụm "my pen" -> Cần Đại từ sở hữu "mine" (= my pen).</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>B và C sai</span> vì "yours" không được đứng trước danh từ "pen". <span class='hl-red'>D sai</span> vì "my" không được đứng một mình ở cuối câu mà không có danh từ đi kèm.</p>`},

  {id:26, q:'Question 26. The boys ______ their homework yesterday. They ______ TV instead.', opts:[{html:'didn\'t do – watches', correct:false}, {html:'don\'t do – watch', correct:false}, {html:'didn\'t do – watched', correct:true}, {html:'don\'t do – watching', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Hôm qua các cậu bé ĐÃ KHÔNG LÀM bài tập về nhà. Thay vào đó, họ ĐÃ XEM tivi."</div> <span class='ex-step-title'>📚 Phân tích ngữ pháp:</span> <p>Dấu hiệu nhận biết thì là từ <span class='p-grammar'>yesterday</span> (ngày hôm qua) -> Sự việc đã xảy ra và kết thúc trong quá khứ -> Dùng <span class='p-grammar'>Thì Quá khứ đơn (Past Simple)</span>.</p> <p>- Công thức phủ định: <span class='p-grammar'>S + didn't + V(nguyên thể)</span>.</p> <p>- Công thức khẳng định: <span class='p-grammar'>S + V-ed/V2</span>.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn C (didn't do - watched)</span> vì chỗ trống 1 chia phủ định quá khứ (didn't do), chỗ trống 2 chia khẳng định quá khứ có quy tắc (thêm -ed thành watched).</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>A sai</span> vì vế hai chia "watches" (Hiện tại đơn ngôi thứ 3 số ít). <span class='hl-red'>B và D sai</span> vì dùng "don't do" của thì Hiện tại đơn, không phù hợp với trạng từ "yesterday".</p>`},

  {id:27, q:'Question 27. Tom: "How will we travel to school in the future?"<br>Linda: "______"', opts:[{html:'We will go to school today.', correct:false}, {html:'I think we will go by skytrain or driverless bus.', correct:true}, {html:'I am tired and I won\'t go to school today.', correct:false}, {html:'We will go to school now.', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: Tom: "Chúng ta sẽ di chuyển đến trường bằng phương tiện gì TRONG TƯƠNG LAI?"</div> <span class='ex-step-title'>📚 Phân tích các lời đáp:</span> <p>A. "Chúng ta sẽ đi học vào hôm nay." (Lạc đề thời gian).</p> <p>B. "Tôi nghĩ chúng ta sẽ đi bằng tàu trên cao hoặc xe buýt không người lái." (Đúng trọng tâm câu hỏi về phương tiện tương lai).</p> <p>C. "Tôi mệt và tôi sẽ không đi học hôm nay." (Lạc đề).</p> <p>D. "Chúng ta sẽ đi học ngay bây giờ." (Lạc đề).</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn B</span> vì Linda trả lời đúng từ khóa hỏi phương tiện (How) bằng cách cung cấp tên các phương tiện mang tính viễn tưởng/tương lai: <span class='p-word'>skytrain</span> (tàu điện trên cao) và <span class='p-word'>driverless bus</span> (xe buýt tự lái). Đồng thời thì tương lai "will go" khớp với thì của câu hỏi.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>A, C, D sai</span> vì đều đề cập đến việc đi học "ngày hôm nay" (today/now), hoàn toàn sai lệch với bối cảnh "in the future" (trong tương lai) mà Tom hỏi.</p>`},

  {id:28, q:'Question 28. ______ girl sitting next to me is ______ American.', opts:[{html:'The / a', correct:false}, {html:'The / an', correct:true}, {html:'A / an', correct:false}, {html:'A / X', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Cô gái đang ngồi cạnh tôi là một người Mỹ."</div> <span class='ex-step-title'>📚 Phân tích ngữ pháp (Articles - Mạo từ):</span> <p>- <span class='p-grammar'>Mạo từ xác định "The"</span>: Dùng trước danh từ khi cả người nói và người nghe đều biết rõ đối tượng đó là ai/cái gì (thường được xác định bởi một cụm từ/mệnh đề theo sau).</p> <p>- <span class='p-grammar'>Mạo từ không xác định "A/An"</span>: Nghĩa là "một", dùng trước danh từ đếm được số ít chỉ nghề nghiệp, quốc tịch. Dùng "An" khi danh từ bắt đầu bằng một nguyên âm (u, e, o, a, i).</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn B (The / an)</span>. <br>- Chỗ 1 dùng <span class='p-word'>The</span> vì danh từ "girl" đã được xác định cụ thể bởi cụm phân từ "sitting next to me" (không phải cô gái nào khác, mà chính là cô gái ngồi cạnh tôi). <br>- Chỗ 2 dùng <span class='p-word'>an</span> vì "American" (người Mỹ) bắt đầu bằng nguyên âm /ə/.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>A sai</span> vì dùng "a American". <span class='hl-red'>C và D sai</span> vì dùng mạo từ "A" cho cô gái, điều này khiến đối tượng trở nên mơ hồ ("một cô gái nào đó"), sai với ý đồ xác định rõ ràng của câu.</p>`},

  {id:29, q:'Question 29. I really want to fly a ______ like Doraemon.', opts:[{html:'bamboo-copter', correct:true}, {html:'hyperloop', correct:false}, {html:'solowheel', correct:false}, {html:'motorbike', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Tôi thực sự muốn bay bằng một chiếc ______ giống như Doraemon."</div> <span class='ex-step-title'>📚 Phân tích từ vựng:</span> <p>A. <span class='p-word'>bamboo-copter</span> (n): chong chóng tre (thiết bị bay gắn trên đầu).</p> <p>B. <span class='p-word'>hyperloop</span> (n): tàu siêu tốc trong đường ống chân không (di chuyển dưới đất).</p> <p>C. <span class='p-word'>solowheel</span> (n): xe điện một bánh (di chuyển trên mặt đất).</p> <p>D. <span class='p-word'>motorbike</span> (n): xe máy.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn A (bamboo-copter)</span> vì có 2 từ khóa chốt hạ: <span class='p-grammar'>fly</span> (bay) và <span class='p-grammar'>Doraemon</span>. Chong chóng tre chính là bảo bối biểu tượng giúp Doraemon bay lượn.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>B, C, D sai</span> vì các phương tiện này đều không có khả năng bay và không liên quan đến hình ảnh của nhân vật hoạt hình Doraemon.</p>`},

  {id:30, q:'Question 30. Electric cars don\'t pollute the environment because they don\'t have ______.', opts:[{html:'Roof', correct:false}, {html:'wheels', correct:false}, {html:'pedals', correct:false}, {html:'fumes', correct:true}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Xe điện không gây ô nhiễm môi trường bởi vì chúng không có ______."</div> <span class='ex-step-title'>📚 Phân tích từ vựng:</span> <p>A. <span class='p-word'>Roof</span> (n): nóc xe / mái nhà.</p> <p>B. <span class='p-word'>wheels</span> (n): những chiếc bánh xe.</p> <p>C. <span class='p-word'>pedals</span> (n): bàn đạp.</p> <p>D. <span class='p-word'>fumes</span> (n): khói độc, khí thải (từ động cơ đốt trong).</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn D (fumes)</span> vì lý do khiến xe điện thân thiện với môi trường ("don't pollute") là do chúng chạy bằng pin, không đốt cháy xăng dầu nên không sinh ra <span class='p-word'>fumes</span> (khí thải độc hại).</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>A, B sai</span> vì xe điện vẫn phải có nóc và bánh xe để di chuyển, và những bộ phận này không gây ô nhiễm. <span class='hl-red'>C sai</span> vì pedal là bàn đạp của xe đạp/xe máy, ô tô điện có chân ga/chân phanh chứ không dùng pedal cơ học, nhưng nó không phải là nguyên nhân gây ô nhiễm.</p>`},

  {id:31, q:'Question 31. I don\'t think she ______ the final test.', opts:[{html:'Pass', correct:false}, {html:'will pass', correct:true}, {html:'passes', correct:false}, {html:'is passing', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Tôi không nghĩ rằng cô ấy sẽ vượt qua bài kiểm tra cuối kỳ."</div> <span class='ex-step-title'>📚 Phân tích ngữ pháp:</span> <p>Câu có chứa cụm <span class='p-grammar'>I don't think (that)...</span> (Tôi không nghĩ rằng...). Đây là cấu trúc kinh điển dùng để đưa ra quan điểm cá nhân hoặc phỏng đoán về một sự việc trong TƯƠNG LAI.</p> <p>Công thức dự đoán: <span class='p-grammar'>I think / I don't think + S + will + V(nguyên thể)</span>.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn B (will pass)</span> vì nó tuân thủ đúng công thức dùng thì Tương lai đơn (will + V) sau "I don't think" để dự đoán.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>A sai</span> vì "Pass" đang thiếu trợ động từ "will" để tạo thì tương lai, hơn nữa lại viết hoa sai chính tả. <span class='hl-red'>C sai</span> vì "passes" là thì Hiện tại đơn. <span class='hl-red'>D sai</span> vì thì Hiện tại tiếp diễn không dùng để phỏng đoán kết quả tương lai mang tính cá nhân như cấu trúc "I think".</p>`},

  {id:32, q:'Question 32. Emissions from vehicles have negative ______ on the environment.', opts:[{html:'tasks', correct:false}, {html:'effects', correct:true}, {html:'benefits', correct:false}, {html:'problems', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Khí thải từ các phương tiện giao thông có ______ tiêu cực lên môi trường."</div> <span class='ex-step-title'>📚 Phân tích từ vựng & Collocation:</span> <p>A. <span class='p-word'>tasks</span> (n): các nhiệm vụ.</p> <p>B. <span class='p-word'>effects</span> (n): các tác động, ảnh hưởng. Ta có cụm cố định (collocation): <span class='p-grammar'>have an effect on something</span> = có tác động lên cái gì.</p> <p>C. <span class='p-word'>benefits</span> (n): các lợi ích.</p> <p>D. <span class='p-word'>problems</span> (n): các vấn đề.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn B (effects)</span> vì nó kết hợp hoàn hảo với động từ "have" và giới từ "on" phía sau để tạo thành cụm từ có nghĩa: "have negative effects on" (có tác động tiêu cực lên...).</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>A và D sai</span> vì không kết hợp với giới từ "on" trong ngữ cảnh này. <span class='hl-red'>C sai</span> về ngữ nghĩa logic vì "negative benefits" (những lợi ích tiêu cực) là một cụm từ mâu thuẫn.</p>`},

  {id:33, q:'Question 33. Look! The train ______.', opts:[{html:'Come', correct:false}, {html:'is coming', correct:true}, {html:'am coming', correct:false}, {html:'are coming', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Nhìn kìa! Đoàn tàu ĐANG đi tới."</div> <span class='ex-step-title'>📚 Phân tích ngữ pháp:</span> <p>Từ <span class='p-grammar'>Look!</span> (Nhìn kìa!) là dấu hiệu nhận biết cực kỳ đặc trưng của thì <span class='p-grammar'>Hiện tại tiếp diễn (Present Continuous)</span>. Nó ra hiệu cho người nghe chú ý vào một hành động đang xảy ra ngay trước mắt lúc nói chuyện.</p> <p>Công thức: <span class='p-grammar'>S + is/am/are + V-ing</span>.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn B (is coming)</span> vì chủ ngữ "The train" (đoàn tàu) là ngôi thứ ba số ít, tương đương với "It", nên tobe đi kèm phải là "is".</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>A sai</span> vì chia động từ nguyên mẫu. <span class='hl-red'>C sai</span> vì "am" chỉ đi với chủ ngữ "I". <span class='hl-red'>D sai</span> vì "are" dùng cho chủ ngữ số nhiều (You, We, They).</p>`},

  {id:34, q:'Question 34. Tom and Mark are talking about London.<br>Tom: "What\'s the symbol of London?" - Mark: "______"', opts:[{html:'I think it\'s the double-decker bus.', correct:true}, {html:'People in London are friendly.', correct:false}, {html:'The weather in it is wet.', correct:false}, {html:'London is one of the most beautiful cities.', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: Tom: "Biểu tượng của London là gì?" - Mark: "______"</div> <span class='ex-step-title'>📚 Phân tích tình huống giao tiếp:</span> <p>Tom đang hỏi một thông tin cụ thể: <span class='p-word'>symbol</span> (biểu tượng) của thành phố London.</p> <p>A. "Mình nghĩ đó là chiếc xe buýt hai tầng." -> Đáp án cung cấp đúng thông tin về biểu tượng.</p> <p>B. "Người dân ở London rất thân thiện." -> Trả lời về con người.</p> <p>C. "Thời tiết ở đó thì ẩm ướt." -> Trả lời về khí hậu.</p> <p>D. "London là một trong những thành phố đẹp nhất." -> Đưa ra lời khen ngợi chung chung.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn A</span> vì Mark trả lời trực tiếp và chính xác vào trọng tâm câu hỏi. <span class='p-word'>Double-decker bus</span> (xe buýt hai tầng màu đỏ) đúng là một biểu tượng văn hóa nổi tiếng toàn cầu của thủ đô London (Anh).</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>B, C, D sai</span> vì hoàn toàn lạc đề, không trả lời được câu hỏi "Biểu tượng là gì?".</p>`},

  {id:35, q:'Question 35. Festival of lights is a ______ festival in India.', opts:[{html:'religion', correct:false}, {html:'region', correct:false}, {html:'regious', correct:false}, {html:'religious', correct:true}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Lễ hội ánh sáng là một lễ hội mang tính ______ ở Ấn Độ."</div> <span class='ex-step-title'>📚 Phân tích từ loại (Word form):</span> <p>Vị trí ô trống nằm giữa mạo từ "a" và danh từ "festival". Theo quy tắc vị trí từ loại: <span class='p-grammar'>Article (a/an/the) + Adjective + Noun</span>. Ta cần một Tính từ bổ nghĩa cho danh từ "festival".</p> <p>A. <span class='p-word'>religion</span> (Noun): tôn giáo.</p> <p>B. <span class='p-word'>region</span> (Noun): khu vực, vùng miền.</p> <p>C. <span class='p-word'>regious</span>: từ này không có nghĩa trong tiếng Anh (viết sai chính tả).</p> <p>D. <span class='p-word'>religious</span> (Adjective): thuộc về tôn giáo, mang tính tôn giáo.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn D (religious)</span> vì đây là TÍNH TỪ duy nhất và đúng chính tả, ghép với "festival" tạo thành cụm "a religious festival" (một lễ hội tôn giáo) cực kỳ hợp lý về nghĩa.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>A và B sai</span> vì là danh từ, không đứng trước bổ nghĩa cho một danh từ khác trong trường hợp này. <span class='hl-red'>C sai</span> vì không tồn tại từ này.</p>`},

  {id:36, q:'Question 36. ______ she had a broken leg, she took part in the competition.', opts:[{html:'However', correct:false}, {html:'Although', correct:true}, {html:'But', correct:false}, {html:'Because', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "______ cô ấy bị gãy chân, cô ấy vẫn tham gia vào cuộc thi."</div> <span class='ex-step-title'>📚 Phân tích ngữ pháp (Liên từ):</span> <p>A. <span class='p-word'>However</span>: Tuy nhiên. Thường đứng đầu câu, theo sau nó PHẢI có dấu phẩy (However, S + V...).</p> <p>B. <span class='p-word'>Although</span> + S + V (Mệnh đề): Mặc dù... (Diễn tả sự nhượng bộ, sự đối lập giữa 2 vế).</p> <p>C. <span class='p-word'>But</span>: Nhưng. Thường đứng giữa câu để nối 2 vế, KHÔNG đứng đầu câu trong văn phong chuẩn.</p> <p>D. <span class='p-word'>Because</span> + S + V (Mệnh đề): Bởi vì... (Chỉ nguyên nhân).</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn B (Although)</span>. Xét về logic: Việc "bị gãy chân" (tiêu cực) đối lập với việc "vẫn tham gia cuộc thi" (tích cực, đòi hỏi vận động). Mối quan hệ tương phản này phải dùng từ nối mang nghĩa nhượng bộ "Mặc dù". Cấu trúc cũng hoàn toàn đúng: Although + Mệnh đề.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>A sai</span> vì thiếu dấu phẩy. <span class='hl-red'>C sai</span> vì But không đứng đầu câu. <span class='hl-red'>D sai</span> vì nếu dịch là "Bởi vì gãy chân nên cô ấy tham gia" thì cực kỳ vô lý.</p>`},

  {id:37, q:'Question 37. Wait a minute, please. The concert ______ soon.', opts:[{html:'will end', correct:true}, {html:'end', correct:false}, {html:'ended', correct:false}, {html:'ending', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Vui lòng chờ một lát. Buổi hòa nhạc SẼ kết thúc SỚM THÔI."</div> <span class='ex-step-title'>📚 Phân tích ngữ pháp:</span> <p>Câu có chứa dấu hiệu thời gian đặc trưng là trạng từ <span class='p-grammar'>soon</span> (sớm thôi, chẳng bao lâu nữa). Điều này chỉ ra rằng hành động chưa xảy ra, nó sẽ diễn ra ở TƯƠNG LAI.</p> <p>Do đó, ta phải dùng <span class='p-grammar'>Thì Tương lai đơn (Future Simple)</span>. Công thức: <span class='p-grammar'>S + will + V(nguyên thể)</span>.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn A (will end)</span> vì tuân thủ đúng công thức chỉ sự việc sắp sửa xảy ra.</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>B sai</span> vì "end" là hiện tại đơn (nếu đúng phải là ends vì chủ ngữ số ít). <span class='hl-red'>C sai</span> vì "ended" là quá khứ đơn, trái ngược với "soon". <span class='hl-red'>D sai</span> vì không có cấu trúc "S + V-ing" đứng trơ trọi nếu thiếu tobe.</p>`},

  {id:38, q:'Question 38. My mother ______ like to drink green tea because it\'s bitter.', opts:[{html:'isn\'t', correct:false}, {html:'aren\'t', correct:false}, {html:'don\'t', correct:false}, {html:'doesn\'t', correct:true}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Mẹ của tôi KHÔNG THÍCH uống trà xanh bởi vì nó đắng."</div> <span class='ex-step-title'>📚 Phân tích ngữ pháp:</span> <p>Câu diễn tả một sở thích/thói quen ở hiện tại -> Dùng <span class='p-grammar'>Thì Hiện tại đơn (Present Simple)</span>.</p> <p>Động từ chính trong câu là <span class='p-word'>like</span> (một động từ thường, không phải tobe). Trong câu phủ định của động từ thường ở hiện tại đơn, ta phải mượn Trợ động từ: <span class='p-grammar'>S + don't / doesn't + V(nguyên thể)</span>.</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn D (doesn't)</span> vì chủ ngữ "My mother" (Mẹ của tôi) là ngôi thứ 3 số ít (tương đương với She), nên trợ động từ bắt buộc phải là "does + not" -> "doesn't".</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>A và B sai</span> vì "isn't / aren't" là động từ Tobe. Nguyên tắc cơ bản: KHÔNG ĐƯỢC để Tobe và Động từ thường (like) đi liền với nhau trong thì Hiện tại đơn. <span class='hl-red'>C sai</span> vì "don't" chỉ dùng cho chủ ngữ số nhiều (I, You, We, They).</p>`},

  {id:39, q:'Question 39. When ______ this car? - Last month.', opts:[{html:'bought', correct:false}, {html:'did you buy', correct:true}, {html:'did you bought', correct:false}, {html:'do you buy', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Bạn ĐÃ MUA chiếc ô tô này KHI NÀO? - Tháng trước."</div> <span class='ex-step-title'>📚 Phân tích ngữ pháp:</span> <p>Câu trả lời có dấu hiệu thời gian rõ ràng: <span class='p-grammar'>Last month</span> (Tháng trước). Sự việc đã xảy ra và kết thúc hoàn toàn trong quá khứ -> Phải dùng <span class='p-grammar'>Thì Quá khứ đơn (Past Simple)</span>.</p> <p>Công thức câu hỏi Wh- question với động từ thường: <span class='p-grammar'>Từ hỏi (When/Where/...) + did + S + V(nguyên thể)?</span></p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn B (did you buy)</span> vì tuân thủ cấu trúc chuẩn mực: mượn trợ động từ "did", theo sau là chủ ngữ "you" và động từ chính đưa về nguyên mẫu "buy".</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>A sai</span> vì thiếu chủ ngữ và trợ động từ cho câu hỏi. <span class='hl-red'>C sai</span> vô cùng nghiêm trọng vì đã mượn "did" thì động từ phải về nguyên thể (buy), không được chia V2 (bought) nữa. <span class='hl-red'>D sai</span> vì mượn "do" là dấu hiệu của thì Hiện tại đơn, mâu thuẫn với "Last month".</p>`},

  {id:40, q:'Question 40. ______ pen is broken. Can I borrow ______?', opts:[{html:'My - yours', correct:true}, {html:'Mine - yours', correct:false}, {html:'My - your', correct:false}, {html:'Mine - your', correct:false}], ex:`<h4>🔍 Phân tích chi tiết</h4> <div class='vi-trans'>Dịch đề: "Cây bút CỦA TÔI bị hỏng rồi. Tôi có thể mượn (bút) CỦA BẠN được không?"</div> <span class='ex-step-title'>📚 Phân tích ngữ pháp:</span> <p>- <span class='p-grammar'>Tính từ sở hữu</span> (my, your...): CẦN có Danh từ đứng ngay phía sau để tạo nghĩa.</p> <p>- <span class='p-grammar'>Đại từ sở hữu</span> (mine, yours...): Đứng MỘT MÌNH. Nó tự bao hàm cả ý nghĩa của [Tính từ sở hữu + Danh từ].</p> <span class='ex-step-title'>✅ Tại sao đúng?</span> <p>3️⃣ <span class='hl-green'>Chọn A (My - yours)</span>. <br>1. Ô trống đầu tiên nằm trước danh từ "pen" -> Dùng Tính từ sở hữu **My** (My pen = Bút của tôi).<br>2. Ô trống thứ hai nằm ở cuối câu, không có danh từ nào theo sau. Để tránh việc phải nói lại cụm "your pen" rườm rà, ta dùng Đại từ sở hữu thay thế là **yours** (= your pen).</p> <span class='ex-step-title'>❌ Tại sao sai?</span> <p>4️⃣ <span class='hl-red'>B và D sai</span> vì ô đầu tiên dùng "Mine" đứng trước danh từ là sai quy tắc. <span class='hl-red'>C sai</span> vì ô thứ hai dùng "your" (tính từ) đứng chơi vơi ở cuối câu mà không có danh từ theo sau.</p>`},

let score = 0;
let answeredCount = 0;
const totalQ = questions.length;

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function renderQuestions() {
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  
  questions.forEach((q, index) => {
    let opts = [...q.opts];
    shuffleArray(opts);

    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `qcard-${index}`;
    
    // Gán cờ đúng/sai qua data-attribute
    let optsHtml = opts.map((opt, i) => `
      <button class="ans-btn" data-correct="${opt.correct}" onclick="checkAnswer(${index}, this)">
        ${opt.html}
      </button>
    `).join('');

    card.innerHTML = `
      <div class="q-num">Câu ${q.id}</div>
      <div class="q-text">${q.q}</div>
      <div class="answers-grid" id="grid-${index}">${optsHtml}</div>
      <div class="explain-box" id="exp-${index}">${q.ex}</div>
    `;
    main.appendChild(card);
  });
}

function checkAnswer(qIndex, btn) {
  initAudio();
  const grid = document.getElementById(`grid-${qIndex}`);
  const expBox = document.getElementById(`exp-${qIndex}`);
  const isCorrect = btn.dataset.correct === "true";
  
  if(grid.dataset.answered) return;
  grid.dataset.answered = "true";
  answeredCount++;
  
  const buttons = grid.querySelectorAll('.ans-btn');
  buttons.forEach(b => {
    b.classList.add('answered');
    b.disabled = true;
  });

  if(isCorrect) {
    btn.classList.add('correct');
    score++;
    playSound('correct');
    fireConfetti(btn.getBoundingClientRect());
  } else {
    btn.classList.add('wrong');
    playSound('wrong');
    // Reveal correct answer
    buttons.forEach(b => {
      if(b.dataset.correct === "true") b.classList.add('reveal-correct');
    });
  }

  expBox.classList.add('show');
  document.getElementById('scoreTracker').innerHTML = `🎯 ${score} / ${totalQ}`;
  document.getElementById('progressBar').style.width = `${(answeredCount/totalQ)*100}%`;
}

// =============== CONFETTI EFFECT ===============
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function fireConfetti(rect) {
  const x = rect.left + rect.width / 2;
  const y = rect.top;
  const colors = ['#FF4757', '#00D26A', '#FDCB6E', '#8854C0', '#43add0'];
  for(let i=0; i<40; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 15,
      vy: (Math.random() - 1) * 15 - 5,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 1
    });
  }
}
function loopConfetti() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=0; i<particles.length; i++) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.5; p.life -= 0.02;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    if(p.life <= 0) { particles.splice(i,1); i--; }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(loopConfetti);
}
loopConfetti();

// =============== MODAL & SUBMIT LOGIC ===============
function openNameModal() {
  if(answeredCount < totalQ) {
    if(!confirm(`Bạn mới làm ${answeredCount}/${totalQ} câu. Bạn có chắc chắn muốn nộp bài sớm không?`)) return;
  }
  document.getElementById('nameModal').classList.add('show');
  document.getElementById('nameInput').focus();
}

function submitName() {
  const name = document.getElementById('nameInput').value.trim();
  const err = document.getElementById('nameError');
  const input = document.getElementById('nameInput');
  
  if(!name) {
    err.innerText = "⚠️ Hãy nhập tên của bạn nhé!";
    input.classList.add('error');
    setTimeout(() => input.classList.remove('error'), 300);
    return;
  }
  
  document.getElementById('nameModal').classList.remove('show');
  showResult(name);
}

function showResult(name) {
  const modal = document.getElementById('resultModal');
  const msg = document.getElementById('resultMsg');
  const scoreEl = document.getElementById('resultScore');
  const gif = document.getElementById('resultGif');
  
  const percent = Math.round((score / totalQ) * 100);
  
  if(percent === 100) {
    msg.innerHTML = `🌟 THIÊN TÀI! <span>${name}</span> xuất sắc tuyệt đối!`;
    gif.src = "https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif"; 
  } else if(percent >= 60) {
    msg.innerHTML = `👏 Giỏi lắm <span>${name}</span>! Phát huy nhé!`;
    gif.src = "https://media.giphy.com/media/3oz8xAFtjouK5dUwyQ/giphy.gif"; 
  } else {
    msg.innerHTML = `💪 Cố lên <span>${name}</span>! Sai để nhớ lâu hơn!`;
    gif.src = "https://media.giphy.com/media/2rtQMJvhzOnRe/giphy.gif"; 
  }
  
  scoreEl.innerText = `${score} / ${totalQ}`;
  modal.classList.add('show');
}

function retryQuiz() {
  score = 0; answeredCount = 0;
  document.getElementById('scoreTracker').innerHTML = `🎯 0 / ${totalQ}`;
  document.getElementById('progressBar').style.width = `0%`;
  document.getElementById('resultModal').classList.remove('show');
  document.getElementById('nameInput').value = '';
  renderQuestions();
  window.scrollTo(0,0);
}

// Khởi tạo bài trắc nghiệm
renderQuestions();
