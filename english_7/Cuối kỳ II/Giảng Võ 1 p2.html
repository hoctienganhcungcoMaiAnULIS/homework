<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Tiếng Anh Tương Tác</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        :root {
            --primary: #ff9a9e;
            --secondary: #fecfef;
            --accent: #a1c4fd;
            --success: #2ecc71;
            --error: #e74c3c;
            --text-dark: #2c3e50;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            overflow: hidden;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-dark);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating SVG Background */
        .floating-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: -1;
        }

        /* Header */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            z-index: 100;
            font-size: 14px;
            font-weight: 700;
            color: rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        /* Split Layout */
        .container {
            display: flex;
            width: 100vw;
            height: calc(100vh - 40px);
            margin-top: 40px;
        }

        .pane {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.6); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.9); }

        /* Glassmorphism Cards */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--glass-shadow);
        }

        .reading-title {
            font-size: 22px;
            font-weight: 800;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .paragraph {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 15px;
            text-align: justify;
        }

        .btn-translate {
            background: rgba(255,255,255,0.7);
            border: none;
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            color: #d35400;
            transition: 0.3s;
            display: block;
            margin: 10px 0 20px 0;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn-translate:hover {
            transform: translateY(-2px);
            background: white;
        }

        .translation {
            display: none;
            background: rgba(255,255,255,0.5);
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            color: #34495e;
            margin-bottom: 20px;
            border-left: 4px solid #f1c40f;
        }

        /* Glossary Table */
        .glossary {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: rgba(255,255,255,0.3);
            border-radius: 12px;
            overflow: hidden;
        }
        .glossary th, .glossary td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.5);
        }
        .glossary th {
            background: rgba(255,255,255,0.6);
            font-weight: 800;
            color: #2c3e50;
        }

        /* Questions UI */
        .question-text {
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255,255,255,0.6);
            border: 2px solid transparent;
            padding: 15px;
            border-radius: 15px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: left;
            color: #2c3e50;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .option-btn:hover {
            background: rgba(255,255,255,0.9);
            transform: scale(1.02);
        }

        .option-btn.correct {
            background: var(--success);
            color: white;
            border-color: #27ae60;
            pointer-events: none;
        }

        .option-btn.wrong {
            background: var(--error);
            color: white;
            border-color: #c0392b;
            animation: shake 0.4s;
            pointer-events: none;
        }

        .option-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }

        /* Explanation Box */
        .explanation-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.85);
            border-radius: 15px;
            border-left: 5px solid #3498db;
            font-size: 16px;
            line-height: 1.6;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Typography Colors strictly enforced */
        .p-word { color: #0984e3; font-weight: 800; } 
        .p-mean { color: #d35400; font-style: italic; font-weight: 700; } 
        .p-grammar { text-decoration: underline; text-decoration-color: #e74c3c; font-weight: 800; color: #2c3e50; } 
        .hl-green { color: #27ae60; font-weight: 800; } 
        .hl-red { color: #c0392b; font-weight: 800; text-decoration: line-through; } 

        .submit-btn {
            width: 100%;
            padding: 20px;
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: 0.3s;
            margin-top: 20px;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
        }

        /* Popups */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .popup {
            background: white; padding: 40px; border-radius: 25px;
            text-align: center; max-width: 400px; width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: zoomIn 0.3s;
        }

        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .popup input {
            width: 100%; padding: 15px; margin: 20px 0;
            border: 2px solid #a1c4fd; border-radius: 12px;
            font-size: 18px; text-align: center; font-weight: 700;
            outline: none;
        }

        .popup button {
            background: #2ecc71; color: white; border: none;
            padding: 12px 30px; font-size: 18px; font-weight: 800;
            border-radius: 12px; cursor: pointer;
        }

        .score-gif { width: 100%; border-radius: 15px; margin: 15px 0; }
        .score-text { font-size: 30px; font-weight: 900; color: #8e44ad; }
        .teacher-cmt { font-size: 18px; color: #2c3e50; font-style: italic; margin-top: 10px; }

    </style>
</head>

// --- AUDIO SYSTEM ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playDing() {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'triangle'; osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}
function playTing() {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sawtooth'; osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
}

// --- CONFETTI EFFECT ---
function fireConfetti() {
    const emojis = ['🎉', '🌟', '✨', '🔥'];
    for(let i=0; i<30; i++) {
        let el = document.createElement('div');
        el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.position = 'fixed'; el.style.fontSize = Math.random()*20+20+'px';
        el.style.left = Math.random()*100 + 'vw'; el.style.top = '-50px';
        el.style.zIndex = '9999'; el.style.pointerEvents = 'none';
        el.style.transition = 'top 2s ease-in, transform 2s ease-out';
        document.body.appendChild(el);
        setTimeout(() => {
            el.style.top = '110vh';
            el.style.transform = `rotate(${Math.random()*360}deg) translateX(${Math.random()*100-50}px)`;
        }, 10);
        setTimeout(() => el.remove(), 2000);
    }
}

let totalQuestions = 0;
let score = 0;
let answeredQuestions = new Set();

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function toggleTranslate(id) {
    const el = document.getElementById(id);
    if(el.style.display === 'block') el.style.display = 'none';
    else el.style.display = 'block';
}

function renderApp() {
    const leftPane = document.getElementById('left-pane');
    const rightPane = document.getElementById('questions-container');

    data.forEach((part, partIdx) => {
        // Render Reading passage
        let partHtml = `<div class="glass-card"><div class="reading-title">${part.title}</div>`;
        part.texts.forEach((text, textIdx) => {
            let tId = `trans-${partIdx}-${textIdx}`;
            partHtml += `
                <div class="paragraph">${text.en}</div>
                <button class="btn-translate" onclick="toggleTranslate('${tId}')">Mở dịch đoạn này 🌟</button>
                <div id="${tId}" class="translation">${text.vi}</div>
            `;
        });

        // Glossary table
        partHtml += `<table class="glossary"><tr><th>Từ vựng (Vocabulary)</th><th>Nghĩa (Meaning)</th></tr>`;
        part.glossary.forEach(g => {
            partHtml += `<tr><td><span class='p-word'>${g.word}</span></td><td><span class='p-mean'>${g.meaning}</span></td></tr>`;
        });
        partHtml += `</table></div>`;
        leftPane.innerHTML += partHtml;

        // Render Questions
        part.questions.forEach((q, qIdx) => {
            totalQuestions++;
            let globalQIdx = totalQuestions;
            let shuffledOptions = shuffle([...q.options]);

            let qHtml = `<div class="glass-card">
                <div class="question-text">${q.q}</div>
                <div class="options-grid" id="grid-${globalQIdx}">`;

            shuffledOptions.forEach((opt, oIdx) => {
                let optId = `opt-${globalQIdx}-${oIdx}`;
                qHtml += `<button id="${optId}" class="option-btn" onclick="checkAnswer(${globalQIdx}, ${opt.isC}, '${optId}')">${opt.t}</button>`;
            });

            qHtml += `</div>
                <div class="explanation-box" id="exp-${globalQIdx}">${q.exp}</div>
            </div>`;
            rightPane.innerHTML += qHtml;
        });
    });
}

function checkAnswer(qId, isCorrect, btnId) {
    if(answeredQuestions.has(qId)) return;
    answeredQuestions.add(qId);

    const btn = document.getElementById(btnId);
    const grid = document.getElementById(`grid-${qId}`);
    const exp = document.getElementById(`exp-${qId}`);
    const allBtns = grid.querySelectorAll('.option-btn');

    if(isCorrect) {
        btn.classList.add('correct');
        playDing();
        fireConfetti();
        score++;
    } else {
        btn.classList.add('wrong');
        playTing();
    }

    allBtns.forEach(b => {
        b.classList.add('disabled');
        // Auto highlight correct if wrong was clicked
        if(!isCorrect && data.flatMap(p=>p.questions)[qId-1].options.find(o=>o.t === b.innerText).isC) {
            b.classList.add('correct');
            b.classList.remove('disabled');
        }
    });

    exp.style.display = 'block';
}

function openNamePopup() {
    if(answeredQuestions.size < totalQuestions) {
        alert('Em cần làm hết các câu hỏi trước khi nộp bài nhé!');
        return;
    }
    document.getElementById('name-overlay').style.display = 'flex';
}

function submitQuiz() {
    let name = document.getElementById('student-name').value.trim();
    if(!name) { alert("Phải nhập tên để ghi vào bảng vàng em nha!"); return; }

    document.getElementById('name-overlay').style.display = 'none';

    let pct = score / totalQuestions;
    let gifUrl = "";
    let msg = "";

    if(pct === 1) {
        gifUrl = "https://media.tenor.com/images/3a29cecf1e2e987cbf9b10bd8bc2cb96/tenor.gif"; // Genius
        msg = "Thật không thể tin nổi! Em là một thiên tài! Ms Mai An rất tự hào về em! 🌟🏆";
    } else if (pct >= 0.6) {
        gifUrl = "https://media.tenor.com/images/9c33cd88b0a94bf0dca8fbabf35b62b3/tenor.gif"; // High five
        msg = "Làm rất tốt! Cố gắng phân tích kỹ hơn một chút nữa là đạt điểm tối đa nha em! 👏";
    } else {
        gifUrl = "https://media.tenor.com/images/15dbf6230f2c41c73a4b08709e32e85a/tenor.gif"; // Crying cute
        msg = "Đừng buồn nhé! Em hãy đọc kỹ lại phần GIẢI THÍCH CHI TIẾT bên dưới để rút kinh nghiệm. Lần sau chắc chắn sẽ tốt hơn! 💪";
    }

    document.getElementById('r-name').innerText = `Kết Quả Của: ${name}`;
    document.getElementById('r-score').innerText = `Điểm số: ${score} / ${totalQuestions}`;
    document.getElementById('r-gif').src = gifUrl;
    document.getElementById('r-cmt').innerText = msg;
    document.getElementById('result-overlay').style.display = 'flex';
}
