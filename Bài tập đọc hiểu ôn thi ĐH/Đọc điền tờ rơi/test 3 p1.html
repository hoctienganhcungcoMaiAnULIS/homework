<html lang="vi">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* BASE & THEME */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(-45deg, #dcffbd, #e8a5d8, #cc86d1, #a8e6cf);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #333;
            overflow: hidden;
            height: 100vh;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* FLOATING EMOJIS */
        .floating-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; overflow: hidden; }
        .emoji-float {
            position: absolute; font-size: 3rem; opacity: 0.4;
            animation: floatUp linear infinite, sway 3s ease-in-out infinite alternate;
        }
        @keyframes floatUp { from { transform: translateY(100vh); } to { transform: translateY(-100px); } }
        @keyframes sway { from { margin-left: -20px; } to { margin-left: 20px; } }

        /* HEADER */
        header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px);
            padding: 10px 20px; text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .author { font-size: 0.9rem; font-weight: 700; color: #5a3e7a; letter-spacing: 1px; }

        /* SPLIT SCREEN LAYOUT */
        .container { display: flex; height: 100vh; padding-top: 45px; }
        .panel { flex: 1; padding: 20px; overflow-y: auto; scrollbar-width: thin; }
        .panel::-webkit-scrollbar { width: 8px; }
        .panel::-webkit-scrollbar-thumb { background: rgba(204, 134, 209, 0.8); border-radius: 10px; }
        .left-panel { border-right: 2px dashed rgba(255,255,255,0.6); }

        /* GLASSMORPHISM CARDS */
        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 20px; padding: 25px; margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: transform 0.3s;
        }
        .glass-card:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(0,0,0,0.12); }
        
        /* READING SECTION STYLES */
        .reading-title { font-size: 1.5rem; color: #6A0572; margin-bottom: 15px; font-weight: 800; text-align: center;}
        .passage-section { margin-bottom: 20px; line-height: 1.7; font-size: 1.1rem; }
        .passage-section ul { margin-left: 25px; margin-top: 10px;}
        .passage-section li { margin-bottom: 8px; }
        .blank-space { display: inline-block; width: 60px; border-bottom: 2px solid #6A0572; text-align: center; font-weight: bold; color: #6A0572;}
        .translate-btn {
            background: linear-gradient(135deg, #a8e6cf, #dcffbd); border: none; padding: 6px 12px;
            border-radius: 15px; font-size: 0.85rem; font-weight: bold; color: #2d6a4f;
            cursor: pointer; display: block; margin-top: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .translation-text {
            display: none; margin-top: 10px; padding: 12px;
            background: rgba(255,255,255,0.6); border-left: 4px solid #a8e6cf;
            border-radius: 8px; font-size: 0.95rem; color: #444; font-style: italic;
        }

        /* GLOSSARY */
        .glossary-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: rgba(255,255,255,0.5); border-radius: 10px; overflow: hidden; }
        .glossary-table th { background: rgba(106, 5, 114, 0.1); padding: 10px; text-align: left; font-weight: 800; color: #6A0572; }
        .glossary-table td { padding: 10px; border-top: 1px solid rgba(255,255,255,0.6); }

        /* QUESTION SECTION STYLES */
        .question-number { font-weight: 800; color: #9B1FA8; font-size: 1.2rem; margin-bottom: 15px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .opt-btn {
            background: rgba(255,255,255,0.7); border: 2px solid transparent;
            padding: 12px; border-radius: 15px; font-size: 1.05rem; font-weight: 700;
            color: #333; cursor: pointer; transition: all 0.2s; font-family: 'Nunito', sans-serif;
        }
        .opt-btn:hover { background: #fff; transform: scale(1.02); border-color: #cc86d1; box-shadow: 0 4px 15px rgba(204,134,209,0.3); }
        .opt-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; pointer-events: none; }
        .opt-btn.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; pointer-events: none; animation: shakeBtn 0.4s; }
        .opt-btn.disabled { pointer-events: none; opacity: 0.7; }
        @keyframes shakeBtn { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }

        /* MASTER EXPLANATION STYLES (STRICT COMPLIANCE) */
        .explanation-box {
            display: none; margin-top: 15px; padding: 15px; border-radius: 15px;
            background: rgba(255,255,255,0.85); border: 1px solid #cc86d1;
            font-size: 1rem; line-height: 1.6;
            animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .p-word { color: #0056b3; font-weight: bold; }
        .p-mean { color: #e07a5f; font-style: italic; }
        .p-grammar { text-decoration: underline red; font-weight: bold; }
        .hl-green { color: #2a9d8f; font-weight: bold; background: rgba(42, 157, 143, 0.1); padding: 0 4px; border-radius: 4px; }
        .hl-red { color: #d62828; text-decoration: line-through; background: rgba(214, 40, 40, 0.1); padding: 0 4px; border-radius: 4px; }
        
        .exp-title { font-weight: bold; color: #6A0572; margin-bottom: 8px; border-bottom: 1px dashed #6A0572; display: inline-block;}
        .exp-quote { margin: 10px 0; padding: 10px; background: #f1f8ff; border-left: 4px solid #0056b3; border-radius: 5px;}

        /* SUBMIT BUTTON & MODALS */
        .submit-btn {
            display: block; width: 100%; max-width: 400px; margin: 30px auto;
            padding: 18px; border-radius: 50px; border: none;
            background: linear-gradient(135deg, #6A0572, #F0C040); color: #fff;
            font-size: 1.3rem; font-weight: 800; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(106, 5, 114, 0.4); transition: transform 0.2s;
        }
        .submit-btn:hover { transform: scale(1.05); }

        /* PASSWORD MODAL (From user prompt) */
        #passwordModal {
            position:fixed; inset:0; z-index:9999;
            display:flex; align-items:center; justify-content:center;
            background:rgba(5,2,15,0.92); backdrop-filter:blur(20px);
        }
        .pw-card {
            background:linear-gradient(160deg, rgba(40,10,70,0.95) 0%, rgba(15,5,30,0.98) 100%);
            border:1.5px solid rgba(240,192,64,0.4); border-radius:24px; padding:48px 40px 40px; 
            max-width:440px; width:93%; text-align:center; position:relative; overflow:hidden;
            box-shadow:0 0 60px rgba(106,5,114,0.6), 0 0 120px rgba(240,192,64,0.1), inset 0 1px 0 rgba(240,192,64,0.15);
        }
        .pw-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg, #6A0572, #F0C040, #6A0572); }
        .pw-crest { font-size:4rem; margin-bottom:8px; display:block; }
        .pw-title { font-family:'Cinzel', serif; font-size:1.4rem; font-weight:700; color:#F0C040; margin-bottom:6px; letter-spacing:1px; }
        .pw-sub   { font-size:.87rem; color:rgba(200,200,212,0.6); margin-bottom:24px; }
        .pw-input {
            width:100%; padding:13px 20px; border-radius:12px; border:1.5px solid rgba(240,192,64,0.3); background:rgba(255,255,255,0.05);
            color:#FFE082; font-size:1rem; font-family:'Nunito', sans-serif; outline:none; letter-spacing:3px; text-align:center; transition:all .3s;
        }
        .pw-input:focus { border-color:#F0C040; box-shadow:0 0 0 3px rgba(240,192,64,0.15); }
        .pw-input.error { border-color:#FF4757; box-shadow:0 0 0 3px rgba(255,71,87,0.25); animation:shake .4s ease; }
        .pw-input::placeholder { color:rgba(200,200,212,0.3); letter-spacing:1px; }
        .pw-btn {
            width:100%; padding:14px; margin-top:14px; border-radius:12px; border:none;
            background:linear-gradient(135deg, #6A0572 0%, #9B1FA8 40%, #F0C040 100%);
            color:#fff; font-size:1rem; font-weight:700; font-family:'Cinzel', serif; cursor:pointer; letter-spacing:.5px; transition:transform .2s;
        }
        .pw-btn:hover { transform:translateY(-2px); box-shadow:0 8px 32px rgba(106,5,114,0.7); }
        .pw-err { color:#ff8a9a; font-size:.84rem; margin-top:10px; display:none; font-weight:700; }

        /* RESULT POPUP */
        #resultModal {
            position: fixed; inset: 0; z-index: 10000; display: none; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.3); backdrop-filter: blur(15px);
        }
        .result-card {
            background: rgba(255,255,255,0.85); border-radius: 25px; padding: 30px; width: 90%; max-width: 500px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.2); border: 2px solid #fff;
        }
        .result-card img { width: 100%; max-width: 250px; border-radius: 15px; margin: 15px 0; }
        #studentNameInput { width: 80%; padding: 12px; margin-bottom: 20px; border-radius: 10px; border: 2px solid #cc86d1; font-size: 1.1rem; text-align: center; outline:none; }
    </style>
</head>

        // --- PASSWORD LOGIC ---

        function checkPassword() {
            const inp = document.getElementById('pwInput');
            const err = document.getElementById('pwErr');
            if (inp.value === _pw) {
                document.getElementById('passwordModal').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                
                spawnFloats();
                document.getElementById('audioIntro').play().catch(e=>console.log('Audio autoplay blocked'));
                initApp();
            } else {
                inp.classList.remove('error'); void inp.offsetWidth; inp.classList.add('error');
                err.style.display = 'block'; setTimeout(() => inp.classList.remove('error'), 500);
            }
        }
        document.addEventListener('DOMContentLoaded', () => {
            const pwInput = document.getElementById('pwInput');
            if(pwInput) pwInput.addEventListener('keydown', e => { if (e.key==='Enter') checkPassword(); });
        });

                <p>👉 Dịch: Các doanh nghiệp ngày nay <span class="hl-green">sử dụng</span> các công cụ tinh vi...</p>

            { id: 14, correct: "many", options: ["many", "every", "little", "another"],
              exp: `
                <div class="exp-title">Dịch & Phân tích câu hỏi:</div>
                <p>Mặc dù (14) ______ ngành công nghiệp được hưởng lợi...</p>
                <ul style="margin: 10px 0 10px 20px;">
                    <li><span class="p-grammar">Ngữ pháp:</span> "industries" là danh từ đếm được số nhiều.</li>
                    <li><span class="p-word">many</span> + N(số nhiều) = <span class="p-mean">nhiều</span>. <span class="hl-green">✅ Đúng.</span></li>
                    <li>"every", "another" + N(số ít). "little" + N(không đếm được). <span class="hl-red">❌ Đều sai ngữ pháp.</span></li>

                <div class="exp-quote">🔍 Dẫn chứng: "While <b>many</b> industries benefit..."</div>
                <p>👉 Dịch: Mặc dù <span class="hl-green">nhiều</span> ngành công nghiệp được hưởng lợi...</p>
              `
            },
            { id: 15, correct: "for fear of", options: ["rather than", "except for", "in regard to", "for fear of"],
              exp: `
                <div class="exp-title">Dịch & Phân tích câu hỏi:</div>
                <p>...người dùng tránh chia sẻ thông tin nhạy cảm (15) ______ vi phạm dữ liệu.</p>
                <ul style="margin: 10px 0 10px 20px;">
                    <li><span class="p-word">rather than</span> (<span class="p-mean">hơn là</span>) <span class="hl-red">❌ Sai.</span></li>
                    <li><span class="p-word">except for</span> (<span class="p-mean">ngoại trừ</span>) <span class="hl-red">❌ Sai.</span></li>
                    <li><span class="p-word">in regard to</span> (<span class="p-mean">liên quan đến</span>) <span class="hl-red">❌ Sai.</span></li>
                    <li><span class="p-word">for fear of</span> (<span class="p-mean">vì sợ</span>) <span class="hl-green">✅ Đúng. Chỉ nguyên nhân họ không dám chia sẻ.</span></li>
                </ul>
                <div class="exp-quote">🔍 Dẫn chứng: "...avoid sharing sensitive information <b>for fear of</b> breaches."</div>
                <p>👉 Dịch: ...tránh chia sẻ thông tin nhạy cảm <span class="hl-green">vì sợ</span> vi phạm dữ liệu.</p>
              `
            },
            { id: 16, correct: "reach out", options: ["bring in", "reach out", "look forward", "get ahead"],
              exp: `
                <div class="exp-title">Dịch & Phân tích câu hỏi:</div>
                <p>Khuyến khích các công ty (16) ______ với các nhà phát triển...</p>
                <ul style="margin: 10px 0 10px 20px;">
                    <li><span class="p-word">bring in</span> (<span class="p-mean">mời vào/mang vào</span>) <span class="hl-red">❌ Sai.</span></li>
                    <li><span class="p-word">reach out</span> (<span class="p-mean">kết nối, liên hệ</span>) <span class="hl-green">✅ Đúng. Cụm "reach out to sb" = liên hệ/kết nối với ai.</span></li>
                    <li><span class="p-word">look forward</span> (<span class="p-mean">mong đợi</span>) <span class="hl-red">❌ Sai.</span></li>
                    <li><span class="p-word">get ahead</span> (<span class="p-mean">tiến lên</span>) <span class="hl-red">❌ Sai.</span></li>
                </ul>
                <div class="exp-quote">🔍 Dẫn chứng: "Encourage companies to <b>reach out</b> to developers..."</div>
                <p>👉 Dịch: Khuyến khích các công ty <span class="hl-green">kết nối</span> với các nhà phát triển...</p>
              `
            },
            { id: 17, correct: "amounts", options: ["levels", "numbers", "amounts", "degrees"],
              exp: `
                <div class="exp-title">Dịch & Phân tích câu hỏi:</div>
                <p>...xử lý an toàn (17) ______ lớn dữ liệu người dùng nhạy cảm.</p>
                <ul style="margin: 10px 0 10px 20px;">
                    <li><span class="p-grammar">Ngữ pháp:</span> "data" ở đây được coi là không đếm được.</li>
                    <li><span class="p-word">amounts</span> (<span class="p-mean">lượng</span>) thường đi với danh từ không đếm được ("huge amounts of data"). <span class="hl-green">✅ Đúng.</span></li>
                    <li>"numbers" dùng cho danh từ đếm được. "levels", "degrees" không hợp nghĩa chỉ khối lượng dữ liệu. <span class="hl-red">❌ Sai.</span></li>

                <div class="exp-quote">🔍 Dẫn chứng: "...to handle huge <b>amounts</b> of sensitive user data securely."</div>
                <p>👉 Dịch: ...để xử lý an toàn <span class="hl-green">lượng</span> lớn dữ liệu người dùng nhạy cảm.</p>

            { id: 18, correct: "objectives", options: ["constraints", "objectives", "guidelines", "instructions"],
              exp: `
                <div class="exp-title">Dịch & Phân tích câu hỏi:</div>
                <p>Các tổ chức nên điều chỉnh việc sử dụng AI của họ với các (18) ______ được xác định rõ ràng để tối đa hóa hiệu quả...</p>
                <ul style="margin: 10px 0 10px 20px;">
                    <li><span class="p-word">constraints</span> (<span class="p-mean">hạn chế</span>) <span class="hl-red">❌ Sai.</span></li>

                    <li><span class="p-word">guidelines</span> (<span class="p-mean">hướng dẫn</span>) <span class="hl-red">❌ Sai nghĩa ngữ cảnh.</span></li>

                <div class="exp-quote">🔍 Dẫn chứng: "Organizations should align their AI use with well-defined <b>objectives</b>..."</div>
                <p>👉 Dịch: Các tổ chức nên điều chỉnh... với các <span class="hl-green">mục tiêu</span> được xác định rõ ràng...</p>
              `
            }
        ];

        // --- RENDER APP ---
        function initApp() {
            // Render Bài đọc (Left Pane)
            const leftPane = document.getElementById('readingContainer');
            passages.forEach(p => {
                const card = document.createElement('div');
                card.className = 'glass-card';
                card.innerHTML = `<div class="reading-title">${p.title}</div>${p.content}`;
                leftPane.appendChild(card);
            });

            // Render Câu hỏi (Right Pane)
            const rightPane = document.getElementById('questionsContainer');
            // Insert title before questions but after container starts, wait, questions are rendered directly.
            const rightTitle = document.createElement('div');
            rightTitle.className = 'reading-title';
            rightTitle.innerText = "Exercises (Multiple Choice)";
            rightPane.insertBefore(rightTitle, rightPane.firstChild);

            questions.forEach(q => {
                const qCard = document.createElement('div');
                qCard.className = 'glass-card';
                qCard.id = `q-card-${q.id}`;
                
                let html = `<div class="question-number">Question ${q.id}: Select the best option</div>`;
                html += `<div class="options-grid" id="opts-${q.id}">`;
                
                // Shuffle Array
                let shuffledOpts = [...q.options].sort(() => Math.random() - 0.5);
                
                shuffledOpts.forEach(opt => {
                    html += `<button class="opt-btn" onclick="checkAnswer(${q.id}, '${opt}', this)">${opt}</button>`;
                });
                
                html += `</div>`;
                html += `<div class="explanation-box" id="exp-${q.id}">${q.exp}</div>`;
                
                qCard.innerHTML = html;
                // Insert before the submit button
                const submitBtn = rightPane.querySelector('.submit-btn');
                rightPane.insertBefore(qCard, submitBtn);
            });
        }

        // --- INTERACTION LOGIC ---
        function toggleTrans(btn) {
            const text = btn.nextElementSibling;
            if(text.style.display === 'block') {
                text.style.display = 'none';
                btn.innerText = "Mở dịch đoạn này 🌟";
            } else {
                text.style.display = 'block';
                btn.innerText = "Đóng dịch 🌟";
            }
        }

        function checkAnswer(qId, selectedOpt, btnElement) {
            const q = questions.find(x => x.id === qId);
            const grid = document.getElementById(`opts-${qId}`);
            const buttons = grid.querySelectorAll('.opt-btn');
            const expBox = document.getElementById(`exp-${qId}`);
            
            // Disable all buttons in this question
            buttons.forEach(b => b.classList.add('disabled'));
            
            if (selectedOpt === q.correct) {
                // Correct
                btnElement.classList.add('correct');
                btnElement.classList.remove('disabled');
                document.getElementById('audioCorrect').play().catch(()=>{});
                fireConfetti(btnElement);
                score++;
            } else {
                // Wrong
                btnElement.classList.add('wrong');
                btnElement.classList.remove('disabled');
                document.getElementById('audioWrong').play().catch(()=>{});
                // Highlight correct
                buttons.forEach(b => {
                    if(b.innerText === q.correct) {
                        b.classList.add('correct');
                        b.classList.remove('disabled');
                    }
                });
            }
            
            answeredQuestions++;
            expBox.style.display = 'block';
            
            // Cuộn mượt đến giải thích
            expBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function fireConfetti(element) {
            const rect = element.getBoundingClientRect();
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;
            
            confetti({
                particleCount: 80, spread: 60, origin: { x: x, y: y },
                colors: ['#26ccff', '#a25afd', '#ff5e7e', '#88ff5a', '#fcff42']
            });
        }

        // --- SUBMIT LOGIC ---
        function openSubmitModal() {
            if(answeredQuestions < totalQuestions) {
                alert(`Bạn mới làm ${answeredQuestions}/${totalQuestions} câu. Hãy hoàn thành hết nhé!`);
                return;
            }
            document.getElementById('resultModal').style.display = 'flex';
        }

        function showFinalResult() {
            const nameInput = document.getElementById('studentNameInput').value.trim();
            if(!nameInput) {
                alert("Bạn quên nhập tên kìa!");
                return;
            }
            
            document.getElementById('nameEntryState').style.display = 'none';
            document.getElementById('scoreState').style.display = 'block';
            
            document.getElementById('finalScoreText').innerText = `${score} / ${totalQuestions}`;
            document.getElementById('studentNameDisplay').innerText = `Học sinh: ${nameInput}`;
            
            const commentEl = document.getElementById('teacherComment');
            const gifEl = document.getElementById('resultGif');
            let percentage = score / totalQuestions;
            
            if (percentage === 1) {
                commentEl.innerText = "Tuyệt đỉnh! Con là thiên tài ngoại ngữ! 🌟🏆";
                commentEl.style.color = "#FFD700";
                gifEl.src = "https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif"; // Smart clapping
                confetti({particleCount: 300, spread: 100, origin: {y: 0.3}});
            } else if (percentage >= 0.6) {
                commentEl.innerText = "Rất tốt! Cô Mai An rất tự hào về con! 👏✨";
                gifEl.src = "https://media.giphy.com/media/l41lZxzroU33typuU/giphy.gif"; // High five
            } else {
                commentEl.innerText = "Cố lên nhé! Lần sau con sẽ làm tốt hơn! 💪😢";
                commentEl.style.color = "#d62828";
                gifEl.src = "https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"; // Crying/sad but cute
            }
        }
    </script>
