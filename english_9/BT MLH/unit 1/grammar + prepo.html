<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question Words & Prepositions | Ms Mai An ULIS</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --ocean-deep: #020B18;
  --ocean-mid: #041429;
  --bio-cyan: #00F5FF;
  --bio-teal: #06D6A0;
  --bio-pink: #FF6B9D;
  --bio-purple: #C77DFF;
  --bio-blue: #48CAE4;
  --coral: #FF9F1C;
  --correct: #06D6A0;
  --wrong: #FF4757;
  --glass: rgba(0,245,255,0.04);
  --glass-border: rgba(0,245,255,0.12);
  --text-main: #D8F4F8;
  --text-soft: #7BBFCF;
}
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Quicksand',sans-serif;
  background:var(--ocean-deep);
  color:var(--text-main);
  min-height:100vh;
  overflow-x:hidden;
}

/* ===== OCEAN BACKGROUND ===== */
.ocean-bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 50% at 10% 20%, rgba(6,214,160,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 90% 80%, rgba(199,125,255,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 50% 0%, rgba(0,180,216,0.1) 0%, transparent 50%),
    linear-gradient(180deg, #020B18 0%, #041429 30%, #050E22 60%, #02101F 100%);
  animation:oceanBreath 15s ease-in-out infinite alternate;
}
@keyframes oceanBreath{
  0%{filter:hue-rotate(0deg) brightness(1);}
  100%{filter:hue-rotate(15deg) brightness(1.08);}
}

/* Light rays */
.light-rays{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    conic-gradient(from 250deg at 50% -10%,
      transparent 0deg, rgba(0,245,255,0.04) 5deg,
      transparent 10deg, rgba(6,214,160,0.03) 15deg,
      transparent 20deg, rgba(72,202,228,0.04) 25deg,
      transparent 35deg);
  animation:rayShift 20s linear infinite;
}
@keyframes rayShift{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

/* Bubble canvas */
#bubble-canvas{position:fixed;inset:0;z-index:2;pointer-events:none;}

/* Jellyfish */
.jelly-wrap{position:fixed;inset:0;z-index:2;pointer-events:none;}
.jelly{
  position:absolute;
  display:flex;flex-direction:column;align-items:center;
  animation:jellyFloat linear infinite;
  opacity:0;
}
.jelly-body{
  border-radius:50% 50% 0 0;
  border:1.5px solid;
  position:relative;
  box-shadow: 0 0 12px, inset 0 -4px 12px rgba(255,255,255,0.05);
}
.jelly-body::after{
  content:'';position:absolute;
  bottom:0;left:15%;right:15%;
  height:40%;
  border-radius:0 0 40% 40%;
  opacity:0.15;
}
.jelly-tentacles{
  display:flex;gap:2px;margin-top:1px;
}
.jelly-tentacles span{
  display:block;width:1.5px;
  border-radius:2px;
  animation:tentacleWave ease-in-out infinite alternate;
}
@keyframes jellyFloat{
  0%{transform:translateY(110vh) translateX(0) scale(0.8);opacity:0;}
  5%{opacity:0.7;}
  90%{opacity:0.5;}
  100%{transform:translateY(-120px) translateX(var(--drift)) scale(1);opacity:0;}
}
@keyframes tentacleWave{
  0%{transform:scaleY(0.85) rotate(-3deg);}
  100%{transform:scaleY(1.1) rotate(3deg);}
}

/* Floating particles */
.particles-wrap{position:fixed;inset:0;z-index:1;pointer-events:none;}
.particle{
  position:absolute;border-radius:50%;
  animation:particleDrift linear infinite;
}
@keyframes particleDrift{
  0%{transform:translate(0,0);opacity:0;}
  10%{opacity:1;}
  90%{opacity:0.5;}
  100%{transform:translate(var(--dx),var(--dy));opacity:0;}
}

/* Coral decoration */
.coral-bottom{
  position:fixed;bottom:0;left:0;right:0;height:80px;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(2,11,24,0.8));
}

/* ===== MAIN CONTENT ===== */
.wrapper{
  position:relative;z-index:10;
  max-width:860px;margin:0 auto;
  padding:20px 16px 80px;
}

/* ===== HEADER ===== */
.quiz-header{
  text-align:center;
  padding:20px 24px 16px;
  margin-bottom:26px;
  background:rgba(0,245,255,0.04);
  backdrop-filter:blur(20px);
  border:1px solid rgba(0,245,255,0.15);
  border-radius:24px;
  box-shadow:0 8px 40px rgba(0,0,0,0.4),0 0 60px rgba(0,245,255,0.05),inset 0 1px 0 rgba(0,245,255,0.1);
  position:relative;overflow:hidden;
}
.quiz-header::before{
  content:'';position:absolute;top:-40px;left:50%;transform:translateX(-50%);
  width:200px;height:80px;
  background:radial-gradient(ellipse,rgba(0,245,255,0.12),transparent);
  pointer-events:none;
}
.quiz-title{
  font-family:'Comfortaa',sans-serif;
  font-size:1.45rem;font-weight:700;
  background:linear-gradient(135deg,#00F5FF,#06D6A0,#C77DFF,#FF6B9D);
  background-size:300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shimmer 5s linear infinite;
  letter-spacing:1px;margin-bottom:5px;
}
@keyframes shimmer{0%{background-position:0%}100%{background-position:300%}}
.quiz-subtitle{font-size:0.82rem;color:var(--text-soft);font-weight:600;letter-spacing:1.5px;}
.teacher-tag{
  display:inline-block;margin-top:8px;
  background:linear-gradient(135deg,rgba(6,214,160,0.2),rgba(0,245,255,0.15));
  border:1px solid rgba(6,214,160,0.35);
  border-radius:20px;padding:3px 16px;
  font-size:0.73rem;color:#80FFD8;font-weight:700;letter-spacing:0.5px;
}

/* ===== PROGRESS ===== */
.progress-wrap{
  background:rgba(255,255,255,0.05);
  border-radius:50px;height:8px;
  margin-bottom:8px;overflow:hidden;
  border:1px solid rgba(0,245,255,0.08);
}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg,#06D6A0,#00F5FF,#C77DFF);
  border-radius:50px;
  transition:width 0.5s ease;
  box-shadow:0 0 10px rgba(0,245,255,0.5);
}
.progress-label{
  text-align:right;font-size:0.75rem;
  color:var(--text-soft);margin-bottom:20px;font-weight:700;
}

/* ===== SECTION DIVIDER ===== */
.section-div{
  text-align:center;margin:30px 0 18px;position:relative;
}
.section-div::before{
  content:'';position:absolute;top:50%;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,245,255,0.3),transparent);
}
.section-div span{
  position:relative;
  background:linear-gradient(135deg,rgba(2,11,24,0.95),rgba(4,20,41,0.95));
  padding:6px 20px;
  font-family:'Comfortaa',sans-serif;font-size:0.72rem;letter-spacing:2px;
  color:#00F5FF;border-radius:20px;
  border:1px solid rgba(0,245,255,0.25);
  box-shadow:0 0 20px rgba(0,245,255,0.08);
}

/* ===== QUESTION CARD ===== */
.q-card{
  background:rgba(0,245,255,0.025);
  backdrop-filter:blur(16px);
  border:1px solid rgba(0,245,255,0.09);
  border-radius:22px;
  padding:26px 24px 20px;
  margin-bottom:20px;
  box-shadow:0 6px 30px rgba(0,0,0,0.35),inset 0 1px 0 rgba(0,245,255,0.06);
  transition:transform 0.3s,box-shadow 0.3s;
  position:relative;overflow:hidden;
}
.q-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(0,245,255,0.4),transparent);
}
.q-card:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 40px rgba(0,0,0,0.4),0 0 30px rgba(0,245,255,0.06);
}
.q-number{
  font-family:'Comfortaa',sans-serif;font-size:0.67rem;
  color:var(--bio-cyan);font-weight:700;letter-spacing:2px;
  margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.q-number::before{content:'◈';color:var(--bio-purple);}
.q-text{
  font-size:1.13rem;font-weight:700;line-height:1.65;
  color:#D8F4F8;margin-bottom:18px;
}
.q-text .blank{
  display:inline-block;min-width:90px;
  border-bottom:2px dashed rgba(0,245,255,0.4);
  color:rgba(0,245,255,0.3);text-align:center;
  padding:0 8px;font-style:italic;
}
.q-text .orig-sent{
  background:rgba(0,180,216,0.08);
  border-left:3px solid #48CAE4;
  border-radius:0 10px 10px 0;
  padding:8px 14px;margin:8px 0;
  font-size:1rem;color:#A8DCF0;font-style:italic;
  display:block;
}

/* ===== TEXT INPUT FOR ANSWERS ===== */
.input-wrap {
  display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;
}
.text-ans-input {
  flex: 1;
  background: rgba(0,245,255,0.04);
  border: 2px solid rgba(0,245,255,0.25);
  border-radius: 14px;
  padding: 13px 18px;
  color: #D8F4F8;
  font-family: 'Quicksand', sans-serif;
  font-size: 1.05rem;
  font-weight: 600;
  outline: none;
  transition: all 0.3s;
  min-width: 200px;
}
.text-ans-input:focus {
  border-color: #00F5FF;
  box-shadow: 0 0 15px rgba(0,245,255,0.15);
}
.text-ans-input.correct {
  border-color: var(--correct);
  background: rgba(6,214,160,0.08);
  color: #90FFD8;
}
.text-ans-input.wrong {
  border-color: var(--wrong);
  background: rgba(255,71,87,0.08);
  color: #FFB8C0;
  animation: shake 0.5s ease;
}
.check-btn {
  background: linear-gradient(135deg, rgba(0,245,255,0.1), rgba(6,214,160,0.1));
  border: 1.5px solid rgba(0,245,255,0.3);
  border-radius: 14px;
  padding: 13px 24px;
  color: #D8F4F8;
  font-family: 'Quicksand', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.check-btn:hover:not(:disabled) {
  border-color: rgba(0,245,255,0.6);
  background: linear-gradient(135deg, rgba(0,245,255,0.2), rgba(6,214,160,0.2));
  box-shadow: 0 4px 15px rgba(0,245,255,0.2);
  transform: translateY(-2px);
}
.check-btn:disabled {
  opacity: 0.5;
  cursor: default;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(4px)}
}

/* ===== EXPLANATION ===== */
.explain-wrap{max-height:0;overflow:hidden;transition:max-height 0.6s ease,opacity 0.4s;opacity:0;}
.explain-wrap.open{max-height:2400px;opacity:1;}

.explain-box{
  margin-top:14px;
  background:linear-gradient(135deg,rgba(2,11,24,0.9),rgba(4,14,35,0.85));
  border:1px solid rgba(0,245,255,0.15);
  border-radius:16px;padding:18px 20px;
  font-size:0.98rem;line-height:1.78;color:#C0D8F0;
  box-shadow:0 4px 24px rgba(0,0,0,0.3),inset 0 1px 0 rgba(0,245,255,0.05);
}
.explain-box h4{
  font-family:'Comfortaa',sans-serif;font-size:0.7rem;
  color:#06D6A0;letter-spacing:2px;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.explain-section{margin-bottom:13px;}
.explain-section-title{
  font-size:0.82rem;font-weight:700;color:#C77DFF;
  margin-bottom:7px;letter-spacing:0.5px;
  display:flex;align-items:center;gap:6px;
}
.ans-item{margin:5px 0;padding-left:16px;position:relative;}
.ans-item::before{content:'→';position:absolute;left:0;color:#00F5FF;}

.vn-translate{
  background:rgba(255,159,28,0.1);border-left:3px solid var(--coral);
  border-radius:0 10px 10px 0;padding:8px 14px;
  margin:8px 0;font-weight:700;color:#FFCC80;font-size:0.96rem;
}

/* Color classes */
.p-word{color:#00F5FF;font-weight:800;}
.p-mean{color:#FFCC80;font-weight:700;}
.p-grammar{text-decoration:underline wavy #FF6B9D;color:#FFB8D0;font-weight:700;}
.hl-green{color:#06D6A0;font-weight:900;}
.hl-red{color:#FF8FA3;font-weight:700;text-decoration:line-through;}
.pos-tag{
  background:rgba(0,245,255,0.12);border:1px solid rgba(0,245,255,0.25);
  border-radius:4px;padding:1px 6px;font-size:0.77rem;color:#80D4F0;font-style:italic;margin-right:3px;
}
.grammar-box{
  background:rgba(6,214,160,0.08);border:1px solid rgba(6,214,160,0.25);
  border-radius:10px;padding:10px 14px;margin:8px 0;
  font-size:0.92rem;color:#A0FFD8;
  font-family:'Comfortaa',sans-serif;font-size:0.85rem;
}
.rewrite-correct{
  background:rgba(6,214,160,0.1);border-left:3px solid #06D6A0;
  border-radius:0 10px 10px 0;padding:8px 14px;margin:6px 0;
  color:#90FFD8;font-weight:700;
}

/* ===== SUBMIT ===== */
.submit-wrap{text-align:center;padding:32px 0 10px;}
.submit-btn{
  background:linear-gradient(135deg,#06D6A0,#00B4D8,#C77DFF);
  border:none;border-radius:50px;padding:17px 46px;
  font-family:'Comfortaa',sans-serif;font-size:1rem;font-weight:700;
  color:#fff;cursor:pointer;letter-spacing:1px;
  box-shadow:0 8px 32px rgba(6,214,160,0.35),0 4px 0 rgba(0,0,0,0.3);
  transition:all 0.25s;
}
.submit-btn:hover{transform:translateY(-4px) scale(1.04);box-shadow:0 16px 48px rgba(6,214,160,0.45),0 6px 0 rgba(0,0,0,0.3);}

/* ===== MODALS ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.8);
  backdrop-filter:blur(10px);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.active{display:flex;}
.modal-box{
  background:linear-gradient(135deg,rgba(4,20,41,0.98),rgba(2,11,24,0.98));
  border:1px solid rgba(0,245,255,0.2);
  border-radius:26px;padding:38px 32px;
  max-width:480px;width:100%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 80px rgba(0,245,255,0.08);
}
.modal-title{
  font-family:'Comfortaa',sans-serif;font-size:1.2rem;font-weight:700;
  color:#00F5FF;margin-bottom:18px;
}
.modal-input{
  width:100%;background:rgba(0,245,255,0.04);
  border:2px solid rgba(0,245,255,0.25);border-radius:14px;
  padding:13px 18px;color:#D8F4F8;
  font-family:'Quicksand',sans-serif;font-size:1.05rem;font-weight:700;
  outline:none;transition:border-color 0.2s;margin-bottom:8px;
}
.modal-input:focus{border-color:#00F5FF;}
.modal-input.error{border-color:var(--wrong);animation:shake 0.5s;}
.modal-error{color:var(--wrong);font-size:0.85rem;margin-bottom:12px;height:18px;font-weight:700;}
.modal-confirm-btn{
  background:linear-gradient(135deg,#06D6A0,#00B4D8);
  border:none;border-radius:50px;padding:13px 38px;
  font-family:'Quicksand',sans-serif;font-size:1.05rem;font-weight:800;
  color:#fff;cursor:pointer;
  box-shadow:0 6px 24px rgba(6,214,160,0.4);transition:all 0.2s;margin-top:8px;
}
.modal-confirm-btn:hover{transform:scale(1.05);}

/* Result */
.result-greeting{
  font-family:'Comfortaa',sans-serif;font-size:1.05rem;font-weight:700;
  background:linear-gradient(90deg,#06D6A0,#00F5FF,#C77DFF,#FF6B9D);
  background-size:300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shimmer 3s linear infinite;
  margin-bottom:16px;line-height:1.5;
}
.result-score{
  font-size:2.8rem;font-weight:700;color:#00F5FF;margin:12px 0 4px;
  font-family:'Comfortaa',sans-serif;
}
.result-pts{font-size:1.3rem;color:#06D6A0;font-weight:700;margin-bottom:14px;}
.result-grade{font-size:0.95rem;color:#80B0C0;margin-bottom:18px;font-weight:600;}
.result-img{width:170px;border-radius:16px;margin:12px auto;display:block;box-shadow:0 8px 32px rgba(0,0,0,0.45);}
.retry-btn{
  background:linear-gradient(135deg,#C77DFF,#06D6A0);
  border:none;border-radius:50px;padding:12px 32px;
  font-family:'Quicksand',sans-serif;font-size:1rem;font-weight:800;
  color:#fff;cursor:pointer;
  box-shadow:0 6px 20px rgba(199,125,255,0.35);margin-top:12px;transition:all 0.2s;
}
.retry-btn:hover{transform:scale(1.05);}

#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:9999;}
</style>
</head>
<body>
<div class="ocean-bg"></div>
<div class="light-rays"></div>
<canvas id="bubble-canvas"></canvas>
<div class="jelly-wrap" id="jellyWrap"></div>
<div class="particles-wrap" id="particlesWrap"></div>
<div class="coral-bottom"></div>
<canvas id="confetti-canvas"></canvas>

<!-- Name Modal -->
<div class="modal-overlay" id="nameModal">
  <div class="modal-box">
    <div class="modal-title">🌊 NHẬP TÊN ĐỂ NỘP BÀI</div>
    <p style="color:#7BBFCF;margin-bottom:18px;font-size:0.92rem;">Hãy cho cô biết em là ai nhé! 🐠</p>
    <input class="modal-input" id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50"/>
    <div class="modal-error" id="nameError"></div>
    <button class="modal-confirm-btn" onclick="confirmName()">✨ XEM KẾT QUẢ</button>
  </div>
</div>

<!-- Result Modal -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-box">
    <div class="result-greeting" id="resultGreeting"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-pts" id="resultPts"></div>
    <div class="result-grade" id="resultGrade"></div>
    <img class="result-img" id="resultImg" src="" alt="result"/>
    <br>
    <button class="retry-btn" onclick="retryQuiz()">🔄 LÀM LẠI BÀI</button>
  </div>
</div>

<div class="wrapper">
  <div class="quiz-header">
    <div class="quiz-title">🌊 QUESTION WORDS & PREPOSITIONS</div>
    <div class="quiz-subtitle">TIẾNG ANH LỚP 9 · WH-WORDS + TO-INFINITIVE · GIỚI TỪ</div>
    <div class="teacher-tag">👩‍🏫 Giáo viên tạo: Ms Mai An · ULIS</div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel">0 / 38 câu đã trả lời</div>
  <div id="quizContainer"></div>
  <div class="submit-wrap">
    <button class="submit-btn" onclick="openNameModal()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
  </div>
</div>

<script>
/* ===== JELLYFISH ===== */
(function(){
  const wrap=document.getElementById('jellyWrap');
  const colors=[
    {border:'rgba(0,245,255,0.7)',glow:'rgba(0,245,255,0.5)',bg:'rgba(0,245,255,0.08)'},
    {border:'rgba(199,125,255,0.7)',glow:'rgba(199,125,255,0.5)',bg:'rgba(199,125,255,0.08)'},
    {border:'rgba(6,214,160,0.7)',glow:'rgba(6,214,160,0.5)',bg:'rgba(6,214,160,0.08)'},
    {border:'rgba(255,107,157,0.7)',glow:'rgba(255,107,157,0.5)',bg:'rgba(255,107,157,0.08)'},
    {border:'rgba(72,202,228,0.7)',glow:'rgba(72,202,228,0.5)',bg:'rgba(72,202,228,0.08)'},
  ];
  function makeJelly(){
    const c=colors[Math.floor(Math.random()*colors.length)];
    const size=Math.random()*40+20;
    const el=document.createElement('div');
    el.className='jelly';
    const dur=Math.random()*20+15;
    const drift=(Math.random()-0.5)*120;
    const delay=Math.random()*10;
    el.style.cssText=`left:${Math.random()*100}%;bottom:-80px;--drift:${drift}px;animation-duration:${dur}s;animation-delay:${delay}s;`;
    const body=document.createElement('div');
    body.className='jelly-body';
    body.style.cssText=`width:${size}px;height:${size*0.7}px;border-color:${c.border};box-shadow:0 0 ${size*0.5}px ${c.glow},inset 0 0 ${size*0.3}px ${c.bg};`;
    body.style.background=c.bg;
    const tents=document.createElement('div');
    tents.className='jelly-tentacles';
    const count=Math.floor(size/5)+2;
    for(let i=0;i<count;i++){
      const s=document.createElement('span');
      const h=Math.random()*size*0.8+size*0.3;

/* ===== BUBBLES ===== */
(function(){
  const c=document.getElementById('bubble-canvas');
  const ctx=c.getContext('2d');
  let W,H,bubbles=[];
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight;}
  window.addEventListener('resize',resize);resize();
  const colors=['rgba(0,245,255,','rgba(6,214,160,','rgba(199,125,255,','rgba(72,202,228,'];
  function newBubble(){
    return{
      x:Math.random()*W,y:H+10,
      r:Math.random()*6+2,
      speed:Math.random()*0.8+0.3,
      alpha:Math.random()*0.5+0.2,
      wobble:Math.random()*Math.PI*2,
      wobbleSpeed:Math.random()*0.03+0.01,
      col:colors[Math.floor(Math.random()*colors.length)]
    };
  }
  for(let i=0;i<40;i++){const b=newBubble();b.y=Math.random()*H;bubbles.push(b);}
  let fr=0;
  function draw(){
    ctx.clearRect(0,0,W,H);
    fr++;
    if(fr%25===0&&bubbles.length<60) bubbles.push(newBubble());
    bubbles.forEach(b=>{
      b.y-=b.speed;
      b.wobble+=b.wobbleSpeed;
      b.x+=Math.sin(b.wobble)*0.5;
      ctx.globalAlpha=b.alpha;
      ctx.strokeStyle=b.col+'0.8)';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=b.alpha*0.2;
      ctx.fillStyle=b.col+'0.3)';
      ctx.fill();
      ctx.globalAlpha=0.6;
      // Shine
      ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.beginPath();ctx.arc(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.25,0,Math.PI*2);ctx.fill();
    });
    bubbles=bubbles.filter(b=>b.y>-20);
    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  draw();
})();

function playCorrect(){
  const c=ga();
  [[523,0],[659,0.1],[783,0.2],[1046,0.3]].forEach(([f,t])=>{
    const o=c.createOscillator(),g=c.createGain();

    g.gain.setValueAtTime(0,c.currentTime+t);

  });
}

function launchConfetti(){
  const c=document.getElementById('confetti-canvas');
  const ctx=c.getContext('2d');
  c.width=innerWidth;c.height=innerHeight;
  const pieces=[];
  const cols=['#00F5FF','#06D6A0','#C77DFF','#FF6B9D','#FFD700','#00B4D8'];
  for(let i=0;i<80;i++)pieces.push({
    x:Math.random()*c.width,y:-10,
    w:Math.random()*10+4,h:Math.random()*6+3,
    color:cols[Math.floor(Math.random()*cols.length)],
    r:Math.random()*Math.PI*2,dr:Math.random()*0.12-0.06,
    dx:Math.random()*3-1.5,dy:Math.random()*4+2,alpha:1
  });
  let fr=0;
  function loop(){
    ctx.clearRect(0,0,c.width,c.height);
    pieces.forEach(p=>{
      ctx.save();ctx.globalAlpha=p.alpha;
      ctx.translate(p.x,p.y);ctx.rotate(p.r);
      ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
      p.x+=p.dx;p.y+=p.dy;p.r+=p.dr;p.alpha-=0.009;
    });
    fr++;
    if(fr<130)requestAnimationFrame(loop);
    else ctx.clearRect(0,0,c.width,c.height);
  }
  loop();
}

 {id:38,ex:"XI",
   text:`The scarf, which he wrapped around his neck, was made <span class="blank">______</span> wool thread by his girlfriend.`,
   ph: "Nhập giới từ...",
   answers:["of"],
   explain:`<div class="explain-section"><div class="explain-section-title">📚 Phân tích:</div>
     <div class="vn-translate">Dịch câu: "Chiếc khăn quàng cổ mà anh ấy quấn quanh cổ được bạn gái anh ấy làm <b>bằng</b> sợi len."</div>
     <div class="grammar-box">⚡ <span class="p-grammar">be made OF + nguyên liệu (vẫn giữ nguyên bản chất, có thể nhận ra được)</span><br>So sánh: be made <b>FROM</b> + nguyên liệu (đã biến đổi hoàn toàn không nhận ra dạng ban đầu, VD: Wine is made from grapes - Rượu làm từ nho).<br>Chiếc khăn được đan từ sợi len (wool thread), sau khi thành hình chiếc khăn, ta vẫn nhìn thấy và nhận ra chất liệu len ban đầu. Do đó dùng <b>OF</b> là chuẩn xác nhất.</div>
   </div>`
  }
];

/* ===== STATE & HELPERS ===== */
let answered={};
const totalQ=questions.length;

function cleanStr(s) {
  // Chuẩn hóa chuỗi nhập: cắt khoảng trắng thừa, xóa chấm cuối, chuyển đổi nháy
  return s.trim().toLowerCase().replace(/['`’]/g, "'").replace(/\s+/g, ' ').replace(/[.?!]+$/, '');
}

/* ===== BUILD QUIZ ===== */
function buildQuiz(){
  const con=document.getElementById('quizContainer');
  con.innerHTML='';answered={};
  let lastEx='';
  const exNames={
    VIII:'EXERCISE VIII · Điền từ nghi vấn thích hợp',
    IX:'EXERCISE IX · Viết lại câu dùng WH-word + to-infinitive',
    X:'EXERCISE X · Lời nói gián tiếp · WH-word + to-infinitive',
    XI:'EXERCISE XI · Điền giới từ thích hợp'
  };

  questions.forEach(q=>{
    if(q.ex!==lastEx){
      const d=document.createElement('div');
      d.className='section-div';
      d.innerHTML=`<span>✦ ${exNames[q.ex]} ✦</span>`;
      con.appendChild(d);
      lastEx=q.ex;
    }

    const card=document.createElement('div');
    card.className='q-card';card.id=`card-${q.id}`;

    let html=`<div class="q-number">CÂU ${q.id} / ${totalQ}</div>`;
    html+=`<div class="q-text">${q.text}</div>`;
    
    // Đổi thành Text Input thay vì nút chọn
    html+=`<div class="input-wrap" id="opts-${q.id}">`;
    html+=`<input type="text" class="text-ans-input" id="input-${q.id}" placeholder="${q.ph}" onkeydown="if(event.key==='Enter') checkAns(${q.id})" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />`;
    html+=`<button class="check-btn" onclick="checkAns(${q.id})" id="btn-${q.id}">Kiểm tra</button>`;
    html+=`</div>`;

    html+=`<div class="explain-wrap" id="ex-${q.id}"><div class="explain-box"><h4>🔬 GIẢI THÍCH CHI TIẾT</h4>${q.explain}</div></div>`;
    card.innerHTML=html;
    con.appendChild(card);
  });
  updateProgress();
}

function checkAns(qId){
  if(answered[qId]!==undefined)return;
  const inp = document.getElementById(`input-${qId}`);
  const btn = document.getElementById(`btn-${qId}`);
  
  const rawVal = inp.value;
  const userVal = cleanStr(rawVal);
  
  if(!userVal) {
    inp.classList.add('wrong');
    setTimeout(() => inp.classList.remove('wrong'), 500);
    return; 
  }

  const q = questions.find(x => x.id === qId);
  // So sánh mảng câu trả lời hợp lệ
  const isCorrect = q.answers.some(ans => cleanStr(ans) === userVal);

  answered[qId] = isCorrect;
  inp.disabled = true;
  btn.disabled = true;

  if(isCorrect) {
    inp.classList.add('correct');
    playCorrect();
    launchConfetti();
  } else {
    inp.classList.add('wrong');
    playWrong();
  }
  
  document.getElementById(`ex-${qId}`).classList.add('open');
  updateProgress();
}

function updateProgress(){
  const done=Object.keys(answered).length;
  document.getElementById('progressBar').style.width=(done/totalQ*100)+'%';
  document.getElementById('progressLabel').textContent=`${done} / ${totalQ} câu đã trả lời`;
}

function openNameModal(){
  document.getElementById('nameModal').classList.add('active');
  setTimeout(()=>document.getElementById('nameInput').focus(),300);
}
document.getElementById('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')confirmName();});

function confirmName(){
  const inp=document.getElementById('nameInput');
  const err=document.getElementById('nameError');
  const name=inp.value.trim();
  if(!name){
    inp.classList.add('error');err.textContent='⚠️ Em chưa nhập tên!';
    setTimeout(()=>inp.classList.remove('error'),600);return;
  }
  inp.classList.remove('error');err.textContent='';
  document.getElementById('nameModal').classList.remove('active');
  showResult(name);
}

function showResult(name){
  let cor=0;
  questions.forEach(q=>{if(answered[q.id]===true)cor++;});
  const pct=Math.round(cor/totalQ*100);
  const pts=(cor/totalQ*10).toFixed(1);
  let greet='';
  if(pct===100)greet=`🏆 XUẤT SẮC TUYỆT VỜI! ${name} đạt điểm tối đa! Em thật tài năng! 🌊`;
  else if(pct>=80)greet=`🎉 RẤT KHÁ! ${name} làm tốt lắm! Tiếp tục cố gắng nha! ⭐`;
  else if(pct>=60)greet=`💪 KHÁ ĐẤY! ${name} đã hiểu bài! Ôn thêm một chút nữa nhé! 🐠`;
  else greet=`🌊 CỐ LÊN! ${name} ơi, xem lại giải thích rồi làm lại nhé! 🐡`;

  document.getElementById('resultGreeting').textContent=greet;
  document.getElementById('resultScore').textContent=`${cor} / ${totalQ}`;
  document.getElementById('resultPts').textContent=`${pts} / 10 điểm`;
  document.getElementById('resultGrade').textContent=`Tỷ lệ đúng: ${pct}%`;

  let img='';
  if(pct===100)img='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';
  else if(pct>=60)img='https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif';
  else img='https://media.giphy.com/media/ISOckXUybVfQ4/giphy.gif';
  document.getElementById('resultImg').src=img;
  document.getElementById('resultModal').classList.add('active');
  launchConfetti();
}

function retryQuiz(){
  document.getElementById('resultModal').classList.remove('active');
  window.scrollTo({top:0,behavior:'smooth'});
  buildQuiz();
}

buildQuiz();
</script>
