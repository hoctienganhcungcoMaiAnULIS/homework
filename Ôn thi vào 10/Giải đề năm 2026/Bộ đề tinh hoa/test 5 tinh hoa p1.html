<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tương Tác - Ms Mai An ULIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Quicksand:wght@400;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset & Variables - SUMMER OCEAN THEME */
        :root {
            --ocean-dark: #0077b6;
            --ocean-light: #00b4d8;
            --ocean-aqua: #90e0ef;
            --coral: #ff7f50;
            --sand: #f4a261;
            --success: #00b894;
            --danger: #ff7675;
            --glass-bg: rgba(224, 247, 250, 0.4); /* Xanh ngọc trong suốt */
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-dark: #003049;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Quicksand', sans-serif;
            /* Gradient Nước biển loang màu liên tục */
            background: linear-gradient(-45deg, #48cae4, #0096c7, #0077b6, #023e8a, #00b4d8);
            background-size: 400% 400%;
            animation: oceanCurrent 15s ease infinite;
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes oceanCurrent {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* HỌA TIẾT BAY BAY ĐẠI DƯƠNG (Cá, Sao biển, Bong bóng) */
        .bg-shapes {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1; overflow: hidden;
        }
        .shape-obj {
            position: absolute; opacity: 0.6; animation: floatUp linear infinite;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(-15deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.6; }
            50% { transform: translateY(40vh) rotate(15deg) scale(1.2); }
            90% { opacity: 0.6; }
            100% { transform: translateY(-20vh) rotate(-15deg) scale(0.9); opacity: 0; }
        }

        /* GIAO DIỆN MÀN HÌNH KHÓA (KÍNH MỜ XANH BIỂN) */
        #passwordModal {
            position:fixed; inset:0; z-index:9999;
            display:flex; align-items:center; justify-content:center;
            background:rgba(0, 48, 73, 0.4); backdrop-filter:blur(15px);
        }
        .pw-card {
            background: rgba(202, 240, 248, 0.35); /* Kính mờ xanh ngọc */
            backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px; padding: 48px 40px 40px; 
            max-width: 440px; width: 93%; text-align: center; position: relative; overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 119, 182, 0.3), inset 0 0 20px rgba(255,255,255,0.3);
        }
        .pw-card::before {
            content:''; position:absolute; top:0; left:0; right:0; height:6px;
            background:linear-gradient(90deg, var(--coral), var(--sand), var(--ocean-light));
        }
        .pw-crest { font-size:4.5rem; margin-bottom:15px; display:block; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2)); }
        .pw-title { font-family:'Nunito', sans-serif; font-size:1.8rem; font-weight:800; color:#fff; text-shadow: 1px 1px 4px rgba(0, 119, 182, 0.8); margin-bottom:20px; letter-spacing:1px; }
        .pw-input {
            width:100%; padding:15px 20px; border-radius:15px;
            border:2px solid rgba(255,255,255,0.7); background:rgba(255,255,255,0.5);
            color:#023e8a; font-size:1.2rem; font-family:'Nunito', sans-serif; font-weight: 800;
            outline:none; letter-spacing:3px; text-align:center; transition:all .3s;
            backdrop-filter: blur(5px);
        }
        .pw-input:focus { background: rgba(255,255,255,0.9); box-shadow:0 0 0 4px rgba(144, 224, 239, 0.5); border-color: var(--ocean-light);}
        .pw-input.error { border-color:#FF4757; box-shadow:0 0 0 4px rgba(255,71,87,0.3); animation:shake .4s ease; background: rgba(255,255,255,0.9);}
        .pw-input::placeholder { color:#0077b6; letter-spacing:1px; font-weight: 600; opacity: 0.7;}
        
        .pw-btn {
            width:100%; padding:16px; margin-top:20px; border-radius:15px; border:none;
            background:linear-gradient(135deg, var(--coral) 0%, #f4a261 100%);
            color:#fff; font-size:1.2rem; font-weight:800; font-family:'Nunito', sans-serif;
            cursor:pointer; letter-spacing:1px; transition:all .3s; box-shadow: 0 8px 20px rgba(255, 127, 80, 0.4);
        }
        .pw-btn:hover { transform:translateY(-3px); box-shadow:0 12px 25px rgba(255, 127, 80, 0.6); background:linear-gradient(135deg, #ff6b6b 0%, var(--coral) 100%);}
        .pw-err { color:#d63031; font-size:0.95rem; margin-top:15px; display:none; font-weight:800; background: rgba(255,255,255,0.9); padding: 8px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}

        @keyframes shake { 0%,100%{transform:translateX(0)} 15%,45%,75%{transform:translateX(-6px)} 30%,60%,90%{transform:translateX(6px)} }

        /* Container & Glassmorphism cho Bài thi */
        .app-container {
            max-width: 900px; margin: 2rem auto; padding: 0 1rem; position: relative; z-index: 10;
        }

        header { text-align: center; margin-bottom: 2rem; color: #fff; text-shadow: 2px 2px 6px rgba(0, 48, 73, 0.4);}
        header h1 { font-family: 'Nunito', sans-serif; font-size: 3rem; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px;}
        header p { font-size: 1rem; font-weight: 800; background: rgba(255,255,255,0.25); backdrop-filter: blur(10px); display: inline-block; padding: 8px 25px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: #fff; text-transform: uppercase; letter-spacing: 1px;}

        .question-card {
            background: var(--glass-bg); 
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); 
            border-radius: 24px;
            padding: 2.5rem; margin-bottom: 2rem;
            box-shadow: 0 15px 35px rgba(0, 119, 182, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .question-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0, 119, 182, 0.3); }

        .q-number {
            display: inline-block; background: linear-gradient(135deg, var(--ocean-dark), var(--ocean-light));
            color: #fff; padding: 8px 25px; border-radius: 25px;
            font-size: 1.05rem; font-weight: 800; margin-bottom: 1.5rem; box-shadow: 0 4px 15px rgba(0, 119, 182, 0.4);
            letter-spacing: 0.5px;
        }

        .q-text { font-size: 1.3rem; font-weight: 700; margin-bottom: 1.5rem; line-height: 1.6; color: #003049; }

        /* Recreated Signs inside Question */
        .electric-sign {
            border: 4px dashed #e74c3c; border-radius: 16px; padding: 25px;
            text-align: center; background: rgba(255,255,255,0.9); margin: 15px 0;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.1);
        }
        .electric-sign h2 { font-family: 'Nunito', sans-serif; color: #e74c3c; font-size: 1.8rem; margin-bottom: 10px; font-weight: 800;}
        .electric-sign p { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 1.2rem; color: #003049; }
        
        .promo-card {
            background: rgba(255, 240, 243, 0.95); border: 4px solid #ffb8b8;
            padding: 25px; font-family: 'Nunito', sans-serif; text-align: center;
            margin: 15px 0; border-radius: 16px;
            box-shadow: 0 8px 20px rgba(255, 184, 184, 0.3);
        }
        .promo-card h3 { color: #e84393; font-size: 1.5rem; margin-bottom: 10px; font-weight: 800;}
        .promo-card p { font-size: 1.15rem; font-weight: 700; color: #003049;}

        /* Options Grid */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.5rem; }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }

        .option-btn {
            background: rgba(255, 255, 255, 0.85); 
            border: 2px solid rgba(255,255,255,0.9);
            padding: 1.3rem; border-radius: 18px;
            font-family: 'Nunito', sans-serif; font-size: 1.15rem; font-weight: 800;
            color: #0077b6; cursor: pointer; box-shadow: 0 6px 0 rgba(0, 119, 182, 0.15);
            transition: all 0.15s ease; text-align: left;
            backdrop-filter: blur(5px);
        }
        .option-btn:hover {
            transform: scale(1.02) translateY(-3px);
            box-shadow: 0 9px 0 rgba(0, 119, 182, 0.2); 
            border-color: var(--ocean-light); color: var(--ocean-dark);
            background: #fff;
        }
        .option-btn:active { transform: scale(0.98) translateY(4px); box-shadow: 0 2px 0 rgba(0, 119, 182, 0.15); }
        .option-btn.correct { background: var(--success); color: white; box-shadow: 0 6px 0 #00997a; border-color: #00997a; }
        .option-btn.incorrect { background: var(--danger); color: white; box-shadow: 0 6px 0 #d63031; border-color: #d63031; animation: shake 0.4s both; }

        /* Explanation Box */
        .explanation {
            display: none; margin-top: 2rem; padding: 1.8rem;
            background: rgba(255, 255, 255, 0.95); border-radius: 16px;
            border-left: 8px solid var(--coral); font-size: 1.1rem; line-height: 1.7;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); animation: slideDown 0.4s ease forwards;
            color: #003049;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Specific Highlight Classes */
        .vn-translate {
            display: block; background: linear-gradient(135deg, #e0f7fa, #b2ebf2);
            color: #0077b6; font-weight: 800; padding: 15px; border-radius: 12px;
            margin-bottom: 20px; border-left: 5px solid #00b4d8; font-size: 1.15rem; box-shadow: 0 4px 10px rgba(0, 180, 216, 0.15);
        }
        .p-word { color: #d35400; font-weight: 800; }
        .p-phonetic { background: #e0f7fa; color: #0077b6; padding: 2px 8px; border-radius: 6px; font-family: monospace; font-weight: bold; border: 1px solid #b2ebf2;}
        .p-mean { color: #023e8a; font-weight: 700;}
        .p-grammar { text-decoration: underline; text-decoration-color: var(--danger); text-decoration-thickness: 3px; color: #003049; font-weight: 800; }
        .hl-green { color: #00b894; font-weight: 800; background: #e8f8f5; padding: 3px 8px; border-radius: 6px;}
        .hl-red { color: #d63031; text-decoration: line-through; text-decoration-thickness: 3px; font-weight: 800;}

        /* Submit Button */
        .submit-wrap { text-align: center; margin: 4rem 0; }
        .btn-submit {
            background: linear-gradient(135deg, var(--coral) 0%, #f4a261 100%);
            color: #fff; border: 3px solid rgba(255,255,255,0.6); padding: 20px 50px; font-size: 1.6rem;
            font-family: 'Nunito', sans-serif; font-weight: 800; border-radius: 40px;
            cursor: pointer; box-shadow: 0 12px 30px rgba(255, 127, 80, 0.4); transition: all 0.3s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .btn-submit:hover { background: linear-gradient(135deg, #ff6b6b 0%, var(--coral) 100%); transform: translateY(-5px) scale(1.05); box-shadow: 0 18px 40px rgba(255, 127, 80, 0.6); border-color: #fff;}

        /* Modals Kết Quả */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 48, 73, 0.6); backdrop-filter: blur(12px);
            display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.95); padding: 3.5rem; border-radius: 35px;
            width: 90%; max-width: 500px; text-align: center;
            box-shadow: 0 30px 70px rgba(0,0,0,0.3); border: 2px solid #caf0f8;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        .modal-content h2 { color: var(--ocean-dark); margin-bottom: 15px; font-family: 'Nunito', sans-serif; font-size: 2.2rem; font-weight: 800;}
        .name-input {
            width: 100%; padding: 16px; border: 3px solid #caf0f8;
            border-radius: 16px; font-size: 1.2rem; margin-bottom: 25px;
            font-family: 'Quicksand', sans-serif; text-align: center; font-weight: 700; color: #003049;
            background: #f8f9fa;
        }
        .name-input:focus { border-color: var(--ocean-light); outline: none; box-shadow: 0 0 0 4px rgba(0, 180, 216, 0.2); background: #fff;}
        .name-input.error { border-color: var(--danger); animation: shake 0.3s; }
        .btn-action {
            background: var(--success); color: white; border: none;
            padding: 16px 40px; font-size: 1.3rem; border-radius: 16px;
            font-weight: 800; cursor: pointer; transition: 0.2s; font-family: 'Nunito', sans-serif;
            box-shadow: 0 8px 0 #00997a;
        }
        .btn-action:hover { transform: translateY(-3px); box-shadow: 0 11px 0 #00997a; filter: brightness(1.1);}
        .btn-action:active { transform: translateY(5px); box-shadow: 0 3px 0 #00997a; }
        
        .result-gif { width: 100%; border-radius: 20px; margin: 25px 0; max-height: 280px; object-fit: cover; border: 4px solid #caf0f8;}
        .score-display { font-size: 4rem; font-weight: 800; color: var(--coral); text-shadow: 3px 3px 0px #f4a261; margin: 15px 0;}

        /* Confetti elements */
        .confetti {
            position: fixed; width: 14px; height: 14px; pointer-events: none; z-index: 999; animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body>

    <div id="passwordModal">
        <div class="pw-card">
            <span class="pw-crest">🌊</span>
            <div class="pw-title">XÁC THỰC BÀI THI</div>
            <input type="password" class="pw-input" id="pwInput" placeholder="Nhập mật khẩu..." autocomplete="off" />
            <button class="pw-btn" onclick="checkPassword()">LẶN XUỐNG BIỂN THÔI!</button>
            <div class="pw-err" id="pwErr">Mật khẩu không đúng! Vui lòng thử lại.</div>
        </div>
    </div>

    <div id="mainContent" style="display: none;">
        
        <div class="bg-shapes" id="bgShapes"></div>

        <div class="app-container">
            <header>
                <h1>🐠 Đấu Trường Đại Dương 🐠</h1>
                <p>Giáo viên tạo: Ms Mai An ULIS</p>
            </header>

            <div id="quizContainer">
                </div>

            <div class="submit-wrap">
                <button class="btn-submit" onclick="requestSubmit()">🎯 NỘP BÀI & XEM KẾT QUẢ</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="nameModal">
        <div class="modal-content">
            <h2>Nhập tên thợ lặn 🤿</h2>
            <p style="margin-bottom: 20px; color: #0077b6; font-weight: 700; font-size: 1.1rem;">Hãy cho cô biết ai đang làm bài xuất sắc thế này?</p>
            <input type="text" class="name-input" id="studentName" placeholder="Ví dụ: Nguyễn Văn A...">
            <button class="btn-action" onclick="processSubmit()">Xác Nhận & Nộp Bài</button>
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <h2 id="resultGreeting">🌟 THIÊN TÀI!</h2>
            <p style="font-size: 1.2rem; font-weight: 700; color: #0077b6;">Số kho báu con thu thập được:</p>
            <div class="score-display" id="resultScore">10 / 20</div>
            <img src="" alt="Meme Result" class="result-gif" id="resultImg">
            <button class="btn-action" onclick="location.reload()">Chơi Lại Từ Đầu 🔄</button>
        </div>
    </div>

<script>
// --- CẤU HÌNH BẢO MẬT & ÂM THANH ---
// Mật khẩu đã được mã hóa base64 để không lộ plain text (pass: cogangdatdiemcao)
const _pwEnc = "Y29nYW5nZGF0ZGllbWNhbw=="; 

// Âm thanh
const introAudio = new Audio("https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/export_7wcKV5pKUrQYWyi7XgktJM.mp3");
const wrongAudio = new Audio("https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/File%20nghe%20Ket%20A2/huh_sound_effect-www_tiengdong_com.mp3");

// Check Password Logic
function checkPassword() {
    const inp = document.getElementById('pwInput');
    const err = document.getElementById('pwErr');
    if (inp.value === atob(_pwEnc)) {
        document.getElementById('passwordModal').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        
        // Phát âm thanh nhắc nhở
        introAudio.play().catch(e => console.log("Trình duyệt chặn tự động phát âm thanh.", e));
        
        // Khởi tạo hiệu ứng bay Đại dương
        createOceanShapes();
    } else {
        inp.classList.remove('error'); void inp.offsetWidth; inp.classList.add('error');
        err.style.display = 'block'; setTimeout(() => inp.classList.remove('error'), 500);
    }
}
document.addEventListener('DOMContentLoaded', () => {
    const pwInput = document.getElementById('pwInput');
    if(pwInput) pwInput.addEventListener('keydown', e => { if (e.key==='Enter') checkPassword(); });
});

// --- DATABASE CÂU HỎI (ĐỀ 05) ---
const quizData = [
    {
        id: 1,
        question: "Mark the word whose underlined part differs from the other three in pronunciation:<br><br>tour<u>ed</u> &nbsp;&nbsp;&nbsp; jump<u>ed</u> &nbsp;&nbsp;&nbsp; solv<u>ed</u> &nbsp;&nbsp;&nbsp; rain<u>ed</u>",
        options: [
            { text: "toured", isCorrect: false },
            { text: "jumped", isCorrect: true },
            { text: "solved", isCorrect: false },
            { text: "rained", isCorrect: false }
        ],
        explanation: `
            <span class="vn-translate">Dịch đề: Chọn từ có phần gạch chân phát âm khác với ba từ còn lại.</span>
            <strong>1. Phân tích từ vựng 4 đáp án:</strong><br>
            - <span class='p-word'>toured</span> <span class='p-phonetic'>/tʊərd/</span>: <span class='p-mean'>đi du lịch</span><br>
            - <span class='p-word'>jumped</span> <span class='p-phonetic'>/dʒʌmpt/</span>: <span class='p-mean'>nhảy</span><br>
            - <span class='p-word'>solved</span> <span class='p-phonetic'>/sɑːlvd/</span>: <span class='p-mean'>giải quyết</span><br>
            - <span class='p-word'>rained</span> <span class='p-phonetic'>/reɪnd/</span>: <span class='p-mean'>mưa</span><br>
            <strong>2. Tại sao chọn "jumped"?</strong><br>
            Phần gạch chân đuôi "-ed" của từ "jumped" được phát âm là <span class='p-phonetic'>/t/</span> vì từ gốc kết thúc bằng âm vô thanh /p/. <span class='hl-green'>Correct</span><br>
            <strong>3. Tại sao các đáp án khác sai?</strong><br>
            Các từ "toured", "solved", "rained" có âm cuối đều là các âm hữu thanh (/r/, /v/, /n/) nên đuôi -ed của chúng được phát âm là <span class='p-phonetic'>/d/</span>. <span class='hl-red'>Incorrect</span>
        `
    },
    {
        id: 2,
        question: "Mark the word whose underlined part differs from the other three in pronunciation:<br><br>approach<u>es</u> &nbsp;&nbsp;&nbsp; wash<u>es</u> &nbsp;&nbsp;&nbsp; notic<u>es</u> &nbsp;&nbsp;&nbsp; love<u>s</u>",
        options: [
            { text: "approaches", isCorrect: false },
            { text: "washes", isCorrect: false },
            { text: "notices", isCorrect: false },
            { text: "loves", isCorrect: true }
        ],
        explanation: `
            <span class="vn-translate">Dịch đề: Chọn từ có phần gạch chân phát âm khác với ba từ còn lại.</span>
            <strong>1. Phân tích từ vựng 4 đáp án:</strong><br>
            - <span class='p-word'>approaches</span> <span class='p-phonetic'>/əˈproʊtʃɪz/</span>: <span class='p-mean'>tiếp cận</span><br>
            - <span class='p-word'>washes</span> <span class='p-phonetic'>/ˈwɑːʃɪz/</span>: <span class='p-mean'>rửa</span><br>
            - <span class='p-word'>notices</span> <span class='p-phonetic'>/ˈnoʊtɪsɪz/</span>: <span class='p-mean'>chú ý</span><br>
            - <span class='p-word'>loves</span> <span class='p-phonetic'>/lʌvz/</span>: <span class='p-mean'>yêu</span><br>
            <strong>2. Tại sao chọn "loves"?</strong><br>
            Đuôi "-s" trong từ "loves" được phát âm là <span class='p-phonetic'>/z/</span> do từ gốc kết thúc bằng âm hữu thanh /v/. <span class='hl-green'>Correct</span><br>
            <strong>3. Tại sao các đáp án khác sai?</strong><br>
            Các từ còn lại đều tận cùng bằng các âm rít (/tʃ/, /ʃ/, /s/) nên đuôi -es được phát âm thành một âm tiết riêng biệt là <span class='p-phonetic'>/ɪz/</span>. <span class='hl-red'>Incorrect</span>
        `
    },
    {
        id: 3,
        question: "Mark the word that differs from the other three in the position of primary stress:<br><br>submit &nbsp;&nbsp;&nbsp; install &nbsp;&nbsp;&nbsp; happen &nbsp;&nbsp;&nbsp; attend",

// --- CORE LOGIC CHẤM ĐIỂM & GIAO DIỆN ---
const quizContainer = document.getElementById('quizContainer');
let score = 0;
let answeredQuestions = 0;
let totalQuestions = quizData.length;

// Audio Context Setup cho Ding sound
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function playDing() {
    if (!audioCtx) audioCtx = new AudioContext();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
    osc.frequency.exponentialRampToValueAtTime(1318.51, audioCtx.currentTime + 0.1); 
    gain.gain.setValueAtTime(1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}

function shootConfetti(x, y) {
    for (let i = 0; i < 35; i++) {
        const conf = document.createElement('div');
        conf.classList.add('confetti');
        conf.style.left = x + (Math.random() * 80 - 40) + 'px';
        conf.style.top = y + 'px';
        conf.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 65%)`;
        conf.style.transform = `rotate(${Math.random() * 360}deg)`;
        const duration = Math.random() * 1.5 + 1;
        conf.style.animationDuration = duration + 's';
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), duration * 1000);
    }
}

function shuffleArray(array) {
    const newArr = [...array];
    for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
    }
    return newArr;
}

function renderQuiz() {
    quizData.forEach((item, index) => {
        const card = document.createElement('div');
        card.classList.add('question-card');
        card.id = `q-card-${item.id}`;

        const qNumber = document.createElement('div');
        qNumber.classList.add('q-number');
        qNumber.innerText = `Câu ${index + 1}`;

        const qText = document.createElement('div');
        qText.classList.add('q-text');
        qText.innerHTML = item.question;

        const optionsGrid = document.createElement('div');
        optionsGrid.classList.add('options-grid');
        
        const shuffledOptions = shuffleArray(item.options);

        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.classList.add('option-btn');
            btn.innerHTML = opt.text;
            btn.onclick = (e) => handleAnswer(e, btn, opt, item.id, card, shuffledOptions);
            optionsGrid.appendChild(btn);
        });

        const explanationBox = document.createElement('div');
        explanationBox.classList.add('explanation');
        explanationBox.id = `exp-${item.id}`;
        explanationBox.innerHTML = item.explanation;

        card.appendChild(qNumber);
        card.appendChild(qText);
        card.appendChild(optionsGrid);
        card.appendChild(explanationBox);
        quizContainer.appendChild(card);
    });
}

function handleAnswer(e, btn, opt, id, card, shuffledOptions) {
    if (card.dataset.answered === "true") return;
    card.dataset.answered = "true";
    answeredQuestions++;

    const allBtns = card.querySelectorAll('.option-btn');
    
    let correctBtn;
    allBtns.forEach((b, i) => {
        b.style.cursor = 'default';
        if(shuffledOptions[i].isCorrect) correctBtn = b;
    });

    if (opt.isCorrect) {
        btn.classList.add('correct');
        score++;
        playDing(); 
        shootConfetti(e.clientX, e.clientY); 
    } else {
        btn.classList.add('incorrect'); 
        correctBtn.classList.add('correct'); 
        
        wrongAudio.currentTime = 0;
        wrongAudio.play().catch(err => console.log("Không tải được âm thanh báo lỗi.", err));
    }

    document.getElementById(`exp-${id}`).style.display = 'block';
}

function requestSubmit() {
    if(answeredQuestions < totalQuestions) {
        alert("Thợ lặn vẫn chưa thu thập đủ kho báu kìa! Cố lên! 🤿");
        return;
    }
    document.getElementById('nameModal').style.display = 'flex';
}

function processSubmit() {
    const nameInput = document.getElementById('studentName');
    const name = nameInput.value.trim();
    if(!name) {
        nameInput.classList.add('error');
        setTimeout(() => nameInput.classList.remove('error'), 300);
        return;
    }

    document.getElementById('nameModal').style.display = 'none';
    
    const percentage = (score / totalQuestions) * 100;
    const resultModal = document.getElementById('resultModal');
    document.getElementById('resultGreeting').innerText = `🌟 XUẤT SẮC THỢ LẶN ${name}!`;
    document.getElementById('resultScore').innerText = `${score} / ${totalQuestions}`;
    
    const imgEl = document.getElementById('resultImg');
    if(percentage === 100) {
        imgEl.src = "https://media.tenor.com/2R_qg1U8r3AAAAAC/leonardo-dicaprio.gif";
    } else if (percentage >= 60) {
        imgEl.src = "https://media.tenor.com/Z42-y42l-x4AAAAC/minions-cheering.gif";
    } else {
        imgEl.src = "https://media.tenor.com/Z1X-9r1sH3AAAAAC/crying-sad.gif";
    }

    resultModal.style.display = 'flex';
}

        div.style.animationDuration = Math.random() * 20 + 10 + 's';
        div.style.animationDelay = Math.random() * 5 + 's';
        container.appendChild(div);
    }
}

window.onload = () => {
    renderQuiz();
};
</script>
