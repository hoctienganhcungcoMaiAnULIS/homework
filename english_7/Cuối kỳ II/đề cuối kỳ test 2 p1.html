<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST 2 – Ms Mai An ULIS</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pink1:#FFB7C5;--pink2:#FF8FAB;--pink3:#FF6B9D;--pink4:#FFC1CC;
  --lavender:#C9A0DC;--yellow:#FDCB6E;--teal:#00C9A7;
  --deep:#5c1a3a;--text:#3d0a2a;
  --glass:rgba(255,255,255,0.30);--glassborder:rgba(255,255,255,0.55);
}
body{font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;color:var(--text)}

/* ── BACKGROUND ── */
.bg{position:fixed;inset:0;z-index:-2;
  background:linear-gradient(135deg,#FFB7C5,#FFADE0,#FF8FAB,#C9A0DC,#FDCB6E,#FF6B9D,#FFC1CC,#A29BFE,#FFB7C5);
  background-size:600% 600%;
  animation:bgShift 16s ease infinite}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.bg-pattern{position:fixed;inset:0;z-index:-1;opacity:.13;pointer-events:none}

/* ── HEADER ── */
.header{
  background:var(--glass);backdrop-filter:blur(24px);
  border:1.5px solid var(--glassborder);
  border-radius:24px;
  padding:14px 24px 12px;
  text-align:center;
  box-shadow:0 8px 32px rgba(255,107,157,.18);
  margin-bottom:20px;
}
.header .badge{font-size:.78rem;font-weight:700;color:#a03060;letter-spacing:.3px;margin-bottom:3px}
.header h1{font-size:1.55rem;font-weight:900;color:var(--deep);letter-spacing:-.3px}
.header .sub{font-size:.82rem;color:#7a3050;margin-top:3px;font-weight:600}

/* ── PROGRESS ── */
.prog-wrap{background:rgba(255,255,255,.35);border-radius:50px;height:13px;margin-bottom:5px;overflow:hidden;
  box-shadow:inset 0 2px 4px rgba(180,60,100,.12)}
.prog-bar{height:100%;border-radius:50px;
  background:linear-gradient(90deg,var(--pink3),var(--yellow));
  transition:width .5s cubic-bezier(.4,0,.2,1);width:0%}
.prog-txt{text-align:center;font-size:.82rem;font-weight:800;color:#a03060;margin-bottom:20px}

/* ── SECTION HEADER ── */
.sec-hd{
  background:rgba(255,255,255,.22);backdrop-filter:blur(14px);
  border-radius:16px;padding:13px 18px;margin:24px 0 12px;
  border:1.5px solid var(--glassborder);
  border-left:5px solid var(--pink3);
}
.sec-hd p{font-size:.88rem;font-weight:800;color:var(--deep);line-height:1.5}
.sec-hd em{font-weight:600;color:#7a3050;font-style:italic}

/* ── QUESTION CARD ── */
.qcard{
  background:var(--glass);backdrop-filter:blur(22px);
  border:1.5px solid var(--glassborder);
  border-radius:22px;padding:20px 20px 16px;
  margin-bottom:18px;
  box-shadow:0 6px 24px rgba(255,107,157,.12);
  transition:transform .2s
}
.qcard:hover{transform:translateY(-2px)}
.qnum{
  display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--pink3),var(--lavender));
  color:#fff;border-radius:50%;width:30px;height:30px;min-width:30px;
  font-weight:900;font-size:.85rem;
  box-shadow:0 3px 8px rgba(255,107,157,.35);
  margin-right:9px;flex-shrink:0
}
.qtxt{font-size:1.08rem;font-weight:800;color:var(--deep);margin-bottom:14px;display:flex;align-items:flex-start;line-height:1.55}
.qtxt-inner{flex:1;white-space:pre-line}

/* ── CONTEXT BOX ── */
.ctx{
  background:rgba(255,255,255,.38);border-radius:14px;
  padding:13px 16px;margin-bottom:13px;
  border-left:4px solid var(--lavender);
  font-size:.9rem;color:var(--text);line-height:1.7
}
.chat{margin:5px 0;padding:7px 12px;border-radius:12px;font-size:.9rem}
.chat-j{background:rgba(255,107,157,.18);margin-right:24px}
.chat-h{background:rgba(162,155,254,.18);margin-left:24px}
.chat-name{font-weight:900;font-size:.78rem;display:block;margin-bottom:2px}

/* ── SIGN / NOTICE ── */
.sign-wrap{display:flex;justify-content:center;margin:10px 0 14px}
.sign-box{
  border:3px solid #222;border-radius:8px;padding:12px 18px;
  background:#fff;font-family:'Nunito',sans-serif;text-align:center;
  box-shadow:3px 3px 10px rgba(0,0,0,.18);min-width:148px
}
.notice-box{
  border:2.5px solid #fbbf24;border-radius:10px;padding:13px 18px;
  background:#fffbeb;text-align:center;font-size:.88rem;
  color:#333;line-height:1.55;box-shadow:2px 2px 8px rgba(0,0,0,.1)
}

/* ── OPTIONS ── */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.opt{
  background:rgba(255,255,255,.48);
  border:2px solid rgba(255,107,157,.28);
  border-radius:17px;padding:11px 15px;
  font-family:'Nunito',sans-serif;font-size:.98rem;font-weight:700;
  color:var(--deep);cursor:pointer;text-align:left;
  box-shadow:0 4px 12px rgba(255,107,157,.13),0 2px 0 rgba(220,120,160,.25);
  transition:all .18s ease;line-height:1.4;word-break:break-word
}
.opt:hover:not(:disabled){
  transform:scale(1.03) translateY(-2px);
  background:rgba(255,255,255,.72);
  border-color:rgba(255,107,157,.55);
  box-shadow:0 8px 20px rgba(255,107,157,.28),0 2px 0 rgba(220,120,160,.25)
}
.opt.correct{
  background:linear-gradient(135deg,#00D26A,#00b858);
  color:#fff;border-color:#009940;
  box-shadow:0 4px 16px rgba(0,210,106,.38),0 3px 0 #007730
}
.opt.wrong{
  background:linear-gradient(135deg,#FF4757,#e02535);
  color:#fff;border-color:#cc1525;
  box-shadow:0 4px 16px rgba(255,71,87,.38),0 3px 0 #aa0515;
  animation:shake .45s ease
}
.opt:disabled{cursor:not-allowed}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(5px)}
}

/* ── EXPLANATION ── */
.exp{
  display:none;margin-top:13px;
  background:rgba(255,248,220,.68);backdrop-filter:blur(10px);
  border-radius:15px;padding:15px 17px;
  border-left:4px solid var(--yellow);
  font-size:.91rem;line-height:1.72;color:var(--text);
  animation:slideD .28s ease
}
.exp.show{display:block}
@keyframes slideD{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.exp h4{font-size:.9rem;font-weight:900;color:#c04000;margin-bottom:8px}
.exp ul{margin:6px 0 6px 18px}
.exp li{margin-bottom:3px}

/* explanation color classes */
.p-word{color:#1a6dd4;font-weight:800}
.p-phonetic{color:#7c3aed;background:rgba(167,139,250,.16);padding:1px 5px;border-radius:5px;font-weight:700}
.p-mean{color:#c04000;font-weight:700}
.p-grammar{text-decoration:underline;text-decoration-color:#ff4757;text-decoration-thickness:2px;color:var(--text);font-weight:800}
.hl-green{color:#007730;font-weight:900}
.hl-red{color:#cc1020;text-decoration:line-through;font-weight:700}
.viet{
  background:rgba(255,190,80,.22);border-left:3px solid var(--yellow);
  padding:7px 12px;border-radius:9px;
  font-weight:800;color:#7a3800;margin:7px 0;font-size:.88rem
}

/* ── SUBMIT BUTTON ── */
.submit-wrap{text-align:center;margin:28px 0 40px}
.submit-btn{
  background:linear-gradient(135deg,var(--pink3),var(--yellow));
  color:#fff;border:none;border-radius:50px;
  padding:15px 44px;font-family:'Nunito',sans-serif;
  font-size:1.15rem;font-weight:900;cursor:pointer;
  box-shadow:0 5px 0 #b03050,0 8px 24px rgba(255,107,157,.4);
  transition:all .18s
}
.submit-btn:hover{transform:translateY(-3px);box-shadow:0 8px 0 #b03050,0 12px 30px rgba(255,107,157,.5)}
.submit-btn:active{transform:translateY(2px);box-shadow:0 3px 0 #b03050}

/* ── MODALS ── */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
  z-index:1000;align-items:center;justify-content:center
}
.overlay.show{display:flex}
.modal{
  background:rgba(255,255,255,.93);backdrop-filter:blur(24px);
  border-radius:26px;padding:30px 28px;
  max-width:460px;width:92%;
  box-shadow:0 20px 60px rgba(255,107,157,.3);
  animation:popIn .28s cubic-bezier(.3,1.4,.6,1)
}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-size:1.3rem;font-weight:900;color:var(--deep);text-align:center;margin-bottom:14px}
.name-in{
  width:100%;border:2px solid var(--pink3);border-radius:13px;
  padding:11px 15px;font-family:'Nunito',sans-serif;
  font-size:.98rem;color:var(--text);background:rgba(255,255,255,.8);
  outline:none;margin-bottom:7px
}
.name-in:focus{border-color:var(--lavender);box-shadow:0 0 0 3px rgba(201,160,220,.2)}
.name-in.err{border-color:#ff4757}
.err-msg{color:#ff4757;font-size:.82rem;font-weight:700;display:none;margin-bottom:7px}
.mbtn{
  width:100%;background:linear-gradient(135deg,var(--pink3),var(--yellow));
  color:#fff;border:none;border-radius:50px;padding:13px;
  font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900;
  cursor:pointer;box-shadow:0 4px 0 #b03050;transition:all .15s
}
.mbtn:hover{transform:translateY(-1px)}
.res-name{text-align:center;font-size:1.1rem;font-weight:900;color:var(--pink3);margin-bottom:6px}
.res-score{text-align:center;font-size:2.8rem;font-weight:900;color:var(--deep);margin:10px 0}
.res-score span{font-size:1.4rem}
.res-img{display:block;margin:12px auto;border-radius:16px;max-width:190px;width:100%}
.res-msg{text-align:center;font-weight:700;color:var(--deep);margin:8px 0 4px;font-size:.95rem}
.rbtn{
  display:block;margin:10px auto 0;border:none;border-radius:50px;
  padding:11px 30px;font-family:'Nunito',sans-serif;font-size:.95rem;
  font-weight:900;cursor:pointer;
  background:linear-gradient(135deg,var(--lavender),var(--pink3));
  color:#fff;box-shadow:0 4px 0 #8a50a0;transition:all .15s
}
.rbtn:hover{transform:translateY(-1px)}
.rbtn.green{background:linear-gradient(135deg,#00C9A7,#009980);box-shadow:0 4px 0 #007060}

/* ── CONFETTI ── */
#cfc{position:fixed;inset:0;pointer-events:none;z-index:999}

/* ── RESPONSIVE ── */
@media(max-width:560px){
  .opts{grid-template-columns:1fr}
  .qtxt{font-size:.98rem}
  .header h1{font-size:1.3rem}
}
.container{max-width:840px;margin:0 auto;padding:18px}
</style>
</head>
<body>
<div class="bg"></div>

<!-- ── SVG PATTERN OVERLAY (cherry blossom + transport theme) ── -->
<svg class="bg-pattern" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <pattern id="pat" x="0" y="0" width="130" height="130" patternUnits="userSpaceOnUse">
      <text x="8"  y="28"  font-size="22" opacity=".7">🌸</text>
      <text x="60" y="18"  font-size="16" opacity=".55">✈️</text>
      <text x="95" y="50"  font-size="18" opacity=".6">⭐</text>
      <text x="18" y="78"  font-size="14" opacity=".5">🚀</text>
      <text x="70" y="95"  font-size="20" opacity=".55">🌺</text>
      <text x="4"  y="115" font-size="12" opacity=".45">♦</text>
      <text x="48" y="55"  font-size="10" opacity=".4">●</text>
      <text x="105" y="115" font-size="14" opacity=".5">🌸</text>
      <text x="45" y="120" font-size="12" opacity=".4">✨</text>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#pat)"/>
</svg>

<canvas id="cfc"></canvas>

<div class="container">
  <!-- HEADER -->
  <div class="header">
    <div class="badge">👩‍🏫 Giáo viên tạo: Ms Mai An ULIS</div>
    <h1>📝 TEST 2 – ENGLISH</h1>
    <div class="sub">Bài kiểm tra tương tác · Chọn đáp án để xem giải thích ngay!</div>
  </div>

  <!-- PROGRESS -->
  <div class="prog-wrap"><div class="prog-bar" id="progBar"></div></div>
  <div class="prog-txt" id="progTxt">0 / 18 câu đã trả lời</div>

  <div id="quiz"></div>

  <div class="submit-wrap">
    <button class="submit-btn" onclick="openNameModal()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
  </div>
</div>

<!-- NAME MODAL -->
<div class="overlay" id="nameModal">
  <div class="modal">
    <h2>📝 Nhập tên của bạn</h2>
    <input class="name-in" id="nameIn" type="text" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50"
      onkeydown="if(event.key==='Enter')doSubmitName()">
    <div class="err-msg" id="nameErr">⚠️ Vui lòng nhập tên trước khi nộp bài!</div>
    <button class="mbtn" onclick="doSubmitName()">🚀 Xem kết quả ngay!</button>
  </div>
</div>

<!-- RESULT MODAL -->
<div class="overlay" id="resModal">
  <div class="modal">
    <div class="res-name" id="resGreet"></div>
    <div class="res-score" id="resScore"></div>
    <img class="res-img" id="resGif" src="" alt="result gif">
    <p class="res-msg" id="resMsg"></p>
    <button class="rbtn" onclick="doRetry()">🔄 Làm lại bài</button>
    <button class="rbtn green" onclick="closeRes()" style="margin-top:8px">✅ Đóng</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  QUIZ DATA
// ═══════════════════════════════════════════
const QS = [
  // ── SECTION 1: PRONUNCIATION ──────────────
  {
    id:1,
    sec:"SECTION 1: PHÁT ÂM (Pronunciation)",
    secDesc:"Mark the letter A, B, C or D to indicate the word whose <u>underlined part</u> is pronounced differently from that of the rest.",
    showSec:true,
    q:"Chọn từ có phần gạch chân được phát âm KHÁC so với các từ còn lại:",
    opts:[
      {id:"A",t:"mid<u>nigh</u>t"},
      {id:"B",t:"deli<u>gh</u>ted"},
      {id:"C",t:"tur<u>bi</u>ne"},
      {id:"D",t:"<u>vi</u>sit"}
    ],
    ans:"D",
    exp:`<h4>📖 GIẢI THÍCH CHI TIẾT – Question 1</h4>
<p>1️⃣ <strong>Phân tích phần gạch chân của 4 đáp án:</strong></p>
<ul>
  <li>A. <span class="p-word">mid<u>nigh</u>t</span> <span class="p-phonetic">/ˈmɪd.naɪt/</span>: "igh" → <span class="p-mean">/aɪ/</span> (âm "ai" dài)</li>
  <li>B. <span class="p-word">deli<u>gh</u>ted</span> <span class="p-phonetic">/dɪˈlaɪ.tɪd/</span>: "igh" → <span class="p-mean">/aɪ/</span> (âm "ai" dài)</li>
  <li>C. <span class="p-word">tur<u>bi</u>ne</span> <span class="p-phonetic">/ˈtɜː.baɪn/</span>: "i" → <span class="p-mean">/aɪ/</span> (âm "ai" dài)</li>
  <li>D. <span class="p-word"><u>vi</u>sit</span> <span class="p-phonetic">/ˈvɪ.zɪt/</span>: "i" → <span class="p-mean">/ɪ/</span> (âm "i" <em>ngắn</em>) ← <span class="hl-green">KHÁC!</span></li>
</ul>
<div class="viet">🇻🇳 midnight = nửa đêm &nbsp;|&nbsp; delighted = vui mừng &nbsp;|&nbsp; turbine = tua-bin &nbsp;|&nbsp; visit = thăm/ghé</div>
<p>3️⃣ <strong>Tại sao <span class="hl-green">D (visit)</span> đúng?</strong><br>
Từ <span class="p-word">visit</span> có phần gạch chân "vi" phát âm là <span class="p-phonetic">/ɪ/</span> (i ngắn, miệng gần đóng, âm nhẹ). Ba từ còn lại đều có phần gạch chân phát âm là <span class="p-phonetic">/aɪ/</span> (âm đôi, miệng mở rộng rồi thu lại).</p>
<p>4️⃣ <strong>Bẫy thường gặp:</strong> <span class="hl-red">turbine</span> – nhiều học sinh nhầm là /ɪ/ vì chữ "i" đơn, nhưng thực tế đây là âm đôi <span class="p-phonetic">/aɪ/</span> trong tiếng Anh Anh. <span class="p-grammar">Quy tắc: "i" trước phụ âm + e cuối thường = /aɪ/</span>.</p>`
  },
  {
    id:2,
    showSec:false,
    q:"Chọn từ có phần gạch chân được phát âm KHÁC so với các từ còn lại:",
    opts:[
      {id:"A",t:"c<u>e</u>nter"},
      {id:"B",t:"d<u>e</u>sert"},
      {id:"C",t:"s<u>e</u>curity"},
      {id:"D",t:"b<u>e</u>lt"}
    ],
    ans:"C",
    exp:`<h4>📖 GIẢI THÍCH CHI TIẾT – Question 2</h4>
<p>1️⃣ <strong>Phân tích âm "e" được gạch chân:</strong></p>
<ul>
  <li>A. <span class="p-word">c<u>e</u>nter</span> <span class="p-phonetic">/ˈsen.tər/</span>: "e" → <span class="p-mean">/e/</span> (âm "e" rõ ràng)</li>
  <li>B. <span class="p-word">d<u>e</u>sert</span> <span class="p-phonetic">/ˈdez.ərt/</span>: "e" → <span class="p-mean">/e/</span> (âm "e" rõ ràng)</li>
  <li>C. <span class="p-word">s<u>e</u>curity</span> <span class="p-phonetic">/sɪˈkjʊə.rɪ.ti/</span>: "e" → <span class="p-mean">/ɪ/</span> (âm "i" ngắn) ← <span class="hl-green">KHÁC!</span></li>
  <li>D. <span class="p-word">b<u>e</u>lt</span> <span class="p-phonetic">/belt/</span>: "e" → <span class="p-mean">/e/</span> (âm "e" rõ ràng)</li>
</ul>
<div class="viet">🇻🇳 center = trung tâm &nbsp;|&nbsp; desert = sa mạc &nbsp;|&nbsp; security = an ninh/bảo mật &nbsp;|&nbsp; belt = thắt lưng</div>
<p>3️⃣ <strong>Tại sao <span class="hl-green">C (security)</span> đúng?</strong><br>
Trong <span class="p-word">security</span>, âm tiết đầu "se-" KHÔNG được nhấn trọng âm → chữ "e" bị giảm nhẹ thành <span class="p-phonetic">/ɪ/</span>. <span class="p-grammar">Quy tắc: nguyên âm ở âm tiết không nhấn thường bị giảm thành /ɪ/ hoặc /ə/.</span></p>
<p>4️⃣ <strong>Bẫy:</strong> <span class="hl-red">desert</span> – nếu là <em>danh từ</em> "sa mạc" /ˈdez.ərt/ thì "e" = /e/. Còn <em>động từ</em> "desert" /dɪˈzɜːt/ (bỏ rơi) thì khác. Đây là danh từ nên "e" = /e/.</p>`
  },

  // ── SECTION 2: WORD STRESS ─────────────────
  {
    id:3,
    sec:"SECTION 2: TRỌNG ÂM (Word Stress)",
    secDesc:"Mark the letter A, B, C or D to indicate the word that differs from the other three in the position of primary stress.",
    showSec:true,
    q:"Chọn từ có vị trí trọng âm chính KHÁC so với ba từ còn lại:",
    opts:[
      {id:"A",t:"station"},
      {id:"B",t:"healthy"},
      {id:"C",t:"safety"},
      {id:"D",t:"alone"}
    ],
    ans:"D",
    exp:`<h4>📖 GIẢI THÍCH CHI TIẾT – Question 3</h4>
<p>1️⃣ <strong>Phân tích vị trí trọng âm:</strong></p>
<ul>
  <li>A. <span class="p-word">station</span> <span class="p-phonetic">/ˈsteɪ.ʃən/</span>: trọng âm <span class="p-mean">âm tiết 1</span> → <strong>STA</strong>-tion</li>
  <li>B. <span class="p-word">healthy</span> <span class="p-phonetic">/ˈhel.θi/</span>: trọng âm <span class="p-mean">âm tiết 1</span> → <strong>HEAL</strong>-thy</li>
  <li>C. <span class="p-word">safety</span> <span class="p-phonetic">/ˈseɪf.ti/</span>: trọng âm <span class="p-mean">âm tiết 1</span> → <strong>SAFE</strong>-ty</li>

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let answers = {};
let shuffled = {};
const TOTAL = QS.length;

// ═══════════════════════════════════════════
//  SHUFFLE
// ═══════════════════════════════════════════
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// ═══════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════
function render(){
  const el=document.getElementById('quiz');
  let h='';
  QS.forEach(q=>{
    shuffled[q.id]=shuffle(q.opts);

    if(q.showSec&&q.sec){
      h+=`<div class="sec-hd"><p>📌 ${q.sec}${q.secDesc?`<br><em>${q.secDesc}</em>`:''}</p></div>`;
    }

    h+=`<div class="qcard" id="card-${q.id}">`;
    h+=`<div class="qtxt"><span class="qnum">${q.id}</span><div class="qtxt-inner">${q.q.replace(/\n/g,'<br>')}</div></div>`;

    // Conversation
    if(q.isConv&&q.conv){
      h+=`<div class="ctx">`;
      q.conv.forEach(c=>{
        const cls=c.who==='Jenny'?'chat-j':'chat-h';
        h+=`<div class="chat ${cls}"><span class="chat-name">${c.who}:</span>${c.line}</div>`;
      });
      h+=`</div>`;
    }

    // Passage
    if(q.isPassage){
      h+=`<div class="ctx"><p style="line-height:1.72">${q.passage}</p>`;
      if(q.sents)q.sents.forEach(s=>{h+=`<p style="margin-top:7px"><strong>${s.l}.</strong> ${s.t}</p>`;});
      h+=`</div>`;
    }

    // Sign
    if(q.isSign&&q.signHTML){
      h+=`<div class="sign-wrap">${q.signHTML}</div>`;
    }

    // Options
    h+=`<div class="opts" id="opts-${q.id}">`;
    shuffled[q.id].forEach(o=>{
      h+=`<button class="opt" id="o-${q.id}-${o.id}" onclick="pick(${q.id},'${o.id}')">${o.t}</button>`;
    });
    h+=`</div>`;

    // Explanation
    h+=`<div class="exp" id="exp-${q.id}">${q.exp}</div>`;
    h+=`</div>`;
  });
  el.innerHTML=h;
  updateProg();
}

// ═══════════════════════════════════════════
//  PICK ANSWER
// ═══════════════════════════════════════════
function pick(qid,sid){
  if(answers[qid])return;
  answers[qid]=sid;
  const q=QS.find(x=>x.id===qid);
  const ok=sid===q.ans;

  shuffled[qid].forEach(o=>{
    const b=document.getElementById(`o-${qid}-${o.id}`);
    b.disabled=true;
    if(o.id===q.ans)b.classList.add('correct');
    else if(o.id===sid)b.classList.add('wrong');
  });

  document.getElementById(`exp-${qid}`).classList.add('show');

  if(ok){sound('ok');confetti();}
  else{sound('no');}
  updateProg();
}

// ═══════════════════════════════════════════
//  PROGRESS
// ═══════════════════════════════════════════
function updateProg(){
  const n=Object.keys(answers).length;
  document.getElementById('progBar').style.width=(n/TOTAL*100)+'%';
  document.getElementById('progTxt').textContent=`${n} / ${TOTAL} câu đã trả lời`;
}

// ═══════════════════════════════════════════
//  AUDIO – Web Audio API
// ═══════════════════════════════════════════
let AC=null;
function getAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function sound(type){
  try{
    const ctx=getAC();
    if(type==='ok'){
      [[523,0],[659,.1],[784,.2],[1047,.32]].forEach(([f,d])=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';o.frequency.setValueAtTime(f,ctx.currentTime+d);
        g.gain.setValueAtTime(.28,ctx.currentTime+d);
        g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+.38);
        o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.4);
      });
    } else {
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sawtooth';
      o.frequency.setValueAtTime(160,ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(80,ctx.currentTime+.28);
      g.gain.setValueAtTime(.28,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.28);
      o.start(ctx.currentTime);o.stop(ctx.currentTime+.3);
    }
  }catch(e){}
}

// ═══════════════════════════════════════════
//  CONFETTI
// ═══════════════════════════════════════════
const cv=document.getElementById('cfc');
const cx=cv.getContext('2d');
let pts=[];let af=null;
function confetti(){
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#FF6B9D','#FFB7C5','#FDCB6E','#C9A0DC','#00D26A','#A29BFE','#FFC1CC','#FF8FAB'];
  for(let i=0;i<70;i++){
    pts.push({
      x:Math.random()*cv.width,y:-15,
      vx:(Math.random()-.5)*4.5,vy:Math.random()*4+2,
      c:cols[Math.floor(Math.random()*cols.length)],
      w:Math.random()*10+5,h:Math.random()*5+3,
      r:Math.random()*360,rv:(Math.random()-.5)*9,life:1
    });
  }
  if(!af)drawCf();
}
function drawCf(){
  cx.clearRect(0,0,cv.width,cv.height);
  pts=pts.filter(p=>p.life>0);
  pts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.r+=p.rv;p.vy+=.1;p.life-=.013;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r*Math.PI/180);
    cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;
    cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
  });
  if(pts.length>0){af=requestAnimationFrame(drawCf);}
  else{af=null;cx.clearRect(0,0,cv.width,cv.height);}
}

// ═══════════════════════════════════════════
//  MODALS
// ═══════════════════════════════════════════
function openNameModal(){
  document.getElementById('nameModal').classList.add('show');
  document.getElementById('nameIn').focus();
}
function doSubmitName(){
  const ni=document.getElementById('nameIn');
  const nm=ni.value.trim();
  if(!nm){
    ni.classList.add('err');
    document.getElementById('nameErr').style.display='block';
    return;
  }
  ni.classList.remove('err');
  document.getElementById('nameErr').style.display='none';
  document.getElementById('nameModal').classList.remove('show');
  showRes(nm);
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')doSubmitName();});
});

function showRes(name){
  let cor=0;
  QS.forEach(q=>{if(answers[q.id]===q.ans)cor++;});
  const pct=cor/TOTAL*100;

  let greet,msg,gif;
  if(pct===100){
    greet=`🏆 THIÊN TÀI TUYỆT ĐỐI! ${name} đạt điểm 10 hoàn hảo!`;
    msg='Không một câu sai nào! Em là ngôi sao sáng nhất lớp ⭐!';
    gif='https://media.giphy.com/media/26tOZ42Mg6pbTUPHW/giphy.gif';
  } else if(pct>=60){
    greet=`🌟 GIỎI LẮM! ${name} đã làm rất tốt!`;
    msg=`${cor}/${TOTAL} câu đúng! Cố thêm một chút để đạt điểm tuyệt đối nhé! 💪`;
    gif='https://media.giphy.com/media/l3q2K5jinAlChoCLS/giphy.gif';
  } else {
    greet=`💪 CỐ LÊN, ${name}! Lần sau sẽ tốt hơn!`;
    msg=`${cor}/${TOTAL} câu đúng. Ôn lại phần giải thích và thử lại nhé! 📚`;
    gif='https://media.giphy.com/media/L95W4wv8nnb9K/giphy.gif';
  }

  document.getElementById('resGreet').textContent=greet;
  document.getElementById('resScore').innerHTML=`${cor} <span>/ ${TOTAL}</span>`;
  document.getElementById('resGif').src=gif;
  document.getElementById('resMsg').textContent=msg;
  document.getElementById('resModal').classList.add('show');

  if(pct>=60){for(let i=0;i<3;i++)setTimeout(confetti,i*450);}
}
function closeRes(){document.getElementById('resModal').classList.remove('show');}
function doRetry(){
  document.getElementById('resModal').classList.remove('show');
  answers={};shuffled={};
  render();window.scrollTo({top:0,behavior:'smooth'});
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
render();
</script>
