<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Sample Test - Grade 7</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --g1: #11998e; --g2: #38ef7d; --g3: #00C9A7; --g4: #43e97b;
  --accent: #0d7377; --light: #c8ffd4; --glass: rgba(255,255,255,0.18);
  --glass-border: rgba(255,255,255,0.35); --shadow: rgba(17,153,142,0.25);
  --correct: #00D26A; --wrong: #FF4757; --text: #0d3b36; --white: #fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;color:var(--text)}

/* ANIMATED BACKGROUND */
.bg-wrap{position:fixed;inset:0;z-index:0}
.bg-gradient{
  position:absolute;inset:0;
  background:linear-gradient(135deg,#11998e,#38ef7d,#00C9A7,#43e97b,#26d0ce,#11998e,#2af598);
  background-size:400% 400%;
  animation:bgMove 12s ease infinite;
}
@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.bg-pattern{position:absolute;inset:0;opacity:0.13}

/* HEADER */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(17,153,142,0.85);
  backdrop-filter:blur(12px);
  border-bottom:1.5px solid var(--glass-border);
  padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 20px rgba(0,0,0,0.15);
}
.header-title{color:#fff;font-size:1rem;font-weight:800;letter-spacing:.5px}
.header-sub{color:rgba(255,255,255,0.85);font-size:0.72rem;font-weight:600;margin-top:1px}
.header-badge{
  background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);
  border-radius:20px;padding:4px 12px;color:#fff;font-size:0.72rem;font-weight:700;
}
.score-live{
  background:rgba(255,255,255,0.15);border-radius:20px;padding:5px 14px;
  color:#fff;font-weight:800;font-size:0.85rem;border:1px solid rgba(255,255,255,0.3);
}

/* MAIN CONTAINER */
.container{position:relative;z-index:10;max-width:860px;margin:0 auto;padding:20px 16px 100px}

/* SECTION LABEL */
.section-label{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.25);border:1.5px solid rgba(255,255,255,0.5);
  border-radius:30px;padding:5px 16px;font-size:0.78rem;font-weight:800;
  color:var(--accent);margin-bottom:8px;backdrop-filter:blur(6px);
}
.section-desc{
  background:rgba(255,255,255,0.18);border-left:4px solid var(--g1);
  border-radius:0 10px 10px 0;padding:8px 14px;font-size:0.85rem;
  font-weight:700;color:var(--accent);margin-bottom:16px;font-style:italic;
  backdrop-filter:blur(4px);
}

/* QUESTION CARD */
.q-card{
  background:var(--glass);border:1.5px solid var(--glass-border);
  border-radius:22px;padding:22px 24px 18px;margin-bottom:22px;
  backdrop-filter:blur(14px);box-shadow:0 8px 32px var(--shadow);
  transition:transform .2s;
}
.q-card:hover{transform:translateY(-2px)}
.q-number{
  font-size:0.7rem;font-weight:900;color:var(--g1);letter-spacing:2px;
  text-transform:uppercase;margin-bottom:6px;opacity:.8;
}
.q-text{font-size:1.12rem;font-weight:700;color:var(--accent);line-height:1.6;margin-bottom:16px}
.q-text u{text-decoration-color:var(--wrong);text-underline-offset:3px;text-decoration-thickness:2px}

/* NO PARKING SIGN */
.sign-wrap{display:flex;justify-content:center;margin-bottom:16px}
.no-park{
  width:90px;height:90px;border-radius:50%;
  background:#fff;border:5px solid #e74c3c;
  position:relative;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 18px rgba(231,76,60,.35);
}
.no-park span{font-size:2.6rem;font-weight:900;color:#1a1aff;line-height:1}
.no-park::after{
  content:'';position:absolute;
  width:115%;height:5px;background:#e74c3c;
  border-radius:4px;transform:rotate(-45deg);
}

/* ANSWER CARDS */
.answers-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px}
@media(max-width:540px){.answers-grid{grid-template-columns:1fr}}
.ans-btn{
  background:rgba(255,255,255,0.55);border:2px solid rgba(255,255,255,0.7);
  border-radius:18px;padding:13px 16px;font-family:'Nunito',sans-serif;
  font-size:1.05rem;font-weight:700;color:var(--accent);cursor:pointer;
  transition:all .18s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 4px 14px rgba(17,153,142,.15),0 1px 0 rgba(255,255,255,.8) inset;
  text-align:center;backdrop-filter:blur(6px);position:relative;overflow:hidden;
}
.ans-btn:hover:not(:disabled){
  transform:scale(1.045) translateY(-2px);
  box-shadow:0 8px 24px rgba(17,153,142,.28),0 1px 0 rgba(255,255,255,.8) inset;
  border-color:var(--g1);background:rgba(255,255,255,0.75);
}
.ans-btn.correct{
  background:linear-gradient(135deg,#00D26A,#38ef7d)!important;
  border-color:#00D26A!important;color:#fff!important;
  box-shadow:0 6px 22px rgba(0,210,106,.4)!important;
  transform:scale(1.04);
}
.ans-btn.wrong{
  background:linear-gradient(135deg,#FF4757,#ff6b81)!important;
  border-color:#FF4757!important;color:#fff!important;
  animation:shake .4s ease;
}
.ans-btn:disabled{cursor:not-allowed;opacity:.85}
@keyframes shake{
  0%{transform:translateX(0)}10%{transform:translateX(-8px)}
  30%{transform:translateX(8px)}50%{transform:translateX(-5px)}
  70%{transform:translateX(5px)}90%{transform:translateX(-2px)}100%{transform:translateX(0)}
}

/* EXPLANATION BOX */
.expl-box{
  display:none;margin-top:16px;
  background:rgba(255,255,255,0.72);border:1.5px solid rgba(17,153,142,0.3);
  border-radius:16px;padding:18px 20px;backdrop-filter:blur(8px);
  box-shadow:0 4px 20px rgba(17,153,142,.12);
  animation:fadeSlide .35s ease;
}
.expl-box.show{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.expl-title{font-size:.78rem;font-weight:900;color:var(--g1);letter-spacing:1.5px;
  text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.expl-step{margin-bottom:10px;font-size:.95rem;line-height:1.7;color:#1a4a45}
.expl-step strong{color:var(--accent)}

/* Explanation color classes */
.p-word{color:#1a6ef5;font-weight:700}
.p-phonetic{color:#7c3aed;background:rgba(124,58,237,.1);border-radius:4px;padding:1px 5px;font-size:.88em}
.p-mean{color:#c0392b;font-weight:600}
.p-grammar{text-decoration:underline;text-decoration-color:#e74c3c;text-underline-offset:2px;font-weight:700}
.hl-green{color:#00873d;font-weight:800}
.hl-red{color:#c0392b;font-weight:700;text-decoration:line-through;text-decoration-color:#c0392b}
.vi-translate{
  background:rgba(255,166,0,.12);border:1.5px solid rgba(255,166,0,.3);
  border-radius:10px;padding:10px 14px;margin-top:8px;
  font-size:.9rem;font-weight:700;color:#7a4100;line-height:1.6;
}

/* PROGRESS BAR */
.progress-wrap{position:sticky;top:56px;z-index:90;padding:8px 0;
  background:rgba(17,153,142,0.06);backdrop-filter:blur(4px)}
.progress-bar-bg{background:rgba(255,255,255,.3);border-radius:10px;height:8px;
  margin-bottom:6px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:10px;
  background:linear-gradient(90deg,var(--g1),var(--g2));
  transition:width .4s ease;width:0%}
.progress-text{text-align:center;font-size:.75rem;font-weight:700;color:var(--accent)}

/* SUBMIT BUTTON */
.submit-wrap{text-align:center;margin-top:20px}
.btn-submit{
  background:linear-gradient(135deg,var(--g1),var(--g2));
  border:none;border-radius:50px;padding:16px 48px;
  font-family:'Nunito',sans-serif;font-size:1.15rem;font-weight:900;
  color:#fff;cursor:pointer;
  box-shadow:0 6px 28px rgba(17,153,142,.4),0 2px 0 rgba(0,0,0,.1);
  transition:all .2s;letter-spacing:.5px;
}
.btn-submit:hover{transform:translateY(-3px) scale(1.03);
  box-shadow:0 10px 36px rgba(17,153,142,.5)}
.btn-submit:active{transform:translateY(0)}

/* MODALS */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:999;
  background:rgba(0,50,40,.55);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.show{display:flex}
.modal-box{
  background:rgba(255,255,255,0.95);border-radius:28px;
  padding:36px 32px;max-width:460px;width:100%;
  box-shadow:0 20px 60px rgba(17,153,142,.35);
  animation:popIn .3s cubic-bezier(.34,1.56,.64,1);text-align:center;
}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-size:1.4rem;font-weight:900;color:var(--accent);margin-bottom:8px}
.modal-sub{font-size:.9rem;color:#666;margin-bottom:20px}
.modal-input{
  width:100%;border:2px solid rgba(17,153,142,.3);border-radius:14px;
  padding:13px 16px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;
  color:var(--accent);outline:none;transition:border .2s;
  background:rgba(200,255,212,.15);
}
.modal-input:focus{border-color:var(--g1);background:rgba(200,255,212,.3)}
.modal-input.err{border-color:var(--wrong);animation:shake .4s ease}
.err-msg{color:var(--wrong);font-size:.82rem;font-weight:700;margin-top:5px;display:none}
.err-msg.show{display:block}
.btn-modal{
  background:linear-gradient(135deg,var(--g1),var(--g2));
  border:none;border-radius:50px;padding:13px 40px;margin-top:16px;
  font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900;
  color:#fff;cursor:pointer;transition:all .2s;
  box-shadow:0 4px 18px rgba(17,153,142,.35);
}
.btn-modal:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(17,153,142,.45)}

/* RESULT MODAL */
.result-emoji{font-size:3rem;margin-bottom:10px}
.result-name{font-size:1.25rem;font-weight:900;color:var(--accent);margin-bottom:6px}
.result-score{
  font-size:3rem;font-weight:900;
  background:linear-gradient(135deg,var(--g1),var(--g2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin:10px 0;
}
.result-label{font-size:.9rem;color:#666;margin-bottom:16px}
.result-meme{width:200px;height:160px;object-fit:cover;border-radius:16px;
  margin:12px auto;display:block;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.result-msg{font-size:1rem;font-weight:700;color:var(--accent);margin:10px 0}
.btn-retry{
  background:linear-gradient(135deg,#FF6B6B,#FF8E53);
  border:none;border-radius:50px;padding:12px 32px;margin-top:10px;
  font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:900;
  color:#fff;cursor:pointer;transition:all .2s;
}
.btn-retry:hover{transform:translateY(-2px)}

/* CONFETTI */
.confetti-piece{
  position:fixed;width:10px;height:10px;border-radius:2px;
  pointer-events:none;z-index:9999;animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}
</style>
</head>
<body>

<!-- BACKGROUND -->
<div class="bg-wrap">
  <div class="bg-gradient"></div>
  <svg class="bg-pattern" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
      <pattern id="pat" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
        <!-- Book -->
        <rect x="8" y="12" width="18" height="22" rx="2" fill="rgba(255,255,255,0.6)" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>
        <line x1="17" y1="12" x2="17" y2="34" stroke="rgba(17,153,142,0.4)" stroke-width="1"/>
        <!-- Pencil -->
        <rect x="38" y="8" width="5" height="20" rx="1" fill="rgba(255,214,0,0.5)" transform="rotate(30 40 18)"/>
        <polygon points="38,28 43,28 40.5,34" fill="rgba(255,150,0,0.5)" transform="rotate(30 40 18)"/>
        <!-- Leaf -->
        <ellipse cx="75" cy="20" rx="10" ry="6" fill="rgba(56,239,125,0.4)" transform="rotate(-20 75 20)"/>
        <line x1="65" y1="24" x2="85" y2="16" stroke="rgba(17,153,142,0.4)" stroke-width="1"/>
        <!-- Star -->
        <polygon points="100,8 102,14 108,14 103,18 105,24 100,20 95,24 97,18 92,14 98,14"
          fill="rgba(255,214,0,0.45)"/>
        <!-- Lightbulb -->
        <circle cx="20" cy="80" r="8" fill="rgba(255,230,100,0.45)"/>
        <rect x="16" y="87" width="8" height="4" rx="1" fill="rgba(200,200,200,0.4)"/>
        <!-- Atom -->
        <circle cx="65" cy="75" r="4" fill="rgba(17,153,142,0.35)"/>
        <ellipse cx="65" cy="75" rx="14" ry="5" fill="none" stroke="rgba(17,153,142,0.3)" stroke-width="1" transform="rotate(0 65 75)"/>
        <ellipse cx="65" cy="75" rx="14" ry="5" fill="none" stroke="rgba(17,153,142,0.3)" stroke-width="1" transform="rotate(60 65 75)"/>
        <ellipse cx="65" cy="75" rx="14" ry="5" fill="none" stroke="rgba(17,153,142,0.3)" stroke-width="1" transform="rotate(120 65 75)"/>
        <!-- Apple -->
        <ellipse cx="100" cy="80" rx="8" ry="9" fill="rgba(231,76,60,0.35)"/>
        <path d="M100 71 Q103 67 105 68" stroke="rgba(17,153,142,0.4)" stroke-width="1.5" fill="none"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#pat)"/>
  </svg>
</div>

<!-- HEADER -->
<div class="header">
  <div>
    <div class="header-title">🌿 English Sample Test – Grade 7</div>
    <div class="header-sub">Giáo viên tạo: Ms Mai An ULIS</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <div class="score-live" id="scoreLive">✅ 0 / 21</div>
  </div>
</div>

<!-- PROGRESS -->
<div class="progress-wrap">
  <div class="container" style="padding-top:0;padding-bottom:0">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
    <div class="progress-text" id="progressText">Đã trả lời: 0 / 21 câu</div>
  </div>
</div>

<!-- MAIN QUIZ -->
<div class="container" id="quizContainer"></div>

<!-- NAME MODAL -->
<div class="modal-overlay" id="nameModal">
  <div class="modal-box">
    <div style="font-size:2rem">📝</div>
    <div class="modal-title">Nhập tên của bạn</div>
    <div class="modal-sub">Để xem kết quả cá nhân hoá, hãy nhập tên bạn nhé!</div>
    <input class="modal-input" id="nameInput" type="text" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="40"/>
    <div class="err-msg" id="nameErr">⚠️ Vui lòng nhập tên của bạn!</div>
    <br>
    <button class="btn-modal" onclick="submitName()">🎯 XEM KẾT QUẢ</button>
  </div>
</div>

<!-- RESULT MODAL -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-box">
    <div class="result-emoji" id="resEmoji">🌟</div>
    <div class="result-name" id="resName"></div>
    <div class="result-score" id="resScore"></div>
    <div class="result-label" id="resLabel"></div>
    <img class="result-meme" id="resMeme" src="" alt="result gif"/>
    <div class="result-msg" id="resMsg"></div>
    <button class="btn-retry" onclick="retryQuiz()">🔄 Làm lại bài</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  QUESTION DATA
// ═══════════════════════════════════════════════════════
const allQ = [
  {
    id:1, sec:"🔊 PHÁT ÂM",
    desc:"Chọn từ có phần gạch chân phát âm KHÁC với ba từ còn lại.",
    q:"Câu 1:",
    ans:[
      {h:"c<u>y</u>cle",v:"cycle"},
      {h:"simpl<u>y</u>",v:"simply"},
      {h:"s<u>y</u>mbol",v:"symbol"},
      {h:"luck<u>y</u>",v:"lucky"}
    ],
    cor:"cycle",
    expl:`<div class="expl-step"><strong>1. Phân tích phát âm chữ "<u>y</u>" trong từng từ:</strong><br>
• <span class='p-word'>cycle</span> <span class='p-phonetic'>/ˈsaɪkəl/</span>: chữ <u>y</u> đọc là <span class='p-mean'>/aɪ/</span> — giống âm "ai" dài<br>
• <span class='p-word'>simply</span> <span class='p-phonetic'>/ˈsɪmpli/</span>: chữ <u>y</u> đọc là <span class='p-mean'>/i/</span> — giống "ee" ngắn<br>
• <span class='p-word'>symbol</span> <span class='p-phonetic'>/ˈsɪmbəl/</span>: chữ <u>y</u> đọc là <span class='p-mean'>/ɪ/</span> — i ngắn<br>
• <span class='p-word'>lucky</span> <span class='p-phonetic'>/ˈlʌki/</span>: chữ <u>y</u> đọc là <span class='p-mean'>/i/</span> — giống "ee" ngắn</div>
<div class="expl-step"><strong>2. Tại sao <span class='hl-green'>A. cycle</span> đúng?</strong><br>
Trong <span class='p-word'>cycle</span>, chữ "y" là nguyên âm duy nhất của âm tiết được nhấn → đọc là <span class='p-phonetic'>/aɪ/</span>.<br>
Trong <span class='hl-red'>simply, symbol, lucky</span>: chữ "y" cuối từ hoặc không nhấn → đọc là <span class='p-phonetic'>/i/</span> hoặc <span class='p-phonetic'>/ɪ/</span>.</div>
<div class="vi-translate">🇻🇳 Quy tắc: "y" ở giữa từ (âm tiết nhấn) → /aɪ/. "y" cuối từ → /i/. <b>cycle /aɪ/</b> khác với simply, symbol, lucky /i/ hoặc /ɪ/.</div>`
  },
  {
    id:2, sec:"🔊 PHÁT ÂM",
    desc:"Chọn từ có phần gạch chân phát âm KHÁC với ba từ còn lại.",
    q:"Câu 2:",
    ans:[
      {h:"condi<u>tion</u>",v:"condition"},
      {h:"atten<u>tion</u>",v:"attention"},
      {h:"addi<u>tion</u>",v:"addition"},
      {h:"ques<u>tion</u>",v:"question"}
    ],
    cor:"question",
    expl:`<div class="expl-step"><strong>1. Phân tích phát âm phần gạch chân "-tion":</strong><br>
• <span class='p-word'>condition</span> <span class='p-phonetic'>/kənˈdɪʃən/</span>: <u>tion</u> → <span class='p-mean'>/ʃən/</span><br>
• <span class='p-word'>attention</span> <span class='p-phonetic'>/əˈtenʃən/</span>: <u>tion</u> → <span class='p-mean'>/ʃən/</span><br>
• <span class='p-word'>addition</span> <span class='p-phonetic'>/əˈdɪʃən/</span>: <u>tion</u> → <span class='p-mean'>/ʃən/</span><br>
• <span class='p-word'>question</span> <span class='p-phonetic'>/ˈkwɛstʃən/</span>: <u>tion</u> → <span class='p-mean'>/tʃən/</span> ← KHÁC!</div>
<div class="expl-step"><strong>2. Tại sao <span class='hl-green'>D. question</span> đúng?</strong><br>
Hậu tố <span class='p-word'>-tion</span> thường đọc là <span class='p-phonetic'>/ʃən/</span>.<br>
Nhưng trong <span class='p-word'>question</span>, trước "-tion" có chữ "s" tạo thành tổ hợp âm <span class='p-phonetic'>/tʃ/</span>, nên "-tion" đọc là <span class='p-phonetic'>/tʃən/</span>.<br>
<span class='hl-red'>condition, attention, addition</span> đều đọc là <span class='p-phonetic'>/ʃən/</span> → giống nhau.</div>
<div class="vi-translate">🇻🇳 Lưu ý: -tion thường đọc /ʃən/, nhưng trong "question" thì đọc /tʃən/ — đây là ngoại lệ cần nhớ!</div>`
  },
  {
    id:3, sec:"🎵 TRỌNG ÂM",
    desc:"Chọn từ có trọng âm chính rơi vào vị trí KHÁC với ba từ còn lại.",
    q:"Câu 3:",
    ans:[
      {h:"traffic",v:"traffic"},
      {h:"firework",v:"firework"},
      {h:"turkey",v:"turkey"},
      {h:"perform",v:"perform"}
    ],

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

//  AUDIO (Web Audio API)
// ═══════════════════════════════════════════════════════
const ctx = new (window.AudioContext||window.webkitAudioContext)();

function playCorrect(){
  const freqs=[523,659,784,1047];
  freqs.forEach((f,i)=>{
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=f;o.type='sine';
    g.gain.setValueAtTime(0,ctx.currentTime+i*0.1);
    g.gain.linearRampToValueAtTime(0.18,ctx.currentTime+i*0.1+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.1+0.22);
    o.start(ctx.currentTime+i*0.1);
    o.stop(ctx.currentTime+i*0.1+0.25);
  });
}

function playWrong(){
  const o=ctx.createOscillator();
  const g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);
  o.type='sawtooth';
  o.frequency.setValueAtTime(220,ctx.currentTime);
  o.frequency.linearRampToValueAtTime(110,ctx.currentTime+0.25);
  g.gain.setValueAtTime(0.18,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
  o.start(ctx.currentTime);o.stop(ctx.currentTime+0.32);
}

      top:-20px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${6+Math.random()*10}px;
      height:${6+Math.random()*10}px;
      border-radius:${Math.random()>0.5?'50%':'2px'};
      animation-duration:${0.9+Math.random()*1.4}s;
      animation-delay:${Math.random()*0.4}s;
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}

// ═══════════════════════════════════════════════════════
//  BUILD QUIZ
// ═══════════════════════════════════════════════════════
function buildQuiz(){
  shuffled = allQ.map(q=>({...q, shuffledAns: shuffle(q.ans)}));
  const container = document.getElementById('quizContainer');
  container.innerHTML='';
  answered = new Array(allQ.length).fill(false);
  correctCount=0;
  updateProgress();

  let lastSec='';
  shuffled.forEach((q,qi)=>{
    if(q.sec!==lastSec){
      const sl=document.createElement('div');
      sl.className='section-label';sl.textContent=q.sec;
      container.appendChild(sl);
      if(q.desc){
        const sd=document.createElement('div');
        sd.className='section-desc';sd.textContent=q.desc;
        container.appendChild(sd);
      }
      lastSec=q.sec;
    }
    const card=document.createElement('div');
    card.className='q-card';card.id=`card-${qi}`;
    
    let signHTML='';
    if(q.hasSign){
      signHTML=`<div class="sign-wrap">
        <div class="no-park"><span>P</span></div>
      </div>`;
    }

    card.innerHTML=`
      <div class="q-number">Câu hỏi ${q.id} / 21</div>
      <div class="q-text">${q.q}</div>
      ${signHTML}
      <div class="answers-grid" id="grid-${qi}">
        ${q.shuffledAns.map((a,ai)=>`
          <button class="ans-btn" id="btn-${qi}-${ai}" onclick="selectAnswer(${qi},'${a.v.replace(/'/g,"\\'")}',${ai})">
            ${a.h}
          </button>
        `).join('')}
      </div>
      <div class="expl-box" id="expl-${qi}">
        <div class="expl-title">💡 GIẢI THÍCH CHI TIẾT</div>
        ${q.expl}
      </div>
    `;
    container.appendChild(card);
  });

  // Submit button
  const sw=document.createElement('div');
  sw.className='submit-wrap';
  sw.innerHTML=`<button class="btn-submit" onclick="openNameModal()">🎯 NỘP BÀI & XEM KẾT QUẢ</button>`;
  container.appendChild(sw);
}

// ═══════════════════════════════════════════════════════
//  SELECT ANSWER
// ═══════════════════════════════════════════════════════
function selectAnswer(qi, val, ai){
  if(answered[qi]) return;
  answered[qi]=true;
  if(ctx.state==='suspended') ctx.resume();

  const q = shuffled[qi];
  const isCorrect = val === q.cor;
  if(isCorrect) correctCount++;

  // Style buttons
  const grid=document.getElementById(`grid-${qi}`);
  const btns=grid.querySelectorAll('.ans-btn');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(q.shuffledAns[i].v===q.cor) b.classList.add('correct');
  });
  if(!isCorrect) btns[ai].classList.add('wrong');

  // Audio + confetti
  if(isCorrect){playCorrect();spawnConfetti();}
  else{playWrong();}

  // Show explanation
  document.getElementById(`expl-${qi}`).classList.add('show');

  updateProgress();
}

// ═══════════════════════════════════════════════════════
//  PROGRESS
// ═══════════════════════════════════════════════════════
function updateProgress(){
  const done=answered.filter(Boolean).length;
  const total=allQ.length;
  const pct=Math.round((done/total)*100);
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressText').textContent=`Đã trả lời: ${done} / ${total} câu`;
  document.getElementById('scoreLive').textContent=`✅ ${correctCount} / ${total}`;
}

// ═══════════════════════════════════════════════════════
//  MODALS
// ═══════════════════════════════════════════════════════
function openNameModal(){
  document.getElementById('nameModal').classList.add('show');
  setTimeout(()=>document.getElementById('nameInput').focus(),200);
}

document.getElementById('nameInput').addEventListener('keydown',e=>{
  if(e.key==='Enter') submitName();
});

function submitName(){
  const inp=document.getElementById('nameInput');
  const err=document.getElementById('nameErr');
  const name=inp.value.trim();
  if(!name){
    inp.classList.add('err');err.classList.add('show');
    setTimeout(()=>{inp.classList.remove('err');},500);
    return;
  }
  err.classList.remove('show');
  document.getElementById('nameModal').classList.remove('show');
  showResult(name);
}

function showResult(name){
  const total=allQ.length;
  const pct=correctCount/total;

  let emoji,msg,meme;
  if(pct>=1){
    emoji='🏆';
    msg=`🌟 XUẤT SẮC TUYỆT ĐỐI! ${name} là thiên tài đích thực!`;
    meme='https://media.giphy.com/media/3oz8xAFtqoOUUrsh7W/giphy.gif';
  } else if(pct>=0.8){
    emoji='🎉';
    msg=`🎊 GIỎI LẮM! ${name} đã làm rất tốt! Cố gắng hơn nữa nhé!`;
    meme='https://media.giphy.com/media/26u4lOMA8JKSnL9Uk/giphy.gif';
  } else if(pct>=0.6){
    emoji='👍';
    msg=`💪 KHÁ ĐÓ! ${name} đã qua ngưỡng! Ôn thêm để giỏi hơn nào!`;
    meme='https://media.giphy.com/media/QBd2kLB5qDmysEXre9/giphy.gif';
  } else {
    emoji='😢';
    msg=`🌱 CỐ LÊN ${name}! Ôn lại bài và thử lần nữa nhé! Bạn làm được!`;
    meme='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';
  }

  document.getElementById('resEmoji').textContent=emoji;
  document.getElementById('resName').textContent=name;
  document.getElementById('resScore').textContent=`${correctCount} / ${total}`;
  document.getElementById('resLabel').textContent=`Tỉ lệ đúng: ${Math.round(pct*100)}%`;
  document.getElementById('resMsg').textContent=msg;
  document.getElementById('resMeme').src=meme;
  document.getElementById('resultModal').classList.add('show');

  if(pct>=1) spawnConfetti();
}

function retryQuiz(){
  document.getElementById('resultModal').classList.remove('show');
  document.getElementById('nameInput').value='';
  window.scrollTo({top:0,behavior:'smooth'});
  buildQuiz();
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
buildQuiz();
</script>
