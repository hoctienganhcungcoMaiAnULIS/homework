        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; }
        body {

            background-size: 400% 400%;

            color: #2d3436;
            min-height: 100vh;

            -webkit-tap-highlight-color: transparent;

        @keyframes gradientMove {

            100% { background-position: 0% 50%; }

        /* QUESTION CARDS (GLASSMORPHISM) */

            border: 2px solid rgba(255, 255, 255, 0.9);

        /* 3D BUTTONS (BLOOKET STYLE) */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }

        .opt-btn {
            background: #ffffff; border: 2px solid #dfe6e9; border-radius: 18px;
            padding: 18px 20px; font-size: 1.1rem; font-weight: 700; color: #2d3436;
            text-align: center; cursor: pointer; transition: all 0.15s ease;
            box-shadow: 0 6px 0 #b2bec3; position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .opt-btn:hover:not(:disabled) { transform: scale(1.03) translateY(-2px); border-color: #74b9ff; box-shadow: 0 8px 0 #0984e3; color: #0984e3; }
        .opt-btn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0px 0 #b2bec3; }
        .opt-btn:disabled { cursor: default; }

        /* RESULT STATES */
        .opt-btn.correct { background: #00D26A !important; border-color: #00b894 !important; color: white !important; box-shadow: 0 6px 0 #009432 !important; font-weight: 800; transform: translateY(0); }

        .opt-btn.wrong { background: #FF4757 !important; border-color: #ff6b81 !important; color: white !important; box-shadow: 0 6px 0 #c0392b !important; animation: shake 0.4s; }

        .hl-green { color: #00D26A; font-weight: 900; background: rgba(0, 210, 106, 0.1); padding: 2px 5px; border-radius: 5px;}

        .modal-btn {

<script>
// WEB AUDIO API LÀM ÂM THANH TƯƠNG TÁC (KHÔNG DÙNG LINK NGOÀI)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playDing() {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Note A5
    osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // Slide to A6
    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}
function playBuzz() {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
}

// CONFETTI HIỆU ỨNG (JS THUẦN TẠO CANVAS TRÊN MÀN HÌNH)
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let particles = [];
function fireConfetti(x, y) {
    const colors = ['#00D26A', '#FFD700', '#FF4757', '#0984e3', '#fdcb6e'];
    for (let i = 0; i < 40; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 1) * 15,
            size: Math.random() * 8 + 4, color: colors[Math.floor(Math.random() * colors.length)],
            life: 1, lifeDecay: Math.random() * 0.02 + 0.01
        });
    }
}
function loopConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        p.vy += 0.5; // gravity
        p.x += p.vx; p.y += p.vy; p.life -= p.lifeDecay;
        if (p.life <= 0) { particles.splice(i, 1); i--; continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(loopConfetti);
}
loopConfetti();
window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

// TẠO BACKGROUND BAY BAY
const emojis = ['🌱', '🌍', '🦋', '♻️', '☀️', '💧', '🍃', '🌼'];
const bgContainer = document.getElementById('bg-elements');
for(let i=0; i<15; i++) {
    let el = document.createElement('div'); el.className = 'float-item';
    el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (Math.random() * 10 + 10) + 's';
    el.style.animationDelay = (Math.random() * 5) + 's';
    bgContainer.appendChild(el);
}

    <b>2. Dịch câu hỏi:</b> Tìm từ có âm "a" phát âm khác biệt.<br>

    <b>4. Tại sao sai:</b> Các đáp án còn lại sai vì chữ "a" đều được phát âm là <span class='hl-red'>/æ/</span>.</div>`},
    
    {q:"2. ", opts:["di<u>sp</u>lay","<u>sp</u>ecial","<u>sp</u>ort","cu<u>st</u>omer"], ans:3,

    {sec:"B. VOCABULARY & GRAMMAR", ex:"Ex3. Choose the best answer A, B, C, or D.", q:"12. My brother said via the phone that he _______ Sydney for a tour of the world.", opts:["is leaving","would leave","leaves","may leave"], ans:1,

    • <span class='p-word'>would leave</span>: <span class='p-mean'>sẽ rời đi (quá khứ của will leave)</span><br>

    <div class='expl-details'><b>1. Phân tích 4 đáp án:</b><br>
    • <span class='p-word'>holography</span>: <span class='p-mean'>kỹ thuật tạo ảnh toàn ký 3D</span><br>
    • <span class='p-word'>multimedia</span>: <span class='p-mean'>đa phương tiện</span><br>
    • <span class='p-word'>video-con-ferencing</span>: <span class='p-mean'>hội nghị qua video</span><br>
    • <span class='p-word'>face-to-face</span>: <span class='p-mean'>trực tiếp (mặt đối mặt)</span><br>
    <b>2. Tại sao đúng:</b> Chọn <span class='hl-green'>face-to-face</span> vì hành động "shaking hands" (bắt tay) đòi hỏi sự tiếp xúc vật lý, chỉ có thể diễn ra khi hai người gặp nhau <span class='p-grammar'>trực tiếp</span>.<br>
    <b>3. Tại sao sai:</b> Các phương án còn lại (holography, video) đều là <span class='hl-red'>giao tiếp ảo/từ xa</span>, không thể thực hiện hành động bắt tay thực sự.</div>`},

    {q:"20. The ground began to _______ when the earthquake occurred.", opts:["shake","litter","parade","dump"], ans:0, 
    expl:`<div class='vi-translation'>Dịch: Mặt đất bắt đầu rung lắc khi trận động đất xảy ra.</div>
    <div class='expl-details'><b>1. Phân tích 4 đáp án:</b><br>
    • <span class='p-word'>shake</span>: <span class='p-mean'>rung, lắc</span><br>
    • <span class='p-word'>litter</span>: <span class='p-mean'>xả rác</span><br>

    <b>2. Tại sao đúng:</b> Chọn <span class='hl-green'>shake</span>. Khi có "earthquake" (động đất), hiện tượng vật lý hiển nhiên là mặt đất sẽ bị <span class='p-grammar'>rung lắc</span>.<br>

    {q:"21. Virtual Reality (VR) is the technology that places the user in a(n) _______ environment through a head-mounted device.", opts:["real","virtual","instant","private"], ans:1, 
    expl:`<div class='vi-translation'>Dịch: Thực tế ảo (VR) là công nghệ đặt người dùng vào một môi trường ảo thông qua một thiết bị đeo trên đầu.</div>
    <div class='expl-details'><b>1. Phân tích 4 đáp án:</b><br>
    • <span class='p-word'>real</span>: <span class='p-mean'>thực tế</span><br>
    • <span class='p-word'>virtual</span>: <span class='p-mean'>ảo</span><br>
    • <span class='p-word'>instant</span>: <span class='p-mean'>ngay lập tức</span><br>
    • <span class='p-word'>private</span>: <span class='p-mean'>riêng tư</span><br>
    <b>2. Tại sao đúng:</b> Chọn <span class='hl-green'>virtual</span>. Dựa vào manh mối ngay ở đầu câu "Virtual Reality" (Thực tế ảo), thì môi trường mà nó tạo ra chắc chắn phải là <span class='p-grammar'>môi trường ảo</span> (virtual environment).<br>
    <b>3. Tại sao sai:</b> Từ "real" (thật) <span class='hl-red'>trái ngược hoàn toàn</span> với bản chất của VR. Các từ còn lại không có ý nghĩa liên quan đến công nghệ này.</div>`},

    {sec:"CLOSEST IN MEANING", ex:"Choose the word CLOSEST in meaning to the underlined word.", q:"22. She can do telepathy? <u>You're kidding!</u> It's impossible.", opts:["I don't believe it.","You're a kid.","She can do telepathy.","It doesn't work."], ans:0, 
    expl:`<div class='vi-translation'>Dịch: Cô ấy có thể dùng thần giao cách cảm á? Bạn đùa tôi à! Chuyện đó là không thể.</div>
    <div class='expl-details'><b>1. Phân tích 4 đáp án:</b><br>
    • <span class='p-word'>I don't believe it.</span>: <span class='p-mean'>Tôi không tin điều đó.</span><br>
    • <span class='p-word'>You're a kid.</span>: <span class='p-mean'>Bạn là một đứa trẻ. (Dịch word-by-word sai)</span><br>
    • <span class='p-word'>She can do telepathy.</span>: <span class='p-mean'>Cô ấy có thể dùng thần giao cách cảm.</span><br>
    • <span class='p-word'>It doesn't work.</span>: <span class='p-mean'>Nó không hoạt động.</span><br>
    <b>2. Tại sao đúng:</b> Chọn <span class='hl-green'>I don't believe it.</span>. Thành ngữ giao tiếp "You're kidding!" (Bạn đùa đấy à) được dùng khi bạn <span class='p-grammar'>rất ngạc nhiên và không tin vào những gì người khác vừa nói</span>.<br>
    <b>3. Tại sao sai:</b> Các đáp án khác <span class='hl-red'>sai hoàn toàn về chức năng giao tiếp</span> và nghĩa bóng của cụm từ.</div>`},

    {sec:"OPPOSITE IN MEANING", ex:"Choose the word OPPOSITE in meaning to the underlined word.", q:"23. Remember to <u>turn off</u> lights and electronic devices when they are not in use to conserve energy.", opts:["switch on","turn down","go over","go away"], ans:0, 
    expl:`<div class='vi-translation'>Dịch: Hãy nhớ TẮT đèn và các thiết bị điện tử khi không sử dụng để tiết kiệm năng lượng. (Tìm từ TRÁI NGHĨA)</div>
    <div class='expl-details'><b>1. Phân tích 4 đáp án:</b><br>
    • <span class='p-word'>switch on</span>: <span class='p-mean'>bật lên</span><br>
    • <span class='p-word'>turn down</span>: <span class='p-mean'>vặn nhỏ (âm thanh) / từ chối</span><br>
    • <span class='p-word'>go over</span>: <span class='p-mean'>kiểm tra kĩ lưỡng</span><br>
    • <span class='p-word'>go away</span>: <span class='p-mean'>rời đi</span><br>
    <b>2. Tại sao đúng:</b> Chọn <span class='hl-green'>switch on</span>. Đề bài yêu cầu tìm từ <span class='p-grammar'>TRÁI NGHĨA (Opposite)</span>. Trái với "turn off" (tắt) chính là "switch on" (bật).<br>
    <b>3. Tại sao sai:</b> Các Phrasal verbs (cụm động từ) còn lại <span class='hl-red'>không mang nghĩa đối lập</span> với việc tắt thiết bị điện.</div>`},

    {q:"24. The store decided to <u>reduce</u> the prices of summer clothing to attract more customers.", opts:["increase","decrease","diminish","cut down"], ans:0, 
    expl:`<div class='vi-translation'>Dịch: Cửa hàng quyết định GIẢM giá quần áo mùa hè để thu hút thêm khách hàng. (Tìm từ TRÁI NGHĨA)</div>
    <div class='expl-details'><b>1. Phân tích 4 đáp án:</b><br>
    • <span class='p-word'>increase</span>: <span class='p-mean'>tăng lên</span><br>
    • <span class='p-word'>decrease</span>: <span class='p-mean'>giảm xuống (Đồng nghĩa)</span><br>
    • <span class='p-word'>diminish</span>: <span class='p-mean'>làm suy giảm, bé đi</span><br>
    • <span class='p-word'>cut down</span>: <span class='p-mean'>cắt giảm</span><br>
    <b>2. Tại sao đúng:</b> Chọn <span class='hl-green'>increase</span>. Từ "reduce" mang nghĩa là cắt giảm. Đề yêu cầu tìm từ <span class='p-grammar'>TRÁI NGHĨA</span>, do đó đáp án phải mang nghĩa "tăng lên".<br>
    <b>3. Tại sao sai:</b> Ba đáp án B, C, D đều mang nét nghĩa là làm cho ít đi/nhỏ đi (đồng nghĩa), <span class='hl-red'>không đáp ứng yêu cầu tìm từ trái nghĩa</span> của đề bài.</div>`},

    {sec:"LOGICAL TEXT ORDER", ex:"Ex 5: Put the sentences (a-d) in the correct order to make a logical text.", q:"<strong>25.</strong><br>a. They are always fond of freshness, and have the habit of going shopping every day to prepare meals for the whole family.<br>b. However, they often complain about the freshness of seafood there.<br>c. Some young ladies love shopping at supermarkets.<br>d. Despite the changes in society, most of Vietnamese mothers and grandmothers still go to the traditional markets for daily fresh products.", opts:["b-c-d-a","c-b-a-d","d-a-c-b","a-b-c-d"], ans:2, 
    expl:`<div class='vi-translation'>Dịch: Sắp xếp các câu thành đoạn văn logic về thói quen đi chợ.</div>
    <div class='expl-details'><b>1. Phân tích:</b><br>
    • (d) Giới thiệu chủ đề chung: Các bà, các mẹ vẫn thích đi chợ truyền thống.<br>
    • (a) Giải thích lý do cho (d): Vì họ thích sự tươi mới mỗi ngày ("They" thay thế cho mothers & grandmothers).<br>
    • (c) Đổi hướng sang nhóm đối tượng khác: Một vài phụ nữ trẻ thích đi siêu thị.<br>
    • (b) Nêu sự tương phản cho (c): Tuy nhiên, họ ("they" thay thế cho young ladies) lại phàn nàn đồ siêu thị không tươi.<br>
    <b>2. Tại sao đúng:</b> Chuỗi <span class='hl-green'>d-a-c-b</span> liên kết chặt chẽ <span class='p-grammar'>sự nối tiếp đại từ "They"</span> và tính logic tương phản giữa chợ truyền thống và siêu thị.<br>
    <b>3. Tại sao sai:</b> Các chuỗi khác sai vì <span class='hl-red'>làm đứt gãy sự liên kết đại từ</span> (They) và phá vỡ mạch suy nghĩ của tác giả.</div>`},

    {q:"<strong>26.</strong><br>a. Most people are worried about the future of our planet.<br>b. Most people believe that human activity, such as burning fossil fuels, has caused the Earth to warm up.<br>c. Human activity has not only caused change but also caused permanent damage to the planet.<br>d. There is clear evidence that the Earth has been getting warmer.", opts:["b-c-d-a","c-b-a-d","d-a-c-b","a-d-b-c"], ans:3, 
    expl:`<div class='vi-translation'>Dịch: Sắp xếp các câu thành đoạn văn logic về biến đổi khí hậu toàn cầu.</div>
    <div class='expl-details'><b>1. Phân tích:</b><br>
    • (a) Mở đoạn: Nhận định bao quát (Mọi người đều lo lắng cho Trái Đất).<br>
    • (d) Đưa ra bằng chứng: Rõ ràng Trái Đất đang ấm lên.<br>
    • (b) Nêu nguyên nhân: Việc ấm lên đó là do con người (human activity).<br>
    • (c) Câu chốt mạnh mẽ: Nhấn mạnh lặp lại từ khóa "Human activity" không chỉ gây thay đổi mà còn phá hoại vĩnh viễn.<br>
    <b>2. Tại sao đúng:</b> Chuỗi <span class='hl-green'>a-d-b-c</span> đi từ <span class='p-grammar'>tổng quan đến chi tiết cụ thể</span> (Lo lắng -> Bằng chứng -> Nguyên nhân -> Kết luận nhấn mạnh).<br>
    <b>3. Tại sao sai:</b> Các phương án khác <span class='hl-red'>sai cấu trúc diễn dịch</span>, đưa hệ quả hoặc nguyên nhân lên trước khi giới thiệu vấn đề.</div>`}
];

// XÁO TRỘN ĐÁP ÁN MỖI LẦN TẢI TRANG
const QS = JSON.parse(JSON.stringify(rawQS)); // Clone to avoid modifying original
QS.forEach(q => {
    let correctText = q.opts[q.ans];
    for (let i = q.opts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [q.opts[i], q.opts[j]] = [q.opts[j], q.opts[i]];
    }
    q.ans = q.opts.indexOf(correctText);
});

let userAnswers = new Array(QS.length).fill(null);
let isSubmitted = false;

document.addEventListener('DOMContentLoaded', () => {
    renderQuiz();

    document.getElementById('quiz-wrap').addEventListener('click', (e) => {
        const btn = e.target.closest('.opt-btn');
        if (!btn || isSubmitted) return;

        const qIdx = parseInt(btn.getAttribute('data-qidx'));
        const optIdx = parseInt(btn.getAttribute('data-optidx'));
        
        if (userAnswers[qIdx] !== null) return;

        userAnswers[qIdx] = optIdx;
        const cAns = QS[qIdx].ans;
        const card = document.getElementById(`q-${qIdx}`);
        const btns = card.querySelectorAll('.opt-btn');
        
        btns.forEach(b => {
            b.disabled = true;
            b.style.cursor = 'default';
        });

        if(optIdx === cAns) {
            btn.classList.add('correct');
            playDing();
            let rect = btn.getBoundingClientRect();
            fireConfetti(rect.left + rect.width/2, rect.top);
        } else {
            btn.classList.add('wrong');
            btns[cAns].classList.add('correct');
            playBuzz();
        }

        document.getElementById(`expl-${qIdx}`).classList.add('show');
        updateProg();
    });

    document.getElementById('btnOpenSubmit').addEventListener('click', openSubmit);
    document.getElementById('btnDoSubmit').addEventListener('click', doSubmit);
    document.getElementById('btnReload').addEventListener('click', () => location.reload());
    
    // Ẩn lỗi khi người dùng nhập tên
    document.getElementById('nameInp').addEventListener('input', () => {
        document.getElementById('nameErr').style.display = 'none';
    });
});

function renderQuiz() {
    const container = document.getElementById('quiz-wrap');
    let html = '';
    let currSec = '', currEx = '';

    QS.forEach((q, idx) => {
        if(q.sec && q.sec !== currSec) {
            html += `<div class="sec-title">🎯 ${q.sec}</div><br>`;
            currSec = q.sec;
        }
        if(q.ex && q.ex !== currEx) {
            html += `<div class="ex-title">📖 ${q.ex}</div>`;
            currEx = q.ex;
        }

        html += `
        <div class="q-card" id="q-${idx}">
            <div class="q-text">${q.q}</div>
            <div class="options-grid">
                ${q.opts.map((opt, optIdx) => `
                    <button type="button" class="opt-btn" data-qidx="${idx}" data-optidx="${optIdx}">
                        ${opt}
                    </button>
                `).join('')}
            </div>
            <div class="expl-box" id="expl-${idx}">
                ${q.expl}
            </div>
        </div>`;
    });
    container.innerHTML = html;
    updateProg();
}

function updateProg() {
    const answered = userAnswers.filter(a => a !== null).length;
    document.getElementById('progText').innerText = `Năng lượng hoàn thành: ${answered} / ${QS.length} ⚡`;
    document.getElementById('progFill').style.width = `${(answered / QS.length) * 100}%`;
}

function openSubmit() {
    const answered = userAnswers.filter(a => a !== null).length;
    if(answered < QS.length) {
        if(!confirm(`Úi! Bạn mới làm ${answered}/${QS.length} câu. Bạn có chắc chắn muốn nộp bài sớm không?`)) return;
    }
    document.getElementById('nameModal').classList.add('active');
    document.getElementById('nameInp').focus();
}

function doSubmit() {
    const name = document.getElementById('nameInp').value.trim();
    if(!name) {
        document.getElementById('nameErr').style.display = 'block';
        // Hiệu ứng rung lắc nhẹ khi lỗi
        const box = document.querySelector('#nameModal .modal-content');
        box.style.animation = 'none'; box.offsetHeight; box.style.animation = 'shake 0.4s';
        playBuzz();
        return;
    }
    
    document.getElementById('nameModal').classList.remove('active');
    isSubmitted = true;
    
    let score = 0;
    QS.forEach((q, i) => {
        if(userAnswers[i] === q.ans) score++;
        
        const btns = document.getElementById(`q-${i}`).querySelectorAll('.opt-btn');
        btns.forEach(b => { b.disabled = true; b.style.cursor = 'default'; });
        
        if(userAnswers[i] === null) {
            btns[q.ans].classList.add('correct');
            document.getElementById(`expl-${i}`).classList.add('show');
        }
    });
    
    document.getElementById('subArea').style.display = 'none';
    showResult(name, score);
    playDing();
    setTimeout(() => { playDing(); fireConfetti(window.innerWidth/2, window.innerHeight/2); }, 300);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showResult(name, score) {
    const modal = document.getElementById('resModal');
    document.getElementById('resName').innerText = `Tuyệt vời, ${name}! 🌟`;
    document.getElementById('resScore').innerText = `${score} / ${QS.length}`;
    
    const pct = score / QS.length;
    let cmt = "", gif = "";
    if(pct === 1) { 
        cmt = "ĐỈNH CỦA CHÓP! XUẤT SẮC TUYỆT ĐỐI! 👑"; 
        gif = "https://media.giphy.com/media/xT0GqssRweIhlz209i/giphy.gif"; 
    }
    else if(pct >= 0.8) { 
        cmt = "Quá giỏi! Gần như hoàn hảo luôn! 🔥"; 
        gif = "https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif"; 
    }
    else if(pct >= 0.6) { 
        cmt = "Khá tốt! Đập tay cái nào! ✋😉"; 
        gif = "https://media.giphy.com/media/3o7TKRwpztlIADD2tO/giphy.gif"; 
    }
    else { 
        cmt = "Hơi tiếc một chút! Hãy ôn tập kĩ giải thích và thử lại nhé! 💪🥺"; 
        gif = "https://media.giphy.com/media/l41YkxvU8c7J7Bba0/giphy.gif"; 
    }
    
    document.getElementById('resCmt').innerText = cmt;
    document.getElementById('resGif').src = gif;
    modal.classList.add('active');
}
</script>
