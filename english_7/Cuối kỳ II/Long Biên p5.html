<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Reading Challenge</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap');

        :root {
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --primary-pastel: #ffb6b9;
            --secondary-pastel: #fae3d9;
            --accent-pastel: #bbded6;
            --text-dark: #2d3436;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }

        body {
            background: linear-gradient(-45deg, #ffb6b9, #fae3d9, #bbded6, #8ac6d1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Background Emojis */
        .bg-shapes {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; overflow: hidden; pointer-events: none;
        }
        .emoji-float {
            position: absolute; font-size: 3rem; animation: floatUp linear infinite; opacity: 0.6;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-20vh) rotate(360deg); }
        }

        /* Header */
        header {
            position: absolute; top: 10px; left: 20px; z-index: 10;
            background: var(--glass-bg); backdrop-filter: blur(10px);
            padding: 5px 15px; border-radius: 20px; border: 1px solid var(--glass-border);
            font-size: 0.9rem; font-weight: 600; color: #555;
            box-shadow: var(--glass-shadow);
        }

        /* Màn hình khóa Password - Tone sur tone */
        #passwordModal {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(20px);
        }
        .pw-card {
            background: var(--glass-bg);
            border: 2px solid white; border-radius: 25px; padding: 48px 40px 40px; 
            max-width: 440px; width: 93%; text-align: center; position: relative; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .pw-crest { font-size: 4rem; margin-bottom: 8px; display: block; animation: floatIcon 3s ease-in-out infinite; }
        @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .pw-title { font-size: 1.6rem; font-weight: 800; color: #ff6b81; margin-bottom: 6px; letter-spacing: 1px; }
        .pw-sub   { font-size: 1rem; color: #555; margin-bottom: 24px; font-weight: 600; }
        .pw-input {
            width: 100%; padding: 13px 20px; border-radius: 12px;
            border: 2px solid white; background: rgba(255,255,255,0.7);
            color: #2d3436; font-size: 1.2rem; font-weight: bold;
            outline: none; letter-spacing: 5px; text-align: center; transition: all .3s;
        }
        .pw-input:focus { border-color: #ff6b81; box-shadow: 0 0 15px rgba(255, 107, 129, 0.3); }
        .pw-input.error { border-color: #ff4757; background: #ffeaa7; animation: shake .4s ease; }
        .pw-input::placeholder { color: #aaa; letter-spacing: 1px; font-weight: normal; font-size: 1rem; }
        .pw-btn {
            width: 100%; padding: 14px; margin-top: 20px; border-radius: 15px; border: none;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #d63031; font-size: 1.1rem; font-weight: 800;
            cursor: pointer; letter-spacing: 1px; transition: transform .2s, box-shadow .2s;
            box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
        }
        .pw-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255, 154, 158, 0.6); }
        .pw-err { color: #ff4757; font-size: 0.95rem; margin-top: 15px; display: none; font-weight: 800; background: rgba(255,255,255,0.8); padding: 5px; border-radius: 8px;}

        /* Split Screen Layout */
        .container {
            display: none; /* Ẩn đi chờ nhập pass */
            width: 100%; height: 100vh; padding: 60px 20px 20px 20px; gap: 20px;
        }
        .pane {
            flex: 1; height: 100%; overflow-y: auto;
            background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 25px;
            box-shadow: var(--glass-shadow); padding: 25px;
        }
        .pane::-webkit-scrollbar { width: 8px; }
        .pane::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }

        /* Reading Section */
        .passage-block { margin-bottom: 40px; padding-bottom: 20px; border-bottom: 2px dashed rgba(255,255,255,0.8); }
        .passage-block:last-child { border-bottom: none; }
        .passage-text { font-size: 1.15rem; line-height: 1.8; margin-bottom: 15px; text-align: justify; }
        .blank { display: inline-block; min-width: 80px; text-align: center; border-bottom: 2px dashed #666; font-weight: bold; color: #555; padding: 0 5px; }
        .blank.filled { border-bottom: 2px solid #28a745; color: #28a745; }
        
        .btn-translate {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            border: none; padding: 8px 15px; border-radius: 15px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.2s; color: #0056b3;
            display: block; margin-top: 10px;
        }
        .btn-translate:hover { transform: scale(1.05); }
        .translation-box {
            background: rgba(255,255,255,0.85); padding: 15px; border-radius: 15px; margin-top: 10px;
            font-style: italic; display: none; border-left: 5px solid #a1c4fd; font-size: 1.1rem; line-height: 1.6;
        }

        /* Glossary Table */
        .glossary { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(255,255,255,0.6); border-radius: 15px; overflow: hidden; }
        .glossary th, .glossary td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .glossary th { background: rgba(255, 182, 185, 0.6); font-weight: bold; color: #d63031;}

        /* Questions Section */
        .question-card {
            background: rgba(255, 255, 255, 0.7); border-radius: 20px; padding: 20px; margin-bottom: 25px;
            border: 1px solid var(--glass-border); box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .q-text { font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; color: #2d3436; }
        .options-grid { display: flex; flex-direction: column; gap: 10px; } 
        
        .btn-option {
            background: rgba(255, 255, 255, 0.9); border: 2px solid transparent; padding: 15px;
            border-radius: 15px; font-size: 1.05rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: left;
        }
        .btn-option:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); border-color: #a1c4fd; }
        .btn-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .btn-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        
        /* System Colors for Explanations */
        .p-word { color: #0056b3; font-weight: bold; }
        .p-mean { color: #d35400; font-weight: bold; }
        .p-grammar { color: #c0392b; text-decoration: underline; font-weight: bold; }
        .hl-green { color: #27ae60; font-weight: bold; }
        .hl-red { color: #c0392b; text-decoration: line-through; font-weight: bold; }
        
        /* Highlight boxes */
        .highlight-translation, .quote-box {
            background-color: #fff3cd; padding: 12px; border-radius: 10px;
            border-left: 5px solid #ffc107; margin-top: 12px; font-size: 1.05rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .expl-title { font-weight: 800; color: #0056b3; display: inline-block; }

        .explanation {
            margin-top: 15px; padding: 18px; background: #fff; border-radius: 15px;
            border-left: 5px solid #28a745; display: none; font-size: 1.05rem; line-height: 1.7;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
        }

        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: translateX(0); } 25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); }
        }

        /* Submit Button & Modal */
        .btn-submit {
            display: block; width: 100%; padding: 15px; margin-top: 30px;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            border: none; border-radius: 20px; font-size: 1.2rem; font-weight: 800; color: white;
            cursor: pointer; box-shadow: 0 10px 20px rgba(161, 140, 209, 0.4); transition: transform 0.2s;
        }
        .btn-submit:hover { transform: scale(1.02); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 25px; text-align: center;
            width: 90%; max-width: 450px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .modal-content input {
            width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #bbded6;
            border-radius: 10px; font-size: 1.1rem; outline: none; text-align: center; font-weight: bold;
        }
        .modal-content input:focus { border-color: #8ac6d1; }
        .score-display { font-size: 3rem; font-weight: 900; color: #28a745; margin: 10px 0; }
        .gif-result { width: 100%; border-radius: 15px; margin-top: 15px; max-height: 250px; object-fit: cover; }
        
        #confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
    </style>
</head>
<body>

    <header>Giáo viên tạo: Ms Mai An ULIS</header>
    
    <div class="bg-shapes" id="bg-shapes"></div>
    <canvas id="confetti"></canvas>

    <div id="passwordModal">
        <div class="pw-card">
            <span class="pw-crest">🔐</span>
            <div class="pw-title">BẢO MẬT BÀI THI</div>
            <div class="pw-sub">Vui lòng nhập mật khẩu để bắt đầu làm bài nhé!</div>
            <input type="password" class="pw-input" id="pwInput" placeholder="Nhập mã..." autocomplete="off" />
            <button class="pw-btn" onclick="checkPassword()">XÁC NHẬN MỞ KHÓA ✨</button>
            <div class="pw-err" id="pwErr">Mật khẩu chưa đúng rồi! Hãy thử lại nhé.</div>
        </div>
    </div>

    <div class="container" id="mainContent">
        <div class="pane left-pane" id="reading-pane">
            </div>

        <div class="pane right-pane" id="questions-pane">
            <button class="btn-submit" onclick="promptSubmit()">🎯 NỘP BÀI TÍNH ĐIỂM & XEM KẾT QUẢ</button>
        </div>
    </div>

    <div class="modal-overlay" id="nameModal">
        <div class="modal-content">
            <h2 style="color: #ff6b81;">Nhập tên của con nhé! 🌟</h2>
            <input type="text" id="studentName" placeholder="Chiến binh tên là...">
            <button class="pw-btn" style="margin-top:5px;" onclick="showResult()">Xem Điểm Nào!</button>
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <h2 id="r-name" style="color: #0056b3;"></h2>
            <div class="score-display" id="r-score"></div>
            <p id="r-comment" style="font-size: 1.2rem; font-weight: 600; color: #555;"></p>
            <img id="r-gif" class="gif-result" src="" alt="Result GIF">
            <button class="pw-btn" style="margin-top:20px; background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); color: #0056b3;" onclick="location.reload()">Làm Lại Lần Nữa 🔄</button>
        </div>
    </div>

<script>
    // System Tone & Emojis
    const emojis = ["⚡", "🌿", "☀️", "🗣️", "🌍", "🎉", "🎶", "📚", "✨"];
    const shapeContainer = document.getElementById('bg-shapes');
    for(let i=0; i<15; i++) {
        let span = document.createElement('span');
        span.className = 'emoji-float';
        span.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        span.style.left = Math.random() * 100 + 'vw';
        span.style.animationDuration = (Math.random() * 10 + 10) + 's';
        span.style.animationDelay = (Math.random() * 5) + 's';
        shapeContainer.appendChild(span);
    }

    // AUDIO SYSTEM
    const reminderAudio = new Audio('https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/export_2rUjepgpwpTxnU6YGv6kmq.mp3');
    const wrongAudio = new Audio('https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/oi-ban-oi.mp3');
    
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playCorrect() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = 800;
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
        oscillator.stop(audioCtx.currentTime + 0.3);
    }

    function playWrong() {
        wrongAudio.currentTime = 0;
        wrongAudio.play();
    }

    function checkPassword() {
        const inp = document.getElementById('pwInput');
        const err = document.getElementById('pwErr');
        // 'MTYxMQ==' là mã Base64 của chuỗi '1611' - giúp bảo mật mã nguồn
        if (btoa(inp.value.trim()) === 'MTYxMQ==') {
            document.getElementById('passwordModal').style.display = 'none';
            const main = document.getElementById('mainContent');
            main.style.display = 'flex';
            reminderAudio.play().catch(e => console.log("Trình duyệt chặn autoplay audio, cần user tương tác"));
        } else {
            inp.classList.remove('error'); void inp.offsetWidth; inp.classList.add('error');
            err.style.display = 'block'; setTimeout(() => inp.classList.remove('error'), 500);
        }
    }
    document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key==='Enter') checkPassword(); });


    // Data Models: Tách riêng từng đoạn nhỏ để có nút dịch riêng
    const passages = [
        {
            id: 'p1',
            text: "There are many sources of energy. Some are renewable, but others may <span id='blank-77' class='blank'>(77) _______</span> in the future. Fossil fuels like coal, oil, and gas are non-renewable and used to produce <span id='blank-78' class='blank'>(78) _______</span>. However, they cause pollution and contribute to climate change.",
            translation: "Có rất nhiều nguồn năng lượng. Một số có thể tái tạo, nhưng những nguồn khác có thể cạn kiệt trong tương lai. Nhiên liệu hóa thạch như than đá, dầu mỏ và khí đốt là không thể tái tạo và được sử dụng để sản xuất điện. Tuy nhiên, chúng gây ô nhiễm và góp phần vào biến đổi khí hậu.",
            glossary: []
        },
        {
            id: 'p1_b',
            text: "Energy <span id='blank-79' class='blank'>(79) _______</span> essential for modern life, so we must find ways to use it efficiently. To protect the environment, we should use more <span id='blank-80' class='blank'>(80) _______</span> such as wind and solar power.",
            translation: "Năng lượng là thiết yếu cho cuộc sống hiện đại, vì vậy chúng ta phải tìm cách sử dụng nó một cách hiệu quả. Để bảo vệ môi trường, chúng ta nên sử dụng nhiều nguồn năng lượng tái tạo hơn như năng lượng gió và mặt trời.",
            glossary: []
        },
        {
            id: 'p1_c',
            text: "Solar panels can <span id='blank-81' class='blank'>(81) _______</span> electricity from sunlight, while wind turbines convert wind into energy. These clean sources are sustainable and widely used in many countries. In some places, wind turbines are built <span id='blank-82' class='blank'>(82) _______</span> open fields to generate power efficiently.",
            translation: "Các tấm pin mặt trời có thể sản xuất điện từ ánh sáng mặt trời, trong khi tua-bin gió chuyển đổi gió thành năng lượng. Những nguồn sạch này mang tính bền vững và được sử dụng rộng rãi ở nhiều quốc gia. Ở một số nơi, tua-bin gió được xây dựng trên những cánh đồng mở để tạo ra điện một cách hiệu quả.",
            glossary: [
                {w: "Source", p: "(n)", m: "Nguồn"}, {w: "Renewable", p: "(adj)", m: "Có thể tái tạo"},
                {w: "Fossil fuel", p: "(n)", m: "Nhiên liệu hóa thạch"}, {w: "Produce", p: "(v)", m: "Sản xuất"},
                {w: "Pollution", p: "(n)", m: "Sự ô nhiễm"}, {w: "Efficiently", p: "(adv)", m: "Một cách hiệu quả"},
                {w: "Sustainable", p: "(adj)", m: "Bền vững"}
            ]
        },
        {
            id: 'p2',
            text: "English is the main language in some countries such as the United States, the United Kingdom, Canada, Australia, and New Zealand. <span id='blank-83' class='blank'>(83) _______</span>, many people around the world learn it for work and travel. Each country has a <span id='blank-84' class='blank'>(84) _______</span> culture.",
            translation: "Tiếng Anh là ngôn ngữ chính ở một số quốc gia như Hoa Kỳ, Vương quốc Anh, Canada, Úc và New Zealand. Tuy nhiên, nhiều người trên khắp thế giới học nó để làm việc và du lịch. Mỗi quốc gia có một nền văn hóa độc đáo.",
            glossary: []
        },
        {
            id: 'p2_b',
            text: "In the United Kingdom, people enjoy tea, while in Australia, surfing is popular. The United States <span id='blank-85' class='blank'>(85) _______</span> its modern cities like New York. English helps people communicate with <span id='blank-86' class='blank'>(86) _______</span> worldwide. Many companies require employees to <span id='blank-87' class='blank'>(87) _______</span>. Learning it opens doors <span id='blank-88' class='blank'>(88) _______</span>.",
            translation: "Ở Vương quốc Anh, mọi người thích uống trà, trong khi ở Úc, lướt sóng rất phổ biến. Hoa Kỳ được biết đến với những thành phố hiện đại như New York. Tiếng Anh giúp mọi người giao tiếp với những người khác trên toàn thế giới. Nhiều công ty yêu cầu nhân viên phải nói tiếng Anh trôi chảy. Học ngôn ngữ này mở ra cánh cửa dẫn đến những cơ hội tốt hơn.",
            glossary: [
                {w: "Communicate", p: "(v)", m: "Giao tiếp"}, {w: "Worldwide", p: "(adv)", m: "Trên toàn cầu"}, 
                {w: "Require", p: "(v)", m: "Yêu cầu"}, {w: "Employee", p: "(n)", m: "Nhân viên"}, 
                {w: "Fluent", p: "(adj)", m: "Trôi chảy"}, {w: "Unique", p: "(adj)", m: "Độc đáo"}
            ]
        },
        {
            id: 'p3',
            text: "A Grade 7 student and his friends <span id='blank-89' class='blank'>(89) _______</span> an idea of organizing a cultural festival to celebrate their local culture. They call it the “Spring Harmony Festival.” Every year, they will choose <span id='blank-90' class='blank'>(90) _______</span> special weekend to hold the event.",
            translation: "Một học sinh lớp 7 và các bạn của cậu ấy có ý tưởng tổ chức một lễ hội văn hóa để tôn vinh văn hóa địa phương. Họ gọi đó là “Lễ hội Hòa âm Mùa xuân”. Mỗi năm, họ sẽ chọn một ngày cuối tuần đặc biệt để tổ chức sự kiện.",
            glossary: []
        },
        {
            id: 'p3_b',
            text: "People who attend the festival <span id='blank-91' class='blank'>(91) _______</span> traditional food, drinks, and decorations different cultures. Those who cannot bring anything will help with organizing performances and guiding visitors <span id='blank-92' class='blank'>(92) _______</span> the festival areas.",
            translation: "Những người tham dự lễ hội nên mang theo thức ăn truyền thống, đồ uống và đồ trang trí từ các nền văn hóa khác nhau. Những người không thể mang theo bất cứ thứ gì sẽ giúp tổ chức các buổi biểu diễn và hướng dẫn du khách đến các khu vực lễ hội.",
            glossary: []
        },
        {
            id: 'p3_c',
            text: "They believe that traditional food and music will help people understand different cultures better. The festival will make the <span id='blank-93' class='blank'>(93) _______</span>, and everyone will feel <span id='blank-94' class='blank'>(94) _______</span>!",

        { id: 96, q: "Why does wind exist?", options: ["Because the Sun heats the Earth unevenly", "Because of wind turbines", "Because it is created by people", "Because of electricity"], correct: "Because the Sun heats the Earth unevenly", 
          expl: `<div class='expl-title'>Dịch câu hỏi:</div> Tại sao lại có gió?<br><br>
          <div class='expl-title'>Phân tích 4 đáp án:</div><br>
          A. Vì Mặt trời làm nóng Trái đất không đồng đều ✅ <span class='hl-green'>Đúng hoàn toàn theo nội dung câu 2 đoạn 1.</span><br>

          <div class='quote-box'>🔍 <b>Dẫn chứng trong bài:</b> "It [Wind] happens because the Sun heats different parts of the Earth unevenly."<br>👉 <b>Dịch:</b> "Gió xảy ra bởi vì Mặt trời làm nóng các phần khác nhau của Trái đất <b style='color:red'>một cách không đồng đều</b>."<br>Từ vựng: <span class='p-word'>unevenly</span> có nghĩa là <span class='p-mean'>không đồng đều</span>.</div>` },

        { id: 97, q: "The word 'produce' in the text is CLOSEST in meaning to", options: ["stop", "create", "destroy", "lose"], correct: "create", 
          expl: `<div class='expl-title'>Dịch câu hỏi:</div> Từ 'produce' trong đoạn văn GẦN NGHĨA NHẤT với từ nào?<br><br>
          <div class='expl-title'>Phân tích 4 đáp án:</div><br>

        { id: 98, q: "The word 'modern' is OPPOSITE in meaning to", options: ["traditional", "amazing", "plentiful", "abundant"], correct: "traditional",

    ];

    let score = 0;
    const totalQ = questions.length;
    let answeredQuestions = new Set();

    // Render Passages (Từng đoạn nhỏ có nút dịch và bảng từ vựng)
    const readingPane = document.getElementById('reading-pane');
    passages.forEach(p => {
        let glossaryHtml = '';
        if (p.glossary && p.glossary.length > 0) {
            glossaryHtml = `
            <table class="glossary">
                <tr><th>Từ vựng</th><th>Loại từ</th><th>Nghĩa tiếng Việt</th></tr>
                ${p.glossary.map(g => `<tr><td><strong>${g.w}</strong></td><td>${g.p}</td><td>${g.m}</td></tr>`).join('')}
            </table>`;
        }

        let html = `<div class="passage-block">
            <div class="passage-text">${p.text}</div>
            <button class="btn-translate" onclick="toggleTranslation('${p.id}')">Mở dịch đoạn này 🌟</button>
            <div id="trans-${p.id}" class="translation-box">${p.translation}</div>
            ${glossaryHtml}
        </div>`;
        readingPane.innerHTML += html;
    });

    // Render Questions (KHÔNG NHÃN A, B, C, D)
    const questionsPane = document.getElementById('questions-pane');
    const submitBtn = questionsPane.innerHTML; // Lấy lại nút Nộp bài
    questionsPane.innerHTML = '';

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    questions.forEach(q => {
        let shuffledOptions = shuffle([...q.options]);
        let optionsHtml = shuffledOptions.map(opt => 
            // Truyền trực tiếp text của option
            `<button class="btn-option" onclick="checkAnswer(this, ${q.id}, '${opt}', '${q.correct}')">${opt}</button>`
        ).join('');

        let html = `<div class="question-card" id="card-${q.id}">
            <div class="q-text">Câu ${q.id}: ${q.q.replace(`(${q.id}) _______`, `____`)}</div>
            <div class="options-grid">${optionsHtml}</div>
            <div class="explanation" id="expl-${q.id}">${q.expl}</div>
        </div>`;
        questionsPane.innerHTML += html;
    });
    questionsPane.innerHTML += submitBtn; // Gắn lại nút Nộp bài

    // Interaction Logic
    window.toggleTranslation = function(id) {
        const box = document.getElementById(`trans-${id}`);
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    window.checkAnswer = function(btn, qId, selected, correct) {
        const card = document.getElementById(`card-${qId}`);
        const buttons = card.querySelectorAll('.btn-option');
        
        // Ngăn chọn lại
        if(answeredQuestions.has(qId)) return;
        answeredQuestions.add(qId);
        
        buttons.forEach(b => b.style.pointerEvents = 'none');

        if (selected === correct) {
            btn.classList.add('correct');
            playCorrect(); // Âm thanh Web Audio API khi đúng
            fireConfetti();
            score++;
            // Điền từ vào chỗ trống bên bài đọc
            const blank = document.getElementById(`blank-${qId}`);
            if(blank) {
                blank.innerHTML = correct;
                blank.classList.add('filled');
            }
        } else {
            btn.classList.add('wrong');
            card.classList.add('shake');
            playWrong(); // Âm thanh Meme "Ôi bạn ơi" khi sai
            // Tự động tìm và bôi xanh đáp án đúng
            buttons.forEach(b => {
                if(b.innerText === correct) b.classList.add('correct');
            });
            setTimeout(() => card.classList.remove('shake'), 500);
        }

        // Hiện giải thích chi tiết
        document.getElementById(`expl-${qId}`).style.display = 'block';
    }

    // Submit Logic
    window.promptSubmit = function() {
        document.getElementById('nameModal').style.display = 'flex';
    }

    window.showResult = function() {
        const nameInput = document.getElementById('studentName').value.trim();
        if(!nameInput) {
            alert("Chiến binh chưa nhập tên kìa!");
            return;
        }
        
        document.getElementById('nameModal').style.display = 'none';
        document.getElementById('resultModal').style.display = 'flex';
        
        document.getElementById('r-name').innerText = `Kết quả của ${nameInput}`;
        document.getElementById('r-score').innerText = `${score}/${totalQ}`;
        
        const commentBox = document.getElementById('r-comment');
        const gifBox = document.getElementById('r-gif');
        
        let ratio = score / totalQ;
        if(ratio === 1) {
            commentBox.innerText = "Tuyệt đỉnh! Cô tự hào về con! British English Master! 🏆";
            gifBox.src = "https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif"; 
        } else if(ratio >= 0.6) {
            commentBox.innerText = "Rất tốt! Chỉ một chút xíu nữa là hoàn hảo thôi. Cố gắng lên nhé! 👏";
            gifBox.src = "https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif"; 
        } else {
            commentBox.innerText = "Đừng buồn nhé! Hãy đọc kỹ phần giải thích chi tiết của cô và thử lại nào! 💪";
            gifBox.src = "https://media.giphy.com/media/2rtQMJvhzOnRe/giphy.gif"; 
        }
        
        if(ratio >= 0.6) fireConfetti();
    }

    // Confetti Canvas System
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let particles = [];

    function fireConfetti() {
        for(let i=0; i<50; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 2 + 100,
                r: Math.random() * 6 + 2,
                dx: Math.random() * 10 - 5,
                dy: Math.random() * -10 - 5,
                color: `hsl(${Math.random() * 360}, 100%, 50%)`
            });
        }
    }

    function animateConfetti() {
        requestAnimationFrame(animateConfetti);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p, index) => {
            p.dy += 0.3; // gravity
            p.x += p.dx;
            p.y += p.dy;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            if(p.y > canvas.height) particles.splice(index, 1);
        });
    }
    animateConfetti();

</script>
