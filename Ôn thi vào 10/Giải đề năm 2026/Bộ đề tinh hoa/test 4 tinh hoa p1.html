<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tương Tác - Ms Mai An ULIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Quicksand:wght@400;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset & Variables */
        :root {
            --primary: #6A0572;
            --secondary: #F0C040;
            --accent: #00D26A;
            --danger: #FF4757;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.9);
            --text-dark: #2d3436;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fdfbfb;
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* GIAO DIỆN MÀN HÌNH KHÓA */
        #passwordModal {
            position:fixed; inset:0; z-index:9999;
            display:flex; align-items:center; justify-content:center;
            background:rgba(5,2,15,0.92); backdrop-filter:blur(20px);
        }
        .pw-card {
            background:linear-gradient(160deg, rgba(40,10,70,0.95) 0%, rgba(15,5,30,0.98) 100%);
            border:1.5px solid rgba(240,192,64,0.4); border-radius:24px; padding:48px 40px 40px; 
            max-width:440px; width:93%; text-align:center; position:relative; overflow:hidden;
            box-shadow:0 0 60px rgba(106,5,114,0.6), 0 0 120px rgba(240,192,64,0.1), inset 0 1px 0 rgba(240,192,64,0.15);
        }
        .pw-card::before {
            content:''; position:absolute; top:0; left:0; right:0; height:3px;
            background:linear-gradient(90deg, #6A0572, #F0C040, #6A0572);
        }
        .pw-crest { font-size:4rem; margin-bottom:8px; display:block; }
        .pw-title { font-family:'Cinzel', serif; font-size:1.4rem; font-weight:700; color:#F0C040; margin-bottom:6px; letter-spacing:1px; }
        .pw-sub   { font-size:.87rem; color:rgba(200,200,212,0.6); margin-bottom:24px; }
        .pw-input {
            width:100%; padding:13px 20px; border-radius:12px;
            border:1.5px solid rgba(240,192,64,0.3); background:rgba(255,255,255,0.05);
            color:#FFE082; font-size:1rem; font-family:'Nunito', sans-serif;
            outline:none; letter-spacing:3px; text-align:center; transition:all .3s;
        }
        .pw-input:focus { border-color:#F0C040; box-shadow:0 0 0 3px rgba(240,192,64,0.15); }
        .pw-input.error { border-color:#FF4757; box-shadow:0 0 0 3px rgba(255,71,87,0.25); animation:shake .4s ease; }
        .pw-input::placeholder { color:rgba(200,200,212,0.3); letter-spacing:1px; }
        .pw-btn {
            width:100%; padding:14px; margin-top:14px; border-radius:12px; border:none;
            background:linear-gradient(135deg, #6A0572 0%, #9B1FA8 40%, #F0C040 100%);
            color:#fff; font-size:1rem; font-weight:700; font-family:'Cinzel', serif;
            cursor:pointer; letter-spacing:.5px; transition:transform .2s;
        }
        .pw-btn:hover { transform:translateY(-2px); box-shadow:0 8px 32px rgba(106,5,114,0.7); }
        .pw-err { color:#ff8a9a; font-size:.84rem; margin-top:10px; display:none; font-weight:700; }

        @keyframes shake { 0%,100%{transform:translateX(0)} 15%,45%,75%{transform:translateX(-6px)} 30%,60%,90%{transform:translateX(6px)} }

        /* THEME MÀU LOANG (GRADIENT MESH BLOBS) */
        .blobs-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden; z-index: -2; background: #fff5f7;
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(70px);
            opacity: 0.7; animation: floatBlob 15s infinite alternate ease-in-out;
        }
        .blob-1 { width: 45vw; height: 45vw; background: #a18cd1; top: -10%; left: -10%; animation-duration: 20s; }
        .blob-2 { width: 50vw; height: 50vw; background: #fbc2eb; bottom: -10%; right: -10%; animation-direction: alternate-reverse; }
        .blob-3 { width: 35vw; height: 35vw; background: #8fd3f4; top: 30%; left: 30%; animation-duration: 25s; }
        .blob-4 { width: 30vw; height: 30vw; background: #ffecd2; top: -5%; right: 10%; animation-duration: 18s; }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 10%) scale(1.1); }
            100% { transform: translate(-5%, -5%) scale(0.9); }
        }

        /* HỌA TIẾT BAY BAY (FLOATING OBJECTS) */
        .bg-shapes {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1; overflow: hidden;
        }
        .shape-obj {
            position: absolute;
            opacity: 0.6;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-20vh) rotate(360deg); }
        }

        /* Container & Glassmorphism */
        .app-container {
            max-width: 900px; margin: 2rem auto; padding: 0 1rem; position: relative; z-index: 10;
        }

        header { text-align: center; margin-bottom: 2rem; color: #4b2354; }
        header h1 { font-family: 'Nunito', sans-serif; font-size: 2.8rem; font-weight: 800; text-shadow: 2px 2px 0px #fff; margin-bottom: 5px; }
        header p { font-size: 1rem; font-weight: 700; background: rgba(255,255,255,0.6); display: inline-block; padding: 5px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        .question-card {
            background: var(--glass-bg); backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 2.5rem; margin-bottom: 2rem;
            box-shadow: 0 15px 35px rgba(106, 5, 114, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .question-card:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(106, 5, 114, 0.12); }

        .q-number {
            display: inline-block; background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            color: #fff; padding: 6px 20px; border-radius: 20px;
            font-size: 1rem; font-weight: 800; margin-bottom: 1.5rem; box-shadow: 0 4px 10px rgba(161, 140, 209, 0.3);
        }

        .q-text { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; line-height: 1.6; color: #2d3436; }

        /* Recreated Signs inside Question */
        .electric-sign {
            border: 4px dashed #c0392b; border-radius: 16px; padding: 25px;
            text-align: center; background: #fff9f9; margin: 15px 0;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.05);
        }
        .electric-sign h2 { font-family: 'Nunito', sans-serif; color: #c0392b; font-size: 1.6rem; margin-bottom: 10px; font-weight: 800;}
        .electric-sign p { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 1.15rem; color: #2d3436; }
        
        .note-card {
            background: #fffdf2; border-left: 8px solid #f0c040;
            padding: 20px 25px; font-family: 'Nunito', sans-serif;
            margin: 15px 0; border-radius: 12px;
            box-shadow: 0 8px 20px rgba(240, 192, 64, 0.15); font-size: 1.15rem; font-weight: 600; color: #574b2a;
        }

        /* Options Grid */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-top: 1.5rem; }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }

        .option-btn {
            background: white; border: 2px solid #f1f2f6;
            padding: 1.2rem; border-radius: 18px;
            font-family: 'Nunito', sans-serif; font-size: 1.1rem; font-weight: 700;
            color: #4b4b4b; cursor: pointer; box-shadow: 0 6px 0 #dfe4ea;
            transition: all 0.15s ease; text-align: left;
        }
        .option-btn:hover {
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 8px 0 #ced6e0; border-color: #a18cd1; color: #6A0572;
        }
        .option-btn:active { transform: scale(0.98) translateY(4px); box-shadow: 0 2px 0 #ced6e0; }
        .option-btn.correct { background: var(--accent); color: white; box-shadow: 0 6px 0 #00b85c; border-color: #00b85c; }
        .option-btn.incorrect { background: var(--danger); color: white; box-shadow: 0 6px 0 #e84150; border-color: #e84150; animation: shake 0.4s both; }

        /* Explanation Box */
        .explanation {
            display: none; margin-top: 2rem; padding: 1.8rem;
            background: rgba(255, 255, 255, 0.95); border-radius: 16px;
            border-left: 6px solid #a18cd1; font-size: 1.05rem; line-height: 1.7;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); animation: slideDown 0.4s ease forwards;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Specific Highlight Classes */
        .vn-translate {
            display: block; background: linear-gradient(135deg, #fff3cd, #ffeaa7);
            color: #d35400; font-weight: 800; padding: 15px; border-radius: 12px;
            margin-bottom: 20px; border-left: 5px solid #ff9f43; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(255, 159, 67, 0.1);
        }
        .p-word { color: #0984e3; font-weight: 800; }
        .p-phonetic { background: #e0b0ff; color: #4a00e0; padding: 2px 8px; border-radius: 6px; font-family: monospace; font-weight: bold;}
        .p-mean { color: #d35400; font-weight: 700;}
        .p-grammar { text-decoration: underline; text-decoration-color: #d63031; text-decoration-thickness: 2px; color: #2d3436; font-weight: 800; }
        .hl-green { color: #00b894; font-weight: 800; background: #e8f8f5; padding: 3px 8px; border-radius: 6px;}
        .hl-red { color: #d63031; text-decoration: line-through; text-decoration-thickness: 2px; font-weight: 700;}

        /* Submit Button */
        .submit-wrap { text-align: center; margin: 3rem 0; }
        .btn-submit {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white; border: none; padding: 18px 45px; font-size: 1.5rem;
            font-family: 'Nunito', sans-serif; font-weight: 800; border-radius: 35px;
            cursor: pointer; box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4); transition: all 0.3s;
        }
        .btn-submit:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 15px 35px rgba(245, 87, 108, 0.6); }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-content {
            background: white; padding: 3rem; border-radius: 30px;
            width: 90%; max-width: 480px; text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.2);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        .modal-content h2 { color: var(--primary); margin-bottom: 15px; font-family: 'Nunito', sans-serif; font-size: 2rem;}
        .name-input {
            width: 100%; padding: 15px; border: 3px solid #dfe6e9;
            border-radius: 15px; font-size: 1.2rem; margin-bottom: 20px;
            font-family: 'Quicksand', sans-serif; text-align: center; font-weight: 700; color: #2d3436;
        }
        .name-input:focus { border-color: #a18cd1; outline: none; box-shadow: 0 0 0 4px rgba(161, 140, 209, 0.2);}
        .name-input.error { border-color: var(--danger); animation: shake 0.3s; }
        .btn-action {
            background: var(--accent); color: white; border: none;
            padding: 15px 35px; font-size: 1.2rem; border-radius: 15px;
            font-weight: 800; cursor: pointer; transition: 0.2s; font-family: 'Nunito', sans-serif;
            box-shadow: 0 6px 0 #00b85c;
        }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #00b85c; }
        .btn-action:active { transform: translateY(4px); box-shadow: 0 2px 0 #00b85c; }
        
        .result-gif { width: 100%; border-radius: 20px; margin: 20px 0; max-height: 250px; object-fit: cover; }
        .score-display { font-size: 3.5rem; font-weight: 800; color: var(--secondary); text-shadow: 3px 3px 0px #e17055; margin: 10px 0;}

        /* Confetti elements */
        .confetti {
            position: fixed; width: 12px; height: 12px; pointer-events: none; z-index: 999; animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body>

    <div id="passwordModal">
        <div class="pw-card">
            <span class="pw-crest">🔒</span>
            <div class="pw-title">BẢO MẬT</div>
            <div class="pw-sub">Vui lòng nhập mật khẩu để làm bài</div>
            <input type="password" class="pw-input" id="pwInput" placeholder="Nhập mật khẩu..." autocomplete="off" />
            <button class="pw-btn" onclick="checkPassword()">XÁC NHẬN</button>
            <div class="pw-err" id="pwErr">Mật khẩu không đúng! Vui lòng thử lại.</div>
        </div>
    </div>

    <div id="mainContent" style="display: none;">
        
        <div class="blobs-container">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
            <div class="blob blob-4"></div>
        </div>

        <div class="bg-shapes" id="bgShapes"></div>

        <div class="app-container">
            <header>
                <h1>🌟 Đấu Trường Anh Ngữ 🌟</h1>
                <p>Giáo viên tạo: Ms Mai An ULIS</p>
            </header>

            <div id="quizContainer">
                </div>

            <div class="submit-wrap">
                <button class="btn-submit" onclick="requestSubmit()">🎯 NỘP BÀI & XEM KẾT QUẢ</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="nameModal">
        <div class="modal-content">
            <h2>Nhập tên chiến binh ⚔️</h2>
            <p style="margin-bottom: 20px; color: #636e72; font-weight: 600;">Hãy cho cô biết ai đang làm bài xuất sắc thế này?</p>
            <input type="text" class="name-input" id="studentName" placeholder="Ví dụ: Nguyễn Văn A...">
            <button class="btn-action" onclick="processSubmit()">Xác Nhận & Nộp Bài</button>
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <h2 id="resultGreeting">🌟 THIÊN TÀI!</h2>
            <p style="font-size: 1.1rem; font-weight: 600; color: #636e72;">Điểm số của con là:</p>
            <div class="score-display" id="resultScore">10 / 20</div>
            <img src="" alt="Meme Result" class="result-gif" id="resultImg">
            <button class="btn-action" onclick="location.reload()">Chơi Lại Từ Đầu 🔄</button>
        </div>
    </div>

<script>
// --- CẤU HÌNH BẢO MẬT & ÂM THANH ---
const _k  = [99, 111, 103, 97, 110, 103, 100, 97, 116, 100, 105, 101, 109, 99, 97, 111]; 
const _pw = _k.map(c => String.fromCharCode(c)).join('');

// Âm thanh
const introAudio = new Audio("https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/export_7wcKV5pKUrQYWyi7XgktJM.mp3");
const wrongAudio = new Audio("https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/File%20nghe%20Ket%20A2/huh_sound_effect-www_tiengdong_com.mp3");

// Check Password Logic
function checkPassword() {
    const inp = document.getElementById('pwInput');
    const err = document.getElementById('pwErr');
    if (inp.value === _pw) {
        document.getElementById('passwordModal').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        
        // Phát âm thanh nhắc nhở
        introAudio.play().catch(e => console.log("Trình duyệt chặn tự động phát âm thanh.", e));
        
        // Khởi tạo hiệu ứng bay
        createBgShapes();
    } else {
        inp.classList.remove('error'); void inp.offsetWidth; inp.classList.add('error');
        err.style.display = 'block'; setTimeout(() => inp.classList.remove('error'), 500);
    }
}
document.addEventListener('DOMContentLoaded', () => {
    const pwInput = document.getElementById('pwInput');
    if(pwInput) pwInput.addEventListener('keydown', e => { if (e.key==='Enter') checkPassword(); });
});

// --- DATABASE CÂU HỎI ---
const quizData = [
    {
        id: 1,
        question: "Mark the word whose underlined part differs from the other three in pronunciation:<br><br>finish<u>ed</u> &nbsp;&nbsp;&nbsp; defeat<u>ed</u> &nbsp;&nbsp;&nbsp; develop<u>ed</u> &nbsp;&nbsp;&nbsp; look<u>ed</u>",
        options: [
            { text: "finished", isCorrect: false },
            { text: "defeated", isCorrect: true },
            { text: "developed", isCorrect: false },
            { text: "looked", isCorrect: false }
        ],
        explanation: `
            <span class="vn-translate">Dịch đề: Chọn từ có phần gạch chân phát âm khác với ba từ còn lại.</span>
            <strong>1. Phân tích từ vựng 4 đáp án:</strong><br>
            - <span class='p-word'>finished</span> <span class='p-phonetic'>/ˈfɪnɪʃt/</span>: <span class='p-mean'>kết thúc</span><br>
            - <span class='p-word'>defeated</span> <span class='p-phonetic'>/dɪˈfiːtɪd/</span>: <span class='p-mean'>đánh bại</span><br>
            - <span class='p-word'>developed</span> <span class='p-phonetic'>/dɪˈveləpt/</span>: <span class='p-mean'>phát triển</span><br>
            - <span class='p-word'>looked</span> <span class='p-phonetic'>/lʊkt/</span>: <span class='p-mean'>nhìn</span><br>
            <strong>2. Tại sao chọn "defeated"?</strong><br>
            Phần gạch chân đuôi "-ed" của "defeated" được phát âm là <span class='p-phonetic'>/ɪd/</span> vì từ gốc kết thúc bằng âm /t/. Trong khi các từ còn lại phát âm là <span class='p-phonetic'>/t/</span>. <span class='hl-green'>Correct</span><br>
            <strong>3. Tại sao các đáp án khác sai?</strong><br>
            Các từ "finished", "developed", "looked" có âm cuối lần lượt là /ʃ/, /p/, /k/ (các âm vô thanh) nên đuôi -ed được phát âm là /t/. <span class='hl-red'>Incorrect</span>
        `
    },
    {
        id: 2,
        question: "Mark the word whose underlined part differs from the other three in pronunciation:<br><br>ch<u>ea</u>t &nbsp;&nbsp;&nbsp; gr<u>ea</u>t &nbsp;&nbsp;&nbsp; m<u>ea</u>t &nbsp;&nbsp;&nbsp; h<u>ea</u>t",
        options: [
            { text: "cheat", isCorrect: false },
            { text: "great", isCorrect: true },
            { text: "meat", isCorrect: false },
            { text: "heat", isCorrect: false }
        ],
        explanation: `
            <span class="vn-translate">Dịch đề: Chọn từ có phần gạch chân phát âm khác với ba từ còn lại.</span>
            <strong>1. Phân tích từ vựng 4 đáp án:</strong><br>
            - <span class='p-word'>cheat</span> <span class='p-phonetic'>/tʃiːt/</span>: <span class='p-mean'>gian lận</span><br>
            - <span class='p-word'>great</span> <span class='p-phonetic'>/ɡreɪt/</span>: <span class='p-mean'>tuyệt vời</span><br>
            - <span class='p-word'>meat</span> <span class='p-phonetic'>/miːt/</span>: <span class='p-mean'>thịt</span><br>
            - <span class='p-word'>heat</span> <span class='p-phonetic'>/hiːt/</span>: <span class='p-mean'>sức nóng</span><br>
            <strong>2. Tại sao chọn "great"?</strong><br>
            Phần gạch chân "ea" trong "great" được phát âm là nguyên âm đôi <span class='p-phonetic'>/eɪ/</span>, khác biệt hoàn toàn với phần còn lại. <span class='hl-green'>Correct</span><br>
            <strong>3. Tại sao các đáp án khác sai?</strong><br>
            Các từ "cheat", "meat", "heat" đều có phần gạch chân "ea" phát âm là nguyên âm dài <span class='p-phonetic'>/iː/</span>. <span class='hl-red'>Incorrect</span>
        `
    },
    {
        id: 3,
        question: "Mark the word that differs from the other three in the position of primary stress:<br><br>tension &nbsp;&nbsp;&nbsp; event &nbsp;&nbsp;&nbsp; agree &nbsp;&nbsp;&nbsp; betray",
        options: [
            { text: "tension", isCorrect: true },
            { text: "event", isCorrect: false },
            { text: "agree", isCorrect: false },
            { text: "betray", isCorrect: false }
        ],
        explanation: `
            <span class="vn-translate">Dịch đề: Chọn từ có vị trí trọng âm chính khác với ba từ còn lại.</span>
            <strong>1. Phân tích trọng âm 4 đáp án:</strong><br>
            - <span class='p-word'>tension</span> <span class='p-phonetic'>/ˈtenʃn/</span>: <span class='p-mean'>sự căng thẳng</span> (Trọng âm 1)<br>
            - <span class='p-word'>event</span> <span class='p-phonetic'>/ɪˈvent/</span>: <span class='p-mean'>sự kiện</span> (Trọng âm 2)<br>

// --- CORE LOGIC ---
const quizContainer = document.getElementById('quizContainer');
let score = 0;
let answeredQuestions = 0;
let totalQuestions = quizData.length;

// Audio Context Setup cho Ding sound
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function playDing() {
    if (!audioCtx) audioCtx = new AudioContext();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}

function shootConfetti(x, y) {
    for (let i = 0; i < 30; i++) {
        const conf = document.createElement('div');
        conf.classList.add('confetti');
        conf.style.left = x + (Math.random() * 100 - 50) + 'px';
        conf.style.top = y + 'px';
        conf.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
        conf.style.transform = `rotate(${Math.random() * 360}deg)`;
        const duration = Math.random() * 1.5 + 1;
        conf.style.animationDuration = duration + 's';
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), duration * 1000);
    }
}

function shuffleArray(array) {
    const newArr = [...array];
    for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
    }
    return newArr;
}

function renderQuiz() {
    quizData.forEach((item, index) => {
        const card = document.createElement('div');
        card.classList.add('question-card');
        card.id = `q-card-${item.id}`;

        const qNumber = document.createElement('div');
        qNumber.classList.add('q-number');
        qNumber.innerText = `Câu ${index + 1}`;

        const qText = document.createElement('div');
        qText.classList.add('q-text');
        qText.innerHTML = item.question;

        const optionsGrid = document.createElement('div');
        optionsGrid.classList.add('options-grid');
        
        const shuffledOptions = shuffleArray(item.options);

        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.classList.add('option-btn');
            btn.innerHTML = opt.text;
            btn.onclick = (e) => handleAnswer(e, btn, opt, item.id, card, shuffledOptions);
            optionsGrid.appendChild(btn);
        });

        const explanationBox = document.createElement('div');
        explanationBox.classList.add('explanation');
        explanationBox.id = `exp-${item.id}`;
        explanationBox.innerHTML = item.explanation;

        card.appendChild(qNumber);
        card.appendChild(qText);
        card.appendChild(optionsGrid);
        card.appendChild(explanationBox);
        quizContainer.appendChild(card);
    });
}

function handleAnswer(e, btn, opt, id, card, shuffledOptions) {
    if (card.dataset.answered === "true") return;
    card.dataset.answered = "true";
    answeredQuestions++;

    const allBtns = card.querySelectorAll('.option-btn');
    
    let correctBtn;
    allBtns.forEach((b, i) => {
        b.style.cursor = 'default';
        if(shuffledOptions[i].isCorrect) correctBtn = b;
    });

    if (opt.isCorrect) {
        btn.classList.add('correct');
        score++;
        playDing();
        shootConfetti(e.clientX, e.clientY);
    } else {
        btn.classList.add('incorrect');
        correctBtn.classList.add('correct');
        
        // Phát âm thanh báo sai từ Link
        wrongAudio.currentTime = 0;
        wrongAudio.play();
    }

    document.getElementById(`exp-${id}`).style.display = 'block';
}

function requestSubmit() {
    if(answeredQuestions < totalQuestions) {
        alert("Làm nốt các câu chưa khoanh đi đã chiến binh ơi! ⚔️");
        return;
    }
    document.getElementById('nameModal').style.display = 'flex';
}

function processSubmit() {
    const nameInput = document.getElementById('studentName');
    const name = nameInput.value.trim();
    if(!name) {
        nameInput.classList.add('error');
        setTimeout(() => nameInput.classList.remove('error'), 300);
        return;
    }

    document.getElementById('nameModal').style.display = 'none';
    
    const percentage = (score / totalQuestions) * 100;
    const resultModal = document.getElementById('resultModal');
    document.getElementById('resultGreeting').innerText = `🌟 THIÊN TÀI! ${name} xuất sắc!`;
    document.getElementById('resultScore').innerText = `${score} / ${totalQuestions}`;
    
    const imgEl = document.getElementById('resultImg');
    if(percentage === 100) {
        imgEl.src = "https://media.tenor.com/2R_qg1U8r3AAAAAC/leonardo-dicaprio.gif";
    } else if (percentage >= 60) {
        imgEl.src = "https://media.tenor.com/Z42-y42l-x4AAAAC/minions-cheering.gif";
    } else {
        imgEl.src = "https://media.tenor.com/Z1X-9r1sH3AAAAAC/crying-sad.gif";
    }

    resultModal.style.display = 'flex';
}

function createBgShapes() {

    const svgs = [
        '<svg viewBox="0 0 24 24" fill="#a18cd1"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>', // Ngôi sao
        '<svg viewBox="0 0 24 24" fill="#fbc2eb"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>', // Máy bay giấy
        '<svg viewBox="0 0 24 24" fill="#8fd3f4"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>' // Trái đất
    ];
    
    for(let i=0; i<15; i++) {
        const div = document.createElement('div');
        div.classList.add('shape-obj');
        div.innerHTML = svgs[Math.floor(Math.random() * svgs.length)];
        div.style.width = Math.random() * 30 + 15 + 'px';
        div.style.height = div.style.width;
        div.style.left = Math.random() * 100 + 'vw';
        div.style.animationDuration = Math.random() * 15 + 10 + 's';
        div.style.animationDelay = Math.random() * 5 + 's';
        container.appendChild(div);
    }
}

window.onload = () => {
    renderQuiz();
};
